<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trusts — Buzz Word Drill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');
:root{
  --bg:#0a0f0d;--surface:#101510;--card-front:#131a15;--card-back:#0f1a18;
  --border:#1e2e24;--teal:#3a8a7a;--teal-bright:#5abfaa;--teal-dim:#1e5a4a;
  --cream:#e0ece8;--muted:#6a8a7a;--text:#c0d8cc;
  --green:#2d6a4f;--green-bright:#52b788;--red:#7a2a2a;--red-bright:#c05555;
  --policy:#4a2a6a;--policy-bright:#9b72cf;--gold:#c9a84c;--gold-dim:#7a6430;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
header{width:100%;padding:20px 32px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;background:var(--surface);}
.brand{font-family:'Playfair Display',serif;font-size:10pt;color:var(--teal-bright);letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;}
.title{font-family:'Playfair Display',serif;font-size:26pt;font-weight:900;color:var(--cream);letter-spacing:.04em;line-height:1;}
.subtitle{font-size:8.5pt;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:4px;}
.stats{text-align:right;}.stat-row{display:flex;gap:20px;justify-content:flex-end;}
.stat-item{text-align:center;}.stat-num{font-family:'Playfair Display',serif;font-size:20pt;font-weight:700;display:block;line-height:1;}
.stat-num.got{color:var(--green-bright);}.stat-num.again{color:var(--red-bright);}
.stat-lbl{font-size:7.5pt;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}
.filter-bar{width:100%;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-wrap:wrap;gap:6px;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Source Serif 4',serif;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:2px;cursor:pointer;transition:all .18s;}
.filter-btn:hover{border-color:var(--teal-dim);color:var(--teal-bright);}
.filter-btn.active{background:var(--teal);border-color:var(--teal);color:#0a0f0d;font-weight:600;}
.filter-btn.policy-btn.active{background:var(--policy-bright);border-color:var(--policy-bright);}
main{flex:1;width:100%;max-width:760px;padding:32px 20px;display:flex;flex-direction:column;align-items:center;}
.progress-wrap{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.progress-bar{flex:1;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .4s ease;}
.progress-text{font-size:8.5pt;color:var(--muted);letter-spacing:.1em;white-space:nowrap;}
.deck-label{font-size:8.5pt;color:var(--teal-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px;width:100%;text-align:center;}
.card-scene{width:100%;perspective:1200px;margin-bottom:20px;}
.card{width:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer;min-height:240px;}
.card.flipped{transform:rotateY(180deg);}
.card-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--border);border-radius:4px;padding:36px 44px;min-height:240px;display:flex;flex-direction:column;justify-content:center;}
.card-front{background:var(--card-front);position:relative;}
.card-front.policy-card{border-color:var(--policy);background:#130d1a;}
.card-back{background:var(--card-back);transform:rotateY(180deg);position:absolute;top:0;left:0;right:0;bottom:0;border-color:var(--teal-dim);}
.card-back.policy-back{border-color:var(--policy-bright);background:#130d1a;}
.card-category{font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-dim);margin-bottom:16px;}
.card-category.policy{color:var(--policy-bright);}
.card-term{font-family:'Playfair Display',serif;font-size:24pt;font-weight:700;color:var(--cream);line-height:1.2;margin-bottom:20px;}
.buzz-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'Source Serif 4',serif;font-size:11pt;padding:8px 0;outline:none;transition:border-color .2s;}
.buzz-input:focus{border-color:var(--teal-dim);}
.buzz-input::placeholder{color:var(--muted);font-style:italic;font-size:9.5pt;}
.flip-hint{position:absolute;bottom:14px;right:18px;font-size:7.5pt;color:var(--border);letter-spacing:.1em;text-transform:uppercase;}
.back-category{font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-bright);margin-bottom:12px;}
.back-category.policy{color:var(--policy-bright);}
.back-term{font-family:'Playfair Display',serif;font-size:15pt;color:var(--cream);margin-bottom:16px;font-weight:700;line-height:1.2;}
.buzz-label{font-size:7.5pt;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-dim);margin-bottom:8px;}
.buzz-words{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.buzz-tag{background:rgba(58,138,122,.1);border:1px solid var(--teal-dim);color:var(--teal-bright);font-family:'Playfair Display',serif;font-size:10.5pt;font-weight:700;padding:5px 12px;border-radius:2px;letter-spacing:.04em;}
.buzz-tag.policy{background:rgba(155,114,207,.1);border-color:var(--policy);color:var(--policy-bright);}
.notes-section{border-top:1px solid var(--border);padding-top:12px;margin-top:4px;}
.notes-label{font-size:7.5pt;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.notes-text{font-size:9pt;color:var(--muted);line-height:1.6;font-style:italic;white-space:pre-line;}
.btn-row{display:flex;gap:10px;width:100%;justify-content:center;}
.btn{font-family:'Source Serif 4',serif;font-size:9.5pt;letter-spacing:.12em;text-transform:uppercase;padding:11px 28px;border-radius:2px;border:none;cursor:pointer;transition:all .18s;font-weight:600;}
.btn-flip{background:transparent;border:1px solid var(--teal-dim);color:var(--teal-bright);}
.btn-flip:hover{background:var(--teal);color:#0a0f0d;}
.btn-got{background:var(--green);color:#fff;border:1px solid var(--green);}
.btn-got:hover{background:var(--green-bright);border-color:var(--green-bright);}
.btn-again{background:transparent;border:1px solid var(--red);color:var(--red-bright);}
.btn-again:hover{background:var(--red);color:#fff;}
.btn-skip{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-skip:hover{border-color:var(--muted);color:var(--text);}
.hidden{display:none!important;}
.done-state{display:none;flex-direction:column;align-items:center;text-align:center;padding:50px 20px;}
.done-state.visible{display:flex;}
.done-icon{font-size:44pt;margin-bottom:16px;}
.done-title{font-family:'Playfair Display',serif;font-size:24pt;color:var(--cream);margin-bottom:10px;}
.done-sub{font-size:10.5pt;color:var(--muted);margin-bottom:28px;}
.score-display{display:flex;gap:36px;margin-bottom:28px;}
.score-item{text-align:center;}
.score-num{font-family:'Playfair Display',serif;font-size:34pt;font-weight:700;display:block;}
.score-num.got{color:var(--green-bright);}.score-num.again{color:var(--red-bright);}
.score-lbl{font-size:8pt;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
.btn-restart{background:var(--teal);color:#0a0f0d;border:none;font-family:'Playfair Display',serif;font-size:11pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:13px 36px;border-radius:2px;cursor:pointer;margin:5px;transition:all .18s;}
.btn-restart:hover{background:var(--teal-bright);}
.btn-again-only{background:transparent;color:var(--red-bright);border:1px solid var(--red);font-family:'Source Serif 4',serif;font-size:9.5pt;letter-spacing:.12em;text-transform:uppercase;padding:11px 28px;border-radius:2px;cursor:pointer;margin:5px;transition:all .18s;}
.btn-again-only:hover{background:var(--red);color:#fff;}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">LegalMinds ⚖️</div>
    <div class="title">TRUSTS</div>
    <div class="subtitle">Buzz Word Drill · Colleges of Law · Class of 2026</div>
  </div>
  <div class="stats">
    <div class="stat-row">
      <div class="stat-item"><span class="stat-num got" id="got-count">0</span><span class="stat-lbl">Got It</span></div>
      <div class="stat-item"><span class="stat-num again" id="again-count">0</span><span class="stat-lbl">Again</span></div>
    </div>
  </div>
</header>
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('Creation',this)">Creation</button>
  <button class="filter-btn" onclick="setFilter('Types of Trust',this)">Types of Trust</button>
  <button class="filter-btn" onclick="setFilter('Trust Supervision',this)">Supervision</button>
  <button class="filter-btn" onclick="setFilter('Beneficiaries Rights',this)">Beny Rights</button>
  <button class="filter-btn" onclick="setFilter('Modification & Termination',this)">Mod / Term</button>
  <button class="filter-btn policy-btn" onclick="setFilter('Policy & Limitations',this)">⚑ Policy</button>
</div>
<main>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="progress-text">0 of 0</div>
  </div>
  <div class="deck-label" id="deck-label">Full Deck</div>
  <div id="drill-area" style="width:100%">
    <div class="card-scene">
      <div class="card" id="main-card" onclick="handleCardClick()">
        <div class="card-face card-front" id="card-front-face">
          <div class="card-category" id="card-category">Category</div>
          <div class="card-term" id="card-term">Term</div>
          <input class="buzz-input" id="buzz-input" type="text" placeholder="Type your buzz words… or just flip" autocomplete="off" onclick="event.stopPropagation()"/>
          <div class="flip-hint">click card to flip</div>
        </div>
        <div class="card-face card-back" id="card-back-face">
          <div class="back-category" id="back-category">Category</div>
          <div class="back-term" id="back-term">Term</div>
          <div class="buzz-label">Buzz Words</div>
          <div class="buzz-words" id="buzz-words"></div>
          <div class="notes-section" id="notes-section">
            <div class="notes-label">Notes</div>
            <div class="notes-text" id="notes-text"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="btn-row" id="front-btns">
      <button class="btn btn-flip" onclick="flipCard()">Flip</button>
      <button class="btn btn-skip" onclick="nextCard()">Skip →</button>
    </div>
    <div class="btn-row hidden" id="back-btns">
      <button class="btn btn-again" onclick="markAgain()">Again</button>
      <button class="btn btn-got" onclick="markGot()">Got It ✓</button>
    </div>
  </div>
  <div class="done-state" id="done-state">
    <div class="done-icon">⚖️</div>
    <div class="done-title">Round Complete</div>
    <div class="done-sub" id="done-sub">No fact left behind.</div>
    <div class="score-display">
      <div class="score-item"><span class="score-num got" id="final-got">0</span><span class="score-lbl">Got It</span></div>
      <div class="score-item"><span class="score-num again" id="final-again">0</span><span class="score-lbl">Again</span></div>
    </div>
    <button class="btn-restart" onclick="restartAll()">Restart All</button>
    <button class="btn-again-only" id="drill-again-btn" onclick="drillAgain()">Drill "Again" Cards</button>
  </div>
</main>
<script>
const ALL_CARDS=[
  // CREATION
  {category:"Creation",term:"Trust Elements — PIRAT",buzz:["PIRAT"],notes:"Purpose · Intent · Res · Ascertainable Beneficiaries · Trustee"},
  {category:"Creation",term:"Inter Vivos Trust",buzz:["Lifetime","Potentially Revocable"],notes:"Created during settlor's lifetime. May be revocable or irrevocable depending on instrument."},
  {category:"Creation",term:"Testamentary Trust",buzz:["Created in Will","At Death"],notes:"Created inside a will. Effective at death. Will speaks at death — no delivery required."},
  {category:"Creation",term:"Purpose",buzz:["Legal","Not Against Public Policy","Intent"],notes:"Trust purpose must be legal, not tortious, and not against public policy."},
  {category:"Creation",term:"Intent",buzz:["Explicit","Expressed","Immediate"],notes:"Present intent expressed verbally or through conduct, effective immediately. Precatory words ('I hope/wish') may be insufficient."},
  {category:"Creation",term:"Res (Corpus)",buzz:["ID","Existing","Delivered","Funded"],notes:"Identifiable property; existing interest (not mere expectancy); delivered to trustee if trustee is a third party."},
  {category:"Creation",term:"Trustee",buzz:["Named in Trust","Court Can Appoint","Duties"],notes:"Trust does not fail for lack of trustee — court will appoint one. Trustee has AOL duties."},
  {category:"Creation",term:"Ascertainable Beneficiaries",buzz:["ID","Human"],notes:"Must be identifiable. Must be human (or charitable class). Honorary trusts are the exception."},

  // TYPES OF TRUST
  {category:"Types of Trust",term:"Trust Types — Mnemonic",buzz:["PATRON SAINT SAMMY"],notes:"Pour-Over · Secret/Semi-Secret · Spendthrift · Support · Discretionary · Blended/Protective · Charitable · Honorary · Operation of Law"},
  {category:"Types of Trust",term:"Pour-Over Will",buzz:["Trust","Leftover Will"],notes:"Assets titled in testator's name at death pour into an existing inter vivos trust. Cleanup device."},
  {category:"Types of Trust",term:"Secret Trust",buzz:["Shhh","Need Evidence"],notes:"Trust is completely hidden on face of will. Extrinsic evidence is admissible to prove the trust."},
  {category:"Types of Trust",term:"Semi-Secret Trust",buzz:["Trust Known","Beny Unknown","No Evidence Allowed"],notes:"Will reveals a trust exists but not who the beneficiary is. Extrinsic evidence NOT allowed. Contrast: secret trust allows evidence in."},
  {category:"Types of Trust",term:"Spendthrift Trust",buzz:["Spending Limit"],notes:"Restricts beneficiary's ability to transfer interest and creditors' ability to attach. Once beneficiary receives res, creditors can attach."},
  {category:"Types of Trust",term:"Support Trust",buzz:["Income & Principal","Education or Support","Necessary"],notes:"Trustee pays income and principal as necessary for beneficiary's education or support. Creditors cannot attach unless exceeds support need."},
  {category:"Types of Trust",term:"Discretionary Trust",buzz:["Pay or Withhold"],notes:"Trustee has full discretion to pay or withhold distributions. Creditor attachment depends on trustee's exercise of discretion."},
  {category:"Types of Trust",term:"Blended / Protective Trust",buzz:["Group"],notes:"Benefits a group of beneficiaries. Combines spendthrift/support/discretionary features for group protection."},
  {category:"Types of Trust",term:"Charitable Trust",buzz:["Welfare","Public at Large","Indefinite"],notes:"Must benefit welfare or the public at large. Can be indefinite in duration. Enforced by AG, not specific beneficiaries."},
  {category:"Types of Trust",term:"Charitable Trust Elements",buzz:["Intent","Purpose","Identifiable Beny","AG Enforces"],notes:"Charitable purpose must be legally recognized and public-oriented. AG has enforcement standing."},
  {category:"Types of Trust",term:"Cy Pres",buzz:["Impossible","Impracticable","Illegal","As Near as Possible"],notes:"Court modifies/redirects charitable trust when literal compliance fails. Must show general charitable intent. Buck: inefficiency alone is NOT enough."},
  {category:"Types of Trust",term:"Honorary Trust",buzz:["Non-Charitable","No Living Beny"],notes:"Has no living ascertainable beneficiary and is not charitable. Enforceability is limited — depends on trustee's honor."},
  {category:"Types of Trust",term:"Resulting Trust",buzz:["Trust Failed"],notes:"Arises by operation of law when an express trust fails. Property returns to settlor or settlor's estate."},
  {category:"Types of Trust",term:"Constructive Trust",buzz:["Fraud","Unjust Enrichment"],notes:"Not a true trust — an equitable remedy imposed by court. Trustee must convey title to rightful beneficiary."},
  {category:"Types of Trust",term:"Operation of Law",buzz:["Court Imposed"],notes:"Resulting and constructive trusts arise by operation of law, not express creation."},

  // TRUST SUPERVISION
  {category:"Trust Supervision",term:"Trust Supervision — AOL",buzz:["AOL"],notes:"Authority · Obligations · Liabilities\nKey duties: Loyalty, Prudent Investment, Account & Inform, No Commingling, Impartiality, Defend & Enforce."},
  {category:"Trust Supervision",term:"Duty of Loyalty",buzz:["No Self-Dealing","Beny Interest First","Avoid Conflicts"],notes:"Trustee must place beneficiary's interest above own. Self-dealing transactions are voidable (not void)."},
  {category:"Trust Supervision",term:"Prudent Investor Standard",buzz:["Portfolio as a Whole","Diversification","UPIA"],notes:"Evaluate investment strategy by viewing portfolio as a whole — not individual investments in isolation. Diversification is key."},
  {category:"Trust Supervision",term:"Duty to Account & Inform",buzz:["Non-Waivable","Keep Informed","Affirmative"],notes:"Affirmative, non-waivable duty. Trustee must keep beneficiaries reasonably informed of trust and its administration."},
  {category:"Trust Supervision",term:"Duty Not to Commingle",buzz:["Keep Separate","Earmarked"],notes:"Trust funds must be kept separate and earmarked from trustee's personal funds."},
  {category:"Trust Supervision",term:"Duty of Impartiality",buzz:["Fair to All","Income vs. Remainder"],notes:"Cannot favor income beneficiary over remainder beneficiary or vice versa."},
  {category:"Trust Supervision",term:"Third Party Liability",buzz:["Co-Trustee","Participate Fully","Cannot Delegate Fiduciary"],notes:"Anton: each co-trustee must participate fully. Inattentive co-trustee is liable for dishonest behavior of other co-trustee."},

  // BENEFICIARIES RIGHTS
  {category:"Beneficiaries Rights",term:"Beneficiaries' Rights",buzz:["Alienability","Creditor Attachment"],notes:"Two main issues: can the beneficiary transfer their interest, and can creditors reach it?"},
  {category:"Beneficiaries Rights",term:"Alienability",buzz:["Freely Transferable","Writing if Real Property","Exceptions: Spendthrift / Support / Protective"],notes:"General rule: beneficiary can freely transfer interest. Writing required if real property. Exceptions limit transfer."},
  {category:"Beneficiaries Rights",term:"Creditor Attachment",buzz:["Can Attach","Spendthrift: After Receipt","Support: Exceeds Need or Support Debt","Discretionary: Trustee Controls"],notes:"General rule: creditors may attach trust interest.\nSpendthrift: after beneficiary receives res.\nSupport: only if exceeds support need or debt relates to support.\nDiscretionary: depends on trustee's exercise."},

  // MODIFICATION & TERMINATION
  {category:"Modification & Termination",term:"Modification",buzz:["Changed Circumstances","Power Reserved","Majority: Express","Minority: Unless Irrevocable"],notes:"Majority: settlor can modify only if power expressly reserved.\nMinority: can modify unless expressly irrevocable.\nJudicial: doctrine of changed circumstances — deviation from administrative terms to achieve trust purpose."},
  {category:"Modification & Termination",term:"Revocation",buzz:["Majority: Right Reserved","Minority: Unless Irrevocable","Joint Settlors: Each Revokes Own Portion"],notes:"Majority: not permitted unless right reserved.\nMinority: permitted unless expressly irrevocable.\nJoint settlors: each may revoke own portion (Probate Code §761)."},
  {category:"Modification & Termination",term:"Termination",buzz:["Trustee","Beneficiary","Judicial","Operation of Law"],notes:"Trustee: as provided in trust document.\nBeneficiary: all competent + all consent + doesn't frustrate material purpose.\nJudicial: purpose frustrated/impossible/illegal/changed circumstances.\nOperation of Law: merger doctrine."},

  // POLICY & LIMITATIONS
  {category:"Policy & Limitations",term:"Material Purpose Doctrine",buzz:["All Consent ≠ Terminate","Frustrates Purpose = No"],notes:"Even if all beneficiaries consent, court will not allow termination if it would frustrate a material purpose of the trust."},
  {category:"Policy & Limitations",term:"Merger Doctrine",buzz:["Sole Trustee = Sole Beny","Trust Fails","Takes Outright"],notes:"If sole trustee and sole beneficiary are the same person, interests merge and trust fails. Beneficiary takes outright."},
  {category:"Policy & Limitations",term:"Precatory Words",buzz:["I Hope / I Wish","May Be Insufficient","Extrinsic Evidence In"],notes:"'I hope,' 'I wish,' 'I desire' — may not create a trust. Beneficiary may introduce extrinsic evidence to prove actual intent."},
  {category:"Policy & Limitations",term:"Constructive Trust Policy",buzz:["Not a True Trust","Equitable Remedy","Prevent Unjust Enrichment"],notes:"Court imposes constructive trust to prevent unjust enrichment. Trustee must only convey title to rightful beneficiary."},
  {category:"Policy & Limitations",term:"Cy Pres Limitation (Buck)",buzz:["Inefficiency ≠ Enough","Impossibility Required"],notes:"Court will NOT redirect charitable trust merely because money could do more good elsewhere. Standard is impossibility/impracticability/illegality."},
  {category:"Policy & Limitations",term:"Semi-Secret vs. Secret",buzz:["Secret: Evidence In","Semi-Secret: Evidence Out"],notes:"The evidence rule is opposite: secret trust (hidden on face) → evidence admissible. Semi-secret (trust visible, beny hidden) → evidence NOT admissible."},
  {category:"Policy & Limitations",term:"AG Enforcement (Charitable Trust)",buzz:["No Private Beny","AG Stands In","Public Benefit"],notes:"Charitable trusts have no specific beneficiary with enforceable rights. Enforcement vested in Attorney General."},
];

let deck=[],currentIndex=0,gotCount=0,againCount=0,againCards=[],isFlipped=false,activeFilter='all';

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  restart();
}
function buildDeck(f){const c=f==='all'?[...ALL_CARDS]:ALL_CARDS.filter(x=>x.category===f);return shuffle(c);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function restart(){
  deck=buildDeck(activeFilter);currentIndex=0;gotCount=0;againCount=0;againCards=[];
  updateStats();
  document.getElementById('done-state').classList.remove('visible');
  document.getElementById('drill-area').style.display='block';
  const lbl=activeFilter==='all'?'Full Deck':activeFilter;
  document.getElementById('deck-label').textContent=lbl+' · '+deck.length+' cards';
  showCard();
}
function restartAll(){
  activeFilter='all';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  restart();
}
function drillAgain(){
  if(!againCards.length)return;
  deck=shuffle([...againCards]);currentIndex=0;gotCount=0;againCount=0;againCards=[];
  updateStats();
  document.getElementById('done-state').classList.remove('visible');
  document.getElementById('drill-area').style.display='block';
  document.getElementById('deck-label').textContent='Again Cards · '+deck.length+' cards';
  showCard();
}
function showCard(){
  if(currentIndex>=deck.length){showDone();return;}
  const c=deck[currentIndex];isFlipped=false;
  document.getElementById('main-card').classList.remove('flipped');
  document.getElementById('front-btns').classList.remove('hidden');
  document.getElementById('back-btns').classList.add('hidden');
  document.getElementById('buzz-input').value='';
  const pol=c.category==='Policy & Limitations';
  document.getElementById('card-front-face').className='card-face card-front'+(pol?' policy-card':'');
  const catEl=document.getElementById('card-category');catEl.className='card-category'+(pol?' policy':'');catEl.textContent=c.category;
  document.getElementById('card-term').textContent=c.term;
  document.getElementById('card-back-face').className='card-face card-back'+(pol?' policy-back':'');
  const bCat=document.getElementById('back-category');bCat.className='back-category'+(pol?' policy':'');bCat.textContent=c.category;
  document.getElementById('back-term').textContent=c.term;
  const bDiv=document.getElementById('buzz-words');bDiv.innerHTML='';
  c.buzz.forEach(b=>{const t=document.createElement('span');t.className='buzz-tag'+(pol?' policy':'');t.textContent=b;bDiv.appendChild(t);});
  const ns=document.getElementById('notes-section');const nt=document.getElementById('notes-text');
  if(c.notes){nt.textContent=c.notes;ns.style.display='block';}else{ns.style.display='none';}
  updateProgress();
}
function handleCardClick(){if(!isFlipped)flipCard();}
function flipCard(){isFlipped=true;document.getElementById('main-card').classList.add('flipped');document.getElementById('front-btns').classList.add('hidden');document.getElementById('back-btns').classList.remove('hidden');}
function markGot(){gotCount++;updateStats();currentIndex++;showCard();}
function markAgain(){againCount++;againCards.push(deck[currentIndex]);updateStats();currentIndex++;showCard();}
function nextCard(){currentIndex++;showCard();}
function updateStats(){document.getElementById('got-count').textContent=gotCount;document.getElementById('again-count').textContent=againCount;}
function updateProgress(){const t=deck.length,d=currentIndex,p=t?(d/t*100):0;document.getElementById('progress-fill').style.width=p+'%';document.getElementById('progress-text').textContent=d+' of '+t;}
function showDone(){
  document.getElementById('drill-area').style.display='none';
  const done=document.getElementById('done-state');done.classList.add('visible');
  document.getElementById('final-got').textContent=gotCount;document.getElementById('final-again').textContent=againCount;
  const p=deck.length?Math.round(gotCount/deck.length*100):0;
  document.getElementById('done-sub').textContent=p+'% got it. No fact left behind. ⚖️';
  document.getElementById('drill-again-btn').style.display=againCards.length?'inline-block':'none';
}
restart();
</script>
</body>
</html>
