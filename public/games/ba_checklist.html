<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalMinds — BA Checklist Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a1628; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
#app { width: 100%; max-width: 820px; }

#header { background: #0f1e35; border-radius: 12px; padding: 16px 20px 12px; margin-bottom: 12px; border-bottom: 1px solid rgba(111,163,210,0.35); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
#header h1 { font-size: 18px; font-weight: 600; color: #f5f0e8; letter-spacing: 0.04em; }
#header h1 span { color: #6fa3d2; font-style: italic; }
#header p { font-size: 10px; color: #6b8aaa; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; }
#hdr-stats { text-align: right; }
#hdr-n { font-size: 16px; color: #6fa3d2; font-weight: 600; }
#hdr-l { font-size: 9px; color: #6b8aaa; text-transform: uppercase; letter-spacing: 0.08em; }

#module-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.mod-tab { flex: 1; background: #0f1e35; border: 1.5px solid #1a2f4a; border-radius: 10px; padding: 11px; font-size: 12px; color: #a0b8cc; cursor: pointer; font-family: inherit; transition: all 0.15s; text-align: center; }
.mod-tab:hover { border-color: #3a5f85; }
.mod-tab.active { background: rgba(111,163,210,0.14); border-color: #6fa3d2; color: #aecfeb; font-weight: 600; }

#sec-nav { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-chip { background: #0f1e35; border: 1.5px solid #1a2f4a; border-radius: 16px; padding: 6px 12px; font-size: 10.5px; color: #a0b8cc; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.sec-chip:hover { border-color: #3a5f85; }
.sec-chip.done { border-color: #1d9e75; color: #4fc79f; }

#controls { display: flex; gap: 8px; margin-bottom: 14px; }
.ctrl-btn { flex: 1; background: #0f1e35; border: 1.5px solid #1a2f4a; border-radius: 8px; padding: 9px; font-size: 11px; color: #a0b8cc; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.ctrl-btn:hover { border-color: #2a4a6a; color: #f5f0e8; }

.section { background: #0f1e35; border-radius: 12px; margin-bottom: 10px; overflow: hidden; border: 1px solid rgba(111,163,210,0.12); }
.sec-head { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
.sec-head:hover { background: #13243f; }
.sec-title { font-size: 14px; font-weight: 600; color: #f5f0e8; }
.sec-title .roman { color: #6fa3d2; margin-right: 8px; }
.sec-meta { display: flex; align-items: center; gap: 10px; }
.sec-count { font-size: 10px; color: #6b8aaa; }
.sec-arrow { color: #6fa3d2; font-size: 11px; transition: transform 0.2s; }
.sec-arrow.open { transform: rotate(90deg); }
.sec-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
.sec-body.open { max-height: 3000px; }
.sec-inner { padding: 4px 18px 16px; }

.cl-item { display: flex; align-items: flex-start; gap: 11px; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: #13243f; border: 1.5px solid #13243f; transition: all 0.15s; }
.cl-item.subitem { margin-left: 26px; }
.cl-check { width: 19px; height: 19px; border-radius: 4px; border: 2px solid #2a4a6a; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; font-size: 11px; color: transparent; }
.cl-item.marked .cl-check { background: #6fa3d2; border-color: #6fa3d2; color: #0a1628; }
.cl-item.marked { border-color: rgba(111,163,210,0.4); }
.cl-content { flex: 1; }
.cl-label { font-size: 13px; color: #d0dce8; line-height: 1.5; cursor: pointer; }
.cl-label b { color: #f5f0e8; font-weight: 600; }
.cl-buzz { display: none; margin-top: 7px; }
.cl-buzz.revealed { display: block; }
.buzz { display: inline-block; background: rgba(111,163,210,0.12); border: 1px solid rgba(111,163,210,0.45); color: #aecfeb; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px; margin: 2px 3px 2px 0; }
.split-tag { display: inline-block; background: rgba(201,151,58,0.16); border: 1px solid rgba(201,151,58,0.5); color: #e8b54f; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: 4px; margin: 2px 3px 2px 0; letter-spacing: 0.05em; text-transform: uppercase; }
.verify-tag { display: inline-block; background: rgba(226,75,74,0.12); border: 1px solid rgba(226,75,74,0.45); color: #f09595; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: 4px; margin: 2px 3px 2px 0; letter-spacing: 0.05em; text-transform: uppercase; }
.tap-hint { font-size: 10px; color: #4a6a8a; font-style: italic; margin-top: 5px; }
.takeaway { background: rgba(111,163,210,0.08); border-left: 3px solid #6fa3d2; border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 8px 0; font-size: 12px; color: #a8c4dc; font-style: italic; line-height: 1.55; }

#progress { background: #0f1e35; border-radius: 10px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; position: sticky; bottom: 12px; border: 1px solid rgba(111,163,210,0.2); }
.prog-cell { text-align: center; }
.prog-n { font-size: 16px; font-weight: 600; color: #6fa3d2; }
.prog-l { font-size: 8.5px; color: #6b8aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 1px; }
#prog-track { flex: 1; height: 6px; background: #1a2f4a; border-radius: 3px; overflow: hidden; }
#prog-fill { height: 100%; width: 0%; background: #6fa3d2; border-radius: 3px; transition: width 0.3s; }
</style>
</head>
<body>
<div id="app">

<div id="header">
  <div>
    <h1>LEGAL<span>MINDS</span> ⚖️</h1>
    <p>BA Checklist Game · Agency &amp; Partnerships · Weeks 1–6</p>
  </div>
  <div id="hdr-stats">
    <div id="hdr-n">0%</div>
    <div id="hdr-l">checked off</div>
  </div>
</div>

<div id="module-tabs">
  <button class="mod-tab active" data-mod="A">Module A — Agency</button>
  <button class="mod-tab" data-mod="B">Module B — Partnerships</button>
</div>

<div id="sec-nav"></div>

<div id="controls">
  <button class="ctrl-btn" id="btn-showall">Reveal All Buzz Words</button>
  <button class="ctrl-btn" id="btn-reset">Reset ↺</button>
</div>

<div id="sections"></div>

<div id="progress">
  <div class="prog-cell"><div class="prog-n" id="p-marked">0</div><div class="prog-l">Marked</div></div>
  <div id="prog-track"><div id="prog-fill"></div></div>
  <div class="prog-cell"><div class="prog-n" id="p-total">0</div><div class="prog-l">Items</div></div>
</div>

</div>

<script>
(function(){

// b = buzz pills, s = split tag, v = verify tag, sub = indented, take = takeaway block
var DATA = {
A: {
  name: 'Agency',
  order: 'Exam order: Agency? → Authority? → Liability to 3P? → Duties → Termination',
  sections: [
    { roman:'I', title:'Creation of Agency Relationship', items:[
      { label:'<b>Definition</b> — principal manifests intention that agent act on principal\u2019s behalf', b:['Manifests Intention','On P\u2019s Behalf'] },
      { label:'<b>ABC elements</b>', b:['Assent','Benefit','Control'] },
      { label:'Assent — both parties agree to the relationship', sub:true, b:['Mutual Agreement'] },
      { label:'Benefit — agent works for the benefit of the principal', sub:true, b:['For P\u2019s Benefit, Not Purely Self-Interested'] },
      { label:'Control — principal gives directives and controls agent\u2019s behavior', sub:true, b:['Right to Control Manner & Means'] },
      { label:'<b>Capacity</b> — who can be a principal / agent?', b:['P: Contractual Capacity','A: Minimal Capacity','Agent May Be a Minor'] },
      { label:'<b>Notice</b> — notification vs. knowledge', b:[], v:'Verify — covered in class?' },
    ]},
    { roman:'II', title:'Authority Ladder — Run In Order', items:[
      { label:'<b>1. Express actual authority</b>', b:['\u201cI Authorize You\u2026\u201d','Written Instructions','Board Resolution','Explicit Limits'] },
      { label:'<b>2. Implied / Inherent actual authority</b> — reasonably necessary to carry out express', b:['Job Title + Usual Powers','Custom & Usage','Acquiescence','Emergency / Necessity','Past Practice'] },
      { label:'<b>3. Apparent authority</b> — principal\u2019s manifestations to the third party', b:['P Held Out','Title / Business Card / Prior Dealings','3P Reasonable Belief'] },
      { take:'\u2605 Apparent authority lives in the THIRD PARTY\u2019s head — does the 3P reasonably believe the agent has authority to bind the principal? Red flags / notice of limits defeat reasonableness.' },
      { label:'<b>4. Ratification</b> — principal agrees to be bound after the fact', b:['Knowledge of Material Facts','Affirms After the Act','Accepts Benefits','Fails to Repudiate'] },
      { label:'<b>5. Estoppel</b> — backup theory', b:['P\u2019s Conduct','3P Detrimental Reliance','Change of Position'] },
    ]},
    { roman:'III', title:'Contract Liability to Third Party', items:[
      { label:'<b>Disclosed principal</b> — 3P knows agency + P\u2019s identity', b:['P Liable if Authority','Agent Generally Not Liable'] },
      { label:'<b>Partially disclosed principal</b> — 3P knows agency exists, not P\u2019s identity', b:['A May Also Be Liable'] },
      { label:'<b>Undisclosed principal</b> — 3P thinks agent is the party', b:['A Liable on the K','P Liable if Authorized'] },
      { label:'<b>Agent acted without authority</b>', b:['A Alone Liable','P Not Bound (Absent Ratification / Estoppel)'] },
    ]},
    { roman:'IV', title:'Agency Tort Liability', items:[
      { label:'<b>Vicarious liability / respondeat superior</b>', b:['Employee + Scope of Employment'] },
      { label:'<b>Employee vs. independent contractor</b>', b:['Right to Control Manner & Means','Control Factors'] },
      { label:'<b>Scope of employment</b>', b:['Time / Place / Purpose','Foreseeable','Frolic v. Detour'] },
      { label:'<b>Intentional torts</b> — generally outside scope unless\u2026', b:['Furthering P\u2019s Business','Authorized / Natural to Job'] },
      { label:'<b>Direct liability theories</b>', b:['Negligent Hiring / Supervision'] },
      { label:'<b>Independent contractor torts</b> — P generally not liable; exceptions:', b:['Nondelegable Duty','Inherently Dangerous Activity'] },
    ]},
    { roman:'V', title:'Duties: Agent \u2192 Principal (+ Remedies)', items:[
      { label:'<b>Duty of loyalty</b> (fiduciary)', b:['No Self-Dealing','No Competing','No Adverse Party','Account for Secret Profits'] },
      { label:'Loyalty remedies', sub:true, b:['Disgorgement / Accounting','Constructive Trust','Forfeiture of Comp'] },
      { label:'<b>Duty of obedience</b>', b:['Lawful Instructions','Within Scope'] },
      { label:'<b>Duty of care</b>', b:['Reasonable Care / Skill','No Commingling','Safeguard P\u2019s Property'] },
    ]},
    { roman:'VI', title:'Duties: Principal \u2192 Agent (+ Remedies)', items:[
      { label:'<b>Compensation</b>', b:['As Agreed','Reasonable if Implied'] },
      { label:'<b>Reimbursement / indemnification</b>', b:['Authorized + Necessary Expenses'] },
      { label:'<b>Cooperation / good faith</b>', b:['Non-Interference','K Damages (Mitigation)','Agent\u2019s Lien'] },
    ]},
    { roman:'VII', title:'Termination of Agency', items:[
      { label:'<b>Actual authority ends with the agency</b>', b:['Lapse of Time','Event / Changed Circumstances','Breach','Unilateral Act','Operation of Law'] },
      { label:'<b>Apparent authority survives</b>', b:['Until Notice to 3Ps','Except Automatic-Termination Situations'] },
      { take:'\u2605 The trap: terminate the agent, forget the notice — the agent can still bind the principal through apparent authority.' },
    ]},
  ]
},
B: {
  name: 'Partnerships',
  order: 'Formation \u2192 Management \u2192 Authority \u2192 Liability \u2192 Duties \u2192 Exit \u2192 Entity ID',
  sections: [
    { roman:'A', title:'The Entity Landscape — Six Types', items:[
      { label:'<b>Sole proprietorship</b> — one person owns and runs it', b:['Easy Startup','Complete Control','All Profits to Owner','No Double Tax','Unlimited Personal Liability','Personal Assets Exposed'] },
      { label:'<b>General / limited partnership</b> — 2+ co-owners for profit', b:['Easy to Form — No Filing','UPA / RUPA Defaults','Agreement Supersedes','No Double Tax','Personal Liability','Deadlock Risk (Even Number)'] },
      { label:'<b>LLP</b> — GP with a statutory liability shield', b:['Requires Documentation','Filing + Notice','Law Firm Entity','Never Tested (Professor)'] },
      { label:'<b>LLC</b> — hybrid, ~20 years old', b:['Limited Liability','Flow-Through Tax','Operating Agreement Governs','Flexible Fiduciary Duties','Rarely Tested — Crossover Only'] },
      { label:'<b>Corporation</b> — fictitious legal entity separate from owners', b:['File Articles + Bylaws','Limited Liability — Losses Capped','Freely Transferable Shares','Double Taxation','Rigid Management','Ownership / Control Separation'] },
      { label:'<b>Joint venture</b>', b:['Casebook Only — Minimal Coverage'] },
      { take:'\u2605 Why corporations win anyway: people are risk-averse — they want losses capped at their investment. And agency law is the foundation under all of it: how principals get bound is the through-line of the course.' },
    ]},
    { roman:'0', title:'Spot the Call', items:[
      { label:'Is there a partnership?', b:['Formation'] },
      { label:'Who is liable on a contract / tort?', b:['Joint & Several Liability'] },
      { label:'Can a partner bind the business?', b:['Agency Crossover'] },
      { label:'Did a partner breach duties?', b:['Loyalty / Care','Accounting'] },
      { label:'Dissolution vs. dissociation?', b:['Wind-Up v. Partner Exit'] },
      { label:'Entity twist?', b:['\u201cLimited\u201d Language','LP / LLP / LLC'] },
    ]},
    { roman:'I', title:'Formation — Is There a Partnership?', items:[
      { label:'<b>Rule:</b> an association of\u2026', b:['2+ Persons','Co-Owners','Business for Profit'] },
      { label:'<b>Professor\u2019s shortcut:</b> NO intent or written agreement needed — two key indicators:', b:['Shared Control','Sharing Profits'] },
      { label:'<b>Factors if close</b>', b:['Common Ownership of Property','Holding Out / \u201cPartner\u201d Label','Degree of Activity'] },
    ]},
    { roman:'II', title:'Internal Management (Defaults)', items:[
      { label:'<b>Management rights</b>', b:['Equal Rights in Management & Control'] },
      { label:'<b>Voting</b>', b:['Ordinary Course: Majority','Extraordinary / Against Agreement: Unanimous'] },
    ]},
    { roman:'III', title:'Profits & Losses (Default)', items:[
      { label:'<b>Default split</b> — point out the difference', b:['Modern Majority: Equal Split','Common Law: Capital Contribution Ratio','No Wages Absent Agreement','Agreement Supersedes'], s:'LP Contrast — LPs Share Per Capital Accounts' },
    ]},
    { roman:'IV', title:'Partner Authority — Binding the Partnership', items:[
      { label:'<b>Each partner is an agent of the partnership</b> for partnership business — run the ladder', b:['Express','Implied','Apparent','Ratification'] },
      { label:'<b>Edge case</b>', b:['Post-Dissolution Acts Bind','If 3P Lacks Notice'] },
    ]},
    { roman:'V', title:'Liability to Third Parties', items:[
      { label:'<b>General partnership</b>', b:['Jointly & Severally Liable','Contract + Tort, Ordinary Course'] },
      { label:'<b>Partner paid more than their share</b>', b:['Indemnification / Contribution'] },
      { label:'<b>Incoming partner</b>', b:['No Pre-Admission Liability','Investment at Risk'] },
    ]},
    { roman:'VI', title:'Fiduciary Duties', items:[
      { label:'<b>Duty of loyalty</b> (threefold)', b:['Account for Profits / Opportunities','No Adverse Dealing','No Competing'] },
      { label:'Loyalty remedy', sub:true, b:['Accounting / Disgorgement'] },
      { label:'<b>Duty of care</b>', b:['No Reckless / Negligent Conduct','Act Prudently'] },
    ]},
    { roman:'VII', title:'Exit Events', items:[
      { label:'<b>Dissociation</b> — one partner leaves', b:['Voluntary Withdrawal','Death','Incapacity','Expulsion'] },
      { label:'After dissociation', sub:true, b:['Management Rights End','Lingering Apparent Authority'] },
      { label:'<b>Wrongful dissociation</b>', b:['Willful Material Breach'] },
      { label:'<b>Dissolution</b> — partnership ends', b:['Unanimous Agreement','At-Will: Any Partner\u2019s Express Will','Death / Wrongful Dissociation Unless Majority in Interest Continues'] },
      { label:'<b>Winding up order</b>', b:['Finish Business \u2192 Creditors \u2192 Partners','Profits, Then Capital Accounts'] },
    ]},
    { roman:'VIII', title:'Entity Identification — \u201cLimited\u201d Language', items:[
      { label:'<b>GP</b>', b:['Default Entity','Shared Management','All Personally Liable'] },
      { label:'<b>LP</b>', b:['GP Manages + Liable','LPs Capped at Investment','LPs Vote Major Issues'] },
      { label:'<b>LLP — RUPA \u00a7306(c)</b> full shield', b:['Solely the Partnership\u2019s Obligation','Not Personally Liable','Solely by Reason of Being a Partner'] },
      { label:'LLP exception', sub:true, b:['Personal Misconduct','Own Malpractice Is Always Yours'] },
      { label:'LLP formalities', sub:true, b:['File with State (\u00a7\u00a71001\u20131003)','Letterhead / Signage Notice','Vote to Amend Agreement'] },
      { label:'<b>LLC — hybrid</b>, four characteristics', b:['Limited Liability','Partnership Tax','Management Flexibility','Creditor Protection'] },
      { label:'LLC shield exceptions', sub:true, b:['Agreed Contributions / Excess Distributions','Own Torts','Personal Guarantees'] },
      { label:'LLC management', sub:true, b:['Member-Managed = Partnership Model','Manager-Managed = Corporate Model','Each Member an Agent (Member-Managed)'] },
      { label:'Piercing the LLC veil [Hamilton v. AAHLC]', sub:true, b:['Undercapitalization','Formalities','Commingling','Alter Ego'] },
      { label:'Magic words', sub:true, b:['Omit \u201cLLC\u201d in Name','Liability Occasioned by the Omission','Causation Required'] },
      { label:'Two-member requirement (per course materials)', sub:true, b:['2+ Members at Creation'], v:'Verify — modern statutes permit single-member LLCs' },
      { label:'What contribution gets you', sub:true, b:['Profit / Loss Sharing','Management','Transferability','Per Articles of Organization'] },
    ]},
  ]
}
};

var state = { mod:'A', revealed:{}, marked:{} };
function g(id){ return document.getElementById(id); }

function itemKey(mod, si, ii){ return mod+'-'+si+'-'+ii; }

function build(){
  var mod = DATA[state.mod];
  var nav = g('sec-nav'); nav.innerHTML='';
  mod.sections.forEach(function(sec, si){
    var chip = document.createElement('button');
    chip.className='sec-chip'; chip.textContent = sec.roman+' · '+sec.title.split(' — ')[0].split(' (')[0];
    chip.addEventListener('click', function(){
      var el = document.getElementById('sec-'+si);
      el.querySelector('.sec-body').classList.add('open');
      el.querySelector('.sec-arrow').classList.add('open');
      el.scrollIntoView({behavior:'smooth', block:'start'});
    });
    nav.appendChild(chip);
  });

  var wrap = g('sections'); wrap.innerHTML='';
  mod.sections.forEach(function(sec, si){
    var sdiv = document.createElement('div');
    sdiv.className='section'; sdiv.id='sec-'+si;
    var nItems = sec.items.filter(function(it){return !it.take;}).length;
    var head = document.createElement('div');
    head.className='sec-head';
    head.innerHTML = '<div class="sec-title"><span class="roman">'+sec.roman+'.</span>'+sec.title+'</div><div class="sec-meta"><span class="sec-count">'+nItems+' items</span><span class="sec-arrow">\u25b6</span></div>';
    var body = document.createElement('div');
    body.className='sec-body';
    var inner = document.createElement('div');
    inner.className='sec-inner';
    head.addEventListener('click', function(){
      body.classList.toggle('open');
      head.querySelector('.sec-arrow').classList.toggle('open');
    });

    sec.items.forEach(function(it, ii){
      if(it.take){
        var t = document.createElement('div');
        t.className='takeaway'; t.textContent = it.take;
        inner.appendChild(t);
        return;
      }
      var key = itemKey(state.mod, si, ii);
      var item = document.createElement('div');
      item.className = 'cl-item'+(it.sub?' subitem':'')+(state.marked[key]?' marked':'');
      var check = document.createElement('div');
      check.className='cl-check'; check.textContent='\u2713';
      check.addEventListener('click', function(e){
        e.stopPropagation();
        state.marked[key] = !state.marked[key];
        item.classList.toggle('marked', !!state.marked[key]);
        updateProgress();
      });
      var content = document.createElement('div');
      content.className='cl-content';
      var label = document.createElement('div');
      label.className='cl-label'; label.innerHTML = it.label;
      var buzzWrap = document.createElement('div');
      buzzWrap.className='cl-buzz'+(state.revealed[key]?' revealed':'');
      var bhtml = (it.b||[]).map(function(b){return '<span class="buzz">'+b+'</span>';}).join('');
      if(it.s) bhtml += '<span class="split-tag">'+it.s+'</span>';
      if(it.v) bhtml += '<span class="verify-tag">'+it.v+'</span>';
      buzzWrap.innerHTML = bhtml;
      var hint = document.createElement('div');
      hint.className='tap-hint'; hint.textContent='Say the buzz words out loud — tap to check yourself';
      if(state.revealed[key]) hint.style.display='none';
      label.addEventListener('click', function(){
        state.revealed[key] = !state.revealed[key];
        buzzWrap.classList.toggle('revealed', !!state.revealed[key]);
        hint.style.display = state.revealed[key] ? 'none' : 'block';
      });
      content.appendChild(label);
      content.appendChild(hint);
      content.appendChild(buzzWrap);
      item.appendChild(check);
      item.appendChild(content);
      inner.appendChild(item);
    });

    body.appendChild(inner);
    sdiv.appendChild(head);
    sdiv.appendChild(body);
    wrap.appendChild(sdiv);
  });
  // open first section by default
  var first = wrap.querySelector('.section');
  if(first){ first.querySelector('.sec-body').classList.add('open'); first.querySelector('.sec-arrow').classList.add('open'); }
  updateProgress();
}

function totalItems(){
  var n=0;
  DATA[state.mod].sections.forEach(function(sec){ n += sec.items.filter(function(it){return !it.take;}).length; });
  return n;
}

function updateProgress(){
  var total = totalItems();
  var marked = 0;
  DATA[state.mod].sections.forEach(function(sec, si){
    sec.items.forEach(function(it, ii){
      if(!it.take && state.marked[itemKey(state.mod,si,ii)]) marked++;
    });
  });
  g('p-marked').textContent = marked;
  g('p-total').textContent = total;
  var pct = total>0 ? Math.round(marked/total*100) : 0;
  g('hdr-n').textContent = pct+'%';
  g('prog-fill').style.width = pct+'%';
}

document.querySelectorAll('.mod-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.mod-tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    state.mod = tab.getAttribute('data-mod');
    build();
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

g('btn-showall').addEventListener('click', function(){
  DATA[state.mod].sections.forEach(function(sec, si){
    sec.items.forEach(function(it, ii){
      if(!it.take) state.revealed[itemKey(state.mod,si,ii)] = true;
    });
  });
  build();
  document.querySelectorAll('.sec-body').forEach(function(b){ b.classList.add('open'); });
  document.querySelectorAll('.sec-arrow').forEach(function(a){ a.classList.add('open'); });
});

g('btn-reset').addEventListener('click', function(){
  Object.keys(state.revealed).forEach(function(k){ if(k.indexOf(state.mod+'-')===0) delete state.revealed[k]; });
  Object.keys(state.marked).forEach(function(k){ if(k.indexOf(state.mod+'-')===0) delete state.marked[k]; });
  build();
});

build();
})();
</script>
