<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LegalMinds — MBE Practice</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a1628; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px; }
#w { background: #0f1e35; border-radius: 12px; overflow: hidden; width: 100%; max-width: 760px; }
</style>
</head>
<body>
<div id="w">
  <div style="padding:16px 20px 12px;border-bottom:1px solid rgba(201,151,58,0.25);display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:17px;font-weight:500;color:#f5f0e8;">LEGAL<span style="color:#c9973a;font-style:italic;">MINDS</span> <span style="font-size:11px;color:#6b8aaa;font-weight:400;">MBE Practice</span></div>
    <div style="display:flex;gap:18px;">
      <div style="text-align:center;"><div style="font-size:16px;font-weight:500;color:#c9973a;" id="sc">0</div><div style="font-size:10px;color:#6b8aaa;text-transform:uppercase;">Score</div></div>
      <div style="text-align:center;"><div style="font-size:16px;font-weight:500;color:#c9973a;" id="st">0</div><div style="font-size:10px;color:#6b8aaa;text-transform:uppercase;">Streak</div></div>
      <div style="text-align:center;"><div style="font-size:16px;font-weight:500;color:#c9973a;" id="qn">-</div><div style="font-size:10px;color:#6b8aaa;text-transform:uppercase;">Round</div></div>
    </div>
  </div>
  <div style="height:3px;background:#1a2f4a;"><div id="pb" style="height:3px;background:#c9973a;width:0%;transition:width 0.4s;"></div></div>

  <div style="padding:18px 20px;" id="game">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;" id="frow"></div>
    <div id="badge" style="margin-bottom:10px;min-height:24px;"></div>
    <div id="prompt" style="background:#1a2f4a;border-radius:10px;padding:16px 18px;margin-bottom:16px;font-size:14px;color:#f5f0e8;line-height:1.65;border:1px solid rgba(201,151,58,0.15);min-height:60px;"></div>
    <div id="choices" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;"></div>
    <div id="reveal" style="display:none;background:#1a2f4a;border-radius:10px;padding:16px;margin-bottom:14px;border:1px solid rgba(201,151,58,0.3);">
      <div style="font-size:10px;color:#1d9e75;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;">Correct — why</div>
      <div id="rv-c" style="font-size:13px;color:#9fe1cb;line-height:1.55;margin-bottom:10px;"></div>
      <div id="rv-ww" style="display:none;">
        <div style="font-size:10px;color:#e24b4a;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;">Your answer — why wrong</div>
        <div id="rv-w" style="font-size:13px;color:#f09595;line-height:1.55;"></div>
      </div>
    </div>
    <button id="nxt" style="display:none;width:100%;background:#c9973a;border:none;border-radius:8px;padding:14px;font-size:14px;font-weight:500;color:#0f1e35;cursor:pointer;font-family:inherit;"></button>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:#6b8aaa;" id="prog"></div>
  </div>

  <div id="results" style="display:none;text-align:center;padding:32px 20px;">
    <div style="font-size:20px;font-weight:500;color:#f5f0e8;margin-bottom:8px;">Round complete.</div>
    <div style="font-size:46px;font-weight:500;color:#c9973a;line-height:1;margin-bottom:4px;" id="fscore"></div>
    <div style="font-size:13px;color:#6b8aaa;margin-bottom:22px;" id="fsub"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px;">
      <div style="background:#1a2f4a;border-radius:8px;padding:12px;"><div style="font-size:19px;font-weight:500;color:#c9973a;" id="fcorr"></div><div style="font-size:10px;color:#6b8aaa;text-transform:uppercase;margin-top:3px;">Correct</div></div>
      <div style="background:#1a2f4a;border-radius:8px;padding:12px;"><div style="font-size:19px;font-weight:500;color:#c9973a;" id="facc"></div><div style="font-size:10px;color:#6b8aaa;text-transform:uppercase;margin-top:3px;">Accuracy</div></div>
      <div style="background:#1a2f4a;border-radius:8px;padding:12px;"><div style="font-size:19px;font-weight:500;color:#c9973a;" id="fbst"></div><div style="font-size:10px;color:#6b8aaa;text-transform:uppercase;margin-top:3px;">Best streak</div></div>
    </div>
    <button id="play-again" style="background:#c9973a;border:none;border-radius:8px;padding:13px 32px;font-size:14px;font-weight:500;color:#0f1e35;cursor:pointer;font-family:inherit;">Play again</button>
  </div>
</div>

<script>
(function(){
var Q=[];

var chMap={'4':'Ch. 4 — Formalities','5':'Ch. 5 — Lapse / Intestacy','6':'Ch. 6 — Ademption','7':'Ch. 7 — Distribution'};
var chCol={'4':'#5DCAA5','5':'#f09595','6':'#f09595','7':'#c9973a'};
var filter='all', deck=[], cur=0, score=0, streak=0, best=0, corr=0, answered=false;

function sh(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function g(id){return document.getElementById(id);}

var frow=g('frow');
var filterDefs=[['all','All'],['4','Ch.4 Formalities'],['5','Ch.5 ⚠'],['6','Ch.6 ⚠⚠'],['7','Ch.7']];
filterDefs.forEach(function(fd){
  var btn=document.createElement('button');
  btn.textContent=fd[1];
  btn.style.cssText='padding:5px 12px;font-size:11px;border-radius:20px;border:1.5px solid #2a4a6a;background:transparent;color:#6b8aaa;cursor:pointer;font-family:inherit;';
  if(fd[0]==='all'){btn.style.background='#c9973a';btn.style.borderColor='#c9973a';btn.style.color='#0f1e35';btn.style.fontWeight='500';}
  (function(f,b){
    b.addEventListener('click',function(){
      filter=f;
      frow.querySelectorAll('button').forEach(function(x){x.style.background='transparent';x.style.borderColor='#2a4a6a';x.style.color='#6b8aaa';x.style.fontWeight='400';});
      b.style.background='#c9973a';b.style.borderColor='#c9973a';b.style.color='#0f1e35';b.style.fontWeight='500';
      init();
    });
  })(fd[0],btn);
  frow.appendChild(btn);
});

g('nxt').addEventListener('click',function(){cur++;render();});
g('play-again').addEventListener('click',function(){init();});

function init(){
  cur=0;score=0;streak=0;best=0;corr=0;answered=false;
  var pool=filter==='all'?Q:Q.filter(function(q){return q.ch===filter;});
  deck=sh(pool);
  g('results').style.display='none';
  g('game').style.display='block';
  g('sc').textContent='0';
  g('st').textContent='0';
  render();
}

function render(){
  if(cur>=deck.length){showResults();return;}
  var q=deck[cur];
  answered=false;
  g('qn').textContent=(cur+1)+'/'+deck.length;
  g('pb').style.width=(cur/deck.length*100)+'%';
  g('badge').innerHTML='<span style="display:inline-block;font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(201,151,58,0.15);color:'+chCol[q.ch]+';font-weight:500;">'+chMap[q.ch]+'</span>'+(q.h?'<span style="display:inline-block;font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(226,75,74,0.2);color:#f09595;font-weight:500;margin-left:6px;">You missed this type</span>':'');
  g('prompt').textContent=q.q;

  var opts=sh(q.opts.map(function(o,i){return{t:o.t,e:o.e,correct:(i===q.ci)};}));
  var letters=['A','B','C','D'];
  var ch=g('choices');
  ch.innerHTML='';
  opts.forEach(function(opt,i){
    var btn=document.createElement('button');
    btn.style.cssText='display:block;width:100%;text-align:left;border-radius:8px;padding:15px 16px;font-size:13px;font-family:inherit;cursor:pointer;border:2px solid #2a4a6a;background:#1e3a58;color:#f5f0e8;line-height:1.5;';
    btn.innerHTML='<strong style="color:#c9973a;margin-right:8px;">'+letters[i]+'.</strong>'+opt.t;
    (function(o,b){
      b.addEventListener('click',function(){
        if(answered)return;
        answered=true;
        ch.querySelectorAll('button').forEach(function(x){x.style.cursor='default';});
        opts.forEach(function(oo,ii){
          var xb=ch.querySelectorAll('button')[ii];
          if(oo.correct){xb.style.background='#0f3d2a';xb.style.borderColor='#1d9e75';xb.style.color='#9fe1cb';}
        });
        if(!o.correct){b.style.background='#3d1515';b.style.borderColor='#e24b4a';b.style.color='#f09595';}
        if(o.correct){corr++;streak++;if(streak>best)best=streak;score+=100+(streak>1?(streak-1)*20:0);}
        else{streak=0;}
        g('sc').textContent=score;
        g('st').textContent=streak;
        var correctOpt=opts.filter(function(x){return x.correct;})[0];
        g('rv-c').textContent=correctOpt.e;
        var ww=g('rv-ww');
        if(!o.correct){ww.style.display='block';g('rv-w').textContent=o.e;}
        else{ww.style.display='none';}
        g('reveal').style.display='block';
        var nxt=g('nxt');
        nxt.textContent=cur<deck.length-1?'Next question':'See results';
        nxt.style.display='block';
      });
    })(opt,btn);
    ch.appendChild(btn);
  });

  g('reveal').style.display='none';
  g('nxt').style.display='none';
  g('prog').textContent=(cur+1)+' of '+deck.length;
}

function showResults(){
  g('game').style.display='none';
  g('results').style.display='block';
  g('pb').style.width='100%';
  var pct=Math.round(corr/deck.length*100);
  g('fscore').textContent=score;
  g('fsub').textContent=pct>=80?'Counselor.':pct>=60?'Getting there.':'Ch. 6 is waiting.';
  g('fcorr').textContent=corr+'/'+deck.length;
  g('facc').textContent=pct+'%';
  g('fbst').textContent=best;
}

init();
})();
</script>
</body>
</html>
