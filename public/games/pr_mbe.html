"id":272}, {"topic":"Advocacy","style":"BARBRI","stem":"If one lawyer is a necessary witness at a trial and prohibited from serving as trial counsel, can another member of the lawyer's firm serve as trial counsel?","choices":[{"letter":"A","text":"No, because the lawyer-witness's prohibition on serving as trial counsel is imputed to all members of that lawyer's firm"},{"letter":"B","text":"Yes, but the lawyer may not cross-examine his colleague at trial"},{"letter":"C","text":"Yes, provided the conflict of interest rules do not otherwise preclude the other lawyer from serving as trial counsel"}],"correct":"C","explanation":"A lawyer is permitted to act as an advocate at a trial in which another lawyer in the lawyer's firm is likely to be called as a witness, UNLESS the conflict of interest rules preclude the other lawyer from serving as trial counsel. The advocate-witness prohibition is NOT imputed to other firm members. There are no special rules regarding cross-examining colleagues at trial.","verify":false,"id":273}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer represents a defendant in a criminal case and believes that her client is guilty. Under the rule against frivolous positions, is it improper for the lawyer to allow the client to plead not guilty?","choices":[{"letter":"A","text":"Yes, it is improper to allow a client to plead not guilty when the lawyer believes otherwise"},{"letter":"B","text":"No, if the lawyer believes there is a good faith argument that the client is not guilty"},{"letter":"C","text":"No, because in a criminal matter, it is not improper to require the prosecution to prove every necessary element of the crime"}],"correct":"C","explanation":"Despite the general rule against frivolous positions, a lawyer for a defendant in a criminal case may conduct the defense to require the prosecutor to prove every necessary element of the crime. This is true even if the lawyer believes the client is guilty. It is not necessary that the lawyer believe there is a good faith argument that the client is not guilty.","verify":false,"id":274}, {"topic":"Third Parties","style":"BARBRI","stem":"Which statement correctly describes a lawyer's obligation when dealing on behalf of a client with a third party?","choices":[{"letter":"A","text":"A lawyer must always disclose facts to a third party to avoid assisting her client in committing a crime or fraud"},{"letter":"B","text":"A lawyer must not knowingly misrepresent the law to third parties"},{"letter":"C","text":"A lawyer must inform a third party of all relevant facts related to the matter"}],"correct":"B","explanation":"When dealing on behalf of a client with a third party, a lawyer must not knowingly make a false statement of law or material fact. However, a lawyer generally does not have a duty to inform a third person of relevant facts. A lawyer may sometimes disclose facts to prevent a client's crime or fraud, but may not do so when disclosure is forbidden by the duty of confidentiality — in that case the lawyer must withdraw.","verify":false,"id":275}, {"topic":"Third Parties","style":"BARBRI","stem":"Without specific authorization from the court or by law, is a lawyer permitted to speak about a matter with a party who is represented by counsel in the matter?","choices":[{"letter":"A","text":"No, a lawyer may never speak directly with represented parties"},{"letter":"B","text":"Yes, as long as the party initiated the conversation"},{"letter":"C","text":"Yes, but only when the party's counsel consents"}],"correct":"C","explanation":"A lawyer must not communicate about a matter with a person the lawyer knows is represented by counsel, unless that person's counsel consents, or unless the law or a court order authorizes the communication. Such communication is prohibited even if the represented party initiated the communication or consented to it.","verify":false,"id":276}, {"topic":"Third Parties","style":"BARBRI","stem":"Which statement regarding a lawyer's communication with third parties is FALSE?","choices":[{"letter":"A","text":"A lawyer generally has no duty to volunteer relevant facts"},{"letter":"B","text":"A lawyer must disclose any facts necessary to avoid assisting the client in committing a crime or fraud"},{"letter":"C","text":"A lawyer must not knowingly misrepresent the law to a third party"},{"letter":"D","text":"'Puffery' is generally allowed in communications with third parties"}],"correct":"B","explanation":"FALSE: A lawyer may sometimes disclose facts to avoid assisting a client in a crime or fraud, but may NOT do so when disclosure is forbidden by the ethical duty of confidentiality — in that case the lawyer must withdraw. The other statements are true: lawyers generally have no duty to volunteer facts; lawyers must not misrepresent the law; puffery (statements not taken as statements of material fact) is generally allowed.","verify":false,"id":277}, {"topic":"Third Parties","style":"BARBRI","stem":"Corporations are 'persons' for purposes of the no-contact rule. With which of the following corporate constituents is a lawyer allowed to communicate WITHOUT the organization's counsel's consent?","choices":[{"letter":"A","text":"Any employee who consents to the communication"},{"letter":"B","text":"An employee who has the authority to obligate the organization concerning the matter"},{"letter":"C","text":"A former employee who no longer works for the organization"},{"letter":"D","text":"An employee who supervises the organization's corporate counsel"}],"correct":"C","explanation":"Consent is not needed before talking to a former employee who no longer works for the organization. Consent of the organization's counsel IS required before communicating with: (i) a person who supervises, directs, or regularly consults with corporate counsel about the matter; (ii) a person whose conduct may be imputed to the organization for criminal or civil liability; or (iii) a person who has authority to obligate the organization concerning the matter.","verify":false,"id":278}, {"topic":"Third Parties","style":"BARBRI","stem":"A client is engaging in fraud against a third party and the lawyer wants to avoid assisting the client in the fraud. Which statement describes the best course of action?","choices":[{"letter":"A","text":"The lawyer must withdraw if disclosure to the third party is prohibited by the ethical duty of confidentiality"},{"letter":"B","text":"The lawyer must notify the court of the fraud and allow the court to address the matter"},{"letter":"C","text":"The lawyer must disclose the material facts to the third party"},{"letter":"D","text":"The lawyer has no duty to inform the third party of any material fact, even if the existing facts constitute a falsehood"}],"correct":"A","explanation":"A lawyer must disclose material facts to a third person when necessary to avoid assisting the client in a crime or fraud. However, if disclosure to the third party is prohibited by the ethical duty of confidentiality, the lawyer must WITHDRAW from the representation. The lawyer may not simply notify the court or disclose confidential information without authorization.","verify":false,"id":279}, {"topic":"Third Parties","style":"BARBRI","stem":"Under the rules governing contact with represented and unrepresented persons, a lawyer __________.","choices":[{"letter":"A","text":"Is not authorized to speak with any person who is affiliated with the opposing party without consent"},{"letter":"B","text":"Need not disclose his identity or role in the matter to an unrepresented person"},{"letter":"C","text":"May never give legal advice to an unrepresented person"},{"letter":"D","text":"May interview an unrepresented person who will be called as a witness by the opposing party"}],"correct":"D","explanation":"A lawyer may interview an unrepresented person who will be called as a witness by another party. The no-contact rule does not prohibit: communication not concerning the subject of representation; represented persons from communicating directly with each other; or interviewing unrepresented witnesses. A lawyer must not state or imply being disinterested when dealing with an unrepresented person, and must correct misunderstandings about the lawyer's role. A lawyer may give legal advice to an unrepresented person unless the client's interests are likely in conflict with that person's interests.","verify":false,"id":280}, {"topic":"Advertising","style":"BARBRI","stem":"Regarding a state's ability to regulate lawyer advertising, which statement is true?","choices":[{"letter":"A","text":"A state may ban all lawyer advertising"},{"letter":"B","text":"A state may adopt reasonable regulations to prevent false or misleading advertising"},{"letter":"C","text":"All regulations of lawyer advertising are subject to strict scrutiny"}],"correct":"B","explanation":"The U.S. Supreme Court recognizes lawyer advertising as commercial speech protected by the First and Fourteenth Amendments. A state may adopt reasonable regulations to ensure that lawyer advertising is not false or misleading, but may not totally ban all lawyer advertising. Regulations of lawyer advertising are subject to intermediate scrutiny, not strict scrutiny.","verify":false,"id":281}, {"topic":"Advertising","style":"BARBRI","stem":"Under the ABA Model Rules, which of the following statements is true regarding advertising and other communications about a lawyer's services?","choices":[{"letter":"A","text":"Electronic advertisements are prohibited"},{"letter":"B","text":"A lawyer may enter into an arrangement with another lawyer in which they refer clients to each other"},{"letter":"C","text":"A lawyer is prohibited from naming specific clients in advertisements"},{"letter":"D","text":"An advertisement is proper as long as it does not contain false information"}],"correct":"B","explanation":"A lawyer may enter into a reciprocal referral arrangement with another lawyer or nonlawyer professional subject to certain restrictions. A lawyer may advertise in written, recorded, and electronic media, including public media. A lawyer may identify clients by name in an advertisement after obtaining clients' consent. An advertisement must be truthful AND non-misleading — true information can still be misleading.","verify":false,"id":282}, {"topic":"Advertising","style":"BARBRI","stem":"Which of the following most likely constitutes prohibited solicitation?","choices":[{"letter":"A","text":"The attorney releases an Internet banner advertisement encouraging anyone in need of a divorce attorney to call his office"},{"letter":"B","text":"The attorney sends an email to a murder suspect offering to represent her"},{"letter":"C","text":"The attorney telephones an accident victim and offers to represent her on a contingency fee basis"},{"letter":"D","text":"The attorney visits her uncle and offers to draft his will for him"}],"correct":"C","explanation":"Telephoning an accident victim is prohibited live person-to-person solicitation when a significant motive is pecuniary gain. An Internet banner advertisement is directed to the general public — not a solicitation. An email does not constitute live person-to-person contact, so it is permitted. Live person-to-person contact with relatives is permitted (visiting her uncle).","verify":false,"id":283}, {"topic":"Advertising","style":"BARBRI","stem":"Can a lawyer advertise that he is a certified specialist in a particular field of law?","choices":[{"letter":"A","text":"No, the term 'certified' has been found to be inherently misleading"},{"letter":"B","text":"Yes, if he practices exclusively within that field"},{"letter":"C","text":"Yes, if the certifying organization is identified and has been approved by the state or the ABA"},{"letter":"D","text":"Only if the certifying body of law is patent or admiralty law"}],"correct":"C","explanation":"A lawyer who has been certified as a specialist may state that fact if: (i) the certifying organization has been approved by the state or the ABA, and (ii) the name of the certifying organization is clearly identified in the communication. Practicing exclusively in a field is not sufficient. The term 'certified' is not inherently misleading if all requirements are met.","verify":false,"id":284}, {"topic":"Advertising","style":"BARBRI","stem":"Under the ABA Model Rules, when a partner dies, may the firm continue to use that partner's name in its letterhead?","choices":[{"letter":"A","text":"Yes, because a firm may continue to use the name of all former partners in its letterhead"},{"letter":"B","text":"No, because this is a false indication of partnership"},{"letter":"C","text":"Yes, this is allowed"}],"correct":"C","explanation":"A private law partnership may be designated by the names of one or more of the partners. When partners die or retire, their names may be carried over to successor partnerships. However, the general rule is that lawyers must not imply they are associated in a firm unless they really are — so not all former partners' names may be used indefinitely, but deceased and retired partners are a specific exception.","verify":false,"id":285}, {"topic":"Advertising","style":"BARBRI","stem":"May a lawyer be subject to discipline for written advertisements that contain only true information?","choices":[{"letter":"A","text":"No, a lawyer may only be disciplined for false information in advertisements"},{"letter":"B","text":"Yes, a lawyer may be disciplined for any communication that is misleading, even if true"},{"letter":"C","text":"No, a lawyer may only be disciplined for in-person solicitations"}],"correct":"B","explanation":"A lawyer is subject to discipline for any communication about the lawyer or the lawyer's services that is false OR misleading. A communication can be true but misleading if it omits a fact necessary to make the communication as a whole not materially misleading.","verify":false,"id":286}, {"topic":"Advertising","style":"BARBRI","stem":"A lawyer wants to visit and offer his legal services to a specific person, who happens to be his brother. If __________, it is improper for the lawyer to solicit work from the brother.","choices":[{"letter":"A","text":"The lawyer is seeking fee-paying work"},{"letter":"B","text":"The brother is known to face a specific legal problem"},{"letter":"C","text":"The brother has told the lawyer that he does not want to receive such communications"}],"correct":"C","explanation":"Although a lawyer is generally prohibited from using personal contacts to solicit fee-paying work, there are exceptions for family members. However, a lawyer must not solicit any person by any method if the person has made it known that he does not want to be contacted, or if the communication involves coercion, duress, or harassment.","verify":false,"id":287}, {"topic":"Advertising","style":"BARBRI","stem":"Which of the following statements is true regarding a lawyer's communications about her fields of practice and certifications?","choices":[{"letter":"A","text":"A lawyer may state that an organization has certified her as a 'specialist' as long as the organization is approved by the state or ABA, but need NOT reveal the certifying organization"},{"letter":"B","text":"A lawyer may always state that an organization has certified her as a 'specialist,' as long as this information is true and not misleading"},{"letter":"C","text":"A lawyer may state that she does or does not practice in certain fields of law"}],"correct":"C","explanation":"A lawyer may state to the public that she practices (or does not practice) in a certain field of law. Even if certified as a 'specialist,' the lawyer may not claim to be a certified specialist unless: (i) the certifying organization is approved by the state or the ABA, AND (ii) the certifying organization is clearly identified in the communication. Both requirements must be met.","verify":false,"id":288}, {"topic":"Advertising","style":"BARBRI","stem":"Which of the following private law firm names is most likely to be found misleading?","choices":[{"letter":"A","text":"Lawyers-R-Us"},{"letter":"B","text":"Smith and Jones LLP (Jones is a deceased partner)"},{"letter":"C","text":"City Legal Aid Clinic"}],"correct":"C","explanation":"A firm name is misleading if it implies a connection with a government agency or with a public or charitable legal services organization. 'City Legal Aid Clinic' is likely misleading unless accompanied by an express disclaimer. A trade name like 'Lawyers-R-Us' is not inherently misleading. The name of a deceased partner may be included in a firm name.","verify":false,"id":289}, {"topic":"Advertising","style":"BARBRI","stem":"Every lawyer advertisement must include __________.","choices":[{"letter":"A","text":"The field of practice in which a lawyer practices"},{"letter":"B","text":"The identity of past clients and their successful cases"},{"letter":"C","text":"The fee structure for a lawyer's services"},{"letter":"D","text":"The name and contact information of at least one lawyer or law firm responsible for its content"}],"correct":"D","explanation":"Every advertisement must include the name and contact information of at least one lawyer or law firm responsible for its content. The field of practice, fee structure, and identity of past clients are all optional information.","verify":false,"id":290}, {"topic":"Advertising","style":"BARBRI","stem":"May a lawyer advertise that she practices within a specific field of law?","choices":[{"letter":"A","text":"Yes, this is generally allowed"},{"letter":"B","text":"Only if she is a patent attorney or practices admiralty law"},{"letter":"C","text":"Only if she is a certified specialist and the certifying entity is recognized by the state or ABA"},{"letter":"D","text":"No, a lawyer may never designate a particular specialty or field of practice in her advertising"}],"correct":"A","explanation":"In public communications, a lawyer may state that she does (or does not) practice in particular fields of law. Note: she must not state that she is a certified specialist unless the certifying body has been approved by the state or the ABA. All lawyers — not just patent and admiralty lawyers — may state they practice in particular fields.","verify":false,"id":291}, {"topic":"Advertising","style":"BARBRI","stem":"May two law firms hold themselves out to the public as being 'affiliated' with each other?","choices":[{"letter":"A","text":"No, two separate firms may never hold themselves out as being affiliated with each other"},{"letter":"B","text":"No, only firms that share a common ownership may hold themselves out as affiliated with each other"},{"letter":"C","text":"Yes, but the two firms are treated as a single unit for conflict of interest purposes"}],"correct":"C","explanation":"Two law firms may hold themselves out as 'associated' or 'affiliated' if they have a close, regular, ongoing relationship (common ownership is not required) and the designation is not misleading. However, the two firms would ordinarily be treated as a single unit for conflict of interest purposes.","verify":false,"id":292}, {"topic":"Advertising","style":"BARBRI","stem":"Which of the following statements is true regarding reciprocal referral arrangements?","choices":[{"letter":"A","text":"Such agreements are typically of an indefinite duration"},{"letter":"B","text":"The lawyer may enter into such an arrangement with a lawyer or a nonlawyer professional"},{"letter":"C","text":"The arrangement must be exclusive"},{"letter":"D","text":"The lawyer may only enter into such an arrangement with a lawyer, not a nonlawyer professional"}],"correct":"B","explanation":"A lawyer may set up a reciprocal referral arrangement with another lawyer OR with a nonlawyer professional. Requirements: (i) must not be exclusive; (ii) referred client must be told about the arrangement; (iii) the agreement must not interfere with the lawyer's professional judgment; and (iv) the agreement should not be of indefinite duration and should be reviewed periodically.","verify":false,"id":293}, {"topic":"Advertising","style":"BARBRI","stem":"A lawyer calls a local man accused of murder and offers to represent him free of charge. Under the rules regarding solicitation, which statement is true?","choices":[{"letter":"A","text":"The lawyer acted improperly because such live telephone contact with potential clients is strictly prohibited"},{"letter":"B","text":"The lawyer could have properly instructed her agent to make the same telephone call"},{"letter":"C","text":"The lawyer acted properly because she did not visit the man in person"}],"correct":"B","explanation":"The prohibition on live person-to-person solicitation applies only when a significant motive is PECUNIARY GAIN. Since the lawyer offered to represent the man for free, the prohibition does not apply. Therefore, the lawyer could also have properly instructed an agent to make the same telephone call. The lawyer's contact would have been proper even in person.","verify":false,"id":294}, {"topic":"Advertising","style":"BARBRI","stem":"Olivia's classmate Brennan is president of a small insurance company that manages a legal services policy. Employees sell subscriptions by phone, locating potential subscribers based on location and demographic information only. Brennan wants to reactivate his law license to provide services to members of the plan. Who can properly provide legal services to members?","choices":[{"letter":"A","text":"Olivia only"},{"letter":"B","text":"Brennan only"},{"letter":"C","text":"Olivia and Brennan"},{"letter":"D","text":"Neither Olivia nor Brennan"}],"correct":"A","explanation":"Olivia may participate because the plan is not contacting persons known to need specific legal services in a particular matter — contact is based on location and demographic information only. Olivia has reasonably ensured the plan complies with advertising and solicitation rules. Where a legal services plan uses live person-to-person contacts, a lawyer CANNOT participate if he owns or directs the organization that operates the plan. Brennan is president of the insurance company that operates the plan, so he cannot provide legal services to members.","verify":false,"id":295}, {"topic":"Advertising","style":"BARBRI","stem":"Lorenzo visits the owner of a shopping mall and says, 'I heard you're planning to lease out your top floor to a new department store. I know you always hire large firms to do your leasing work, but I have extensive experience in this field, and I'd like you to consider me for the job.' This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"A","explanation":"This is proper solicitation. Live person-to-person contact with routine business users of the type of services offered is generally allowed. Lorenzo's reference to the owner 'always' hiring other firms for leasing work demonstrates that the owner is a routine user of these services.","verify":false,"id":296}, {"topic":"Advertising","style":"BARBRI","stem":"Jamila sends an email to all members of her tennis club and encourages them to contact her for discounted services if they ever need a lawyer. This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"C","explanation":"There is no indication that the members of Jamila's tennis club were known to need legal services in a particular matter. A solicitation is a communication directed to a specific person the lawyer knows or reasonably should know needs legal services in a particular matter. Because no such specific need is known, this is advertising directed to a general group — not solicitation.","verify":false,"id":297}, {"topic":"Advertising","style":"BARBRI","stem":"Josie previously sent a letter offering her services to several patients of a hospital who suffered life-threatening infections. One of the victims calls Josie and asks to be removed from the list because he already has a lawyer. Josie sends that victim another letter providing additional details of her expertise. This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"B","explanation":"This is prohibited solicitation. Although a letter does not constitute live person-to-person contact, the second letter is still prohibited because the victim had made it known to Josie that he did not want to be solicited. A lawyer must not solicit any person by any method if the person has made it known that he does not want to receive such communications.","verify":false,"id":298}, {"topic":"Advertising","style":"BARBRI","stem":"Mario places a FaceTime call to his best friend and offers to represent her in contesting a traffic ticket. This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"A","explanation":"This is proper solicitation. Live person-to-person contact with certain persons, including close friends, is generally allowed. The prohibition on live person-to-person solicitation for pecuniary gain does not apply to close friends.","verify":false,"id":299}, {"topic":"Advertising","style":"BARBRI","stem":"Gunther's website states, 'NEED A DIVORCE LAWYER? FILL OUT THE CONTACT FORM BELOW.' This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"C","explanation":"This website is directed to the general public, and Gunther has not initiated contact with anyone known to need legal services in a particular matter. A communication directed to the general public (e.g., through a billboard, website, or Internet advertisement) is advertising, not solicitation.","verify":false,"id":300}, {"topic":"Advertising","style":"BARBRI","stem":"After Elizabeth hears about a hit-and-run car accident on the news, she sends her paralegal to the hospital to tell the victim about Elizabeth's firm. This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"B","explanation":"This is prohibited solicitation. A lawyer cannot use an agent to do what the lawyer is not permitted to do. Sending a paralegal to the hospital is prohibited live person-to-person solicitation directed to a specific accident victim the lawyer knows needs legal services.","verify":false,"id":301}, {"topic":"Advertising","style":"BARBRI","stem":"Upon hearing that an acquaintance was injured at work, Greta sends her a text message offering to represent her in her workers' compensation case. This is:","choices":[{"letter":"A","text":"Proper solicitation"},{"letter":"B","text":"Prohibited solicitation"},{"letter":"C","text":"Not solicitation"}],"correct":"A","explanation":"This is proper solicitation. Text messages do not constitute live person-to-person contact. The prohibition on solicitation applies only to live person-to-person contact (in-person, live telephone, or real-time visual/auditory communication). A text message is not a real-time communication that subjects the recipient to a direct personal encounter without time for reflection.","verify":false,"id":302}, {"topic":"Advertising","style":"BARBRI","stem":"A lawyer could properly make a reciprocal referral arrangement with:","choices":[{"letter":"A","text":"An owner of a clothing store"},{"letter":"B","text":"A computer salesperson"},{"letter":"C","text":"A dentist"}],"correct":"C","explanation":"A dentist falls within the generally accepted meaning of 'nonlawyer professional.' Dentistry requires a high level of training and dentists are licensed and regulated. A clothing store owner or computer salesperson would not qualify as a 'nonlawyer professional' for purposes of reciprocal referral arrangements.","verify":false,"id":303}, {"topic":"Advertising","style":"BARBRI","stem":"Bree (lawyer) and Owen (accountant) agree to a nonexclusive reciprocal referral arrangement, will fully inform each client of the agreement, and agree the arrangement will be binding until one of them dies or retires from practice. Was the agreement proper?","choices":[{"letter":"A","text":"Yes, because it was not exclusive, and clients would be informed"},{"letter":"B","text":"No, because it was intended to last until death or retirement"},{"letter":"C","text":"No, because Owen is not a lawyer"}],"correct":"B","explanation":"A reciprocal referral agreement may be entered into with a lawyer or nonlawyer professional (accountants qualify) if it is not exclusive and referred clients are informed. However, such an agreement should NOT be of indefinite duration. The agreement between Bree and Owen is effectively indefinite because it will last until one of them retires or dies — this is improper.","verify":false,"id":304}, {"topic":"Advertising","style":"BARBRI","stem":"Divorce lawyer CeeCee joins 'JusticeMatch,' a service where consumers select their legal problem and are provided a list of lawyers in that field. Because CeeCee purchased a premium membership, she has a 'Best Match' icon next to her name. Was it proper for CeeCee to join JusticeMatch?","choices":[{"letter":"A","text":"No, because she paid for a recommendation"},{"letter":"B","text":"Yes, because lawyers may pay the reasonable costs and charges of advertising and lawyer referral services"}],"correct":"A","explanation":"A lawyer may pay others to generate client leads as long as the lead generator does not recommend the lawyer and the lead generator's communications are not false or misleading. A communication is misleading if it creates a reasonable impression that: (i) it is recommending the lawyer; (ii) it has analyzed the person's legal problems when determining whether to refer the person to the lawyer; or (iii) it is making the referral without any payment from the lawyer. JusticeMatch appears to recommend premium-member lawyers over others via the 'Best Match' icon, so CeeCee is subject to discipline.","verify":false,"id":305}, {"topic":"Advertising","style":"BARBRI","stem":"Larry, a corporate lawyer, tells his client Maude, 'If you put in a good word for me with your cousin [a general counsel], you've got playoff tickets coming your way.' The team fails to make the playoffs and Maude never talks to her cousin. Is Larry subject to discipline?","choices":[{"letter":"A","text":"No, because the tickets would have been a nominal expression of appreciation"},{"letter":"B","text":"No, because Maude did not recommend him to her cousin"},{"letter":"C","text":"No, because he did not give any tickets to Maude"},{"letter":"D","text":"Yes, because he promised the tickets in exchange for a recommendation"}],"correct":"D","explanation":"A lawyer cannot compensate, give anything of value, or promise to give anything of value to a person for recommending the lawyer's services. Even a nominal gift is prohibited if offered in consideration of any understanding that such a gift would be a form of compensation for making referrals. The PROMISE alone is enough to violate the rule — it is immaterial that the recommendation never happened and the tickets were never given.","verify":false,"id":306}, {"topic":"Advertising","style":"BARBRI","stem":"Lucy's firm bio states: 'I specialize in Internet privacy law. The standards for certification in State A are very high, and only the most experienced and highly trained practitioners receive this honor.' Is the statement proper?","choices":[{"letter":"A","text":"Yes, provided she has been certified as a specialist by an organization approved by State A"},{"letter":"B","text":"Yes, because a lawyer may state that she specializes in a field of law based on her experience, specialized training, or education"},{"letter":"C","text":"No, even if she has been certified as a specialist approved by State A"}],"correct":"C","explanation":"A lawyer may not state or imply being certified as a specialist unless: (i) the lawyer has been certified by an organization approved by the state or the ABA, AND (ii) the name of the certifying organization is clearly identified in the communication. Lucy implied certification ('only the most experienced and highly trained practitioners receive this honor') but failed to clearly name the certifying organization — making the statement improper even if she is actually certified.","verify":false,"id":307}, {"topic":"Advertising","style":"BARBRI","stem":"Ginny wants to advertise that she is a specialist in a particular field of law. May she properly do so?","choices":[{"letter":"A","text":"No, unless she practices patent or admiralty law"},{"letter":"B","text":"No, unless she (1) has been certified as a specialist by an organization approved by the ABA or a state authority, and (2) clearly identifies the certifying organization"},{"letter":"C","text":"Yes, as long as the statement is based on her experience, specialized training, or education and is not false or misleading"}],"correct":"C","explanation":"Any lawyer may state that she is a 'specialist' in a particular field of law based on her experience, specialized training, or education as long as the statement is not false or misleading. The certification requirements (approved organization, identified certifying organization) apply only when a lawyer states or implies that she is a CERTIFIED specialist — not when simply claiming to specialize based on experience.","verify":false,"id":308}, {"topic":"Advertising","style":"BARBRI","stem":"A firm is named 'Domino, Peterson, & Keller.' Domino and Peterson are partners, and Keller is the firm's head paralegal. Is the firm name proper?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"It is misleading to include the name of any nonlawyer in a firm name. Keller is a paralegal, not a lawyer, so including Keller's name in the firm name is improper.","verify":false,"id":309}, {"topic":"Advertising","style":"BARBRI","stem":"A firm is named 'Glover, Peele, & Yang.' Glover and Yang are living partners. Peele was a partner but moved to a firm in a different state last year. Is the name proper?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"Although a firm name may continue to use the names of DECEASED or RETIRED partners, Peele is alive and practicing law elsewhere. The firm's continued use of her name is misleading because it implies she is still associated with the firm.","verify":false,"id":310}, {"topic":"Advertising","style":"BARBRI","stem":"A firm is named 'Alvarez, Kane, & Lee.' Alvarez and Kane are living partners. Lee was the third partner but died two years ago. Is the name proper?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"A","explanation":"When partners die, successor partnerships may continue to use their names. A firm name may carry on the names of deceased (and retired) partners.","verify":false,"id":311}, {"topic":"Advertising","style":"BARBRI","stem":"A private personal injury firm located in City B calls itself 'City B Legal Aid Clinic.' Is the name likely proper?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"Trade names are generally permitted as long as they are not false or misleading. A geographical trade name like 'City B Legal Aid Clinic' is misleading because it implies a connection with a public or charitable legal services organization. Such a name usually requires an express disclaimer that it is not a public legal aid organization.","verify":false,"id":312}, {"topic":"Advertising","style":"BARBRI","stem":"Attorney Perez of the Perez, O'Leary, & Miller law firm was elected to the state legislature. Perez periodically travels to the state capital for a few days at a time during the legislative season, but otherwise continues his practice. May the firm continue to use Perez's name?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"A","explanation":"If a lawyer has entered public service, the firm cannot use the lawyer's name during any substantial period in which the lawyer is not regularly and actively practicing with the firm. Perez is still regularly and actively practicing law despite his legislative duties, so the firm may continue to use his name.","verify":false,"id":313}, {"topic":"Public Service","style":"BARBRI","stem":"Which of the following statements is correct under the ABA Model Rules of Professional Conduct?","choices":[{"letter":"A","text":"A lawyer must not seek to avoid accepting a court-appointed client except for good cause"},{"letter":"B","text":"A lawyer must accept any indigent court-appointed client, but may decline others"},{"letter":"C","text":"A lawyer must accept any court-appointed client"},{"letter":"D","text":"A lawyer may decline any court-appointed client at the lawyer's discretion"}],"correct":"A","explanation":"ABA Model Rule 6.2 provides that a lawyer must not seek to avoid accepting a court-appointed client except for good cause. Examples of good cause include unreasonable financial burden and inability to properly effectively represent the client due to a personal issue. It is incorrect to state that a lawyer must accept any court-appointed client, or any indigent court-appointed client.","verify":false,"id":314}, {"topic":"Public Service","style":"BARBRI","stem":"May a lawyer be disciplined for violating the Model Rule regarding annual pro bono service?","choices":[{"letter":"A","text":"No, because a lawyer is only required to contribute monetarily to those who provide pro bono services, and need not perform the services himself"},{"letter":"B","text":"No, because a lawyer is encouraged, but not required, to perform 50 hours of pro bono services per year"},{"letter":"C","text":"Yes, because a lawyer is required to perform 50 hours of pro bono services a year"}],"correct":"B","explanation":"Violating ABA Model Rule 6.1 is not grounds for professional discipline; Model Rule 6.1 recommends that every lawyer should spend 50 hours per year on pro bono work. Nor is the lawyer required to make monetary contributions to lawyers providing pro bono services.","verify":false,"id":315}, {"topic":"Public Service","style":"BARBRI","stem":"Does a lawyer who is a director of a legal services organization that provides services to the poor have a lawyer-client relationship with the persons served by the organization?","choices":[{"letter":"A","text":"No, so there will be no conflict of interest if a person served by the organization becomes adverse to a regular client of the lawyer"},{"letter":"B","text":"Yes, there is always a lawyer-client relationship between the lawyer and the persons served by the legal organization"},{"letter":"C","text":"No, but a conflict of interest may arise if a person served by the organization becomes adverse to one of the lawyer's regular clients"}],"correct":"C","explanation":"A director, officer, or member of a legal services organization does not have a lawyer-client relationship with persons served by the organization, but there can be potential conflicts between the interests of those persons and the interests of the lawyer's regular, paying clients.","verify":false,"id":316}, {"topic":"Public Service","style":"BARBRI","stem":"With respect to quick-advice legal hotlines, which statement regarding the lawyer-client relationship is most correct?","choices":[{"letter":"A","text":"A lawyer-client relationship is never created in a quick-advice situation"},{"letter":"B","text":"A lawyer-client relationship is created in a quick-advice situation, but neither party expects it to continue past the quick-advice stage"},{"letter":"C","text":"A lawyer-client relationship is created in a quick-advice situation, and the relationship continues until the client's legal issue is ultimately resolved"},{"letter":"D","text":"A lawyer-client relationship is generally not created in a quick-advice situation because a lawyer-client relationship is only created when a client pays for legal advice from a lawyer"}],"correct":"B","explanation":"A lawyer-client relationship exists between the lawyer and the person who obtains the quick advice, but neither party expects the relationship to continue past the quick-advice stage. Lawyers often give advice without charge and create a lawyer-client relationship — payment is not required.","verify":false,"id":317}, {"topic":"Public Service","style":"BARBRI","stem":"Which of the following would NOT be deemed good cause for a lawyer to seek to avoid representing a court-appointed client?","choices":[{"letter":"A","text":"The lawyer finds the client so personally repugnant that the lawyer could not represent the client effectively"},{"letter":"B","text":"The client has been charged with a crime that makes the client extremely unpopular in the community"},{"letter":"C","text":"The lawyer has prior confidential information relevant to the client's case"},{"letter":"D","text":"The client's inability to pay would impose an unreasonable financial burden on the lawyer"}],"correct":"B","explanation":"The fact that a court-appointed client has been charged with a crime that makes the client extremely unpopular in the community is NOT good cause for a lawyer to seek to avoid the appointment. Lawyers have an ethical obligation to help make legal service available to all who need it, including accepting a fair share of unpopular clients. Good cause includes: inability to represent the client effectively due to personal repugnance, prior confidential information relevant to the case, or unreasonable financial burden.","verify":false,"id":318}, {"topic":"Public Service","style":"BARBRI","stem":"The ABA Model Rules of Professional Conduct suggest that a lawyer should spend __________ on pro bono work.","choices":[{"letter":"A","text":"50 hours a year"},{"letter":"B","text":"75 hours a year"},{"letter":"C","text":"\"a reasonable number of hours per month\""},{"letter":"D","text":"5 hours a month"}],"correct":"A","explanation":"ABA Model Rule 6.1 recommends that every lawyer should spend 50 hours per year on pro bono work. However, violating this rule is not grounds for professional discipline.","verify":false,"id":319}, {"topic":"Public Service","style":"BARBRI","stem":"A lawyer wants to serve as a director of a legal services organization. The organization represents a client with an adverse interest to one of the lawyer's regular clients. May the lawyer serve as a director of the legal services organization?","choices":[{"letter":"A","text":"Yes, but she may have to refrain from participating in certain decisions of the organization"},{"letter":"B","text":"Yes, with no restrictions, because serving as a director has no relation to the lawyer's legal practice"},{"letter":"C","text":"No, unless she obtains informed, written consent from the lawyer's regular client"},{"letter":"D","text":"No, because this would constitute an impermissible conflict of interest"}],"correct":"A","explanation":"A lawyer may serve as a director, officer, or member of a legal services organization even though the organization serves persons whose interests are adverse to the lawyer's regular clients. However, a lawyer must refrain from participating in a decision or action of the organization if doing so would adversely affect the representation of one of the organization's clients whose interests are adverse to those of a client of the lawyer.","verify":false,"id":320}, {"topic":"Public Service","style":"BARBRI","stem":"A lawyer volunteers his time working for a quick-advice legal services hotline. In this setting, are the communications between a lawyer and client considered confidential?","choices":[{"letter":"A","text":"Yes, the ethical rules of confidentiality are applicable to quick-advice settings"},{"letter":"B","text":"No, because the ethical rules of confidentiality are relaxed in a quick-advice setting"},{"letter":"C","text":"No, because the Rules of Professional Conduct do not apply in a quick-advice setting"}],"correct":"A","explanation":"In a quick-advice situation, the Rules of Professional Conduct apply, including the duty of confidentiality, although the conflict of interest rules are relaxed. Thus, communications between a client and lawyer in a quick-advice setting are still privileged and a lawyer must not disclose such confidential information or use it to the client's disadvantage.","verify":false,"id":321}, {"topic":"Public Service","style":"BARBRI","stem":"A lawyer gives advice to a client while volunteering at a quick-advice legal hotline. As to the lawyer and client, ordinary conflict of interest rules __________.","choices":[{"letter":"A","text":"Never apply; conflict of interest rules are relaxed in a quick-advice setting"},{"letter":"B","text":"Apply only if the lawyer is hired by the quick-advice client to render further service in the matter"},{"letter":"C","text":"Apply in all circumstances"}],"correct":"B","explanation":"While conflict of interest rules are relaxed in a quick-advice setting, if a person who has received quick-advice from a lawyer then wants to hire that lawyer to render further service in the matter, the ordinary conflict of interest rules apply to that further service.","verify":false,"id":322}, {"topic":"Public Service","style":"BARBRI","stem":"Are any of the Rules of Professional Conduct applicable to lawyers in a quick-advice legal hotline setting?","choices":[{"letter":"A","text":"Yes, the Rules of Professional Conduct apply in their entirety"},{"letter":"B","text":"Yes, but the conflict of interest rules are relaxed"},{"letter":"C","text":"Yes, but only the conflict of interest rules apply"},{"letter":"D","text":"No, a lawyer is not subject to the Rules of Professional Conduct in quick-advice settings"}],"correct":"B","explanation":"In a quick-advice situation, the conflict of interest rules are relaxed somewhat. However, the remainder of the Rules of Professional Conduct apply to a quick-advice situation.","verify":false,"id":323}, {"topic":"Public Service","style":"BARBRI","stem":"A lawyer should seek to avoid representing a court-appointed client when the client __________.","choices":[{"letter":"A","text":"Has been charged with such a horrendous crime that his alleged actions would offend the sensibilities of a reasonable person"},{"letter":"B","text":"Is so unpopular in the community that representing him could bring unwanted negative attention to the lawyer"},{"letter":"C","text":"Is so personally repugnant to the lawyer that the lawyer-client relationship would be impaired if the lawyer attempted the representation"},{"letter":"D","text":"Is indigent and cannot pay the lawyer's reasonable fee"}],"correct":"C","explanation":"A lawyer may seek to be excused from a court appointment if the lawyer finds the client or the cause so repugnant that the lawyer-client relationship would be impaired or the lawyer could not represent the client effectively. This is a subjective standard — it is not based on a reasonable person standard and does not apply merely because the client is unpopular or indigent.","verify":false,"id":324}, {"topic":"Public Service","style":"BARBRI","stem":"The ABA Model Rules of Professional Conduct provide that a lawyer __________ render at least __________ hours of pro bono legal services each year.","choices":[{"letter":"A","text":"Must; 50"},{"letter":"B","text":"Should aspire to; 50"},{"letter":"C","text":"Should aspire to; 25"}],"correct":"B","explanation":"Under ABA Model Rule 6.1, every lawyer should aspire to render at least 50 hours of pro bono legal services each year. However, a lawyer who does not meet this professional obligation is not subject to discipline.","verify":false,"id":325}, {"topic":"Public Service","style":"BARBRI","stem":"A lawyer wants to serve as a director of a legal services organization. The organization represents a client with an adverse interest to one of the lawyer's regular clients. As part of his duties as director, the lawyer must _________.","choices":[{"letter":"A","text":"Obtain informed consent, confirmed in writing, from the organization's client"},{"letter":"B","text":"Resign from the organization due to the conflict of interest"},{"letter":"C","text":"Refrain from taking part in a decision that could harm the organization's client"},{"letter":"D","text":"Withdraw from the representation of his regular paying client"}],"correct":"C","explanation":"A lawyer may serve as a director of a legal services organization even though the organization serves persons whose interests are adverse to the lawyer's regular clients. The lawyer need not resign or withdraw from representing the regular client. However, the lawyer must refrain from taking part in a decision or action of the organization if doing so would adversely affect the representation of one of the organization's clients whose interests are adverse to those of a client of the lawyer.","verify":false,"id":326}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "LeAnn is representing Paul in a personal injury lawsuit on a one-third contingency basis. She receives a letter from Gerard, Paul's chiropractor, informing LeAnn that he has obtained a lien for $10,000 of any proceeds from Paul's case. After settling the case, LeAnn receives a check for $30,000 and places the funds into the client trust account. She notifies Paul of the settlement and reminds Paul that she is taking $10,000 for her legal fee. Paul agrees, but when she reminds him of Gerard's lien, Paul demands that she give him his full $20,000 and promises to pay Gerard on his own. What must LeAnn do?", "choices": [{"letter": "A", "text": "Take $10,000, and send $10,000 to Gerard and $10,000 to Paul"}, {"letter": "B", "text": "Take $10,000, send $10,000 to Paul, and keep $10,000 in the client trust account"}, {"letter": "C", "text": "Take $10,000 and keep $20,000 in the client trust account"}, {"letter": "D", "text": "Take $10,000 and send $20,000 to Paul"}, {"letter": "E", "text": "Keep the entire $30,000 in the client trust account"}], "correct": "B", "explanation": "If there is a dispute over funds (between the lawyer and the client, or between the client and some third person), the lawyer must keep the disputed portion in the client trust account until the dispute is resolved. When a third party's claim is not frivolous, the lawyer must refuse to surrender the funds to the client until the third party has been paid. Here, Paul agreed that LeAnn should get her $10,000 legal fee, so the disputed amount is $10,000 — the amount of Gerard's lien. The remaining $10,000 belongs to Paul. Therefore, LeAnn must take her $10,000 fee, distribute $10,000 to Paul, and keep $10,000 in the trust account until the dispute is resolved.", "verify": false, "id": 327}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "Jackie agrees to defend Boris in a traffic case. Boris gives Jackie $1,000 as an advance against fees and expenses. Where can Jackie put the money?", "choices": [{"letter": "A", "text": "In the client trust account"}, {"letter": "B", "text": "In her office account"}, {"letter": "C", "text": "Anywhere, with Boris's consent"}], "correct": "A", "explanation": "Funds that are advanced by the client must be placed into the client trust account, to be withdrawn as the fees are earned and the expenses are incurred. The client cannot consent to placing the funds in the office account.", "verify": false, "id": 328}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "Jeanne practices law in State A. Where can she open a client trust account?", "choices": [{"letter": "A", "text": "In State A only"}, {"letter": "B", "text": "In State A, or elsewhere with the client's consent"}, {"letter": "C", "text": "Anywhere"}], "correct": "B", "explanation": "The client trust fund account must be located in the state where the lawyer practices, unless the client consents to having it elsewhere.", "verify": false, "id": 329}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "Chad runs a fantasy baseball league with several friends, some of whom he represents in legal matters. When the friends sent Chad their entrance fees, Chad put the fees into his own bank account. Chad knows that his friends are not diligent about monitoring their players' statistics, so he falsifies the score reports to ensure that he wins the pool. Is Chad subject to discipline?", "choices": [{"letter": "A", "text": "Yes, for commingling his funds with his clients' funds only"}, {"letter": "B", "text": "Yes, for acting deceitfully only"}, {"letter": "C", "text": "Yes, both for commingling his funds with his client's funds and for acting deceitfully"}, {"letter": "D", "text": "No, because he did not hold the funds in connection with a representation"}], "correct": "B", "explanation": "Chad didn't hold the funds in connection with any representation of his friends (even though some of them are his clients), so Chad isn't subject to the prohibition on commingling funds. However, Chad is still subject to the general prohibition on conduct involving dishonesty, fraud, deceit, or misrepresentation, which applies even when a lawyer isn't acting in connection with any legal representation.", "verify": false, "id": 330}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "Claire, a solo practitioner, rents out office space to George. At the beginning of the lease term, George asks Claire if he can pay her the full year's rent in advance. Claire agrees and deposits the funds in her personal checking account. Is Claire subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "B", "explanation": "The rules of professional conduct relating to the handling of funds (the prohibition on commingling, recordkeeping requirements, etc.) don't apply when the funds are not held in connection with any legal representation. Claire is acting as George's landlord, not his lawyer, so she won't be subject to discipline for depositing his rent in her personal account.", "verify": false, "id": 331}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "Ronnie is representing Martin in a divorce. Martin asks Ronnie to hold various stock certificates in advance of handing them over to his wife. Ronnie puts the certificates in an envelope labeled 'Martin's Stock Certificates' and keeps the envelope on top of his desk in his office. The certificates are stolen. Is Ronnie subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "A", "explanation": "When a lawyer comes into possession of property (other than money) to be held on a client's behalf, the lawyer must identify it as belonging to the client and must put it in a safe place. Lawyers are required to hold the property of others with the care required of a professional fiduciary. Even though the certificates were properly identified as being Martin's property, leaving them in a labeled envelope out in the open is grounds for discipline. Ronnie should have taken more care to keep the certificates safe (e.g., put them in a safe deposit box).", "verify": false, "id": 332}, {"topic": "Safekeeping", "style": "BARBRI", "stem": "Nate was asked by his client, Elva, to hold her valuable diamond ring while he negotiated its sale to a buyer. Nate places the ring in his bank safe deposit box for safekeeping along with his own valuables. Is Nate subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "A", "explanation": "A lawyer is subject to discipline for commingling the client's money or property with the lawyer's own personal or business funds or property. When the lawyer comes into possession of non-monetary property to be held on a client's behalf, the lawyer must identify it as belonging to the client and must put it in a safe place. Although it is advisable to place small items in a safe deposit box, Nate is subject to discipline because he commingled Elva's property with his own.", "verify": false, "id": 333}, {"topic": "Different Roles", "style": "BARBRI", "stem": "The Sarbanes-Oxley Act imposes additional obligations on securities lawyers who come across evidence of a material violation of the securities laws by their client. How does the Sarbanes-Oxley Act differ from the ethical rule relating to violations by organizational clients?", "choices": [{"letter": "A", "text": "It requires a securities lawyer to report a violation to the SEC if the company's highest authority fails to act (whereas the ethical rule permits, but does not require, lawyers to report to outside authorities)"}, {"letter": "B", "text": "It requires a securities lawyer to report a violation to specific authorities within the company (whereas the ethical rule gives lawyers some discretion on who to report to)"}], "correct": "B", "explanation": "Sarbanes-Oxley requires a securities lawyer to report credible evidence of a material violation first to the CLO, then to the board/audit committee/outside directors if the CLO fails to act — specific mandatory reporting targets. The ethical rule requires the lawyer to act to protect the organization but gives discretion on how to proceed and who to report to. Outside reporting to the SEC is permitted (not required) under both frameworks.", "verify": false, "id": 334}, {"topic": "Different Roles", "style": "BARBRI", "stem": "MediaCorp hires Linda to investigate alleged violations of federal privacy regulations by its employees. Linda finds serious violations and reports to the board of directors, but they do not seem willing to take action. Assuming an exception to the duty of confidentiality does NOT apply, may Linda report the information to an outside authority?", "choices": [{"letter": "A", "text": "Yes, if she believes disclosure is necessary to prevent substantial injury to MediaCorp"}, {"letter": "B", "text": "No, she is prohibited from reporting the information"}], "correct": "B", "explanation": "The authority to report to outsiders does not apply to a lawyer who is hired by the organization to investigate an alleged violation of law or to defend the organization against a claimed violation. Linda was hired to investigate the alleged violations, so she was not authorized to report her findings to an outside authority under this rule.", "verify": false, "id": 335}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Kerry represents A-Corp in various matters. Kerry learns that a research team is conducting a clinical trial in a manner that violates federal safety regulations, which could result in severe fines and harm to trial participants. Kerry reports to the president and the board, but they fail to act. Kerry reasonably believes A-Corp will suffer substantial injury if he does not report to an outside authority. Which statement is true?", "choices": [{"letter": "A", "text": "Kerry may report the information to an outside authority, but only if an exception to the duty of confidentiality applies"}, {"letter": "B", "text": "Kerry may report the information to an outside authority, even if it would otherwise be protected by the duty of confidentiality"}, {"letter": "C", "text": "Kerry must report the information to an outside authority"}], "correct": "B", "explanation": "If the lawyer reports a violation to the organization's highest authority and the highest authority fails to take timely, appropriate action, the lawyer MAY report the relevant information to appropriate persons outside the organization if necessary to prevent substantial injury to the organization — even if the information would otherwise be protected by confidentiality. Outside reporting is permitted, not required.", "verify": false, "id": 336}, {"topic": "Different Roles", "style": "BARBRI", "stem": "HotelCo, Ava's longtime client, has been sued for allegedly failing to comply with the ADA. Monica, HotelCo's compliance director, was also named in the lawsuit. HotelCo wants Ava to defend Monica as well. May Ava represent both HotelCo and Monica?", "choices": [{"letter": "A", "text": "Yes, as long as the conflict of interest is addressed"}, {"letter": "B", "text": "Yes, because an organization's lawyer naturally represents both the organization and its constituents"}, {"letter": "C", "text": "No, this is prohibited"}], "correct": "A", "explanation": "A lawyer for an organization owes loyalty to the organization — not to its individual constituents. However, the lawyer may represent both the organization and one or more of its constituents provided the ordinary conflict of interest rules are satisfied: the lawyer must reasonably believe she can competently represent both, and both parties must provide informed consent confirmed in writing. Note: when consent is required from the organization, it must come from someone other than the constituent being represented (Monica cannot consent on HotelCo's behalf).", "verify": false, "id": 337}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Moira represents LocalQuik, a convenience store. LocalQuik asks Moira to attend a city council meeting and argue against a proposed soft drink tax. LocalQuik urges Moira to 'keep their name out of it' if she can. Must Moira volunteer to the city council that she is acting in a representative capacity?", "choices": [{"letter": "A", "text": "Yes, and she must identify LocalQuik as her client"}, {"letter": "B", "text": "Yes, but she is not required to identify her client"}, {"letter": "C", "text": "No, because LocalQuik asked her not to reveal their involvement"}, {"letter": "D", "text": "No, because Moira is not appearing in front of a tribunal"}], "correct": "B", "explanation": "When a lawyer appears on behalf of a client before a legislative body or administrative agency, the lawyer must disclose that she is acting in a representative capacity, but she is NOT required to identify the client. LocalQuik's instructions are irrelevant — the duty to disclose representative capacity cannot be waived by the client. This rule applies to nonadjudicative proceedings before legislative bodies and administrative agencies.", "verify": false, "id": 338}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Prosecutor Julia learns from Dennis's cellmate that Dennis claimed responsibility for an unrelated murder in State B for which Bradley was convicted based on flimsy circumstantial evidence. Julia finds the cellmate's story credible but does not contact State B, believing it would delay justice in her pending case. She plans to contact State B after trial. Is Julia subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the evidence creates a reasonable likelihood that Bradley was wrongfully convicted"}, {"letter": "B", "text": "No, because the conviction occurred in another jurisdiction"}], "correct": "A", "explanation": "A prosecutor must promptly disclose new, credible, and material evidence that creates a reasonable likelihood that a defendant was wrongly convicted. This duty applies even if the conviction occurred in a different jurisdiction. Julia's plan to disclose after trial is not prompt disclosure.", "verify": false, "id": 339}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Prosecutor Neve learns that the sheriff plans to hold a press conference to inform the public that murder defendant Dylan was carrying on multiple extramarital affairs before his wife's death. What must Neve do?", "choices": [{"letter": "A", "text": "She must not make public statements about the affairs herself, but has no duty to prevent the sheriff's press conference because she is not his supervisor"}, {"letter": "B", "text": "She must take reasonable care to prevent the sheriff's press conference"}], "correct": "B", "explanation": "A prosecutor must not make extrajudicial statements that have a substantial likelihood of heightening public condemnation of the accused. A prosecutor also must take reasonable care to prevent investigators, police, employees, and others assisting in a case from making statements that violate these rules. Neve must try to prevent the sheriff from making the statement. Note: Neve is not subject to discipline if she takes reasonable care (e.g., cautioning the sheriff) and her efforts fail.", "verify": false, "id": 340}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Prosecutor Yuri is working on a burglary case. The victim's neighbor tells police she saw a short redheaded man near the victim's house on the day of the crime. Defendant Telly is tall and does not have red hair. Yuri saw the police report of the neighbor's interview but dismissed it because other evidence points to Telly. Is Yuri subject to discipline for failing to disclose the neighbor's interview to the defense?", "choices": [{"letter": "A", "text": "No, because Telly's attorney could have located and interviewed the neighbor"}, {"letter": "B", "text": "Yes, because the evidence tends to negate Telly's guilt"}], "correct": "B", "explanation": "A prosecutor must timely disclose to the defense all evidence and information known to the prosecutor that tends to negate the guilt of the accused or mitigate the degree of the offense. This is true even if the defense could have obtained such evidence themselves. The neighbor's description of a short redheaded man clearly tends to negate Telly's guilt.", "verify": false, "id": 341}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Julius is representing a client in the sale of her car. During negotiations, Julius says to the buyer's attorney, 'It's a great price for a car in such prime condition.' In fact, Julius knows the car has serious engine problems. Is Julius subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he made a false statement of material fact"}, {"letter": "B", "text": "No, because he used an acceptable negotiation technique"}], "correct": "A", "explanation": "A lawyer must not make a false statement of material fact to a non-client. Lying about the condition of the car was not mere 'puffery' — it was a false statement of material fact about a specific, knowable condition. Julius is subject to discipline.", "verify": false, "id": 342}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Lance is negotiating a settlement for his client in a personal injury case. The client has authorized settlement for $60,000 but would prefer $80,000. Lance tells opposing counsel, 'My client won't settle for anything less than $100,000.' Is Lance subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he made a false statement of material fact"}, {"letter": "B", "text": "No, because he used an acceptable negotiation technique"}], "correct": "B", "explanation": "A lawyer must not make a false statement of material fact to a non-client. However, under generally accepted conventions in negotiation, certain statements are not taken as statements of material fact. A statement of a party's intentions as to settlement of a claim is ordinarily regarded as puffery, not a statement of material fact. Therefore, Lance's statement was a permissible negotiation technique.", "verify": false, "id": 343}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Austin represents CameraCo, which wants to borrow money from LocalBank. CameraCo asks Austin to prepare an evaluation of its legal and business affairs to furnish to LocalBank. As Austin reviews CameraCo's affairs, he realizes its potential legal exposure is much more serious than expected. He finalizes the evaluation and simultaneously sends copies to CameraCo and LocalBank. Is Austin subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he did not get CameraCo's informed consent before sending confidential information to LocalBank"}, {"letter": "B", "text": "No, because he was impliedly authorized to send the evaluation to LocalBank as soon as possible"}], "correct": "A", "explanation": "When a lawyer has been asked to evaluate a client's affairs for a third party, and the lawyer knows or should know that the evaluation will materially harm the client, the lawyer must obtain the client's informed consent before making the evaluation. Because Austin realized the evaluation would contain harmful information about CameraCo, he was required to seek CameraCo's informed consent before sending it to LocalBank.", "verify": false, "id": 344}, {"topic": "Different Roles", "style": "BARBRI", "stem": "Zachary is representing Kayla in the sale of her farm. Kayla asks Zachary to evaluate her legal title to the farm and send the evaluation to Barry, a prospective buyer. Zachary evaluates the title, finds no problems, and simultaneously sends copies to both Kayla and Barry. Is Zachary subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he did not get Kayla's informed consent before sending the confidential information to Barry"}, {"letter": "B", "text": "No, because he was impliedly authorized to send the evaluation to Barry"}], "correct": "B", "explanation": "A lawyer may evaluate a client's affairs for the use of a third person if the lawyer reasonably believes that making the evaluation is compatible with other responsibilities to the client. Where disclosure would serve the client's interests, the lawyer is impliedly authorized to disclose the information. The information in Zachary's evaluation would not harm Kayla — it found no problems — so Zachary was impliedly authorized to furnish it to Barry.", "verify": false, "id": 345}, {"topic": "Different Roles", "style": "BARBRI", "stem": "May a lawyer properly give moral, economic, social, political, or other nonlegal advice to a client?", "choices": [{"letter": "A", "text": "Yes, even where the client has not asked for it"}, {"letter": "B", "text": "Yes, but only at the client's request"}, {"letter": "C", "text": "No, a lawyer should focus on legal advice"}], "correct": "A", "explanation": "A lawyer may give a client not only legal advice, but also moral, economic, social, or political advice when relevant to the client's situation. This is true even if the client has not requested such advice. When appropriate, a lawyer may also urge a client to seek advice from persons in related professions (e.g., accountant, psychiatrist, physician, or family counselor).", "verify": false, "id": 346}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Jolie receives an email from Debra, opposing counsel, that was clearly meant for Debra's client rather than Jolie and contains confidential information. What must Jolie do?", "choices": [{"letter": "A", "text": "Delete the email and promptly notify Debra"}, {"letter": "B", "text": "Promptly notify Debra"}, {"letter": "C", "text": "Nothing"}], "correct": "B", "explanation": "When a lawyer receives a document and knows or reasonably should know that it was sent by mistake, she must promptly notify the sender so the sender can take protective measures. Nothing else is required under the Model Rules — they don't address whether the recipient must return or delete the document, or whether inadvertent disclosure waives privilege (state law varies on those questions).", "verify": false, "id": 347}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Benji is representing Genevieve in the sale of her car to Hank, who does not have an attorney. Hank calls Benji and asks whether signing the contract is binding and how he could get out of it. Benji explains he is Genevieve's lawyer acting in her interests only, then truthfully tells Hank that based on legal precedent it would be very difficult to get out of the finalized contract. Is Benji subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he did not tell Hank to get an attorney"}, {"letter": "B", "text": "Yes, because he gave Hank legal advice"}, {"letter": "C", "text": "No, because he did not state or imply that he was disinterested"}, {"letter": "D", "text": "No, because his advice was truthful"}], "correct": "B", "explanation": "When a lawyer knows or should know that their client's interests are likely to conflict with those of an unrepresented person, the lawyer must not give legal advice to that person (other than to get a lawyer). Benji gave legal advice to Hank, an unrepresented person on the opposite side of the transaction. The fact that his advice was truthful is irrelevant. A lawyer is not required to tell an unrepresented person to get an attorney — that is simply the only advice permitted when interests conflict.", "verify": false, "id": 348}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Bailey is representing Raj in an excessive force lawsuit against the local police department. Raj's sister Malia, who does not have a lawyer, was also present during the altercation. Malia asks Bailey whether she might also have a claim against the police department. Bailey truthfully advises Malia that she probably does not have a claim, but that she should seek an attorney. Is Bailey likely subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because she gave legal advice to Malia"}, {"letter": "B", "text": "No, because Malia's interests are not likely to conflict with Raj's interests"}], "correct": "B", "explanation": "When a lawyer knows or should know that her client's interests are likely to conflict with those of an unrepresented person, the lawyer cannot give legal advice to that person. Bailey did give legal advice to Malia, who is unrepresented. However, there is no indication that Raj and Malia have conflicting interests — both were harmed by the same police conduct — so Bailey was not prohibited from giving advice.", "verify": false, "id": 349}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Kelsey is representing Val in the sale of a painting to Emma, who is representing herself. Emma calls Kelsey and asks if Val's latest offer is a good deal. Kelsey tells Emma, 'I'm here to make sure everyone gets a good deal, and this is a good deal.' Kelsey does believe the offer is fair to Emma. Is Kelsey subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "A", "explanation": "When dealing with an unrepresented person, a lawyer must not state or imply that the lawyer is disinterested. Kelsey's statement that she was 'there to make sure everyone gets a good deal' implied she was disinterested, when in fact she had an interest in getting the best deal for Val. Whether Kelsey believed the deal was fair to Emma is irrelevant — she still implied she was disinterested.", "verify": false, "id": 350}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Anne is representing Caila in a personal injury lawsuit. Anne visits Barbara, an eyewitness, and interviews her, making clear she represents Caila and is looking out for Caila's interests. At the end of the interview, Barbara says she has an attorney and gives Anne his card. Anne had no reason to know Barbara was represented before the interview. Is Anne subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "B", "explanation": "The rule prohibiting contact with a represented person only applies where the communicating lawyer knows that the person is represented by counsel. Anne had no reason to know Barbara was represented and had no duty to investigate. The rule for communicating with unrepresented persons applies. Anne acted properly — she did not imply she was disinterested and did not give legal advice.", "verify": false, "id": 351}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Rita is representing Bradley against Stan in a contract dispute. Stan is represented by counsel. One night, Rita and Stan end up in the same elevator and Rita talks to Stan about local election results. Is Rita subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "B", "explanation": "The rule against communicating with persons already represented by an attorney only applies where the communication is related to the matter. Rita and Stan talked about election results — not the contract dispute — so the rule is not implicated.", "verify": false, "id": 352}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Caroline receives a phone call from Lacey, a prospective client who says she is already represented by an attorney in a pending case but is thinking of firing him. Caroline and Lacey have a brief consultation. Is Caroline subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "B", "explanation": "The rule against communicating with persons already represented by an attorney only applies where the communicating lawyer represents a client in that matter. Caroline was not representing any client in Lacey's case, so it was proper for Caroline to speak with Lacey even though Lacey was represented.", "verify": false, "id": 353}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Theresa is representing Malik in his divorce from Jeff. Malik tells Theresa he is going to have coffee with Jeff and try to sort things out. Theresa gives Malik general advice on which topics to discuss and avoid at his meeting with Jeff. Is Theresa subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "B", "explanation": "The rule against contacting represented persons does not prohibit represented persons from communicating directly with each other. Furthermore, a lawyer may advise their client regarding such communications.", "verify": false, "id": 354}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Aaron is representing Molly in a personal injury case. Juan, one of Molly's co-plaintiffs, calls Aaron and says his attorney won't respond to his emails, and asks for a quick update on the case. Aaron gives Juan a quick and accurate update. Is Aaron subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "A", "explanation": "A lawyer who represents a client in a matter cannot communicate about the matter with a person the lawyer knows is represented by counsel, unless that person's counsel consents or the law/court order authorizes it. This is true even if the represented person initiates or consents to the communication. The fact that Juan is not adverse to Molly is irrelevant — Juan is represented in the matter, so Aaron is subject to discipline for talking to Juan without consent from Juan's attorney.", "verify": false, "id": 355}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Stella is defending Rafael in a personal injury lawsuit filed by Dale. Stella reasonably believes Dale's attorney failed to convey Rafael's latest settlement offer to Dale. Stella calls Dale to communicate the offer and tells him to talk it over with his attorney. Is Stella subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "A", "explanation": "A lawyer must not communicate about a matter with a person the lawyer knows is represented by counsel, unless that person's counsel consents or the law/court order authorizes it. Stella communicated with Dale, a represented person, without his attorney's consent. Stella's belief that Dale's attorney failed to pass on the settlement offer is not a
