n an updated retainer agreement (after clearly explaining all updates), and before leaving purchased a dress at regular retail price. Did either action represent a prohibited business transaction conflict?","choices":[{"letter":"A","text":"Yes, the manner in which the retainer agreement was signed represents a conflict, but the purchase of the dress did not"},{"letter":"B","text":"Yes, both the purchase of the dress and the manner in which the retainer agreement was signed represent conflicts"},{"letter":"C","text":"No, there was no conflict"},{"letter":"D","text":"Yes, the purchase of the dress represents a conflict, but the manner in which the retainer agreement was signed does not"}],"correct":"C","explanation":"There was no conflict. The business transaction rule does NOT apply to: (i) ordinary fee agreements between lawyer and client (like the retainer agreement); or (ii) standard commercial transactions in which the lawyer buys goods or services that the client routinely markets to the public (like the dress purchase). Neither action required the special business transaction protections.","verify":false,"id":192}, {"topic":"Conflicts","style":"BARBRI","stem":"If an attorney uses the confidential information of a current, former, or prospective client to his own pecuniary gain, but the client is NOT disadvantaged by the attorney's use of the information, the attorney can be subject to __________.","choices":[{"letter":"A","text":"Disciplinary action"},{"letter":"B","text":"Civil liability"},{"letter":"C","text":"Civil liability and disciplinary action"},{"letter":"D","text":"Neither civil liability nor disciplinary action"}],"correct":"B","explanation":"If the attorney uses confidential information for personal gain but the client is NOT disadvantaged: civil liability only (not disciplinary action). Disciplinary action is only applicable where the client IS disadvantaged by the attorney's use of the information.","verify":false,"id":193}, {"topic":"Conflicts","style":"BARBRI","stem":"Attorney Amanda negotiated a retail lease for her client Clara's boutique. At the grand opening, Clara gifted Amanda with (1) a handbag worth $500 and (2) a $200 dress for Amanda's teenage daughter. May Amanda accept the handbag and/or the dress?","choices":[{"letter":"A","text":"She must not accept either gift"},{"letter":"B","text":"She may accept both gifts"},{"letter":"C","text":"She may accept the handbag, but not the dress"},{"letter":"D","text":"She may accept the dress, but not the handbag"}],"correct":"B","explanation":"Amanda may accept both gifts. The ABA rule prohibits soliciting a substantial gift, not accepting one. Amanda did not solicit the gifts. A lawyer may accept even a substantial unsolicited gift (though it may be voidable for undue influence). The same rules apply to gifts from a client to the lawyer's relative. Therefore, both the handbag and the dress for Amanda's daughter are acceptable.","verify":false,"id":194}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer wants to acquire literary or media rights to her client's life story, and the story IS substantially based on information related to the lawyer's representation of the client, the lawyer __________.","choices":[{"letter":"A","text":"May not acquire those rights at any time"},{"letter":"B","text":"May only acquire those rights after the client's legal matter is entirely completed (including appeals)"},{"letter":"C","text":"May acquire those rights at any time"}],"correct":"B","explanation":"If the story is substantially based on information related to the lawyer's representation, the lawyer may only acquire literary or media rights after the client's legal matter is entirely completed, including appeals. The lawyer is not completely barred from acquiring such rights — the timing restriction simply applies.","verify":false,"id":195}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer is representing an indigent client on a contingency fee basis. The lawyer may pay her indigent client's __________, without any provision for repayment.","choices":[{"letter":"A","text":"Court costs and litigation expenses"},{"letter":"B","text":"Court costs only"},{"letter":"C","text":"Court costs, litigation expenses, and basic living expenses"},{"letter":"D","text":"Court costs, litigation expenses, and lost wages due to appearing at the trial"}],"correct":"A","explanation":"A lawyer may pay an indigent client's court costs AND litigation expenses outright without expectation of repayment. Note: basic living expenses and lost wages are NOT payable without provision for repayment (a lawyer representing an indigent client pro bono may provide modest gifts for basic living expenses, but here the lawyer has a contingent fee — not pro bono representation).","verify":false,"id":196}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer L represents co-plaintiffs A and B in a wrongful death suit. Defendant D offers $1 million as an aggregate settlement. L disclosed all terms to A and B and made sure they had come to an agreement about how to divide the settlement. Can L now participate in making the aggregate settlement?","choices":[{"letter":"A","text":"Yes, he has met the requirements"},{"letter":"B","text":"No, he must first receive informed consent from A and B in writing and must recommend in writing that each client obtain separate independent counsel"},{"letter":"C","text":"No, he must first receive informed consent from A and B in writing"}],"correct":"C","explanation":"L has not yet met all requirements — he must still receive informed consent from A and B in writing. Even though L has disclosed the terms and the clients agreed among themselves, the written informed consent step is missing. There is no requirement to recommend separate independent counsel.","verify":false,"id":197}, {"topic":"Conflicts","style":"BARBRI","stem":"Client C (21 year old college student) was charged with drug possession. C's mother wants to hire Lawyer L to represent C. She agrees not to interfere in L's representation and not to attend or ask about meetings between C and L. Can L take C's case under these conditions?","choices":[{"letter":"A","text":"No, because C's mother can still ask C about C's confidential information"},{"letter":"B","text":"Yes, because C's mother is a close family member"},{"letter":"C","text":"No, unless C gives informed consent"},{"letter":"D","text":"Yes, the requirements for accepting compensation from a third person are met"}],"correct":"C","explanation":"L cannot take C's case unless C gives informed consent. A lawyer must not accept compensation from a third person unless: (i) the client gives informed consent, (ii) the third person does not interfere with the lawyer's independence, and (iii) the arrangement does not compromise the client's confidential information. Even though conditions (ii) and (iii) may be met, informed consent from C is still required and was not mentioned in the fact pattern.","verify":false,"id":198}, {"topic":"Conflicts","style":"BARBRI","stem":"Who is the attorney's client when an insurance company hires the attorney to defend a policyholder?","choices":[{"letter":"A","text":"Depending on state law, either the policyholder or the insurance company and the policyholder jointly"},{"letter":"B","text":"The policyholder and the insurance company jointly"},{"letter":"C","text":"Depending on state law, the policyholder or the insurance company"},{"letter":"D","text":"The policyholder"}],"correct":"A","explanation":"Depending on state law, either the policyholder is the attorney's sole client, or the policyholder and the insurance company are joint clients. Because different states hold differently, and because states generally do not allow the insurance company alone to be the client, the most accurate answer acknowledges this state-law dependency.","verify":false,"id":199}, {"topic":"Conflicts","style":"BARBRI","stem":"When an insurance company hires a lawyer to represent a policyholder, what confidential information about the policyholder can the lawyer share with the insurance company?","choices":[{"letter":"A","text":"Confidential information that may invalidate the policyholder's right to be represented by the insurance company, as well as bills and time records containing confidential information (under any circumstances)"},{"letter":"B","text":"Bills and time records containing confidential information (under any circumstances)"},{"letter":"C","text":"Confidential information that may invalidate the policyholder's right to be represented by the insurance company"},{"letter":"D","text":"Bills and time records containing confidential information (if it will aid, not harm, the policyholder)"}],"correct":"D","explanation":"The lawyer can share bills and time records containing confidential information ONLY if it will aid, not harm, the policyholder. Confidential information that may invalidate the policyholder's right to be represented by the insurance company CANNOT be shared with the insurance company.","verify":false,"id":200}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer was once given confidential information by a former client, the lawyer must not oppose the former client in any matter in which the confidential information would be __________________.","choices":[{"letter":"A","text":"Determinative of the outcome of the matter, under any circumstances"},{"letter":"B","text":"Relevant, unless the former client gives informed consent, confirmed in writing"},{"letter":"C","text":"Determinative of the outcome of the matter, unless the former client gives informed consent, confirmed in writing"},{"letter":"D","text":"Relevant, under any circumstances"}],"correct":"B","explanation":"The standard is RELEVANT (not determinative of the outcome). The lawyer must not oppose the former client in any matter in which the confidential information would be relevant, unless the former client gives informed consent, confirmed in writing. Confidential information might be relevant without being determinative.","verify":false,"id":201}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer's former firm represented a client in a matter, and the lawyer acquired protected confidential information, the lawyer may not thereafter represent another person in a substantially related matter if that person's interests are materially adverse to the former client, unless __________.","choices":[{"letter":"A","text":"The former client gives informed consent, confirmed in writing, and the current client is given written notice"},{"letter":"B","text":"The former and current clients are given written notice"},{"letter":"C","text":"The former client gives informed consent, confirmed in writing"},{"letter":"D","text":"The former and current clients give informed consent, confirmed in writing"}],"correct":"C","explanation":"Only the former client's informed consent, confirmed in writing, is required to cure the conflict. The current client need not provide consent or receive written notice in this situation (unless there is some other conflict affecting the current client).","verify":false,"id":202}, {"topic":"Conflicts","style":"BARBRI","stem":"Attorney A represented Client C while at Law Firm 1. A was the only attorney at Firm 1 to work on the C v. D matter, and no one else had access to C's confidential information. A then left Firm 1 and joined Firm 2, taking client C with him. Can Attorney B at Firm 1 represent D in the same C v. D matter?","choices":[{"letter":"A","text":"Yes, but only if C gives informed consent, confirmed in writing"},{"letter":"B","text":"Yes, but only if C is notified"},{"letter":"C","text":"No, under any circumstances"},{"letter":"D","text":"Yes, under all circumstances"}],"correct":"D","explanation":"Attorney B at Firm 1 can represent D under all circumstances. Because A was the only person who had access to C's confidential information and A has left Firm 1, no attorney remaining at Firm 1 has confidential information about C. Therefore, no conflict exists. C's informed consent and notice to C are not required.","verify":false,"id":203}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer leaving government service is disqualified from a matter, then everyone in that lawyer's firm is also disqualified ______________________________.","choices":[{"letter":"A","text":"Unless the lawyer is timely screened, does not share fees from the matter, and written notice is promptly given to the governmental agency"},{"letter":"B","text":"Under all circumstances"},{"letter":"C","text":"Unless the lawyer is timely screened and the government agency gives its informed consent, confirmed in writing"},{"letter":"D","text":"Unless the lawyer is timely screened, does not share fees from the matter, and the government agency gives its informed consent, confirmed in writing"}],"correct":"A","explanation":"For the government-service-to-private-practice disqualification rule, the firm is also disqualified unless: (1) the disqualified lawyer is timely screened; (2) does not share fees from the matter; AND (3) written notice is promptly given to the governmental agency. The government agency does not need to give informed consent.","verify":false,"id":204}, {"topic":"Conflicts","style":"BARBRI","stem":"While working for the IRS, Attorney Adam was privy to confidential information about Courtney's allegedly hidden assets. Now in private practice, Kurt (Courtney's husband) seeks to hire Peter (Adam's partner at ABC Law Firm) for a divorce suit. Adam's knowledge could materially disadvantage Courtney. Is Peter disqualified?","choices":[{"letter":"A","text":"Peter is disqualified under all circumstances"},{"letter":"B","text":"Peter is disqualified unless Adam is timely screened from the case and does not share fees from the matter"},{"letter":"C","text":"Peter is not disqualified under any circumstances"},{"letter":"D","text":"Peter is disqualified unless Adam is timely screened, does not share fees, and Courtney gives informed consent, confirmed in writing"}],"correct":"B","explanation":"Adam's disqualification (government confidential information that could materially disadvantage Courtney) is imputed to Peter. However, Peter may represent Kurt if Adam is timely screened from the case and does not share fees from the matter. Courtney's informed consent is NOT required under this rule.","verify":false,"id":205}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer who was in private practice and is now an attorney for a government agency may be subject to discipline for doing the following while working at the government agency:","choices":[{"letter":"A","text":"Negotiating for private employment with a person or entity that is involved in a matter in which she is participating personally and substantially"},{"letter":"B","text":"Working on the same matter for which she was personally and substantially involved while in private practice, even if she receives informed written consent of both the government agency and the former private client"},{"letter":"C","text":"Soliciting private employment with a person or entity involved as a party in a matter in which she was participating personally or substantially, but NOT for negotiating or accepting such employment if the party approached her first"}],"correct":"A","explanation":"A government attorney may be disciplined for negotiating private employment with a person or entity that is involved as a party in a matter in which she is participating personally and substantially. Note: if a lawyer worked personally and substantially on a matter in private practice, she must not work on that same matter when she later enters government service — but informed consent (from both the government agency and the former client) can cure that conflict. The answer about soliciting only (not negotiating) is incorrect.","verify":false,"id":206}, {"topic":"Conflicts","style":"BARBRI","stem":"Law Clerk C worked for Judge J and made recommendations on discovery motions in P v. D. C is now in private practice. Lawyer L (another lawyer at C's firm) is considering representing P in the same P v. D matter. L may not represent P unless C is timely screened, does not share fees from the matter, and _________________________________.","choices":[{"letter":"A","text":"Informed consent, confirmed in writing, is promptly received from the parties"},{"letter":"B","text":"Informed consent, confirmed in writing, is promptly received from the parties and the appropriate tribunal"},{"letter":"C","text":"Written notice is promptly given to the parties"},{"letter":"D","text":"Written notice is promptly given to the parties and the appropriate tribunal"}],"correct":"D","explanation":"When a former law clerk's disqualification is imputed to other lawyers at the firm, the firm may take the representation if: (1) C is timely screened; (2) C does not share fees; AND (3) written notice is promptly given to the parties AND the appropriate tribunal. Informed consent from the parties is not required — written notice is sufficient. Both the parties and the tribunal must be notified.","verify":false,"id":207}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer L obtained confidential information during a consultation with Prospective Client P. L and any attorney at L's firm would be prohibited from representing Client C in the same or substantially related matter if such information could significantly harm P. This conflict of interest may be overcome by:","choices":[{"letter":"A","text":"Notifying only P in writing"},{"letter":"B","text":"Notifying P and C in writing"},{"letter":"C","text":"Obtaining informed consent, confirmed in writing, from only P"},{"letter":"D","text":"Obtaining informed consent, confirmed in writing, from P and C"}],"correct":"D","explanation":"This conflict may be overcome by obtaining informed consent, confirmed in writing, from BOTH P and C. Alternatively, the conflict may be overcome by: (i) the lawyer who consulted P took care to avoid exposure to more information than necessary to determine whether to represent P; (ii) the disqualified lawyer is timely screened and does not share the fee; AND (iii) written notice is given to P.","verify":false,"id":208}, {"topic":"Conflicts","style":"BARBRI","stem":"Attorney Aaron was told by his client Celeste that she will build a new condominium complex on 39th and Washington. Based on this confidential information, Aaron bought the adjacent shopping center knowing business would boom. Is Aaron subject to discipline and/or civil liability?","choices":[{"letter":"A","text":"Aaron is subject to both civil liability and disciplinary action"},{"letter":"B","text":"Aaron is subject to disciplinary action but not civil liability"},{"letter":"C","text":"Aaron is subject to civil liability but not disciplinary action"},{"letter":"D","text":"Aaron is subject to neither civil liability nor disciplinary action"}],"correct":"C","explanation":"Aaron is subject to civil liability but NOT disciplinary action. Disciplinary action requires that the client be disadvantaged by the attorney's use of the information — Celeste was not disadvantaged. However, using confidential information for personal pecuniary gain subjects the attorney to civil liability even when the client is not disadvantaged.","verify":false,"id":209}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer Lou was an associate at XYZ, which represented C in C v. D. Lou briefly talked to colleagues working on the case and became privy to confidential and material information. Lou then left XYZ and joined another firm. Can Lou now represent D in C v. D?","choices":[{"letter":"A","text":"Lou cannot represent D under any circumstances"},{"letter":"B","text":"Lou can represent D only if C provides informed consent, confirmed in writing"},{"letter":"C","text":"Lou can represent D because Lou is at a new firm and his obligation to C ended when Lou left XYZ"}],"correct":"B","explanation":"Lou can represent D only if C provides informed consent, confirmed in writing. A lawyer's obligations regarding confidential information continue even after the representation is terminated and even after the lawyer moves to a new firm. Lou is not absolutely barred from representing D — C's informed consent cures the conflict.","verify":false,"id":210}, {"topic":"Conflicts","style":"BARBRI","stem":"Generally, a lawyer's former firm is prohibited from representing a person with interests materially adverse to those of a client of the formerly associated lawyer if: (i) the matter is the same or substantially related; and (ii) a lawyer remaining in the firm has confidential information that is material to the matter. May this conflict be cured?","choices":[{"letter":"A","text":"Yes, if the client of the formerly associated lawyer gives informed consent, confirmed in writing"},{"letter":"B","text":"Yes, if the client of the formerly associated lawyer is notified"},{"letter":"C","text":"No, the conflict cannot be cured"}],"correct":"A","explanation":"This conflict may be cured if the client of the formerly associated lawyer gives informed consent, confirmed in writing. Mere notice to the client is insufficient. This is not an unconsentable conflict.","verify":false,"id":211}, {"topic":"Competence","style":"BARBRI","stem":"Zara asks Jeremy to represent her in a lawsuit. Jeremy gives Zara a written fee agreement containing a clause that limits Jeremy's malpractice liability to $25,000. The clause states it would be beneficial for Zara to seek the advice of independent counsel before signing. Zara reads the agreement herself, finds it reasonable, and returns a signed copy the next day. Is Jeremy subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"A","explanation":"A lawyer must not make an agreement that prospectively waives or limits the lawyer's malpractice liability, except in the unlikely event that the client is independently represented in making the agreement. Unlike with malpractice settlements, the client must ACTUALLY be represented by independent counsel — advising the client to seek representation is not sufficient. Because Zara was not independently represented when making the agreement, Jeremy is subject to discipline.","verify":false,"id":212}, {"topic":"Competence","style":"BARBRI","stem":"Kristen misses a statute of limitations in Howard's case. She offers Howard $50,000 in exchange for his promise not to sue her. The offer letter advises Howard to seek independent counsel, but Kristen tells Howard the offer is only valid for 24 hours. Howard accepts on the spot. Is Kristen subject to discipline?","choices":[{"letter":"A","text":"Yes, because Kristen said the offer was only valid for 24 hours"},{"letter":"B","text":"Yes, because Howard was not independently represented in the settlement"},{"letter":"C","text":"No, because Howard had not yet filed a malpractice claim"},{"letter":"D","text":"No, because Kristen advised Howard in writing to seek independent counsel"}],"correct":"A","explanation":"A lawyer may settle a malpractice claim or potential claim with an unrepresented client, but only if the lawyer advises the client in writing to seek independent counsel AND gives the client a reasonable chance to obtain such advice. Even though Kristen advised Howard in writing, telling him the offer was only valid for 24 hours denied him a reasonable opportunity to consult independent counsel. Note: for settling malpractice claims, the client does NOT need to actually be represented — written advice plus a reasonable opportunity is sufficient. (Contrast: for prospectively WAIVING malpractice liability, the client must actually be independently represented.)","verify":false,"id":213}, {"topic":"Competence","style":"BARBRI","stem":"Partners A, B, and C practice law together in ABC Law Firm, set up as a general partnership. Partner A commits legal malpractice. What is the extent of B's and C's personal liability?","choices":[{"letter":"A","text":"They are jointly and severally liable for the full amount of the judgment, but only if they ordered, ratified, or failed to mitigate A's conduct"},{"letter":"B","text":"They are jointly and severally liable for the full amount of the judgment"},{"letter":"C","text":"They have no personal liability"}],"correct":"B","explanation":"Under partnership law, each partner in a general partnership is jointly and severally liable for the obligations of the partnership, including the torts of another partner or employee committed in the ordinary course of the partnership business. Joint and several liability means any partner may be held personally liable for the entire judgment even if they had nothing to do with the negligent act. The language about ordering/ratifying/failing to mitigate is relevant to ethical responsibility, not financial liability.","verify":false,"id":214}, {"topic":"Competence","style":"BARBRI","stem":"Fatima's client Brian told Fatima in confidence that he planned to open a massive new shopping complex at a particular location. Without telling Brian, Fatima bought land one block away and built a parking garage to serve the upcoming complex. Brian had no plans to build a parking garage, so Fatima's garage did not harm him. Does Brian have a viable civil suit against Fatima?","choices":[{"letter":"A","text":"Yes, because Fatima used Brian's confidential information for her own pecuniary gain"},{"letter":"B","text":"No, because Brian suffered no harm as a result of Fatima's actions"}],"correct":"A","explanation":"The disciplinary rule prohibiting use of confidential information against a client applies only when the lawyer's misuse disadvantages the client. However, a lawyer who uses confidential information for her own pecuniary gain other than in the practice of law may be subject to civil liability — she must account to the client for her profits even if the client is not harmed. Even though the garage did not harm Brian, Fatima must disgorge the garage profits to Brian.","verify":false,"id":215}, {"topic":"Competence","style":"BARBRI","stem":"Bruce hires Aubrey to file a medical malpractice lawsuit against a doctor, but Aubrey misses the statute of limitations and Bruce's claim is barred. Bruce's underlying claim against the doctor was baseless, but Aubrey had no reason to know that when she missed the statute of limitations. Is Bruce likely to prevail in a malpractice claim against Aubrey?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"To prevail on a malpractice claim, the plaintiff must prove that the defendant's conduct was the legal cause of the plaintiff's injury — i.e., but for the negligence, the injury would not have happened. This means Bruce must be able to show that he had a good underlying claim in the first place ('case within a case'). Since his claim against the doctor was baseless, his malpractice claim will not prevail.","verify":false,"id":216}, {"topic":"Competence","style":"BARBRI","stem":"Riley tells her client that she is a specialist in toxic tort cases, even though she has only handled three other cases of this type. Riley then makes a serious error in the client's toxic tort case. What standard of care will be applied to Riley in a negligence suit?","choices":[{"letter":"A","text":"The competence and diligence normally exercised by lawyers in similar circumstances"},{"letter":"B","text":"The competence and diligence normally exercised by lawyers who specialize in toxic tort cases"}],"correct":"B","explanation":"Generally, the standard of care is the competence and diligence normally exercised by attorneys in similar circumstances. However, if an attorney represents to a client that she has greater competence (e.g., is a specialist) or will exercise greater diligence than normally demonstrated by attorneys undertaking similar matters, she is held to that higher standard.","verify":false,"id":217}, {"topic":"Competence","style":"BARBRI","stem":"Yvonne hired Luther to draft a will leaving a substantial sum to her best friend Bonnie. Luther was not aware that state law required two witnesses, and Yvonne signed her will in front of only one witness. The will was held invalid and Bonnie received nothing. Does Bonnie have a malpractice claim against Luther?","choices":[{"letter":"A","text":"No, because Bonnie was not Luther's client"},{"letter":"B","text":"Yes, because Bonnie was intended to benefit from Luther's services"}],"correct":"B","explanation":"Generally, a lawyer does not owe a legal duty to nonclients. However, a lawyer may owe a duty to nonclients when the nonclient was intended to benefit from the lawyer's services and the potential for harm to the nonclient should have been obvious. Because Bonnie was clearly intended to benefit from Luther's will-drafting services, Bonnie has a good malpractice claim against Luther.","verify":false,"id":218}, {"topic":"Competence","style":"BARBRI","stem":"Jamie violates a rule of professional conduct while representing Hunter. Hunter suffers loss and sues Jamie for legal malpractice. How will Jamie's ethics violation impact the malpractice case?","choices":[{"letter":"A","text":"It creates a presumption that Jamie committed malpractice"},{"letter":"B","text":"It is relevant evidence that Jamie's conduct was below the appropriate standard of care"},{"letter":"C","text":"It is irrefutable proof that Jamie committed malpractice"},{"letter":"D","text":"It will not be considered by the court under any circumstances"}],"correct":"B","explanation":"The rules of professional conduct are for disciplinary purposes. A breach of an ethics rule does not automatically or presumptively constitute malpractice. Courts generally regard an ethics violation as relevant evidence that the lawyer's conduct was below the appropriate standard of care — no more, no less.","verify":false,"id":219}, {"topic":"Competence","style":"BARBRI","stem":"Joelle represented Simon in a drunk driving trial. Simon was convicted and his license was suspended. After the verdict, Simon was very emotional and did not want to talk to Joelle. Joelle was unsure whether Simon wanted to appeal, but did not want to continue working with Simon, so she sent him his final bill and moved on. Were Joelle's actions proper?","choices":[{"letter":"A","text":"No, because she failed to consult with Simon about an appeal"},{"letter":"B","text":"Yes, because the trial had concluded"}],"correct":"A","explanation":"As part of the duty of diligence, a lawyer generally must see each matter through to completion (unless fired or required/permitted to withdraw). If there is doubt about whether the lawyer-client relationship has ended, the lawyer should clarify it, preferably in writing. An appeal was possible in Simon's case, so Joelle should have brought this to Simon's attention and clarified whether he wanted her to continue.","verify":false,"id":220}, {"topic":"Competence","style":"BARBRI","stem":"A lawyer can solve a competence problem in any of the following ways, EXCEPT:","choices":[{"letter":"A","text":"Associating with a competent attorney"},{"letter":"B","text":"Charging a reduced fee"},{"letter":"C","text":"Studying the law"}],"correct":"B","explanation":"A lawyer can solve a competence problem through adequate preparation (studying the law) or by associating with a competent attorney. A lawyer CANNOT solve a competence problem simply by charging the client a lower fee. Furthermore, a lawyer who has violated the duty of competence cannot escape discipline by reimbursing the client for any loss.","verify":false,"id":221}, {"topic":"Competence","style":"BARBRI","stem":"For a lawyer to be considered competent, he must __________.","choices":[{"letter":"A","text":"Obtain favorable results for his clients in a reasonable number of cases"},{"letter":"B","text":"Act with the legal knowledge, skill, thoroughness, and preparation reasonably necessary for the representation"},{"letter":"C","text":"Be capable of representing his client's legal needs without consulting with another lawyer"},{"letter":"D","text":"Possess specialized skills in his area of practice"}],"correct":"B","explanation":"Competence means acting with the legal knowledge, skill, thoroughness, and preparation reasonably necessary for the representation. Most matters do not require specialized skill. Every lawyer is capable of competence either through necessary study or association with another lawyer. There is no requirement to obtain favorable results — a lawyer can act competently yet still not obtain the client's desired result.","verify":false,"id":222}, {"topic":"Competence","style":"BARBRI","stem":"Which of the following statements is most accurate regarding a lawyer's duty of diligence?","choices":[{"letter":"A","text":"A lawyer should pursue his client's objectives, even to the point of being offensive or uncivil toward the adversary or other persons"},{"letter":"B","text":"A lawyer should pursue his client's objectives despite opposition, obstacles, or personal inconvenience"},{"letter":"C","text":"A lawyer is bound to press every conceivable advantage for his client"}],"correct":"B","explanation":"Diligence means pursuing a matter on the client's behalf despite opposition, obstacles, and personal inconvenience, and taking whatever lawful and ethical measures are required to vindicate the client's cause. Diligence does NOT require incivility. A lawyer is not bound to press every conceivable advantage. The lawyer uses good judgment in determining the means by which a matter is pursued.","verify":false,"id":223}, {"topic":"Competence","style":"BARBRI","stem":"In a legal malpractice case, which of the following statements is most accurate regarding an ethics violation?","choices":[{"letter":"A","text":"It is considered relevant evidence that the lawyer's conduct was below the appropriate standard of care in a legal malpractice case"},{"letter":"B","text":"It cannot be used against a lawyer as evidence in a legal malpractice case"},{"letter":"C","text":"It creates a presumption that a lawyer has committed legal malpractice"},{"letter":"D","text":"It is considered proof of legal malpractice"}],"correct":"A","explanation":"An ethics violation does not automatically constitute malpractice and does not create a presumption of malpractice. The ethics rules are for disciplinary purposes and are not designed as a basis for civil liability. However, courts regard an ethics violation as relevant evidence that the lawyer's conduct was below the appropriate standard of care.","verify":false,"id":224}, {"topic":"Competence","style":"BARBRI","stem":"A legal malpractice action can be based on:","choices":[{"letter":"A","text":"Intentional tort, negligence, breach of fiduciary duties, or breach of contract"},{"letter":"B","text":"Breach of a legal ethics rule, negligence, or breach of contract"},{"letter":"C","text":"Breach of contract only"},{"letter":"D","text":"Intentional tort or negligence only"}],"correct":"A","explanation":"A legal malpractice action can be based on intentional tort, negligence, breach of fiduciary duties, or breach of contract. Breach of a legal ethics rule alone is NOT a basis for legal malpractice — ethics rules are for disciplinary purposes. Courts do regard ethics violations as relevant evidence of below-standard care in a negligence action.","verify":false,"id":225}, {"topic":"Competence","style":"BARBRI","stem":"In terms of malpractice liability, a lawyer owes a duty of due care to:","choices":[{"letter":"A","text":"His client and any third party who was intended to benefit by the attorney's rendition of legal services"},{"letter":"B","text":"Only his client"},{"letter":"C","text":"His client and any immediate family member of the client"},{"letter":"D","text":"His client and any third party affected during the rendition of legal services for his client"}],"correct":"A","explanation":"An attorney owes a duty of due care to his client AND to any third party who was intended to benefit by the attorney's rendition of legal services. For example, an attorney drafting a will has a duty to the beneficiaries. The attorney does NOT automatically owe a duty to the client's immediate family members (only if they were intended beneficiaries), and does not owe a duty to all third parties affected (e.g., the opposing party has no malpractice claim).","verify":false,"id":226}, {"topic":"Competence","style":"BARBRI","stem":"A lawyer wants to put a clause in her standard retainer agreement providing that her liability for legal malpractice claims is limited to the amount in fees paid by her client. Is the clause valid under the Rules of Professional Conduct?","choices":[{"letter":"A","text":"No, unless the client signs a separate, informed consent agreement"},{"letter":"B","text":"No, under any circumstances"},{"letter":"C","text":"No, unless the client was independently represented in negotiating the retainer agreement"},{"letter":"D","text":"Yes"}],"correct":"C","explanation":"A clause limiting malpractice liability is valid ONLY if the client was independently represented in negotiating the retainer agreement. A separate informed consent agreement signed by the client alone is not sufficient — the client must have actual independent counsel in the negotiation.","verify":false,"id":227}, {"topic":"Competence","style":"BARBRI","stem":"Which of these is NOT a factor normally used to determine whether a lawyer has the competence to handle a particular matter?","choices":[{"letter":"A","text":"The lawyer's general experience"},{"letter":"B","text":"The prestige of the law school the lawyer attended"},{"letter":"C","text":"The preparation and study the lawyer is able to give the matter"},{"letter":"D","text":"The complexity of the matter"}],"correct":"B","explanation":"The prestige of the law school is not a factor. Factors for determining competence include: (i) complexity and specialized nature of the matter; (ii) the lawyer's general experience; (iii) the lawyer's training and experience in the field; (iv) preparation and study the lawyer can give the matter; and (v) whether it is feasible to refer the matter to or associate with a lawyer of established competence in the field.","verify":false,"id":228}, {"topic":"Competence","style":"BARBRI","stem":"A client asks her lawyer to act in an uncivil manner while cross-examining the opposing party. Which statement is correct?","choices":[{"letter":"A","text":"The lawyer must agree, because the duty of diligence means that he must follow the client's orders unless they involve taking illegal or fraudulent action"},{"letter":"B","text":"The lawyer must decline, because the ABA Model Rules expressly forbid a lawyer from speaking to a witness in an uncivil manner"},{"letter":"C","text":"The lawyer may decline, because he is not bound by the duty of diligence to be uncivil toward the client's adversaries"}],"correct":"C","explanation":"The duty of diligence does not require a lawyer to be offensive or uncivil toward adversaries or other persons. The lawyer is not obliged to agree to the client's request for incivility regardless of whether the action would be legal. The ABA Model Rules do not expressly forbid uncivil speech — the point is that diligence does not require it.","verify":false,"id":229}, {"topic":"Competence","style":"BARBRI","stem":"A legal malpractice action is intended to:","choices":[{"letter":"A","text":"Punish a negligent attorney, compensate an injured plaintiff, and protect the public from future wrongs"},{"letter":"B","text":"Protect the public from future wrongs"},{"letter":"C","text":"Punish a negligent attorney"},{"letter":"D","text":"Compensate an injured plaintiff"}],"correct":"D","explanation":"The purpose of a legal malpractice action is to compensate the injured plaintiff. A professional disciplinary action might punish a negligent attorney and/or protect the public from future wrongs — that takes place before a disciplinary tribunal. A malpractice action takes place in civil court.","verify":false,"id":230}, {"topic":"Competence","style":"BARBRI","stem":"Which is the most commonly invoked theory in legal malpractice cases?","choices":[{"letter":"A","text":"Breach of contract"},{"letter":"B","text":"Breach of fiduciary duty"},{"letter":"C","text":"Negligence"},{"letter":"D","text":"Intentional tort"}],"correct":"C","explanation":"Negligence is by far the most common theory invoked in legal malpractice cases. The plaintiff must establish: duty of due care, breach, legal causation, and damages. Other available theories include intentional tort (fraud, misrepresentation, misuse of funds), breach of fiduciary duty (loyalty, confidentiality, honest dealing), and breach of contract — but negligence is most common.","verify":false,"id":231}, {"topic":"Competence","style":"BARBRI","stem":"What is the minimum standard of care for an attorney?","choices":[{"letter":"A","text":"The heightened standard of care required of an expert in the law"},{"letter":"B","text":"The absence of any errors in judgment that cause actual harm to the client"},{"letter":"C","text":"The competence and diligence normally exercised by other attorneys in similar circumstances"},{"letter":"D","text":"The expertise and judgment of a specialist in the area of law of the attorney's practice"}],"correct":"C","explanation":"The standard of care is the competence and diligence normally exercised by attorneys in similar circumstances. The heightened expert standard applies only if the attorney represented to the client that she is a specialist or will exercise greater diligence. An attorney is not liable for errors in judgment that, although well-informed and reasonably made, cause actual harm.","verify":false,"id":232}, {"topic":"Competence","style":"BARBRI","stem":"Client C wants Lawyer L to research online sweepstakes laws in all 50 states. L advises C that this could take up to 500 hours and at least $100,000. Client C asks L to do as much research as he can for up to $20,000. Is this agreement valid?","choices":[{"letter":"A","text":"No, the agreement is not valid unless the client signs a separate, informed consent agreement"},{"letter":"B","text":"Yes, the agreement is valid"},{"letter":"C","text":"No, the agreement is not valid unless the client was independently represented in negotiating this agreement"},{"letter":"D","text":"No, the agreement is not valid unless the client signs a separate, informed consent agreement and was independently represented"}],"correct":"B","explanation":"This agreement is valid. A lawyer may enter into an agreement with his client that reasonably limits the scope of the lawyer's representation. There is no need for the client to sign a separate informed consent agreement or to be independently represented when the scope is being limited. (This is different from limiting malpractice liability, which requires independent representation.)","verify":false,"id":233}, {"topic":"Competence","style":"BARBRI","stem":"When representing a client, a lawyer must act __________.","choices":[{"letter":"A","text":"Independently"},{"letter":"B","text":"As an expert in the field of law would act"},{"letter":"C","text":"Competently"}],"correct":"C","explanation":"A lawyer must act competently — with the legal knowledge, skill, thoroughness, and preparation reasonably necessary for the representation. Expert-level skill is not required unless the lawyer held herself out as a specialist. A lawyer need not always act independently — sometimes gaining competence by consulting other lawyers is appropriate.","verify":false,"id":234}, {"topic":"Competence","style":"BARBRI","stem":"What consequences might a lawyer face as a result of performing legal work incompetently?","choices":[{"letter":"A","text":"Civil liability for legal malpractice only, because mere incompetence is not considered an ethics violation"},{"letter":"B","text":"Professional discipline or civil liability for legal malpractice, but not both, because of the Double Jeopardy Clause"},{"letter":"C","text":"Professional discipline only, because mere incompetence does not rise to the level of malpractice"},{"letter":"D","text":"Both professional discipline and civil liability for legal malpractice"}],"correct":"D","explanation":"A lawyer who performs incompetent or neglected legal work can face BOTH professional discipline AND civil liability for legal malpractice. The Double Jeopardy Clause applies to criminal actions, not civil liability or professional discipline. A malpractice action compensates the injured plaintiff; professional discipline punishes the attorney and protects the public.","verify":false,"id":235}, {"topic":"Competence","style":"BARBRI","stem":"Which of these is NOT a theory that can be invoked in a legal malpractice action?","choices":[{"letter":"A","text":"Breach of a legal ethics rule"},{"letter":"B","text":"Breach of contract"},{"letter":"C","text":"Breach of fiduciary duty"}],"correct":"A","explanation":"Breach of a legal ethics rule alone is NOT a basis for legal malpractice. Ethics rules are for disciplinary purposes. However, courts regard ethics violations as relevant evidence of below-standard care in a negligence action. Valid malpractice theories include: negligence, intentional tort, breach of fiduciary duty, and breach of contract.","verify":false,"id":236}, {"topic":"Competence","style":"BARBRI","stem":"Which of the following is an example of attorney negligence?","choices":[{"letter":"A","text":"A failure to refer a client to a specialist when another reasonably prudent lawyer would have done so"},{"letter":"B","text":"An error in judgment that, although reasonably made, causes actual harm to a client"},{"letter":"C","text":"An incorrect prediction about how an unsettled issue will ultimately be resolved by the courts"},{"letter":"D","text":"A reliance on legal research rather than the attorney's own legal knowledge"}],"correct":"A","explanation":"Failing to refer a client to a specialist when a reasonably prudent lawyer would have done so is negligence. An attorney is NOT negligent for: errors in judgment that are well-informed and reasonably made; incorrect predictions about unsettled issues if reasonable research was done; or relying on standard legal research. An attorney has a duty to use available resources to look up rules of law he does not know.","verify":false,"id":237}, {"topic":"Competence","style":"BARBRI","stem":"Without independent counsel, a client signed a retainer agreement with his lawyer that included: (a) The lawyer would spend no more than 20 hours on the matter; (b) The client must arbitrate any legal malpractice claims; and (c) The lawyer's liability for any malpractice issues would be capped at $10,000. What parts of this agreement are valid?","choices":[{"letter":"A","text":"No portion of the agreement is valid"},{"letter":"B","text":"Parts (a) and (b) only"},{"letter":"C","text":"Parts (a) and (c) only"},{"letter":"D","text":"Parts (a), (b), and (c)"}],"correct":"B","explanation":"Parts (a) and (b) are valid. A lawyer may limit the scope of representation (a) and may agree prospectively to arbitrate all matters (b). Part (c) is NOT valid — a lawyer cannot limit malpractice liability unless the client was independently represented in negotiating the agreement.","verify":false,"id":238}, {"topic":"Competence","style":"BARBRI","stem":"A lawyer may settle a malpractice claim or potential malpractice claim with his client, but only if the lawyer first advises the client __________ to seek the advice of an independent lawyer about the settlement, and _________.","choices":[{"letter":"A","text":"No portion of the agreement is valid"},{"letter":"B","text":"In writing; the lawyer gives the client a reasonable opportunity to obtain such advice"},{"letter":"C","text":"Verbally or in writing; the client actually hires independent counsel"},{"letter":"D","text":"In writing; the client actually hires independent counsel"}],"correct":"B","explanation":"A lawyer may settle a malpractice claim with an unrepresented client if: (1) the lawyer advises the client IN WRITING to seek independent counsel about the settlement, and (2) the lawyer gives the client a REASONABLE OPPORTUNITY to obtain such advice. Verbal advice is insufficient. The client does NOT need to actually hire independent counsel — opportunity to obtain advice is sufficient. (Contrast: for prospectively waiving malpractice liability, the client must actually be independently represented.)","verify":false,"id":239}, {"topic":"Advocacy","style":"BARBRI","stem":"Generally, a lawyer must not act as an advocate at a trial in which she is likely to be a necessary witness. Which of the following is NOT an exception to this prohibition?","choices":[{"letter":"A","text":"The client consents to the lawyer's dual role"},{"letter":"B","text":"The testimony relates solely to an uncontested matter or formality"},{"letter":"C","text":"The testimony relates solely to the nature and value of legal services the lawyer has rendered in the case"},{"letter":"D","text":"The lawyer's withdrawal as trial counsel would cause substantial hardship to the client"}],"correct":"A","explanation":"Client consent is NOT an exception to the advocate-witness rule. The valid exceptions are: (i) testimony relates solely to an uncontested matter or a formality; (ii) testimony relates solely to the nature and value of legal services rendered; and (iii) disqualification would cause substantial hardship to the client because of the distinctive value of the lawyer's services.","verify":false,"id":240}, {"topic":"Advocacy","style":"BARBRI","stem":"Jack is representing Beth in a personal injury case. Beth's sister, Beth's best friend, and a crossing guard also have information relating to Beth's accident. Jack suspects the defense attorney will contact them. Who can Jack properly advise to refrain from giving information to the defense?","choices":[{"letter":"A","text":"Beth only"},{"letter":"B","text":"Beth and Beth's sister only"},{"letter":"C","text":"Beth, Beth's sister, and Beth's best friend only"},{"letter":"D","text":"Beth, Beth's sister, Beth's best friend, and the crossing guard"}],"correct":"B","explanation":"A lawyer may advise a person not to voluntarily give information to an opponent if: (i) the person is a client, or a relative, employee, or agent of a client; AND (ii) the lawyer reasonably believes that the person's interests will not be harmed by not volunteering the information. Beth's sister qualifies as a relative of a client. Beth's best friend and the crossing guard do not fall within any of these categories.","verify":false,"id":241}, {"topic":"Advocacy","style":"BARBRI","stem":"Which payment to a trial witness would be prohibited?","choices":[{"letter":"A","text":"Paying a non-expert witness for their reasonable travel expenses"},{"letter":"B","text":"Paying an expert witness for their time spent preparing for testimony"},{"letter":"C","text":"Paying an expert witness for their time spent testifying"},{"letter":"D","text":"Paying an expert witness a reasonable bonus if the client prevails"}],"correct":"D","explanation":"A victory bonus tied to the outcome of the case is prohibited — a witness's fee cannot be contingent on either the content of the testimony or the outcome of the case. Permitted: paying a non-expert witness's reasonable travel expenses; paying a reasonable fee to an expert witness for preparing to testify and for testifying.","verify":false,"id":242}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer's duty to rectify false evidence:","choices":[{"letter":"A","text":"Ends when a final judgment has been affirmed on appeal or the time for appeal has expired"},{"letter":"B","text":"Ends when the final judgment has been entered, regardless of a possible appeal"},{"letter":"C","text":"Ends when the client dies"},{"letter":"D","text":"Is perpetual"}],"correct":"A","explanation":"The duty to rectify false evidence continues until the end of the proceedings — meaning when a final judgment has been affirmed on appeal OR the time for appeal has expired. The duty does not end merely when the trial court enters judgment.","verify":false,"id":243}, {"topic":"Advocacy","style":"BARBRI","stem":"Lawrence represents Ophelia in a breach of contract case. Lawrence offers various documents supporting Ophelia's case. Later, the opponent discovers that Ophelia forged the documents. Under what circumstances will Lawrence be subject to discipline for offering false evidence?","choices":[{"letter":"A","text":"If he knew the evidence was false"},{"letter":"B","text":"If he knew or reasonably believed the evidence was false"},{"letter":"C","text":"If he knew the evidence was false, reasonably believed it was false, or negligently failed to investigate"}],"correct":"A","explanation":"A lawyer is subject to discipline ONLY for knowingly offering false evidence. A lawyer may (but is not required to) refuse to offer evidence that the lawyer reasonably believes to be false (except for criminal defendant testimony). A negligent failure to investigate the evidence will not result in discipline.","verify":false,"id":244}, {"topic":"Advocacy","style":"BARBRI","stem":"Annika represents Bobby in a murder prosecution. Near the end of the trial, Bobby tells her he intends to lie on the stand. Despite Annika's best efforts, Bobby will not change his plan. Withdrawal will not solve the problem because even if permitted, Bobby's next attorney would face the same situation. What must Annika do next?","choices":[{"letter":"A","text":"Notify the judge of the situation"},{"letter":"B","text":"Nothing, because she owes a duty of confidentiality to Bobby"}],"correct":"A","explanation":"When a criminal defendant insists on testifying falsely, the lawyer must: (1) try to convince the defendant not to testify falsely; (2) consider withdrawal if it would solve the problem; (3) if all else fails, reveal the situation to the judge — even if that means disclosing confidential information. The duty of candor to the tribunal overrides confidentiality in this situation. The judge then decides what to do.","verify":false,"id":245}, {"topic":"Advocacy","style":"BARBRI","stem":"Marek is on trial for negligent manslaughter. His attorney Alexis reasonably believes (but does not know) that Marek intends to lie on the stand. Alexis refuses to call Marek as a witness at trial. Is Alexis subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"A","explanation":"Alexis is subject to discipline. A lawyer may refuse to offer evidence that she REASONABLY BELIEVES is false — EXCEPT for a criminal defendant's testimony on his own behalf. Because Alexis only suspects (does not know) that Marek will testify falsely, and Marek is a criminal defendant, Alexis must allow him to testify on his own behalf. Refusing to call him violates his constitutional right to testify.","verify":false,"id":246}, {"topic":"Advocacy","style":"BARBRI","stem":"Heather is representing Vincent in a burglary prosecution. Heather suspects that Joe, a witness, will testify falsely at trial. She calls Joe to testify anyway. Is Heather subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"Heather is not subject to discipline. A lawyer is subject to discipline only for KNOWINGLY offering false evidence. Heather suspected — but did not know — that Joe's testimony would be false. Joe is not the defendant, so the criminal defendant exception does not apply. Heather had the option of refusing to call Joe, but she is not subject to discipline for calling him because she lacked actual knowledge that his testimony would be false.","verify":false,"id":247}, {"topic":"Advocacy","style":"BARBRI","stem":"Justin is representing Dana in a personal injury lawsuit. Dana tells Justin that she intends to give false testimony at trial. Justin tries and fails to convince her otherwise. Which statement is true?","choices":[{"letter":"A","text":"Justin may refuse to call Dana as a witness"},{"letter":"B","text":"Justin must refuse to call Dana as a witness"},{"letter":"C","text":"Justin must allow Dana to testify"}],"correct":"B","explanation":"Justin must refuse to call Dana as a witness. A lawyer must refuse to offer evidence that he KNOWS is false. Here, Justin knows Dana intends to testify falsely because she told him so. This is a civil matter (not a criminal case), so the criminal defendant exception does not apply. If Dana had already testified, Justin would be required to take reasonable remedial measures.","verify":false,"id":248}, {"topic":"Advocacy","style":"BARBRI","stem":"Ryan is representing a client in a trial in State A. This is a case of first impression in State A, but Ryan knows there is a State B case directly adverse to his client's position. Opposing counsel fails to disclose the State B case. Ryan decides not to disclose it either. Is Ryan subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"Ryan is not subject to discipline. An attorney is subject to discipline for knowingly failing to disclose a legal authority in the CONTROLLING JURISDICTION that is directly adverse to the client's position and not disclosed by opposing counsel. State B is not the controlling jurisdiction here. Because the case is from a non-controlling jurisdiction, Ryan has no duty to disclose it.","verify":false,"id":249}, {"topic":"Advocacy","style":"BARBRI","stem":"Which of the following actions would violate the rule against frivolous proceedings?","choices":[{"letter":"A","text":"Asserting a position without fully substantiating all of the facts"},{"letter":"B","text":"Asserting a position without vital evidence but with the hope that such evidence will be uncovered through discovery proceedings"},{"letter":"C","text":"Asserting a position the lawyer believes is justified, even though it is not supported by existing law and there is no good faith basis for changing the law"},{"letter":"D","text":"Asserting a position with the belief that it will probably fail"}],"correct":"C","explanation":"A 'frivolous' position is one that cannot be supported by a good faith argument under existing law AND cannot be supported by a good faith argument for changing the existing law — even if the lawyer subjectively believes the position is justified. Not frivolous: asserting a position without fully substantiating facts; asserting a position hoping discovery will uncover vital evidence; or asserting a position the lawyer believes will probably fail.","verify":false,"id":250}, {"topic":"Advocacy","style":"BARBRI","stem":"Does a lawyer violate the rule against frivolous claims by asserting a position before fully substantiating all the facts?","choices":[{"letter":"A","text":"Yes, a lawyer must investigate all facts before pursuing a position"},{"letter":"B","text":"No, as long as the lawyer has a good faith belief that facts could reasonably be discovered in order to substantiate the claim"},{"letter":"C","text":"No, a lawyer may advocate any position advantageous to his client"}],"correct":"B","explanation":"A 'frivolous' position is one that cannot be supported by a good faith argument under existing law AND cannot be supported by a good faith argument for changing existing law. It is NOT frivolous to: (i) assert a position without first fully substantiating all the facts; (ii) assert a position knowing vital evidence can be uncovered only through discovery; or (iii) assert a position even though the lawyer believes it will not ultimately prevail.","verify":false,"id":251}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer generally must volunteer information to the court regarding __________________ if such information is not disclosed by the opposing counsel.","choices":[{"letter":"A","text":"All law and facts that are harmful to his client's case"},{"letter":"B","text":"Controlling law that is directly adverse to his client's case"},{"letter":"C","text":"Facts that are harmful to his client's case"}],"correct":"B","explanation":"An attorney is subject to discipline for knowingly failing to disclose to the court a legal authority in the controlling jurisdiction that is directly adverse to the client's position and not disclosed by opposing counsel. An attorney has no obligation to volunteer facts that are harmful to his client's case.","verify":false,"id":252}, {"topic":"Advocacy","style":"BARBRI","stem":"In civil matters, when is a lawyer required to volunteer facts to the court that are harmful to his client's case?","choices":[{"letter":"A","text":"Always"},{"letter":"B","text":"Whenever the opposing counsel fails to disclose the facts"},{"letter":"C","text":"In ex parte proceedings only"},{"letter":"D","text":"Never"}],"correct":"C","explanation":"A lawyer generally has no obligation to volunteer facts harmful to his client's case. However, in an ex parte proceeding, only one side is present and the other has no opportunity to offer its version of the facts. Thus, a lawyer in an ex parte proceeding must inform the tribunal of all material facts known to the lawyer that will help the tribunal make an informed decision. When both sides are present, the lawyer need not volunteer harmful facts even if opposing counsel fails to disclose them.","verify":false,"id":253}, {"topic":"Advocacy","style":"BARBRI","stem":"May a lawyer refuse to offer evidence that she reasonably believes is false?","choices":[{"letter":"A","text":"Yes, in all circumstances"},{"letter":"B","text":"The lawyer may refuse in a civil case, but must present all evidence in a criminal case"},{"letter":"C","text":"Yes, except for a criminal defendant's own testimony"},{"letter":"D","text":"No, a lawyer must offer all evidence on behalf of her client unless it is an obvious falsehood"}],"correct":"C","explanation":"A lawyer may refuse to offer evidence she reasonably believes is false, EXCEPT for a criminal defendant's testimony on his own behalf. The lawyer is not required to present all evidence in a criminal case (apart from the defendant's own testimony) if she reasonably believes it is false.","verify":false,"id":254}, {"topic":"Advocacy","style":"BARBRI","stem":"Which of the following actions by a lawyer during a trial is sometimes permitted?","choices":[{"letter":"A","text":"Stating a personal opinion about the credibility of a witness"},{"letter":"B","text":"Counseling a witness not to give information to an opposing party"},{"letter":"C","text":"Referring to inadmissible material"},{"letter":"D","text":"Stating a personal opinion about the innocence of the accused"}],"correct":"B","explanation":"A lawyer may counsel a person not to voluntarily give information to an opponent if: (i) the person is a client, or a relative, employee, or agent of a client; and (ii) the lawyer reasonably believes that the person's interests will not be harmed by not volunteering the information. A lawyer must not refer to inadmissible material during trial, or state personal opinions about the credibility of a witness or the guilt or innocence of the accused.","verify":false,"id":255}, {"topic":"Advocacy","style":"BARBRI","stem":"Which of the following is most likely a prohibited ex parte communication with a judge?","choices":[{"letter":"A","text":"An oral statement regarding the merits of the case"},{"letter":"B","text":"An unsolicited written communication to a judge with a copy sent to the other party"},{"letter":"C","text":"An oral statement to obtain an extension of time to respond to discovery"},{"letter":"D","text":"An oral statement to obtain an extension of time for amending the pleadings"}],"correct":"A","explanation":"A lawyer must not make an oral statement regarding the merits of a case with the judge or other official before whom the matter is pending without giving adequate notice to the adversary. If local court rules allow ex parte appearances to obtain extensions of time for amending pleadings or responding to discovery, a lawyer may do so — but must not discuss the merits. An unsolicited written communication to a judge is generally not ex parte if a copy is timely sent to opposing parties.","verify":false,"id":256}, {"topic":"Advocacy","style":"BARBRI","stem":"Prohibitions on trial publicity attempt to balance the ____________ protections granted to litigants with the ____________ protections granted to the public and press.","choices":[{"letter":"A","text":"First Amendment; Fifth Amendment"},{"letter":"B","text":"Sixth Amendment; First Amendment"},{"letter":"C","text":"First Amendment; Sixth Amendment"},{"letter":"D","text":"Fifth Amendment; First Amendment"}],"correct":"D","explanation":"Litigants have a Fifth Amendment right to have their dispute resolved on admissible evidence, by fair procedures, in a tribunal not influenced by public sentiment. The public and press have countervailing First Amendment rights — the public has a right to know about threats to its safety and an interest in knowing about the conduct of judicial proceedings.","verify":false,"id":257}, {"topic":"Advocacy","style":"BARBRI","stem":"May a lawyer act as trial counsel and serve as a witness in the same proceeding?","choices":[{"letter":"A","text":"Yes, but the lawyer generally must not represent the client at trial if he is likely to be a necessary witness"},{"letter":"B","text":"No, a lawyer is automatically disqualified from serving as trial counsel if he is called as a witness"},{"letter":"C","text":"Yes, a lawyer may act as both an advocate and a material witness in any proceeding"}],"correct":"A","explanation":"The ABA Model Rules limit serving as both trial counsel and witness. Except in certain circumstances, a lawyer must not act as an advocate at a trial in which the lawyer is likely to be a necessary witness. Exceptions: (i) testimony relates to an uncontested matter or legal services rendered; (ii) withdrawal as trial counsel would cause substantial hardship to the client. A lawyer is not automatically disqualified just by being called as a witness.","verify":false,"id":258}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer represents the accused in a criminal case. If the lawyer becomes aware that the defendant is about to testify falsely, what is the FIRST step the lawyer should take?","choices":[{"letter":"A","text":"Reveal the client's plans to the judge"},{"letter":"B","text":"Attempt to persuade the client not to testify falsely"},{"letter":"C","text":"Immediately withdraw from the representation"}],"correct":"B","explanation":"The three-step approach when a criminal defendant client is about to testify falsely: (1) FIRST, try to convince the defendant not to testify falsely; (2) if the defendant insists, consider withdrawal if that will solve the problem; (3) only if all else fails, reveal the situation to the judge even if that means disclosing confidential information. Revealing to the judge is the last resort, not the first step.","verify":false,"id":259}, {"topic":"Advocacy","style":"BARBRI","stem":"A frivolous argument is one that _______________________.","choices":[{"letter":"A","text":"Cannot be supported by a good faith argument for changing existing law"},{"letter":"B","text":"Cannot be supported by a good faith argument under existing law"},{"letter":"C","text":"Cannot be supported by a good faith argument under existing law AND cannot be supported by a good faith argument for changing existing law"},{"letter":"D","text":"The lawyer believes will ultimately fail"}],"correct":"C","explanation":"A 'frivolous' position is one that BOTH (i) cannot be supported by a good faith argument under existing law AND (ii) cannot be supported by a good faith argument for changing existing law. Both conditions must be met. A position is not frivolous merely because the lawyer believes it will ultimately fail.","verify":false,"id":260}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer owes a duty of candor to the tribunal. Under this duty, can a lawyer be disciplined for failure to correct a statement of material law that is false?","choices":[{"letter":"A","text":"No, a lawyer is not required to correct a previous statement of material law"},{"letter":"B","text":"Yes, unless the lawyer had a good faith belief in the statement's accuracy at the time it was made"},{"letter":"C","text":"Yes, a lawyer must correct all previously made false statements of material law"}],"correct":"C","explanation":"An attorney is subject to discipline for knowingly making a false statement of law to the court OR for failing to correct a previously made false statement of material law. This is true regardless of whether the attorney had a good faith belief that the statement was accurate at the time it was made.","verify":false,"id":261}, {"topic":"Advocacy","style":"BARBRI","stem":"In an ex parte proceeding, a lawyer __________.","choices":[{"letter":"A","text":"May only discuss administrative matters with the court"},{"letter":"B","text":"Need not volunteer any harmful facts to the court"},{"letter":"C","text":"Must inform the court of all material facts known to the lawyer that will help the tribunal make an informed decision"}],"correct":"C","explanation":"In an ex parte proceeding, only one side is present and the other side has no opportunity to offer its version of the facts. Because the adversary system model does not apply in this context, a lawyer in an ex parte proceeding must inform the tribunal of all material facts known to the lawyer that will help the tribunal make an informed decision — including facts harmful to the client's position.","verify":false,"id":262}, {"topic":"Advocacy","style":"BARBRI","stem":"Is a lawyer subject to discipline for offering false evidence?","choices":[{"letter":"A","text":"Yes, if the court determines that the evidence presented to it is false"},{"letter":"B","text":"Only if the lawyer knows or reasonably believes it is false"},{"letter":"C","text":"Only if the lawyer has actual knowledge of its falsehood"},{"letter":"D","text":"No, a lawyer is directed to believe the veracity of her client and present all persuasive evidence"}],"correct":"C","explanation":"A lawyer is subject to discipline for offering evidence only if the lawyer has ACTUAL KNOWLEDGE of its falsehood. Actual knowledge can be inferred from the circumstances. A lawyer may refuse (but is not subject to discipline for offering) evidence she reasonably believes to be false. A lawyer should resolve doubts in favor of the client but cannot ignore an obvious falsehood.","verify":false,"id":263}, {"topic":"Advocacy","style":"BARBRI","stem":"Can a lawyer use threats against an adversary to gain an advantage in a civil case?","choices":[{"letter":"A","text":"Yes, but only threats to bring disciplinary complaints"},{"letter":"B","text":"Yes, but only threats to bring criminal charges or disciplinary complaints; other threats are prohibited"},{"letter":"C","text":"Yes, but only threats to bring criminal charges"},{"letter":"D","text":"No; threats of any kind are prohibited"}],"correct":"C","explanation":"A lawyer may bring, or threaten to bring, criminal charges against her adversary to gain an advantage in a civil case, provided that the criminal and civil matters are closely related AND both the civil case and criminal charges are warranted by the law and the facts. However, a lawyer must NOT threaten to report adversary counsel for a disciplinary violation in order to gain an advantage. If the disciplinary violation must be reported, it should simply be reported — not used as a bargaining chip.","verify":false,"id":264}, {"topic":"Advocacy","style":"BARBRI","stem":"Pursuant to the ABA Model Rules, which of the following actions may a lawyer take relating to a member of the jury?","choices":[{"letter":"A","text":"Communicate with a juror after the trial when the juror indicates that she does not want to speak to the lawyer"},{"letter":"B","text":"Investigate a potential juror's background"},{"letter":"C","text":"Engage in 'small talk' initiated by the lawyer during the trial"},{"letter":"D","text":"Engage in 'small talk' initiated by the juror during the trial"}],"correct":"B","explanation":"It is not improper to investigate a potential juror's background to determine grounds for a challenge. Before and during trial, a lawyer must not communicate outside official proceedings with a juror or panel member on any subject — even 'small talk' — regardless of who initiated it. After the trial and jury discharge, a lawyer must not communicate with a former juror if: (i) local law or court order prohibits it; (ii) the juror does not want to communicate; or (iii) the communication involves misrepresentation, coercion, or harassment.","verify":false,"id":265}, {"topic":"Advocacy","style":"BARBRI","stem":"Which type of statement regarding a case is a lawyer authorized to make outside the courtroom?","choices":[{"letter":"A","text":"Any statement that does not refer to evidence that is inadmissible in the courtroom"},{"letter":"B","text":"Certain statements reasonably believed necessary to protect the client from substantial undue prejudice"},{"letter":"C","text":"Only statements expressly authorized by the court"}],"correct":"B","explanation":"A lawyer may make a public statement that a reasonable lawyer would believe is necessary to protect a client from the substantial undue prejudice of recent publicity not initiated by the lawyer or the lawyer's client. However, a lawyer connected with a case must not make a public statement outside the courtroom that the lawyer reasonably should know would have a substantial likelihood of materially prejudicing the case. Statements need not be expressly authorized by the court.","verify":false,"id":266}, {"topic":"Advocacy","style":"BARBRI","stem":"In which of the following circumstances may a lawyer NOT serve as both trial counsel and a witness?","choices":[{"letter":"A","text":"When the lawyer's testimony relates to the legal services rendered in a case"},{"letter":"B","text":"When the lawyer knew that he would be a necessary witness and obtained the client's consent to the dual role"},{"letter":"C","text":"When withdrawal by the lawyer would cause substantial hardship to the client"},{"letter":"D","text":"When the lawyer's testimony relates to an uncontested issue"}],"correct":"B","explanation":"Client consent is NOT an exception to the advocate-witness rule. A lawyer may not serve as both trial counsel and witness even if the client consents to the dual role. Valid exceptions: (i) testimony about an uncontested issue or mere formality; (ii) testimony about legal services rendered in the case; (iii) withdrawal would cause substantial hardship to the client.","verify":false,"id":267}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer represents the accused in a criminal case. If the client testifies falsely despite the lawyer's attempts to persuade him otherwise, what steps should the lawyer take?","choices":[{"letter":"A","text":"Immediately withdraw from the case"},{"letter":"B","text":"Inform the opposing counsel of any falsity"},{"letter":"C","text":"The lawyer may not take any further action due to confidentiality concerns"},{"letter":"D","text":"Consider withdrawal if that would help the problem, and reveal the situation to the judge if necessary"}],"correct":"D","explanation":"If the defendant insists on testifying falsely: (1) consider withdrawal if that will solve the problem (it usually won't — either the court won't permit it or it won't erase the false testimony); (2) if all else fails, reveal the situation to the judge even if that means disclosing confidential information. The duty of candor to the tribunal overrides confidentiality.","verify":false,"id":268}, {"topic":"Advocacy","style":"BARBRI","stem":"In representing a client, is it frivolous to assert a position if the lawyer thinks it will ultimately fail?","choices":[{"letter":"A","text":"No, a lawyer may assert any position that his client believes has merit"},{"letter":"B","text":"No, this does not in itself make the position frivolous"},{"letter":"C","text":"Yes, a lawyer may not assert a position that he believes will ultimately fail"}],"correct":"B","explanation":"The fact that a lawyer thinks a position will not ultimately prevail does not in itself make the position frivolous. A 'frivolous' position is one that cannot be supported by a good faith argument under existing law AND cannot be supported by a good faith argument for changing existing law. A position may be frivolous even if the client believes it has merit — and conversely, not frivolous even if the lawyer thinks it will fail.","verify":false,"id":269}, {"topic":"Advocacy","style":"BARBRI","stem":"When is a lawyer required to disclose to the court controlling law that is directly adverse to his client?","choices":[{"letter":"A","text":"When it has not been disclosed by opposing counsel"},{"letter":"B","text":"Under all circumstances"},{"letter":"C","text":"Never, because doing so would destroy the lawyer's role as advocate"}],"correct":"A","explanation":"An attorney is subject to discipline for knowingly failing to disclose to the court a legal authority in the controlling jurisdiction that is directly adverse to the client's position and that has not been disclosed by opposing counsel. The lawyer's role as advocate is satisfied by arguing why the controlling law should not be followed. If opposing counsel has already disclosed it, no additional duty applies.","verify":false,"id":270}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer has a duty of candor to the tribunal. Under this duty, when may a lawyer be required to reveal facts that are harmful to his client's position?","choices":[{"letter":"A","text":"Ex parte proceedings only"},{"letter":"B","text":"Any proceeding in a criminal case"},{"letter":"C","text":"Any proceeding in a civil case"},{"letter":"D","text":"None; a lawyer is never required to volunteer facts that are harmful to his client"}],"correct":"A","explanation":"A lawyer generally has no duty to volunteer facts harmful to the client's position. However, in an ex parte proceeding, only one side is present and the adversary system model does not apply. Therefore, a lawyer in an ex parte proceeding must inform the tribunal of all material facts known to the lawyer that will help the tribunal make an informed decision. The duty does not extend to any proceeding in a criminal case or any proceeding in a civil case where both sides are present.","verify":false,"id":271}, {"topic":"Advocacy","style":"BARBRI","stem":"A lawyer's public statement __________ is most likely improper.","choices":[{"letter":"A","text":"That the lawyer reasonably believes will protect the client from a recent prejudicial statement made by the opposing lawyer"},{"letter":"B","text":"Detailing the possibility that a defendant will plead guilty in the case"},{"letter":"C","text":"Identifying the result of the latest step in litigation"},{"letter":"D","text":"Naming the parties involved in the case"}],"correct":"B","explanation":"Detailing the possibility that a defendant will plead guilty is most likely to have a substantial likelihood of materially prejudicing the case and is therefore improper. A lawyer may make statements reasonably believed necessary to protect the client from undue prejudice from recent publicity not initiated by the lawyer. Identifying the result of the latest step in litigation and naming the parties are generally permissible.","verify":false,
