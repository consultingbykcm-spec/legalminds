letter":"B","text":"Can be implied because a lawyer has an ethical duty to take any case offered upon tender of a proper fee"},{"letter":"C","text":"Can be implied when he fails to clearly decline representation and the prospective client reasonably relies on the representation"},{"letter":"D","text":"Must be in writing to be legally binding under the Statute of Frauds"}],"correct":"C","explanation":"A lawyer’s assent to accept a client is implied when he fails to clearly decline representation and the prospective client reasonably relies on the representation. The reasonableness of the reliance is a question of fact. It is false to state that a lawyer’s assent to accept a client can be implied because a lawyer has an ethical duty to take any case offered upon tender of a proper fee. Lawyers in the United States are generally free to refuse service to any person for any reason. The fact that a prospective client tenders a proper fee to a lawyer, by itself, does not create a lawyer-client relationship. The lawyer has to agree to provide the service. As stated above, a lawyer’s assent can be implied when the lawyer fails to decline the representation and the client reasonably relies on the representation; thus it is helpful, but not necessary, for the lawyer to clearly communicate his assent to the client. There is no Statute of Frauds requirement that an agreement to represent a client must be in writing to be binding.","verify":false,"id":56}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"What will the consequence(s) be if a court finds that an attorney’s fee, agreed to at arm’s length between the client and the attorney, is unreasonably high?","choices":[{"letter":"A","text":"The court will enforce the contract and take no action against the attorney because the fee was agreed to at arm’s length"},{"letter":"B","text":"The court will enforce the contract because it was agreed to at arm’s length, but the attorney will be subject to discipline for violation of an ethics rule"},{"letter":"C","text":"The court will not enforce the contract for the fee and the attorney will be subject to discipline"},{"letter":"D","text":"The court will not enforce the contract for the fee, but the attorney will not be subject to discipline because the contract was agreed to at arm’s length between the client and the attorney"}],"correct":"C","explanation":"A court will not enforce a contract for an unreasonably high attorney’s fee or an unreasonably high amount for expenses, and the attorney is subject to discipline for trying to exact such a fee or amount for expenses. Even if, in theory, the attorney and client bargained at arm’s length over the fee, many clients are inexperienced with attorneys’ fees. Thus, in fee disputes, courts strain to give the benefit of the doubt to the client.","verify":false,"id":57}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Does a true retainer fee differ from a payment in advance?","choices":[{"letter":"A","text":"No, both terms are used interchangeably to indicate payment for services yet to be rendered"},{"letter":"B","text":"Yes, a true retainer fee is money paid solely to ensure the availability of a lawyer, whereas an advance is a payment for services yet to be rendered"},{"letter":"C","text":"No, both terms are used interchangeably to indicate money paid solely to ensure the availability of a lawyer"},{"letter":"D","text":"Yes, a true retainer fee is money paid for services yet to be rendered, whereas an advance is solely to ensure the availability of a lawyer"}],"correct":"B","explanation":"A true retainer fee is money that is paid solely to ensure the availability of the lawyer, and the lawyer who is fired or withdraws generally need not refund the retainer fee. In contrast, when a lawyer requires advance payment for services yet to be rendered, she must refund any unearned part of the advance if she is fired or withdraws.","verify":false,"id":58}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"What is the most accurate definition of a contingent fee?","choices":[{"letter":"A","text":"A fee paid solely to ensure the availability of a lawyer"},{"letter":"B","text":"A fee that equals a percentage of the client’s actual recovery in a case"},{"letter":"C","text":"A fee that is collected only if the matter is resolved in the client’s favor"},{"letter":"D","text":"A fee that is contingent on the client’s ability to pay"}],"correct":"C","explanation":"Under a contingent fee agreement, the lawyer collects a fee only if the matter is resolved in the client’s favor. Often, a contingent fee is expressed as a percentage of the client’s eventual recovery in the case, but it need not be; an otherwise proper contingent fee may still be proper even if there is no res, or pool of money, from which the fee can be paid. Some lawyers may choose to offer discounted fees that are contingent on the client’s ability to pay, but this is not what is generally meant by the term contingent fee. A fee paid solely to ensure the availability of a lawyer is called a true retainer fee.","verify":false,"id":59}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"When a lawyer exercises a __________ lien, any recovery obtained for the client serves as security for the lawyer’s fees.","choices":[{"letter":"A","text":"Retaining"},{"letter":"B","text":"Holding"},{"letter":"C","text":"Charging"}],"correct":"C","explanation":"Lawyers have several remedies if a client refuses to pay all or a portion of a fee. When a lawyer exercises a charging lien, any recovery obtained for the client serves as security for the lawyer’s fees. When a lawyer exercises a retaining lien, the lawyer holds documents, funds, and property of the client until his fee is paid. A holding lien is not a recognized term. Most states recognize a common law or statutory charging lien. Even states that do not recognize a charging lien usually recognize such a lien if it was created by the lawyer and client’s express agreement. Many states also permit the lawyer to exercise a retaining lien, but a strong minority of states do not.","verify":false,"id":60}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Which of the following statements regarding fee splitting is most correct?","choices":[{"letter":"A","text":"Lawyers may split fees only with current partners and associates within a law firm"},{"letter":"B","text":"Lawyers generally should not split a legal fee with other lawyers, subject to a few exceptions"},{"letter":"C","text":"Lawyers are generally free to enter into fair fee-splitting arrangements with other lawyers at their discretion"},{"letter":"D","text":"Lawyers are absolutely forbidden from splitting fees with other lawyers"}],"correct":"B","explanation":"As a general rule, a lawyer should not split a legal fee with another lawyer, but this general rule is subject to three exceptions discussed below. First, current partners and associates within a law firm may split legal fees, but this is not the only instance where fee splitting is permitted. Second, a law firm may also make payments to a former partner or associate under a separation or retirement agreement. Finally, two or more lawyers from different firms can split a fee if: (i) the total fee is reasonable; (ii) the split is in proportion to the services performed by each lawyer, or some different proportion if each lawyer assumes joint responsibility for the matter; and (iii) the client agrees to the split in a writing that discloses the share each lawyer will receive. If the fee splitting agreement does not fall into one of the above mentioned exceptions, then lawyers are not free to enter into a fee-splitting arrangements; it is not a matter left to the lawyers’ discretion. It is incorrect to state that lawyers are forbidden from splitting fees with other lawyers.","verify":false,"id":61}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"The lawyer, rather than the client, should make the decision regarding whether to:","choices":[{"letter":"A","text":"Make an objection to a line of questioning"},{"letter":"B","text":"Appeal a verdict"},{"letter":"C","text":"Call the client to testify in a criminal case"},{"letter":"D","text":"Accept a settlement offer"}],"correct":"A","explanation":"Clients normally defer to their lawyers about issues of law, tactics, and strategy. It is the lawyer’s job to help the client determine the validity, scope, and meaning of the law. Thus, the lawyer should determine whether to make an objection to a line of questioning. The client, on the other hand, must make the key decisions that affect the client’s substantial legal rights. A lawyer must therefore abide by the client’s decision regarding whether to appeal a verdict; whether to accept a settlement offer, and whether to call the client to testify in a criminal case. Lawyers also normally defer to their clients about questions of expense and concern for third persons who might be affected by a legal tactic.","verify":false,"id":62}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Which of the following statements is correct regarding a client’s right to fire his attorney?","choices":[{"letter":"A","text":"A client can fire his attorney at any time for just cause, but cannot fire his attorney without cause if there is a signed, written employment agreement between the attorney and the client"},{"letter":"B","text":"A client can fire his attorney at any time for just cause, but cannot fire his attorney without cause unless he seeks court approval"},{"letter":"C","text":"A client can fire his attorney at any time, with or without just cause"},{"letter":"D","text":"A client can fire his attorney at any time for just cause, but cannot fire his attorney without cause if the attorney is representing the client on a contingent fee basis"}],"correct":"C","explanation":"The law generally allows the client to fire the attorney at any time, with or without just cause. The client is liable to the attorney in quantum meruit for the reasonable value of the work the attorney did before being fired. Even if there is a signed, written employment agreement between the attorney and the client and the client fires the attorney for no good reason, the client will not be held liable for breach of contract. For policy reasons, courts construe all attorney employment contracts as being terminable at will by the client. When a client hires a lawyer on a contingent fee basis, the client is still free to fire the lawyer before the case is over, with or without cause. The lawyer is entitled to quantum meruit recovery for the reasonable value of the work done before the firing. However, the lawyer’s claim does not arise until the contingency comes to pass. After a lawsuit has been filed, the rules of a court may require the court’s approval for a substitution of attorneys, but this is the case regardless of whether the client’s firing of the attorney is with or without just cause. When a party wants to fire her attorney for any reason, courts almost always grant the necessary permission, but permission may be denied if a substitution of attorneys would cause undue delay or disruption.","verify":false,"id":63}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"The use of a contingent fee is usually permitted in a _________ case.","choices":[{"letter":"A","text":"Divorce"},{"letter":"B","text":"Criminal"},{"letter":"C","text":"Child support"},{"letter":"D","text":"Medical malpractice"}],"correct":"D","explanation":"The use of a contingent fee is usually permitted in a medical malpractice case. The use of a contingent fee in such a case allows a client of modest means to afford to litigate the claim. But note that some states have set statutory limits on the contingent fee percentages a lawyer can exact in personal injury, medical malpractice, and similar types of cases. A lawyer is subject to discipline for using a contingent fee arrangement when defending a person in a criminal case. A lawyer is also subject to discipline for using a contingent fee in a domestic relations case when the contingency is based on the securing of a divorce, the amount of spousal or child support, or the amount of a property settlement. However, a lawyer may use a contingent fee in a suit to recover money that is past due under a support decree.","verify":false,"id":64}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"A potential client went to a lawyer’s office and asked him to represent her in a civil case. The lawyer agreed. The client then paid the lawyer a retainer fee for his services. A lawyer-client relationship was formed at the moment __________.","choices":[{"letter":"A","text":"The client entered the lawyer’s office with intent that the lawyer represent her"},{"letter":"B","text":"The client asked the lawyer to represent her"},{"letter":"C","text":"The lawyer agreed to represent the client"},{"letter":"D","text":"The lawyer accepted the retainer fee from the client"}],"correct":"C","explanation":"A lawyer-client relationship arises when a person manifests an intent that the lawyer provide legal services and the lawyer agrees. Thus the lawyer-client relationship here was formed at the moment the lawyer agreed to represent the client. Lawyers are generally free to refuse service to any person for any reason. Just because a prospective client enters a lawyer’s office with intent that the lawyer represent her, or asks the lawyer to represent her, that is not enough to create a lawyer-client relationship. The lawyer also has to agree to provide the service. Note that a lawyer-client relationship can arise when a prospective client manifests an intent to have the lawyer represent her, and the lawyer fails to make clear that he does not want to undertake the representation, and the lawyer knows or should know that the prospective client is reasonably relying on the lawyer to provide the services. However, that is not the scenario given here. It is not necessary for payment to take place before a lawyer-client relationship is formed. Here, the lawyer agreed to represent the client and the relationship was formed at that moment, before the lawyer accepted the retainer fee from the client.","verify":false,"id":65}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"A lawyer may accept a case despite the fact that __________.","choices":[{"letter":"A","text":"The lawyer’s physical condition would materially impair his ability to represent the client"},{"letter":"B","text":"The lawyer’s personal feelings about the case are so strong that they would impair his ability to effectively represent the client"},{"letter":"C","text":"The lawyer does not have all the necessary facts at hand at the outset of the case to be certain that the lawsuit is not frivolous"},{"letter":"D","text":"The lawyer is currently too busy with other cases to handle the case competently"}],"correct":"C","explanation":"A lawyer is not required to reject a case simply because the lawyer does not have all the necessary facts at hand at the outset of the case. While it is true that a lawyer must not take a position that is either factually or legally frivolous, a position is not frivolous merely because the lawyer does not have all the facts at hand at the outset, so long as the lawyer expects to develop them during discovery. If a lawyer’s personal feelings about a case are so strong that they would impair his ability to effectively represent the client, he must refuse the case. A lawyer also must reject a case if he is too busy or too inexperienced to handle the matter competently. Finally, a lawyer must decline a case if his mental or physical condition would materially impair his ability to represent the client.","verify":false,"id":66}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Which of these is **NOT **a factor to consider in determining the reasonableness of an attorney’s fee?","choices":[{"letter":"A","text":"The reputation of the lawyer performing the services"},{"letter":"B","text":"The client’s willingness to agree to the fee"},{"letter":"C","text":"The results obtained for the client"},{"letter":"D","text":"The nature of the relationship between the lawyer and client"}],"correct":"B","explanation":"The client’s willingness to agree to the fee is not indicative of the fee’s reasonableness. In theory, an attorney and client bargain at arm’s length over the fee, but in practice many clients are inexperienced with attorneys’ fees. Thus, in fee disputes, courts strain to give the benefit of the doubt to the client and will make an independent determination as to whether a fee is reasonable, considering the factors listed below. The factors considered in determining the reasonableness of a fee are: (i) The time and labor required; (ii) The novelty and difficulty of the questions involved; (iii) The skill needed to perform the legal services properly; (iv) The likelihood, if apparent to the client, that the work for this client will preclude the lawyer from doing fee-paying work for others; (v) The fee customarily charged in the locality for similar legal work; (vi) The amount at stake and the results obtained for the client; (vii) The time limitations imposed by the client or the circumstances; (viii) The nature and length of the relationship between the lawyer and the client; (ix) The experience, reputation, and ability of the lawyer performing the services; and (x) Whether the fee is fixed or contingent (a contingent fee can be higher because it requires the lawyer to take a gamble).","verify":false,"id":67}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"What happens to a fee pre-paid to a lawyer if the lawyer is later fired or withdraws from the case?","choices":[{"letter":"A","text":"If the fee was a true retainer, the lawyer generally need not refund the fee, but if the fee was an advance, the lawyer must refund any unearned portion"},{"letter":"B","text":"The lawyer must refund any unearned portion of the fee, whether the fee paid was an advance or a true retainer"},{"letter":"C","text":"If the fee was an advance, the lawyer generally need not refund the fee, but if the fee was a true retainer, the lawyer must refund any unearned portion"},{"letter":"D","text":"The lawyer generally need not refund any fee already collected, whether the fee paid was an advance or a true retainer"}],"correct":"A","explanation":"A true retainer is money that is paid solely to ensure the availability of the lawyer, and the lawyer who is fired or withdraws generally need not refund the retainer fee. In contrast, when a lawyer requires payment in advance, she must refund any unearned part of the advance if she is later fired or withdraws.","verify":false,"id":68}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Under a(n) __________ fee agreement, the lawyer collects a fee only if the matter is resolved in the client’s favor.","choices":[{"letter":"A","text":"Contingent"},{"letter":"B","text":"True retainer"},{"letter":"C","text":"Advance"}],"correct":"A","explanation":"Under a contingent fee agreement, the lawyer collects a fee only if the matter is resolved in the client’s favor. Often, a contingent fee is expressed as a percentage of the client’s eventual recovery in the case, but it need not be; an otherwise proper contingent fee may still be proper even if there is no res, or pool of money, from which the fee can be paid. A lawyer may require her fee to be paid in advance, but she must refund any unearned part of the advance if she is fired or withdraws. A fee paid solely to ensure the availability of a lawyer is called a true retainer fee.","verify":false,"id":69}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"When a lawyer exercises a retaining lien, __________.","choices":[{"letter":"A","text":"The client pays a fee to ensure the lawyer’s availability"},{"letter":"B","text":"The lawyer holds documents, funds, and property of the client until his fee is paid"},{"letter":"C","text":"Any recovery obtained for the client serves as security for the lawyer’s fees"}],"correct":"B","explanation":"When a lawyer exercises a retaining lien, the lawyer holds documents, funds, and property of the client until his fee is paid. When a lawyer exercises a charging lien, any recovery obtained for the client serves as security for the lawyer’s fees. A retaining lien should not be confused with a true retainer fee, in which the client pays a fee to ensure the lawyer’s availability.","verify":false,"id":70}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Which of the following is an improper fee splitting arrangement?","choices":[{"letter":"A","text":"A lawyer paying a small portion of his fee to another lawyer who had recommended him to the client"},{"letter":"B","text":"A law firm paying a portion of a fee to a former partner under a separation agreement"},{"letter":"C","text":"A partner in a law firm sharing in a contingent fee earned solely by the work of an associate in the firm"},{"letter":"D","text":"Two lawyers from two different specialty firms entering into a written agreement with the client to combine their expertise and share a fee proportionate to each lawyer’s services"}],"correct":"A","explanation":"The ABA Model Rules prohibit a lawyer from paying anyone, including another lawyer, for recommending him to a client. Furthermore, the Rules do not permit fee splitting with a referring lawyer who neither assumes responsibility for a matter nor does work on the matter. A law firm may make payments to a former partner or associate under a separation agreement or retirement agreement. Two lawyers from two different specialty firms are permitted to share a fee if: (i) the total fee is reasonable; (ii) the split is in proportion to the services performed by each lawyer, or some different proportion if each lawyer assumes joint responsibility for the matter; and (iii) the client agrees to the split in a writing that discloses the share each lawyer will receive. The partners and associates within a law firm may split legal fees, even if the fee is earned solely by the work of one person in the firm. That is the essence of practice in a law firm.","verify":false,"id":71}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"If, during the course of litigation, a lawyer discovers that a client is using her services to further an illegal course of action, the lawyer must __________.","choices":[{"letter":"A","text":"Withdraw from the case and, depending on the circumstances, disaffirm her prior work on the matter to potentially alert the opposing side to her client’s wrongdoing"},{"letter":"B","text":"Continue with the case to the best of her ability, remaining silent as to the client’s impropriety so as not to violate attorney-client privilege"},{"letter":"C","text":"Reveal the details of the impropriety to the judge in chambers for advice on how to best proceed under the unique circumstances of the case"},{"letter":"D","text":"Withdraw from the case and make a full disclosure to both the court and opposing counsel of the details of her client’s impropriety so as to avoid being sanctioned"}],"correct":"A","explanation":"When a lawyer discovers that a client has begun an illegal course of action and the action is continuing, the lawyer must not assist in the wrongdoing and must withdraw from the case. Withdrawal alone is often not enough—the lawyer may have to make a “noisy withdrawal” in which she gives outsiders notice of her withdrawal and disaffirms any of her own prior opinions, documents, affirmations, or the like that the client is using to carry out the wrongdoing. The lawyer’s noisy withdrawal may potentially alert the opposing side, but this alone is not a violation of the attorney-client privilege. It would be a violation of the attorney-client privilege to reveal all the details of the client’s impropriety to the court or opposing counsel. In such circumstances, the attorney need not seek advice from the judge on how best to proceed, but should automatically withdraw from the case as discussed above. The lawyer is not free to continue with the case if it is evident that the illegal course of action is continuing.","verify":false,"id":72}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"If a client asks a lawyer to do something that is either illegal or unethical, the lawyer must __________.","choices":[{"letter":"A","text":"Refuse the request without providing any further details to the client so as to avoid any appearance of impropriety"},{"letter":"B","text":"Honor the request unless it involves a risk of harm to a third party, as it is a lawyer’s duty to act as a zealous advocate on behalf of his client"},{"letter":"C","text":"Cut all ties with the client immediately and report the improper request to the proper authorities"},{"letter":"D","text":"Consult with the client and explain why he cannot do what the client wants"}],"correct":"D","explanation":"If the client asks a lawyer to do something that is either illegal or unethical, the lawyer must consult with the client and explain why he cannot do what the client wants. He should not simply refuse the request without providing any further details, but should instead openly communicate with his client about the reasons why the request is improper. It is not necessary that the lawyer cut all ties with the client immediately based on such a request. Instead, the lawyer should explain to the client why the conduct is improper. Furthermore, it would likely be a violation of confidentiality to report a mere request to the authorities. Although a lawyer should act as a zealous advocate on behalf of his client, this ideal does not extend to illegal or unethical conduct.","verify":false,"id":73}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"In which of the following scenarios would it be mandatory for an attorney to withdraw from a case?","choices":[{"letter":"A","text":"The attorney reasonably believes that the client’s chosen course of action is criminal or fraudulent"},{"letter":"B","text":"The attorney’s physical condition materially impairs his ability to continue representing the client"},{"letter":"C","text":"The client has made the attorney’s work unreasonably difficult by refusing to cooperate with the attorney"},{"letter":"D","text":"The client insists on taking action that the attorney considers to be repugnant"}],"correct":"B","explanation":"An attorney must withdraw if the attorney’s mental or physical condition materially impairs the attorney’s ability to continue representing the client. Under this scenario, withdrawal is mandatory. An attorney may also choose to withdraw from representing a client for a variety of other reasons, but these are optional withdrawals, not mandatory. An attorney may withdraw from representing a client if the client persists in a course of action that involves the attorney’s services and that the attorney reasonably believes is criminal or fraudulent. Note that the lawyer is required to withdraw only if the client’s criminal or fraudulent conduct involves some actual assistance by the lawyer. An attorney may withdraw from representing a client if the client insists on taking action that the attorney considers repugnant or with which the lawyer has a fundamental disagreement. Finally, an attorney may also choose to withdraw from representing a client if the client has made the attorney’s work unreasonably difficult by refusing to cooperate with the attorney.","verify":false,"id":74}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"A contingent fee may be valid even if it is ________.","choices":[{"letter":"A","text":"Not based on a percentage of the amount recovered by the client"},{"letter":"B","text":"Oral"},{"letter":"C","text":"Based on the amount of alimony awarded to the client"}],"correct":"A","explanation":"A contingent fee may be valid even if it is not based on a percentage of the amount recovered by the client; an otherwise proper contingent fee may still be proper even if there is no res, or pool of money, from which the fee can be paid. A contingent fee may not be oral; it must be in writing signed by the client, and must state: (i) How the fee is to be calculated, including the percentage that the lawyer will get if the case is settled before trial, won after trial, or won after appeal; (ii) What litigation and other expenses are to be deducted from the recovery; (iii) Whether deductions for expenses will be made before or after the contingent fee is calculated; and (iv) What expenses the client must pay, whether or not she wins the case. A contingent fee is not permitted in criminal cases or domestic relations cases; hence, a fee based on the amount of alimony awarded to the client is not permitted.","verify":false,"id":75}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"What is a lawyer’s obligation if she believes that a prospective client’s motive in bringing an action is to harass the other party?","choices":[{"letter":"A","text":"The lawyer should follow her own conscience and has absolute discretion as to whether she will take the case"},{"letter":"B","text":"The lawyer may take the case provided she believes in good faith that, despite the client’s motive, the action itself is factually and legally sound"},{"letter":"C","text":"The lawyer must take the case if the action itself is factually and legally sound because it is an ethics violation to question a potential client’s motives"},{"letter":"D","text":"The lawyer must reject the case even if the action itself is factually and legally sound"}],"correct":"D","explanation":"A lawyer is subject to discipline for bringing an action, conducting a defense, asserting a position, or taking other steps if the client’s motive is to harass or maliciously injure any person. Thus, a lawyer must reject any case where she believes this is the prospective client’s motive. It is not an ethics violation to question a potential client’s motives. Furthermore, even if the lawyer believes in good faith that the action itself is factually and legally sound, she must reject the case if the client’s motive is harassment. She is not free to follow her own conscience and use her own discretion as to whether to take the case.","verify":false,"id":76}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"A lawyer may properly bill a client for all of the following, **EXCEPT: **","choices":[{"letter":"A","text":"Overhead expenses associated with staffing, equipping, and running the attorney’s office"},{"letter":"B","text":"Travel time to and from depositions"},{"letter":"C","text":"Incidental costs such as photocopying, long distance calls, and computer research associated with the case"},{"letter":"D","text":"Services provided by third parties, such as court reporters, travel agents, and expert witnesses"}],"correct":"A","explanation":"An attorney must disclose the basis on which a client will be charged for legal services and expenses, and the attorney’s bill should clearly show how the amount due has been computed. An attorney must not charge the client for ordinary overhead expenses associated with staffing, equipping, and running the attorney’s office. An attorney may charge a client for the actual cost to the attorney of special services, such as photocopying, long distance calls, computer research, etc. An attorney may charge a client for services provided by third parties, such as court reporters, travel agents, and expert witnesses, but must not charge the client more than her actual cost. An attorney may charge for travel time, such as to and from depositions, but the attorney must not “double bill” her time. For example, if she works on another client’s case while on the airplane to a deposition, she may not bill both clients for both the travel and the work.","verify":false,"id":77}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"May a lawyer accept property as payment for services?","choices":[{"letter":"A","text":"No, because such an arrangement is a conflict of interest"},{"letter":"B","text":"Yes, provided that it does not involve a proprietary interest in the cause of action or subject of litigation"},{"letter":"C","text":"Yes, this is always a permissible arrangement"}],"correct":"C","explanation":"A lawyer may accept property in return for services (e.g., an ownership interest in a business), provided that this does not involve a proprietary interest in the cause of action or subject of litigation contrary to ABA Model Rules. Such an arrangement is subject to scrutiny as a conflict of interest because it may be a business transaction between the lawyer and the client, but it is not always impermissible.","verify":false,"id":78}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"Two lawyers from different law firms want to work together on a matter for a client. Which of the following is **NOT ALWAYS REQUIRED** for a proper fee splitting arrangement between lawyers at a different firm?","choices":[{"letter":"A","text":"The client must agree to the split in a writing that discloses the share each lawyer will receive"},{"letter":"B","text":"The total fee must be reasonable"},{"letter":"C","text":"The split must be in proportion to the services provided by each lawyer"}],"correct":"C","explanation":"Two lawyers from different law firms can agree to split a fee if (i) the total fee is reasonable; (ii) the client agrees to the split in a writing that discloses the share each lawyer will receive; and (iii) the split is in proportion to the services performed by each lawyer, **OR** some different proportion if each lawyer assumes joint responsibility for the matter. Thus, the split need not be in proportion to each lawyer's services if both lawyers assume joint responsibility for the matter.","verify":false,"id":79}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"What is a lawyer’s duty regarding confidential information supplied by a client with diminished capacity who faces a risk of substantial physical, financial, or other harm?","choices":[{"letter":"A","text":"The lawyer has implied authority to reveal the client’s confidential information, but only to the extent necessary to protect the client"},{"letter":"B","text":"The lawyer has the discretion to use the information as he sees fit to best serve the client, because a client with diminished capacity has no expectation of privacy"},{"letter":"C","text":"The lawyer must keep the client’s information confidential at all times, unless he has petitioned a court for express authority to reveal the information"},{"letter":"D","text":"The lawyer remains under an ethical duty to keep the client’s information confidential at all times"}],"correct":"A","explanation":"When a client has diminished capacity and faces a risk of substantial physical, financial, or other harm, the lawyer may take reasonable actions to protect the client. When taking protective action, the lawyer has implied authority to reveal the client’s confidential information, but only to the extent necessary to protect the client. These actions include consulting with people or entities that can protect the client, and, when appropriate, seeking the appointment of a guardian or similar surrogate. The lawyer remains under a general ethical duty to keep the client’s information confidential, but NOT at all times, such as the case here when the client is facing a risk of substantial physical, financial, or other harm. It is not necessary for the lawyer to petition a court for express authority to reveal the information, because in such a situation the lawyer has the implied authority to act as necessary to protect the client from substantial harm. It is incorrect to state that a client with diminished capacity has no expectation of privacy. The lawyer has a duty, so far as reasonably possible, to maintain a normal lawyer-client relationship with the client. The lawyer must treat the client with attention and respect.","verify":false,"id":80}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"When may a lawyer properly choose to delay transmission of pertinent information to her client?","choices":[{"letter":"A","text":"When necessary to best serve the interests of a third party"},{"letter":"B","text":"When the lawyer believes that the client would be likely to react imprudently to the information"},{"letter":"C","text":"Never, because a lawyer is under a strict duty to transmit all pertinent information to her client immediately"},{"letter":"D","text":"When transmitting the information would be inconvenient to the lawyer"}],"correct":"B","explanation":"A lawyer may delay the transmission of information to a client if the client would be likely to react imprudently to an immediate communication. For example, if a lawyer fears a client may become suicidal upon hearing the information, the lawyer may choose to keep the information from the client until the client is in a different mental state. Thus, it is incorrect to state that the lawyer may never withhold information from a client. As discussed above, in some instances, it may be necessary for the lawyer to do so. In addition, a court rule or order may also forbid a lawyer from sharing certain information with a client, and the lawyer must comply with such a rule or order. The lawyer must not, however, withhold information from a client solely to serve the lawyer’s or a third person’s interest or convenience.","verify":false,"id":81}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"A lawyer __________ withdraw from representing a client if the representation will require the lawyer to violate a law or disciplinary rule; a lawyer __________ withdraw from a case if a client’s criminal or fraudulent conduct involves some assistance by the lawyer.","choices":[{"letter":"A","text":"Must; may"},{"letter":"B","text":"Must; must"},{"letter":"C","text":"May; must"},{"letter":"D","text":"May; may"}],"correct":"B","explanation":"If the representation will require the attorney to violate a law or a disciplinary rule, the attorney must withdraw. Similarly, if the client’s criminal or fraudulent conduct involves some assistance by the lawyer, then the lawyer must withdraw. A lawyer may withdraw from representing a client if the client persists in a course of action that involves the lawyer’s services and that the lawyer reasonably believes is criminal or fraudulent. An attorney may also choose to withdraw from representing a client if the client has used the attorney’s services to commit a past crime or fraud.","verify":false,"id":82}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"If a lawyer encounters a nonclient with seriously diminished capacity in a situation that risks imminent and irreparable harm to the nonclient’s health, safety, or financial interest, the lawyer __________.","choices":[{"letter":"A","text":"May only take legal action to assist the nonclient after receiving court approval, because the nonclient is incapable of entering into a lawyer-client relationship"},{"letter":"B","text":"May take legal action on behalf of the nonclient and collect a reasonable fee for his services, because a lawyer-client relationship can be presumed in an emergency situation"},{"letter":"C","text":"May only take nonlegal action to assist the nonclient because no lawyer-client relationship has been established"},{"letter":"D","text":"May take legal action on behalf of the nonclient as if that person were his client, but should not seek any compensation for his services"}],"correct":"D","explanation":"When a person with seriously diminished capacity faces imminent and irreparable harm to her health, safety, or financial interest, a lawyer may take legal action on her behalf, despite her inability to establish a lawyer-client relationship or to make or express considered judgments about the matter. However, the lawyer cannot act until the person (or someone acting on her behalf) has consulted the lawyer, and the lawyer should not act unless he reasonably believes the person has no other representative available. Any action undertaken should be limited to that which is reasonably necessary to maintain the status quo or otherwise avoid imminent and irreparable harm. Normally, a lawyer would not seek compensation for emergency actions taken on behalf of a nonclient. A lawyer who represents a person in such emergency circumstances has the same duties as he would with respect to a client, but this does not mean that an official lawyer-client relationship is presumed. Steps should be taken to regularize the relationship as soon as possible. It is incorrect to state that the lawyer may only take nonlegal action to assist the nonclient because no lawyer-client relationship has been established. As stated above, the lawyer can take emergency legal actions when warranted despite the lack of a lawyer-client relationship, and the lawyer need not wait for court approval to act.","verify":false,"id":83}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"When must a lawyer reject a potential client?","choices":[{"letter":"A","text":"When the client cannot currently provide enough facts to support his case"},{"letter":"B","text":"When the client’s motive is harassment"},{"letter":"C","text":"When the client’s case clearly is unsupported by current law"},{"letter":"D","text":"When the client’s cause is unpopular"}],"correct":"B","explanation":"A lawyer is subject to discipline for bringing an action, conducting a defense, asserting a position, or taking other steps if the client’s motive is to harass or maliciously injure any person. Thus, a lawyer must reject any case where he believes that harassment is the prospective client’s motive. A lawyer who is serving as an advocate in a legal proceeding must not take a position that is either factually or legally frivolous. A position is not frivolous if the lawyer can make a good faith argument that the facts are as claimed or that the present law should be changed. Thus even if a client’s case clearly is unsupported by current law, a lawyer may bring an action arguing for a change of law. Furthermore, a position is not frivolous merely because the client cannot currently provide enough facts to support a case, as the lawyer can attempt to develop the facts during discovery. Lawyers have an ethical obligation to help make legal service available to all who need it and thus should not reject a client simply because the client’s cause is unpopular.","verify":false,"id":84}, {"topic":"Regulation","stem":"A business attorney entered into a partnership with a certified public accountant. The partnership provided legal and accounting services to business clients. The attorney performed only the legal work and the accountant performed only accounting work authorized as a CPA.\n\nIs the attorney subject to discipline?","choices":[{"letter":"A","text":"Yes, because some activities of the partnership consisted of the practice of law."},{"letter":"B","text":"Yes, because lawyers may not form partnerships with nonlawyers."},{"letter":"C","text":"No, because the accountant performed only work authorized as a CPA."},{"letter":"D","text":"No, because the attorney made reasonable efforts to ensure no interference with professional obligations."}],"correct":"A","explanation":"A lawyer may not form a partnership with a nonlawyer if ANY of the partnership activities consist of the practice of law (ABA 5.4(b)). The ban is not on all lawyer-nonlawyer partnerships (a lawyer could partner with a CPA in a pure accounting venture) — it is triggered because this partnership provides legal services. That makes A more precise than B.","style":"Professor","verify":false,"id":85}, {"topic":"Regulation","stem":"A partner in a law firm charged personal expenses to a client and submitted fraudulent billing. Another lawyer in the firm learned of the conduct. The partner rectified the damage to the client.\n\nMust the other lawyer report the partner to the disciplinary authority?","choices":[{"letter":"A","text":"Yes, a lawyer must report all violations of the Rules."},{"letter":"B","text":"Yes, because the conduct raises a substantial question as to the partner’s honesty, trustworthiness, or fitness."},{"letter":"C","text":"No, because the partner rectified the damage to the client."},{"letter":"D","text":"No, because of a continuing fiduciary duty to the partner."}],"correct":"B","explanation":"Rule 8.3(a): a lawyer who KNOWS of a violation raising a SUBSTANTIAL QUESTION as to honesty, trustworthiness, or fitness must inform the appropriate authority. Fraudulent billing is squarely that. Rectifying the harm does not erase the reporting duty, and there is no fiduciary-duty exception between law partners. A overstates the rule — not ALL violations are reportable.","style":"Professor","verify":false,"id":86}, {"topic":"Regulation","stem":"A trial judge has become increasingly abusive — throwing a gavel and behaving rudely toward litigants. An attorney who practices before the judge files automatic substitutions to avoid the judge but does not inform the authorities about the judge’s conduct.\n\nIs the attorney subject to discipline?","choices":[{"letter":"A","text":"Yes, because the attorney failed to inform the authorities about the judge’s conduct."},{"letter":"B","text":"Yes, because the automatic substitutions undermined public confidence in the judiciary."},{"letter":"C","text":"No, because the attorney has a duty to represent clients zealously."},{"letter":"D","text":"No, because the judge may not be reelected."}],"correct":"A","explanation":"Rule 8.3(b): a lawyer who knows a judge has committed a violation of judicial conduct rules raising a substantial question as to the judge’s fitness for office MUST inform the appropriate authority. Throwing objects and abusing litigants qualifies. Avoiding the judge through substitutions does not discharge the reporting duty.","style":"Professor","verify":false,"id":87}, {"topic":"Client-Lawyer","stem":"An attorney’s standard retainer agreement requires the client to release the attorney from all malpractice claims in exchange for the attorney agreeing to return the client’s file at the end of representation. The attorney uses this preprinted form for all retainers.\n\nIs the arrangement proper?","choices":[{"letter":"A","text":"Yes, because the attorney furnished consideration by agreeing to return the client’s file."},{"letter":"B","text":"Yes, because the attorney reasonably believes the fee is fair and the work will be competent."},{"letter":"C","text":"No, because the attorney is attempting to prospectively limit liability for malpractice."},{"letter":"D","text":"No, because the attorney uses a preprinted form for all retainers."}],"correct":"C","explanation":"Rule 1.8(h)(1): a lawyer shall not make an agreement prospectively limiting malpractice liability unless the client is independently represented in making it. A boilerplate release in a retainer is the classic violation. (And the \"consideration\" is illusory anyway — the client is entitled to the file.) Note for Cal Bar essays: CA 1.8.8 bans prospective limits entirely, with no independent-representation exception.","style":"Professor","verify":false,"id":88}, {"topic":"Client-Lawyer","stem":"A client asked an attorney to submit a bid on land. The attorney left a message with the client’s secretary asking the client to return the call as soon as possible. The client returned the call 15 days later, by which time the owner had accepted another bid. The attorney made no additional efforts to contact the client.\n\nWas the attorney’s conduct proper?","choices":[{"letter":"A","text":"Yes, because the attorney left a message with the client’s secretary to return the call as soon as possible."},{"letter":"B","text":"Yes, because the attorney did not know the client would be willing to offer $350,000."},{"letter":"C","text":"No, because the attorney made no additional efforts to contact the client."},{"letter":"D","text":"No, because the attorney did not make a higher offer on behalf of the client."}],"correct":"C","explanation":"Rule 1.4 requires the lawyer to promptly inform the client of matters requiring informed consent and keep the client reasonably informed. With a time-sensitive bid at stake, one message and 15 days of silence is not reasonable communication — the lawyer must make reasonable further efforts. D is wrong because bidding higher without authorization would exceed the lawyer’s authority (1.2).","style":"Professor","verify":false,"id":89}, {"topic":"Client-Lawyer","stem":"A client facing criminal charges asked an attorney to represent him only through the grand jury stage for a flat fee, because that was all he could afford. The attorney agreed.\n\nIs the limited-scope arrangement proper?","choices":[{"letter":"A","text":"Yes, because the client suggested the arrangement."},{"letter":"B","text":"Yes, because the attorney and the client may agree to limit the scope of representation if the limitation is reasonable under the circumstances."},{"letter":"C","text":"No, because the attorney should not limit scope based on the client’s ability to pay."},{"letter":"D","text":"No, because the scope of representation may not be limited in a criminal case."}],"correct":"B","explanation":"Rule 1.2(c): a lawyer may limit the scope of representation if the limitation is reasonable under the circumstances and the client gives informed consent. Representation through a discrete stage of a criminal proceeding can be a reasonable limitation. A states the wrong reason — who suggested it doesn’t control; reasonableness + informed consent do.","style":"Professor","verify":false,"id":90}, {"topic":"Client-Lawyer","stem":"A lawyer began representing a company immediately upon engagement. A few days later, the lawyer disclosed the customary hourly fee and expense arrangement. The fee agreement was never confirmed in writing.\n\nIs the lawyer subject to discipline?","choices":[{"letter":"A","text":"Yes, because the lawyer did not disclose the basis of the fee before commencing the representation."},{"letter":"B","text":"Yes, because the lawyer did not confirm the fee agreement in writing."},{"letter":"C","text":"No, because the lawyer disclosed the basis of the fee within a reasonable time after commencing the representation."},{"letter":"D","text":"No, because the lawyer was not required to advise the client of the customary hourly fee unless requested."}],"correct":"C","explanation":"Rule 1.5(b): the basis or rate of the fee must be communicated to the client, PREFERABLY IN WRITING, before or WITHIN A REASONABLE TIME AFTER commencing the representation. A few days qualifies. Writing is preferred but not required for standard hourly fees (contrast contingent fees, which MUST be written and signed). Cal Bar contrast: CA generally requires written fee agreements over $1,000.","style":"Professor","verify":false,"id":91}, {"topic":"Client-Lawyer","stem":"A lawyer agreed to a 30% contingent fee in a personal injury case. Later, without any special circumstances, the lawyer told the client the fee would have to be 35%, offering to help the client find another experienced lawyer at the original rate if she refused. The client reluctantly agreed, but after recovery refused to pay more than 30%.\n\nWill the lawyer prevail in collecting 35%?","choices":[{"letter":"A","text":"Yes, because the lawyer offered to find another experienced lawyer at the original rate."},{"letter":"B","text":"Yes, because a contingent fee of 35% is reasonable."},{"letter":"C","text":"No, because the lawyer did not suggest the client seek independent counsel before agreeing."},{"letter":"D","text":"No, because there were no special circumstances justifying the fee increase."}],"correct":"D","explanation":"Mid-representation fee increases are scrutinized as dealings between fiduciary and client. Absent special circumstances justifying modification (e.g., a genuinely changed scope of work), an extracted increase is unenforceable — the client’s \"agreement\" under pressure doesn’t cure it. The lawyer collects the original 30%.","style":"Professor","verify":false,"id":92}, {"topic":"Client-Lawyer","stem":"A lawyer received $1,000,000 in settlement funds for a client but deliberately delayed notifying the client and turning over the funds for a week, believing the delay served the client’s interests in avoiding an impulsive purchase. The client did not object.\n\nIs the lawyer subject to discipline?","choices":[{"letter":"A","text":"Yes, because the lawyer had a duty to promptly notify the client of the receipt of the funds."},{"letter":"B","text":"Yes, because the lawyer gave unsolicited advice about nonlegal matters."},{"letter":"C","text":"No, because the client did not object."},{"letter":"D","text":"No, because the lawyer acted in the client’s best interest."}],"correct":"A","explanation":"Rule 1.15(d): upon receiving funds in which a client has an interest, the lawyer must PROMPTLY NOTIFY the client and PROMPTLY DELIVER what the client is entitled to receive. Paternalistic motives don’t suspend the duty — the money is the client’s. Silence afterward is not consent.","style":"Professor","verify":false,"id":93}, {"topic":"Client-Lawyer","stem":"A lawyer collected advance fees and deposited them in the client trust account, then transferred funds for fees not yet earned into the general office account, reasonably believing she would spend 25 additional hours on the case. She later transferred $200 owed to the client back to the trust account.\n\nIs the lawyer subject to discipline?","choices":[{"letter":"A","text":"Yes, because the lawyer accepted legal fees in advance of performing the work."},{"letter":"B","text":"Yes, because the lawyer transferred funds for unearned fees to the general office account."},{"letter":"C","text":"No, because the lawyer transferred the $200 owed to the client from the general office account to the client trust account."},{"letter":"D","text":"No, because the lawyer reasonably believed she would spend 25 additional hours on the case."}],"correct":"B","explanation":"Advance fees belong in the trust account UNTIL EARNED (Rule 1.15(c)). Withdrawing fees before the work is performed — however confident the lawyer is about future hours — is taking the client’s money. Accepting advances is itself fine (A is wrong); the violation is the premature transfer.","style":"Professor","verify":false,"id":94}, {"topic":"Client-Lawyer","stem":"A lawyer agreed to handle a bankruptcy matter pro bono but badly underestimated the time required. Citing the burden on her practice, she withdrew before the bankruptcy petition was filed, and found other ways to satisfy her pro bono obligation.\n\nWas the withdrawal proper?","choices":[{"letter":"A","text":"Yes, because the lawyer withdrew before the bankruptcy petition was filed."},{"letter":"B","text":"Yes, because the lawyer found other ways to satisfy her pro bono obligation."},{"letter":"C","text":"No, because the lawyer withdrew without good cause."},{"letter":"D","text":"No, because the lawyer had no prior bankruptcy experience and could not reliably estimate the time required."}],"correct":"C","explanation":"Underestimating the time a matter takes is not \"good cause\" for permissive withdrawal — 1.16(b) requires either no material adverse effect on the client, or grounds like unreasonable financial burden (a higher bar than inconvenience). A lawyer’s misjudgment of workload is the lawyer’s risk. VERIFY with professor — confirm this matches the discussed answer.","verify":true,"style":"Professor","id":95}, {"topic":"Client-Lawyer","stem":"During settlement negotiations, an attorney agreed to a $5,000 settlement without checking with the client. The client later objected.\n\nIs the client bound by the settlement?","choices":[{"letter":"A","text":"Yes, because settlement is a procedural tactic left to the attorney."},{"letter":"B","text":"Yes, because the lawyer acted with apparent authority."},{"letter":"C","text":"No, because accepting a settlement offer is ultimately the client’s decision."},{"letter":"D","text":"No, because the client did not ratify the settlement agreement."}],"correct":"C","explanation":"Rule 1.2(a): whether to SETTLE a civil matter is the CLIENT’S decision, full stop. It is an objective, not a means. The lawyer had no actual authority, and mere retention of a lawyer generally does not clothe the lawyer with apparent authority to settle. (BA crossover: this is your authority-ladder analysis wearing a PR hat.)","style":"Professor","verify":false,"id":96}, {"topic":"Confidentiality","stem":"A client under indictment for homicide confessed to his attorney that he committed two other unrelated murders and drew a map of the grave locations. Authorities are searching for the victims.\n\nMust (or may) the attorney disclose the information?","choices":[{"letter":"A","text":"Yes, as an officer of the court the attorney must disclose prior crimes."},{"letter":"B","text":"Yes, because the attorney is impeding access to significant evidence."},{"letter":"C","text":"No, because the attorney did not represent or advise the client regarding the prior crimes."},{"letter":"D","text":"No, because the information was obtained in the course of the representation."}],"correct":"D","explanation":"Information about COMPLETED past crimes is protected by the duty of confidentiality — it relates to the representation, and no exception applies: there is no threat of FUTURE death or substantial bodily harm to prevent. (The famous Lake Pleasant / Belge scenario.) C states the wrong reason — protection doesn’t depend on the subject matter being within the engagement.","style":"Professor","verify":false,"id":97}, {"topic":"Confidentiality","stem":"An attorney represented two clients, each of whom paid in cash. Some of the bills turned out to be counterfeit, but the attorney cannot know which client passed them. A grand jury subpoena asks the attorney to identify who gave the bills.\n\nMay the attorney name both clients?","choices":[{"letter":"A","text":"Yes, because negotiation of a counterfeit bill is a criminal act."},{"letter":"B","text":"Yes, because neither client’s identity is privileged under these circumstances."},{"letter":"C","text":"No, because counterfeiting does not threaten imminent death or substantial bodily harm."},{"letter":"D","text":"No, because the attorney cannot know which client gave the counterfeit bills."}],"correct":"B","explanation":"Client IDENTITY and fee information are generally NOT privileged — the privilege protects confidential communications for legal advice, not the fact of representation or how the fee was paid. A subpoena is compelled process; the attorney may (and must, absent privilege) identify both clients. The triangle matters here: this is PRIVILEGE analysis (court compulsion), not the broader ethics duty.","style":"Professor","verify":false,"id":98}, {"topic":"Conflicts","stem":"A lawyer represents two criminal co-defendants, Able and Baker. Able now wants to plead guilty and testify against Baker.\n\nWhat is the lawyer’s proper course of action?","choices":[{"letter":"A","text":"Request court approval to withdraw from representing both clients."},{"letter":"B","text":"Continue with Baker; withdraw from Able with Able’s consent and court approval."},{"letter":"C","text":"Continue with Able; withdraw from Baker with Baker’s consent and court approval."},{"letter":"D","text":"Continue to represent both, but do not call Able as a witness."}],"correct":"A","explanation":"When jointly represented co-defendants turn on each other, the conflict is non-consentable — one client’s claim is now directly adverse to the other in the SAME proceeding (1.7(b)(3)). The lawyer holds confidences of EACH that would be weaponized against the other no matter which client she keeps. Withdrawal from both is required. VERIFY with professor — confirm this matches the discussed answer.","verify":true,"style":"Professor","id":99}, {"topic":"Conflicts","stem":"A lawyer represents a tenants’ association. She regularly updates the association’s president and board, but does not inform all individual tenants until a settlement offer arrives.\n\nIs she subject to discipline?","choices":[{"letter":"A","text":"Yes, because she did not advise the members about potential conflicts."},{"letter":"B","text":"Yes, because she did not periodically inform all members."},{"letter":"C","text":"No, because she kept the association’s officials informed."},{"letter":"D","text":"No, because there is no duty to report until a reasonable settlement is proposed."}],"correct":"C","explanation":"Rule 1.13: the client is the ORGANIZATION, acting through its duly authorized constituents. Communicating with the president and board satisfies the 1.4 duty — individual members are not the client. (This is your Organization-as-Client card doing MBE work.)","style":"Professor","verify":false,"id":100}, {"topic":"Conflicts","stem":"A lawyer representing 10 plaintiffs received a $500,000 lump-sum settlement offer. She told each plaintiff the total amount, that plaintiff’s individual share, and the basis for the division — but not what the other plaintiffs would receive. Each agreed.\n\nIs she subject to discipline?","choices":[{"letter":"A","text":"Yes, for aiding the railroad in making a lump-sum settlement."},{"letter":"B","text":"Yes, because each plaintiff must know what every other plaintiff will receive."},{"letter":"C","text":"No, because disclosure might jeopardize the settlement."},{"letter":"D","text":"No, because the division was fair and each plaintiff agreed."}],"correct":"B","explanation":"Rule 1.8(g): an aggregate settlement requires each client’s informed written consent after disclosure of the EXISTENCE AND NATURE OF ALL claims and the PARTICIPATION OF EACH PERSON in the settlement. Telling each plaintiff only their own share is precisely the violation — every client must see what every other client gets.","style":"Professor","verify":false,"id":101}, {"topic":"Conflicts","stem":"A firm formally ended its representation of a credit union. Later, a national bank asked the firm to represent it in a shopping-mall lease dispute against the credit union — a matter unrelated to the firm’s prior credit union work.\n\nIs the firm subject to discipline for taking the matter?","choices":[{"letter":"A","text":"Yes, because the firm dropped the credit union to represent more lucrative clients."},{"letter":"B","text":"Yes, because the firm is representing the bank in a matter directly adverse to the credit union."},{"letter":"C","text":"No, because the bank’s matter is not substantially related to the firm’s prior credit union work."},{"letter":"D","text":"No, because the firm sent a letter ending the representation."}],"correct":"C","explanation":"Once the credit union became a FORMER client, Rule 1.9 controls: the firm is barred only from materially adverse representation in the SAME OR A SUBSTANTIALLY RELATED matter. An unrelated lease dispute clears that test. (If the credit union were still a CURRENT client, 1.7’s directly-adverse rule would bar it — the current/former line is the whole question. Watch for \"hot potato\" facts: a firm cannot DROP a current client to take an adverse one, but here the representation had already ended.)","style":"Professor","verify":false,"id":102}, {"topic":"Conflicts","stem":"A lawyer is asked to represent a tenant against a landlord. The lawyer’s associate’s sibling represents the landlord. The associate is screened from the matter, and the tenant consents after full disclosure.\n\nIs it proper for the lawyer to accept the representation?","choices":[{"letter":"A","text":"Yes, because the associate’s conflict is personal and is not imputed to the lawyer."},{"letter":"B","text":"Yes, because the landlord did not object."},{"letter":"C","text":"No, because the associate’s disqualification is imputed to the lawyer."},{"letter":"D","text":"No, because the lawyer did not advise the tenant to seek independent counsel before consenting."}],"correct":"A","explanation":"A conflict arising from a lawyer’s PERSONAL INTEREST (here, a family relationship with opposing counsel) is NOT imputed to the firm where it poses no significant risk of materially limiting the others’ work (Rule 1.10(a)(1)). The associate’s sibling tie doesn’t infect the supervising lawyer, and the client consented with disclosure.","style":"Professor","verify":false,"id":103}, {"topic":"Conflicts","stem":"Years ago, while a government lawyer for the Department of Transportation, a lawyer performed a title search on a parcel and recalls a confidential internal memo arguing against the proposed highway route. Now in private practice, she is asked by the parcel’s landowner to represent him in fighting the condemnation.\n\nWhat is the proper course of action?","choices":[{"letter":"A","text":"Represent the landowner on damages only and do not disclose the confidential information."},{"letter":"B","text":"Represent the landowner and use the environmental-impact information to stop the condemnation."},{"letter":"C","text":"Refuse the representation but disclose the information to the landowner."},{"letter":"D","text":"Refuse the representation and do not disclose the information."}],"correct":"D","explanation":"Rule 1.11: a former government lawyer who possesses CONFIDENTIAL GOVERNMENT INFORMATION about a person/matter may not represent a private client whose interests are adverse where the information could be used to that person’s material disadvantage — and the confidential information stays confidential. Both representing AND disclosing are barred. Only D does both halves.","style":"Professor","verify":false,"id":104}, {"topic":"Conflicts","stem":"Before entering private practice, a former judge once entered an administrative order changing the courtroom in which a case would be heard. After the case was remanded years later, a party asked the now-practicing lawyer to try it.\n\nIs the lawyer subject to discipline for accepting?","choices":[{"letter":"A","text":"Yes, because she acted officially as a judge in an aspect of the case."},{"letter":"B","text":"Yes, because she would be trying a case before the court on which she previously sat."},{"letter":"C","text":"No, because she did not act on a substantial matter going to the merits."},{"letter":"D","text":"No, because the information she learned was a matter of public record."}],"correct":"C","explanation":"Rule 1.12 disqualifies a former judge only from matters in which she participated PERSONALLY AND SUBSTANTIALLY. A purely administrative order — changing the courtroom — is not substantial participation on the merits. The gate is \"personally and substantially,\" the same standard as 1.11, and it is not tripped by ministerial acts.","style":"Professor","verify":false,"id":105}, {"topic":"Confidentiality","style":"BARBRI","stem":"Which of the following statements is correct?","choices":[{"letter":"A","text":"The attorney-client privilege protects only confidential communications, whereas the ethical duty of confidentiality applies to all information that relates to the representation of the client"},{"letter":"B","text":"Both the attorney-client privilege and the ethical duty of confidentiality apply to all information that relates to the representation of the client"},{"letter":"C","text":"Both the attorney-client privilege and the ethical duty of confidentiality protect only confidential communications"},{"letter":"D","text":"The ethical duty of confidentiality protects only confidential communications, whereas the attorney-client privilege applies to all information that relates to the representation of the client"}],"correct":"A","explanation":"The ethical duty of confidentiality covers more kinds of information than the attorney-client privilege. The attorney-client privilege protects only confidential communications between the attorney and client (or the agents of either of them). The ethical duty, in contrast, covers not only confidential communications, but also any other information that the attorney obtains relating to the representation of the client, no matter what the source of that information. The ethical duty thus applies to all information that relates to the representation of the client, regardless of whether it is privileged, whether the client asked for it to be kept in confidence, and whether revealing it might harm or embarrass the client.","verify":false,"id":106}, {"topic":"Confidentiality","style":"BARBRI","stem":"What is the definition of a \"client\" with respect to the attorney-client privilege?","choices":[{"letter":"A","text":"A person or entity that has entered into a written contract with an attorney for legal services"},{"letter":"B","text":"A person or entity already involved in an attorney-client relationship with an attorney"},{"letter":"C","text":"A person or entity that has paid for an attorney's services"},{"letter":"D","text":"A person or entity that seeks legal services from an attorney"}],"correct":"D","explanation":"When discussing the attorney-client privilege, the term \"client\" means a person or entity that seeks legal services from an attorney. The privilege covers preliminary communications leading up to an attorney-client relationship, even if no attorney-client relationship develops. It is not necessary that the client have entered into a written contract or paid for the attorney's services.","verify":false,"id":107}, {"topic":"Confidentiality","style":"BARBRI","stem":"What is considered a \"communication\" with respect to the attorney-client privilege?","choices":[{"letter":"A","text":"Only information passed directly between the attorney and the client"},{"letter":"B","text":"Any information passed from the client or the client's agent to the attorney or the attorney's agent, and any information passed from the attorney or the attorney's agent to the client or the client's agent"},{"letter":"C","text":"Only information passed from the client or the client's agent to the attorney or the attorney's agent"},{"letter":"D","text":"Only information passed from the attorney or the attorney's agent to the client or the client's agent"}],"correct":"B","explanation":"When discussing the attorney-client privilege, the term \"communication\" covers information passed from the client to the attorney and from the attorney to the client. It also covers information passed to or from the agents of either the attorney or the client. Thus, the information does not have to pass directly between the attorney and the client to be covered.","verify":false,"id":108}, {"topic":"Confidentiality","style":"BARBRI","stem":"What is required for a communication to be deemed \"confidential\"?","choices":[{"letter":"A","text":"The communicating person must reasonably believe that no outsider will hear the contents of the statement"},{"letter":"B","text":"The communicating person must reasonably believe that no outsider will hear the contents of the statement, and in fact no outsider hears the contents of the statement"},{"letter":"C","text":"The communicating person must state that the communication is to be considered confidential"},{"letter":"D","text":"The communicating person must state that the communication is to be considered confidential and in fact no outsider hears the contents of the statement"}],"correct":"A","explanation":"For a communication to be deemed confidential, it must have been made by a means not intended to disclose the communicated information to outsiders, and the communicating person must reasonably believe that no outsider will hear the contents of the statement. There is no requirement that the communicating person state that the communication is to be considered confidential. Under modern evidence law, the presence of an unsuspected eavesdropper no longer destroys confidentiality, so it is not a requirement that no outsider actually hears the contents.","verify":false,"id":109}, {"topic":"Confidentiality","style":"BARBRI","stem":"The attorney-client privilege exists for the benefit of __________.","choices":[{"letter":"A","text":"Either the client or the attorney, depending on the nature of the privileged material"},{"letter":"B","text":"The client only"},{"letter":"C","text":"Both the client and the attorney"},{"letter":"D","text":"The attorney only"}],"correct":"B","explanation":"The attorney-client privilege exists for the benefit of the client only. The client is the \"holder\" of the privilege and the client is the one who can claim or waive the privilege. The attorney-client privilege is not for the benefit of the attorney, regardless of the nature of the privileged material. Note that the attorney has a duty to invoke the privilege on the client's behalf unless the client has waived the privilege.","verify":false,"id":110}, {"topic":"Confidentiality","style":"BARBRI","stem":"When is \"confidential\" information no longer considered confidential?","choices":[{"letter":"A","text":"When the information becomes known by a nonprivileged third person"},{"letter":"B","text":"When the information is revealed in the presence of a nonprivileged third person"},{"letter":"C","text":"When the information becomes generally known"},{"letter":"D","text":"When the attorney voluntarily discloses it"}],"correct":"C","explanation":"\"Confidential\" information is no longer considered confidential when the information becomes generally known. Unlike the attorney-client privilege, the presence of a nonprivileged third person does not necessarily destroy an attorney's duty of confidentiality. Furthermore, confidential information remains confidential even if the information is actually known by a nonprivileged third person.","verify":false,"id":111}, {"topic":"Confidentiality","style":"BARBRI","stem":"An attorney may reveal a client's confidential information in all of the following cases, EXCEPT:","choices":[{"letter":"A","text":"As is necessary to obtain legal ethics advice for the attorney"},{"letter":"B","text":"To the extent that the lawyer reasonably believes necessary to prevent reasonably certain death or substantial bodily harm to the client or a third party"},{"letter":"C","text":"To the extent necessary to protect the attorney's interests in a dispute that involves the conduct of the attorney"},{"letter":"D","text":"To the extent that the lawyer reasonably believes necessary to prevent any financial injury to the client or a third party"}],"correct":"D","explanation":"There is no exception to the duty of confidentiality that allows an attorney to reveal a client's confidential information simply to prevent any financial injury to the client or a third party. An attorney may reveal confidential information to prevent a client's crime or fraud reasonably certain to cause substantial financial harm if the client used the lawyer's services, but not merely to prevent any financial harm. An attorney may reveal information to prevent reasonably certain death or substantial bodily harm, to protect the attorney's interests in a dispute, or to obtain legal ethics advice.","verify":false,"id":112}, {"topic":"Confidentiality","style":"BARBRI","stem":"An attorney's duty to preserve a client's confidential information __________.","choices":[{"letter":"A","text":"Does not cease when the representation ends"},{"letter":"B","text":"Ceases upon the death of the client"},{"letter":"C","text":"Ceases if the client fires the attorney"},{"letter":"D","text":"Ceases when all pending cases have ended, including any possible appeals"}],"correct":"A","explanation":"An attorney's duty to preserve a client's confidential information does not cease when the representation ends. It also does not cease upon the death of the client or if the client fires the attorney.","verify":false,"id":113}, {"topic":"Confidentiality","style":"BARBRI","stem":"__________ prevent(s) a court from compelling the revelation of confidential communications between an attorney and client.","choices":[{"letter":"A","text":"Both the attorney-client privilege and the ethical duty of confidentiality"},{"letter":"B","text":"The attorney-client privilege"},{"letter":"C","text":"The ethical duty of confidentiality"},{"letter":"D","text":"Neither — courts can always compel disclosure"}],"correct":"B","explanation":"The attorney-client privilege prevents a court, or other governmental tribunal, from using the twin powers of subpoena and contempt to compel the revelation of confidential communications between an attorney and a client. In contrast, the ethical duty of confidentiality prohibits an attorney from voluntarily revealing information relating to the representation of a client — it applies in every context where the attorney-client privilege does not apply.","verify":false,"id":114}, {"topic":"Confidentiality","style":"BARBRI","stem":"Which communications are covered by the attorney-client privilege when the client is a corporation?","choices":[{"letter":"A","text":"None, because the attorney-client privilege applies only to human clients"},{"letter":"B","text":"Communications between the lawyer and a high-ranking corporate official"},{"letter":"C","text":"Communications between the lawyer and any person, if the content of the communications is somehow related to the corporation"},{"letter":"D","text":"Communications between the lawyer and any employee of the corporation"}],"correct":"B","explanation":"When the client is a corporation, the attorney-client privilege covers communications between the lawyer and a high-ranking corporate official. Communications between the lawyer and lower-level employees are privileged only if: (i) the employee communicates with the lawyer at the direction of the employee's superior; (ii) the employee knows the purpose is to obtain legal advice for the corporation; and (iii) the communication concerns a subject within the scope of the employee's corporate duties. Corporate clients are covered by the privilege.","verify":false,"id":115}, {"topic":"Confidentiality","style":"BARBRI","stem":"The attorney-client privilege does NOT apply to:","choices":[{"letter":"A","text":"Written communications"},{"letter":"B","text":"Preexisting documents"},{"letter":"C","text":"Statements made by agents"},{"letter":"D","text":"Oral communications"}],"correct":"B","explanation":"The attorney-client privilege does not apply to preexisting documents. A client cannot protect a preexisting document from discovery simply by turning it over to the attorney. If the document would be discoverable in the client's hands, it is equally discoverable in the attorney's hands. The attorney-client privilege covers both oral and written communications, and statements made by agents of either the attorney or the client.","verify":false,"id":116}, {"topic":"Confidentiality","style":"BARBRI","stem":"Which of the following statements regarding \"confidential\" communications is most correct?","choices":[{"letter":"A","text":"For an attorney-client communication to be considered confidential, the only third parties who can be present are those who play a direct role in the communication"},{"letter":"B","text":"For an attorney-client communication to be considered confidential, the only third parties who can be present are those who are there to help further the attorney-client relationship"},{"letter":"C","text":"For an attorney-client communication to be considered confidential, no third parties can be present during the communication"},{"letter":"D","text":"For an attorney-client communication to be considered confidential, the only third parties who can be present are those who are agents of either the attorney or the client"}],"correct":"B","explanation":"For an attor
