valid reason for direct contact. If there is an exceptional reason to contact a represented person, the lawyer should seek a court order.", "verify": false, "id": 356}, {"topic": "Third Parties", "style": "BARBRI", "stem": "Theo is representing Jessica in the sale of her condo. Prospective buyer Penny admires the lake view and says it is the main reason she is interested. Theo knows that construction will start next month and will almost completely block the view. He says, 'Yep, it's a once in a lifetime view.' Is Theo subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he misrepresented the facts to Penny"}, {"letter": "B", "text": "No, because he had no duty to volunteer harmful facts to Penny"}], "correct": "A", "explanation": "When dealing on behalf of a client with a third person, a lawyer must not knowingly make a false statement of law or material fact. Although a lawyer generally has no duty to volunteer harmful facts, the lawyer cannot misrepresent the facts. Theo's statement that it was 'a once in a lifetime view' — knowing the view would be blocked next month — was a material misrepresentation.", "verify": false, "id": 357}, {"topic": "Public Service", "style": "BARBRI", "stem": "Caleb and Jeremy are running for district attorney. Lorelei used to work with Jeremy, and she writes an editorial endorsing Caleb. In the editorial, she gives her honest and candid opinion that Caleb's opponent, Jeremy, does not have the temperament required for the job. Is Lorelei subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because she disparaged a candidate for public legal office"}, {"letter": "B", "text": "No, because she gave her truthful opinion"}, {"letter": "C", "text": "No, because Jeremy is not a judge or judicial candidate"}], "correct": "B", "explanation": "A lawyer must not make a statement that the lawyer knows is false about the qualifications or integrity of a judge, hearing officer, or public legal official, or a candidate for such office. The same rule applies to statements made with reckless disregard as to truth or falsity. However, this rule does not prohibit a lawyer from giving an informed and candid opinion. This rule applies to public legal officials and candidates for those positions, not just judges and judicial candidates.", "verify": false, "id": 358}, {"topic": "Public Service", "style": "BARBRI", "stem": "Evan is representing a client in litigation in front of Judge Gibson. Evan writes a letter to the chief judge stating that Judge Gibson has been carrying on an improper personal relationship with opposing counsel Reese and failed to disqualify himself. Evan does not know whether Judge Gibson has any relationship with Reese but suspects it because Judge Gibson keeps ruling against him. Is Evan subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "A", "explanation": "A lawyer must not make a statement that the lawyer knows is false — or makes with reckless disregard as to truth or falsity — about the qualifications or integrity of a judge. Because Evan's accusation was not based on any reliable information and was made with reckless disregard for its truth, he is subject to discipline.", "verify": false, "id": 359}, {"topic": "Public Service", "style": "BARBRI", "stem": "Anthony, a tax lawyer, has been asked to join a commission tasked with revising the tax code. Anthony knows that the decisions of the commission may affect some of his clients. May Anthony join the commission?", "choices": [{"letter": "A", "text": "No, because he knows that its decisions may affect his clients"}, {"letter": "B", "text": "Yes, but he must not participate in any decision that could affect his clients"}, {"letter": "C", "text": "Yes, but he must notify the commission when any of his clients would be materially benefited by a decision, though he need not identify the client"}, {"letter": "D", "text": "Yes, but he must notify the commission when any of his clients would be materially benefited by a decision, and he must identify the client"}], "correct": "C", "explanation": "A lawyer may serve on a law reform commission even though a reform advocated may affect one of the lawyer's clients. Unlike service on a legal services organization (where a lawyer cannot participate in decisions adverse to clients), a lawyer on a law reform project MAY participate in decisions that affect clients. However, when asked to participate in a decision that could materially benefit one of the lawyer's clients, the lawyer must disclose that fact — but need not identify the client.", "verify": false, "id": 360}, {"topic": "Public Service", "style": "BARBRI", "stem": "Jerry is on the board of directors of the local legal aid society. The society proposes to end free legal service in landlord-tenant disputes. Jerry represents several apartment complexes in the area. He discloses to the society that some of his clients would benefit from the decision, and then votes for the proposal. Is Jerry subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because he participated in the vote"}, {"letter": "B", "text": "No, because he disclosed to the society that his clients would benefit from the decision"}, {"letter": "C", "text": "No, because he voted for the proposal"}], "correct": "A", "explanation": "A lawyer serving on a legal services organization board must not knowingly participate in a decision that could adversely affect the representation of one of the organization's clients whose interests are adverse to those of a client of the lawyer. The proposal to end landlord-tenant legal services could adversely affect those clients — who are adverse to Jerry's apartment complex clients — so Jerry should not have participated in the vote at all. Disclosure is not enough; it does not cure the conflict. (This is distinct from law reform projects, where participation is permitted with disclosure.)", "verify": false, "id": 361}, {"topic": "Public Service", "style": "BARBRI", "stem": "Albert has not done any pro bono work in the past year. Is Albert subject to discipline?", "choices": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "correct": "B", "explanation": "The rules of professional conduct state that a lawyer should aspire to spend at least 50 hours on pro bono work per year. However, failing to do so is not grounds for professional discipline.", "verify": false, "id": 362}, {"topic": "Regulation", "style": "Midterm Review", "stem": "A partner at a law firm learned that an associate had failed to communicate a settlement offer to a client. By the time the partner learned of this failure, it was too late to avoid or mitigate the harm to the client. Is the partner subject to discipline under Rule 5.1?", "choices": [{"letter": "A", "text": "Yes, because partners are strictly liable for associates' ethical violations"}, {"letter": "B", "text": "Yes, because the partner should have had better supervisory systems in place"}, {"letter": "C", "text": "No, because the partner did not know of the misconduct in time to prevent or mitigate it"}, {"letter": "D", "text": "No, because only the associate who failed to communicate the offer is subject to discipline"}], "correct": "C", "explanation": "Under Rule 5.1, a partner is subject to discipline for an associate's misconduct only if the partner knew of the conduct at a time when its consequences could have been avoided or mitigated. Here, the partner learned of the failure too late to act. Timing of knowledge is the dispositive issue under Rule 5.1.", "verify": false, "id": 363}, {"topic": "Conflicts", "style": "Midterm Review", "stem": "An attorney previously worked for a government agency and conducted a title search on a particular property in that role. The attorney has since entered private practice and has been asked to represent a client in a dispute involving that same property. Which analysis applies?", "choices": [{"letter": "A", "text": "No conflict exists because the attorney was acting in a government capacity, not a private one"}, {"letter": "B", "text": "A conflict of interest analysis is triggered because the attorney worked on the same matter in a prior government role"}, {"letter": "C", "text": "The attorney may proceed as long as she screens herself from the matter"}, {"letter": "D", "text": "The conflict is waivable with informed consent from both parties"}], "correct": "B", "explanation": "When a former government attorney worked on a matter in a government role, and that same matter is now at issue in a private representation, a conflict of interest is triggered. The approach is to identify the dispositive issue first, then locate the applicable rule before answering. Former government employee conflicts require careful analysis under Rule 1.11.", "verify": false, "id": 364}, {"topic": "Confidentiality", "style": "Midterm Review", "stem": "An attorney's client privately confessed that he committed a murder for which another person was wrongfully convicted and is currently facing execution. Under the ABA Model Rules, the attorney did not disclose the information. Which statement best describes the attorney's obligations?", "choices": [{"letter": "A", "text": "The attorney was required to disclose because an innocent person's life is at stake"}, {"letter": "B", "text": "The attorney's non-disclosure was permissible under the ABA Model Rules because the client's confession is confidential information"}, {"letter": "C", "text": "The attorney was required to disclose under both ABA Model Rules and California rules"}, {"letter": "D", "text": "The attorney could disclose only if the client gave informed consent"}], "correct": "B", "explanation": "Under ABA Model Rules, disclosure of confidential information is only permitted (not required) in limited circumstances — generally to prevent future crimes involving death or substantial bodily harm. A past crime (the murder) does not trigger the future-crime exception. Note: California rules differ and may permit disclosure in even narrower circumstances. The MPRE tests ABA Model Rules, not California rules.", "verify": false, "id": 365}, {"topic": "Client-Lawyer", "style": "Midterm Review", "stem": "A sole practitioner referred a client to another firm and agreed to split the contingency fee proportionally based on work performed. The written fee agreement did not specify the fee allocation between the lawyers, and the client's consent to the split was given orally. Is the fee split proper?", "choices": [{"letter": "A", "text": "Yes, as long as the split is proportional to work performed"}, {"letter": "B", "text": "Yes, because the client consented"}, {"letter": "C", "text": "No, because fee splits require written client consent that specifies the fee allocation"}, {"letter": "D", "text": "No, because sole practitioners may not split fees with other firms"}], "correct": "C", "explanation": "A fee split between lawyers at different firms requires: (1) the split is proportional to work done or the lawyers assume joint responsibility; (2) the client agrees to the arrangement in writing, including the share each lawyer will receive; and (3) the total fee is reasonable. Here, the written agreement did not specify fee allocation, and consent was only oral — both requirements were missed. A 'reasonable' split alone is insufficient.", "verify": false, "id": 366}, {"topic": "Regulation", "style": "Midterm Review", "stem": "An attorney discovered that her partner had misappropriated funds from a client trust account, then replaced the funds after being confronted. The attorney did not report the misconduct because the client did not want the matter disclosed and the funds had been returned. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "No, because the funds were returned and the harm was remedied"}, {"letter": "B", "text": "No, because the client's preference not to disclose controls"}, {"letter": "C", "text": "Yes, because attorneys must report misconduct raising substantial questions of honesty regardless of whether it was rectified"}, {"letter": "D", "text": "Yes, but only if the misappropriation was intentional"}], "correct": "C", "explanation": "Under Rule 8.3, a lawyer who knows that another lawyer has committed a violation of the rules of professional conduct that raises a substantial question as to that lawyer's honesty, trustworthiness, or fitness must report it to the appropriate professional authority. Misappropriation of client funds is such a violation. The fact that the funds were replaced and the client objects to disclosure does not eliminate the duty to report. Rectifying a violation does not erase it.", "verify": false, "id": 367}, {"topic": "Competence", "style": "Midterm Review", "stem": "A supervising attorney at a firm was going on vacation and assigned a new associate to handle a custody trial, despite the associate having never conducted or observed such a trial. The client consented to the arrangement after it was disclosed. Is the associate subject to discipline?", "choices": [{"letter": "A", "text": "No, because the client gave informed consent to the arrangement"}, {"letter": "B", "text": "No, because the supervising attorney authorized the assignment"}, {"letter": "C", "text": "Yes, because the associate lacked the competence to handle the trial and was not being supervised by an experienced attorney"}, {"letter": "D", "text": "Yes, but only the supervising attorney is subject to discipline, not the associate"}], "correct": "C", "explanation": "A lawyer must provide competent representation, which requires the legal knowledge, skill, thoroughness, and preparation reasonably necessary for the representation. An attorney who lacks the necessary competence may associate with a competent attorney or prepare adequately. Here, the associate had never conducted or even observed such a trial and was not being supervised — the client's consent cannot waive the attorney's core ethical duties to be competent.", "verify": false, "id": 368}, {"topic": "Competence", "style": "Midterm Review", "stem": "An attorney made a procedural error that arguably violated the rules of professional conduct, but the client ultimately prevailed in the litigation. Which statement is most accurate?", "choices": [{"letter": "A", "text": "A positive outcome for the client means there was no ethical violation"}, {"letter": "B", "text": "A positive outcome for the client makes a malpractice claim impossible, but an ethical violation may still exist"}, {"letter": "C", "text": "An ethical violation and a malpractice claim are the same thing"}, {"letter": "D", "text": "PR violations and malpractice claims are distinct; a positive client outcome does not preclude an ethical violation"}], "correct": "D", "explanation": "Professional responsibility violations and malpractice claims are distinct. A client may prevail and yet the attorney's conduct may still violate the rules of professional conduct. Similarly, an attorney may violate the rules without committing malpractice. A positive outcome for the client does not preclude disciplinary action for an ethical violation.", "verify": false, "id": 369}, {"topic": "Regulation", "style": "Midterm Review", "stem": "During a court proceeding, an attorney witnessed a judge screaming at lawyers and witnesses and throwing a gavel. The attorney responded by seeking a substitution of judge rather than reporting the conduct. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "No, because seeking a substitution of judge was a reasonable response"}, {"letter": "B", "text": "No, because the duty to report judicial misconduct is discretionary"}, {"letter": "C", "text": "Yes, because a lawyer has a duty to report judicial misconduct that meets the threshold for reporting"}, {"letter": "D", "text": "Yes, but only if the attorney was personally affected by the judge's conduct"}], "correct": "C", "explanation": "Under Rule 8.3(b), a lawyer who knows that a judge has committed a violation of the applicable rules of judicial conduct that raises a substantial question as to the judge's fitness for office must inform the appropriate authority. Screaming at participants and throwing a gavel likely meets this threshold. Seeking a substitution of judge instead of reporting does not discharge the attorney's duty to report.", "verify": false, "id": 370}, {"topic": "Client-Lawyer", "style": "Midterm Review", "stem": "An attorney entered into a representation but did not disclose the fee basis at the exact moment the client signed the retainer. Is this a violation of the rules?", "choices": [{"letter": "A", "text": "Yes, fee basis must be disclosed before the representation begins"}, {"letter": "B", "text": "Yes, fee basis must be disclosed at the exact moment the retainer is signed"}, {"letter": "C", "text": "No, fee basis must be communicated within a reasonable time after commencing the representation"}, {"letter": "D", "text": "No, fee basis only needs to be disclosed if the client asks"}], "correct": "C", "explanation": "Under Rule 1.5, a lawyer must communicate the basis or rate of the fee and expenses to the client, preferably in writing, before or within a reasonable time after commencing the representation. The disclosure does not need to occur at the precise moment of entering the agreement — it must occur within a reasonable time thereafter.", "verify": false, "id": 371}, {"topic": "Client-Lawyer", "style": "Midterm Review", "stem": "Before the conclusion of a criminal case, the attorney entered into an agreement with the client giving the attorney the rights to a book about the client's case. Is this proper?", "choices": [{"letter": "A", "text": "Yes, as long as the client gave informed consent in writing"}, {"letter": "B", "text": "Yes, as long as the fee arrangement is otherwise reasonable"}, {"letter": "C", "text": "No, agreements for media rights related to a client's case cannot be made before the conclusion of representation"}, {"letter": "D", "text": "No, attorneys can never acquire media rights from clients"}], "correct": "C", "explanation": "Under Rule 1.8(d), prior to the conclusion of a representation, a lawyer must not make or negotiate an agreement giving the lawyer literary or media rights to a portrayal or account based in substantial part on information relating to the representation. Such agreements can only be made after the representation has concluded.", "verify": false, "id": 372}, {"topic": "Client-Lawyer", "style": "Midterm Review", "stem": "An attorney entered into a contingency fee agreement to represent a client in a divorce proceeding. Is the contingency fee agreement proper?", "choices": [{"letter": "A", "text": "Yes, contingency fees are permissible in all civil matters"}, {"letter": "B", "text": "Yes, as long as the client gives informed written consent"}, {"letter": "C", "text": "No, contingency fee agreements are prohibited in family law cases"}, {"letter": "D", "text": "No, contingency fees are only permitted in personal injury cases"}], "correct": "C", "explanation": "Under Rule 1.5(d), a lawyer must not enter into a contingency fee arrangement in a domestic relations matter (such as divorce) or in a criminal case. This prohibition applies regardless of client consent. This is a high-yield nuance — contingency fees are widely permitted in civil matters but are specifically prohibited in criminal defense and family law.", "verify": false, "id": 373}, {"topic": "Safekeeping", "style": "Midterm Review", "stem": "A dispute arises between a lawyer and client over funds held in the client trust account. The client claims $5,000 more than the lawyer believes is owed. What must the lawyer do with the disputed funds?", "choices": [{"letter": "A", "text": "Distribute all funds to the client immediately to avoid further dispute"}, {"letter": "B", "text": "Keep all funds in the trust account until the dispute is fully resolved"}, {"letter": "C", "text": "Distribute the undisputed amount to the client and keep the disputed portion in the trust account until resolved"}, {"letter": "D", "text": "Transfer all disputed funds to the lawyer's operating account pending resolution"}], "correct": "C", "explanation": "When a dispute arises over funds in a client trust account, the lawyer must promptly distribute any portion of the funds that is not in dispute to the client. The disputed portion must remain in the client trust account until the dispute is resolved. The lawyer must not transfer disputed funds to her own account.", "verify": false, "id": 374}, {"topic": "Conflicts", "style": "Midterm Review", "stem": "An attorney at a firm has a personal conflict of interest with a prospective client due to a prior personal relationship. No other attorney at the firm has any conflict with this client. Is the conflict automatically imputed to the entire firm?", "choices": [{"letter": "A", "text": "Yes, all conflicts are imputed to the entire firm"}, {"letter": "B", "text": "Yes, personal conflicts are always imputed to the firm"}, {"letter": "C", "text": "No, personal conflicts of an individual attorney are not automatically imputed unless there is a significant risk of material limitation on another lawyer's representation"}, {"letter": "D", "text": "No, imputation only applies to former-client conflicts"}], "correct": "C", "explanation": "Client conflicts and former-client conflicts are generally imputed to the entire firm. However, personal conflicts of an individual attorney (not arising from a client or former-client relationship) are not automatically imputed to the firm. Imputation of a personal conflict requires analysis showing there is a significant risk that the representation of the client will be materially limited by the personal conflict.", "verify": false, "id": 375}, {"topic": "Client-Lawyer", "style": "Midterm Review", "stem": "An attorney agrees to represent a client but limits the scope of the representation to only contract drafting — not litigation. Is this permissible?", "choices": [{"letter": "A", "text": "Yes, as long as the limitation is reasonable under the circumstances and the client gives informed consent"}, {"letter": "B", "text": "No, an attorney must always provide full-service representation"}, {"letter": "C", "text": "Yes, and no disclosure is required as long as the fee is reasonable"}, {"letter": "D", "text": "No, scope limitations are only permissible in pro bono matters"}], "correct": "A", "explanation": "Under Rule 1.2(c), a lawyer may limit the scope of representation if the limitation is reasonable under the circumstances and the client gives informed consent. The limitation must be communicated to the client. A lawyer cannot limit the representation in a way that leaves the client without adequate protection.", "verify": false, "id": 376}, {"topic": "Client-Lawyer", "style": "Midterm Review", "stem": "Upon withdrawal from a representation, what must an attorney do with the client's file?", "choices": [{"letter": "A", "text": "Turn over all papers in the client's file, including internal documents placed in the file, but not personal notes not placed in the file"}, {"letter": "B", "text": "Turn over only documents the client originally provided"}, {"letter": "C", "text": "Turn over the entire file including all personal notes and work product"}, {"letter": "D", "text": "Retain the entire file until any outstanding fees are paid"}], "correct": "A", "explanation": "Upon withdrawal, an attorney must turn over all papers and property to which the client is entitled, including internal documents placed in the client's file. However, personal notes and memoranda that were NOT placed in the file do not need to be turned over. The attorney may have a lien on the file for any contingency amount owed but must still take steps to avoid prejudicing the client's interests.", "verify": false, "id": 377}, {"topic": "Conflicts", "style": "Lecture Slides", "stem": "A small law firm represented clients in the banking industry. One of its clients, a credit union, used the firm for foreclosure work. Another client, a national bank, used the firm for loan work. The law firm did not ask clients to sign a general engagement agreement. Instead, it asked clients to present each new foreclosure or loan as a new representation. The work for the credit union was relatively stable, but the work for the national bank was increasing. The firm sent a letter to the credit union indicating it wanted to focus on work for larger banks and that the potential conflicts involving credit unions and smaller banks created an unacceptable risk of possible disqualification. When a substantial shopping mall was announced, the firm's partners sent a letter to the credit union indicating that the firm wished to focus on representing larger institutions and that it would no longer be representing any banks or credit unions. However, before the letters arrived, the details of the shopping mall were announced and the firm agreed to represent the national bank in negotiating for mall space. The other competitor for the mall space was the credit union. The firm had never done any work for the national bank on matters directly adverse to the credit union. The credit union officers filed a complaint with the state disciplinary authority. The law firm had never done direct work for the national bank on matters directly adverse to the credit union. Are the partners of the law firm subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the law firm dropped the credit union as a client in order to represent more lucrative clients"}, {"letter": "B", "text": "Yes, because the law firm represented the national bank in a matter that was directly adverse to the credit union's efforts to secure mall space"}, {"letter": "C", "text": "No, because the representation of the national bank was not substantially related to any work done on behalf of the credit union"}, {"letter": "D", "text": "No, because the law firm's letter informed the credit union that the firm would no longer represent small banks or credit unions"}], "correct": "C", "explanation": "The law firm clearly communicated to the credit union that each foreclosure would be treated as a new representation, so the credit union was not a current client C when the firm undertook representation of the national bank in negotiating for mall space. The credit union was a former C. Rule 1.9 provides that L may undertake representation adverse to a former C that is not substantially related to matters on which L represented the former C — and here not the same matter and no confidential info issues.", "verify": false, "id": 378}, {"topic": "Conflicts", "style": "Lecture Slides", "stem": "A client, inexperienced in legal matters, retained an attorney to defend her in an eviction proceeding commenced by her landlord. The landlord's complaint alleged that the client had failed to pay three months' rent. The client took the position that she was entitled to withhold rent payments because the landlord had failed to make necessary repairs. The attorney knew that the sister of one of 10 associates in the attorney's law firm was representing the landlord in various matters, including the eviction proceeding. The attorney informed the client about the associate's relationship to the landlord's sister, and the client did not object. The associate would not participate in any way in the matter. When the attorney filed his appearance in the matter, the landlord did not object. Was it proper for the attorney to accept the representation?", "choices": [{"letter": "A", "text": "Yes, because the associate's conflict was not imputed to the attorney"}, {"letter": "B", "text": "Yes, because the landlord did not object"}, {"letter": "C", "text": "No, because the associate was not permitted to represent the client, and this disqualification was imputed to the attorney"}, {"letter": "D", "text": "No, because the attorney did not advise the client of the desirability of seeking the advice of independent counsel before consenting to the representation"}], "correct": "A", "explanation": "Under Rule 1.7, the associate had a conflict of interest based on a personal interest and would have needed the client's informed consent to represent C in litigation in which the associate's sister was opposing counsel. However, Rule 1.10(a) provides that a lawyer's personal-interest conflict is not imputed to other lawyers in the same firm unless it presents a significant risk of materially limiting the other lawyer's representation of C. Here, there was no material risk that the attorney would be influenced by the fact that an associate's sister was opposing counsel.", "verify": false, "id": 379}, {"topic": "Conflicts", "style": "Lecture Slides", "stem": "A woman has asked an attorney to represent her in obtaining compensation for a tract of land that is being condemned by the state department of transportation to build a new highway. Two years ago, the attorney had been employed by the department and had been assigned to search title on several tracts of land, including the one owned by the woman. The attorney remembers that a department engineer had drafted a confidential memorandum advising against running a new highway across the woman's land because of a potential adverse environmental impact. Because of this information, the attorney believes it is possible to prevent the condemnation of the woman's land or to increase the settlement amount. What is the proper action for the attorney to take?", "choices": [{"letter": "A", "text": "Represent the woman on the issue of damages only and not disclose the information that might prevent the condemnation"}, {"letter": "B", "text": "Represent the woman and attempt to prevent the condemnation by using the information about the adverse environmental impact"}, {"letter": "C", "text": "Refuse to represent the woman but disclose to her the information about the adverse environmental impact"}, {"letter": "D", "text": "Refuse to represent the woman and not disclose the information about the adverse environmental impact"}], "correct": "D", "explanation": "Under Rule 1.11, a lawyer who was formerly employed by a government agency may not later represent a client 'in connection with a matter in which the lawyer participated personally and substantially' as a public employee without prior government agency consent. The attorney participated personally and substantially in an early stage of the condemnation matter by conducting a title search on the woman's property. The attorney may not now represent the woman in opposing or increasing compensation for the condemnation. Further, the attorney may not disclose the info learned while working at the department because, under Rule 1.11 and Rule 1.9, a lawyer formerly employed by the government must not reveal info relating to a former representation.", "verify": false, "id": 380}, {"topic": "Different Roles", "style": "Lecture Slides", "stem": "A judge has recently resigned from the state trial court bench. When she was a judge, she supervised activity in cases pending before another judge while he was on vacation. In one pending case, she entered an administrative order changing the courtroom in which a particular case was to be tried. After trial and appeal, the case was remanded for a new trial. The plaintiff in that case decided to change lawyers and has asked the recently resigned judge to try the case. Will the judge be subject to discipline if she tries this case on behalf of the plaintiff?", "choices": [{"letter": "A", "text": "Yes, because the judge acted officially as a judge with respect to an aspect of the case"}, {"letter": "B", "text": "Yes, because the judge would try the case before a judge of the court on which she previously sat"}, {"letter": "C", "text": "No, because the judge did not act as a judge with respect to a substantial matter in or the merits of the case"}, {"letter": "D", "text": "No, because any information that the judge learned about the case while acting as a judge was a matter of public record"}], "correct": "C", "explanation": "Under Rule 1.12(a), a former judge may represent the plaintiff because she did not participate 'substantially' in the matter while she was an acting judge. She merely entered an incidental administrative order unrelated to the merits of the lawsuit.", "verify": false, "id": 381}, {"topic": "Client-Lawyer", "style": "Lecture Slides", "stem": "An attorney is employed by a client who is a fugitive from justice under indictment for armed robbery. After thorough legal research and investigation, the attorney reasonably believes the indictment is fatally defective and should be dismissed as a matter of law. The attorney advised the client of his opinion and urged the client to surrender. The client told the attorney that she would not surrender. The attorney informed the district attorney that he represented the client and that he had counseled her to surrender but that she refused to follow his advice. The attorney has not advised his client on how to avoid arrest and prosecution and does not know where she is hiding. Is the attorney subject to discipline if he continues to represent the client?", "choices": [{"letter": "A", "text": "Yes, because the client is engaging in continuing illegal conduct"}, {"letter": "B", "text": "Yes, because the client refused to accept the attorney's advice and surrender"}, {"letter": "C", "text": "No, because the attorney is not counseling the client to avoid arrest and prosecution"}, {"letter": "D", "text": "No, because the attorney reasonably believes the indictment is defective"}], "correct": "C", "explanation": "Under Rule 1.2, a lawyer may not knowingly counsel or assist a client in illegal conduct. However, in this case, the attorney has not done so — he urged the client to surrender, disclosed the representation to the DA, and has not advised the client on how to evade arrest. Merely continuing to represent a client who is a fugitive, without assisting the flight, does not violate the rules.", "verify": false, "id": 382}, {"topic": "Client-Lawyer", "style": "Lecture Slides", "stem": "A county law prohibits selling alcoholic beverages before noon on Sundays. An attorney hired by a liquor store owner accurately told the client that the fine could only be imposed for each Sunday on which alcohol was sold before noon, not for each transaction, and that no one had been prosecuted under the law. She also told him she thought it would be improper to advise him about how to avoid detection. The client thanked the attorney and hung up. Several weeks later, the attorney learned the client had begun to open his store for business on Sundays at 9 a.m. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney reasonably should have known that the information she gave the client would encourage him to violate the law"}, {"letter": "B", "text": "Yes, because the attorney did not discourage her client from breaking the law"}, {"letter": "C", "text": "No, because the attorney merely gave the client her honest opinion about the consequences that were likely to result if she violated the law"}, {"letter": "D", "text": "No, because the lawyer and the client could have discussed the best way to avoid detection under the criminal law"}], "correct": "C", "explanation": "Under Rule 1.2, a lawyer is permitted to explain the law to a client and describe the consequences of violating it, but is not allowed to counsel or assist the client in violation of the law. The attorney here accurately stated the law and the likely consequences, and even declined to advise on how to avoid detection. She did not counsel or assist the client in breaking the law.", "verify": false, "id": 383}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "An attorney was retained by a woman to advise her in negotiating a separation agreement with her husband. The husband, who was not a lawyer, decided to act on his own behalf. The attorney never met or communicated with the husband during negotiations. After several months the parties reached agreement and the woman presented the husband with the terms. The attorney prepared a proposed agreement containing all agreed-upon terms and mailed it to the husband with a cover letter stating: 'As you know, I represent your wife in this matter and I do not represent your interests. I enclose two copies of the separation agreement I have drafted. If it meets with your approval, sign both copies before a notary and return them to me. I will then have your wife sign them and furnish you with a fully executed copy.' Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney did not suggest that the husband seek the advice of independent counsel before signing the agreement"}, {"letter": "B", "text": "Yes, because the attorney directly communicated with an unrepresented person"}, {"letter": "C", "text": "No, because the attorney acted only as a scrivener"}, {"letter": "D", "text": "No, because the attorney's letter did not imply that the attorney was disinterested and the attorney did not give legal advice to the husband"}], "correct": "D", "explanation": "Rule 4.3 permits a lawyer to contact an unrepresented person so long as the lawyer does not state or imply that the lawyer is disinterested. By clearly identifying the wife as his client and stating that he did not represent the husband's interests, the attorney complied with the rule. The attorney also did not give legal advice to the husband.", "verify": false, "id": 384}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "An attorney represented a respondent in proceedings instituted by a child protection services agency to establish the paternity of a child and to recover past-due child support. The mother had refused to file a complaint, refused to retain a lawyer, and had asked the agency not to file any action. The attorney contacted the mother without the knowledge or consent of the agency or its lawyers. The attorney identified himself to the mother as 'an officer of the court' and told her he was investigating the matter. Based on what she told him, the attorney prepared an affidavit that the mother signed, truthfully stating that the respondent was not the father of the child. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney acted without the knowledge or consent of the agency or its lawyers"}, {"letter": "B", "text": "Yes, because the attorney implied that he was disinterested in the matter"}, {"letter": "C", "text": "No, because all of the attorney's statements to the mother were true"}, {"letter": "D", "text": "No, because the attorney did not give the mother legal advice"}], "correct": "B", "explanation": "Rule 4.3 prohibits a lawyer from stating or implying that the lawyer is disinterested in a matter in which the lawyer represents an interested party. By identifying himself as 'an officer of the court' rather than as counsel for the respondent, the attorney implied that he was disinterested — when in fact he represented the respondent whose interests were directly adverse to those of the mother.", "verify": false, "id": 385}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "An attorney represented a company seeking to purchase land on which to build a factory. The seller was a sophisticated businessman the attorney had known for many years but had never represented. Prior to closing, the attorney received a call from the seller asking whether the company could pay the purchase price in five annual installments. The attorney cautioned that she represented only the company and not the seller. She truthfully advised the seller that in her opinion, the seller would be able to receive the property back if full payment was not made. She also advised the seller that it was in his best interest to retain a lawyer. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "No, because the attorney advised the seller to seek independent legal advice"}, {"letter": "B", "text": "No, because the attorney disclosed that she represented only the company"}, {"letter": "C", "text": "Yes, because the attorney permitted the company's president to negotiate directly with the seller"}, {"letter": "D", "text": "Yes, because the attorney gave legal advice to an unrepresented person whose interests conflicted with the interests of the attorney's client"}], "correct": "D", "explanation": "Under Rule 4.3, a lawyer is not permitted to give any legal advice to an unrepresented person whose interests conflict with those of the lawyer's client, except the advice to secure counsel. Here, the seller was not represented by counsel, and the attorney knew the seller's interests conflicted with her client's interests. When the attorney gave the seller her opinion about his legal rights (the ability to recover the property), she acted improperly — even though she also advised him to retain a lawyer.", "verify": false, "id": 386}, {"topic": "Conflicts", "style": "Lecture Slides", "stem": "An attorney previously represented a client in creating an asset-protection trust and prenuptial agreement designed to shield the client's assets from future creditors. The attorney no longer represents that client. A group of business creditors has now asked the attorney to represent them in litigation seeking to overturn the asset-protection system the attorney originally designed. May the attorney accept this representation?", "choices": [{"letter": "A", "text": "Yes, because the former client is no longer a current client and the representation has ended"}, {"letter": "B", "text": "Yes, because the creditors are not asking the attorney to reveal confidential information"}, {"letter": "C", "text": "No, because the new matter is substantially related to the prior representation and the attorney would be attacking their own prior work using confidential information from that representation"}, {"letter": "D", "text": "No, because an attorney may never represent a party whose interests are adverse to any former client"}], "correct": "C", "explanation": "Under Rule 1.9, a lawyer may not represent a new client in a matter that is the same or substantially related to a matter in which the lawyer previously represented a client, where the new client's interests are materially adverse to the former client. Here, the attorney designed the very asset-protection system the creditors now seek to overturn — the matter is the same, and the attorney would be attacking their own prior work. The attorney also likely retains confidential information about how the system was structured, which could be used against the former client.", "verify": false, "id": 387}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "An attorney represented a real estate developer who was trying to buy several properties. The attorney arranged a meeting with an owner of two large parcels of land, hoping to arrange a sale to the developer. When the attorney scheduled the meeting, he neither knew nor asked whether the owner was represented by counsel. Shortly after the meeting began, the owner disclosed that he had retained counsel to assist in the sale but that his lawyer could not be present that day. The owner stated that he would be meeting with his lawyer the next day. The attorney asked the owner if they could talk anyway and stated he would not ask the owner to sign anything until his lawyer had a chance to look it over. The owner, an experienced businessman, agreed to continue, and a tentative agreement was worked out. Was the attorney's conduct proper?", "choices": [{"letter": "A", "text": "Yes, because the owner knowingly agreed to continue the discussions without his own lawyer being present"}, {"letter": "B", "text": "Yes, because the attorney did not present the owner with any documents to sign during the meeting"}, {"letter": "C", "text": "No, because the attorney negotiated with the owner after learning that the owner was represented by a lawyer in the matter"}, {"letter": "D", "text": "No, because the attorney failed to ascertain whether the owner was represented by a lawyer before beginning the negotiation session"}], "correct": "C", "explanation": "Under Rule 4.2, a lawyer must not communicate about the subject of a representation with a person the lawyer knows to be represented by counsel in that matter, unless that person's counsel consents or the law authorizes it. Once the attorney learned that the owner was represented by a lawyer in this transaction, the attorney was required to stop. The owner's consent to continue is irrelevant — only the owner's attorney could consent to the communication. The fact that the attorney promised not to present documents to sign does not cure the violation.", "verify": false, "id": 388}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "An attorney represented the plaintiff in a personal injury matter. The attorney had heard that the defendant was anxious to settle the case and reasonably believed that the defendant's lawyer had not informed the defendant about the attorney's recent settlement offer. The attorney instructed her nonlawyer investigator to tell the defendant about the settlement offer so that the attorney could be sure that the defendant's lawyer had not forced the case to trial merely to increase the lawyer's own fee. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the defendant was represented by counsel"}, {"letter": "B", "text": "Yes, because the attorney was assisting the investigator in the unauthorized practice of law"}, {"letter": "C", "text": "No, because the investigator is not a lawyer"}, {"letter": "D", "text": "No, because the attorney reasonably believed that the defendant's lawyer was not keeping the defendant informed"}], "correct": "A", "explanation": "Rule 4.2 prohibits a lawyer from communicating about the subject of a representation with a person the lawyer knows is represented by counsel in that matter, unless that person's counsel consents or the law authorizes it. This prohibition extends to communications made through agents — a lawyer cannot do indirectly what the rules prohibit directly. The fact that the investigator is not a lawyer does not cure the violation, nor does the attorney's belief (however reasonable) that opposing counsel was not keeping the defendant informed.", "verify": false, "id": 389}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "An attorney represented a prison guard against whom the state department of prisons had brought a charge of striking a prisoner without justification. The department was represented by counsel. The attorney concluded it was vital to interview two other guards who had witnessed the incident but were not themselves implicated in any wrongdoing. The attorney reasonably believed the guards would not talk to him if the department's lawyer was present. Without notifying department counsel, the attorney interviewed the guards at his law office, making clear he was acting on the defendant guard's behalf. He obtained information helpful to his client's case. Is the attorney subject to discipline for interviewing the other guards?", "choices": [{"letter": "A", "text": "Yes, because the attorney did not notify the department's lawyer before conducting the interview"}, {"letter": "B", "text": "Yes, because the attorney did not obtain the department's lawyer's consent to the interview"}, {"letter": "C", "text": "No, because the attorney reasonably believed the guards would not talk to him if the department's lawyer was present"}, {"letter": "D", "text": "No, because the guards were mere witnesses and were not implicated in conduct that could be imputed to the department"}], "correct": "D", "explanation": "Rule 4.2 prohibits communications with a represented organization's constituents whose acts or omissions may be imputed to the organization or who have authority to bind the organization. The two guards were mere witnesses with no managerial authority and whose conduct was not at issue in the charge. They were not 'represented persons' within the meaning of Rule 4.2 simply because they were employees of the department. The attorney was permitted to interview them without notifying or obtaining consent from the department's counsel.", "verify": false, "id": 390}, {"topic": "Client-Lawyer", "style": "Lecture Slides", "stem": "A lawyer is representing a wife in a custody dispute. As the case progresses, the lawyer learns the court is likely to award custody to the father. The lawyer tells the mother, 'As a lawyer, stay — but as a mom, run.' The lawyer helps arrange for a friend to move the wife's belongings, keeps a key to the wife's new location, and later tells the judge that the wife's location is privileged. Is the lawyer subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the lawyer counseled and actively assisted the client in evading the custody proceeding"}, {"letter": "B", "text": "Yes, because the lawyer disclosed the client's location to the court"}, {"letter": "C", "text": "No, because the lawyer was acting in the client's best interest"}, {"letter": "D", "text": "No, because the client's location is protected by attorney-client privilege"}], "correct": "A", "explanation": "Under Rule 1.2, a lawyer may not counsel or assist a client in criminal, fraudulent, or court-order-violating conduct. The lawyer here did not merely advise — she actively helped the mother flee, stored a key to the new location, and then misrepresented to the court that the location was privileged. This went far beyond zealous advocacy. The lawyer was disbarred.", "verify": false, "id": 391}, {"topic": "Client-Lawyer", "style": "Lecture Slides", "stem": "A lawyer believes a court order requiring her client to submit to substance abuse testing exceeds the court's authority. Without seeking review through proper legal channels, the lawyer advises the client to simply ignore the court order. The client complies with the testing anyway, but the judge learns of the lawyer's advice and reports it. Is the lawyer subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because a lawyer may not advise a client to disobey a court order, even if the lawyer believes it is unlawful"}, {"letter": "B", "text": "Yes, because the client was harmed by the lawyer's advice"}, {"letter": "C", "text": "No, because the lawyer had a good-faith belief that the court order exceeded the court's authority"}, {"letter": "D", "text": "No, because the client did not actually disobey the court order"}], "correct": "A", "explanation": "A lawyer may challenge a court order through proper channels — such as a motion to reconsider or an appeal — but may not advise a client to simply disobey it. Even if the lawyer in good faith believes the order is unlawful, the proper remedy is to seek judicial review. The lawyer received a public reprimand.", "verify": false, "id": 392}, {"topic": "Client-Lawyer", "style": "Lecture Slides", "stem": "A lawyer tells a client: 'The penalties for robbing a state bank are less than for robbing a federal bank. Also, the penalty is reduced if your gun is unloaded. Of course, I urge you not to rob the bank.' Is the lawyer subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the lawyer gave tactical advice about how to commit a crime with reduced consequences, even though the lawyer added a disclaimer"}, {"letter": "B", "text": "Yes, because the lawyer has an affirmative duty to report a client who intends to commit a crime"}, {"letter": "C", "text": "No, because the lawyer advised the client not to rob the bank"}, {"letter": "D", "text": "No, because a lawyer is always permitted to explain the law and its penalties"}], "correct": "A", "explanation": "Under Rule 1.2, a lawyer may explain the law and the legal consequences of proposed conduct, but may not counsel or assist a client in criminal or fraudulent conduct. Giving strategic advice about how to commit a crime with lesser penalties — the type of bank, the loaded vs. unloaded gun — crosses the line, even if the lawyer adds 'of course, don't do it.' The caveat does not cure the advice.", "verify": false, "id": 393}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "A defendant agreed to plead guilty and testify against a co-defendant (represented by Lawyer 2) in exchange for a reduced sentence. Lawyer 2 communicated directly with the defendant, persuaded him to fire his attorney, withdraw his plea, and allow Lawyer 2 to represent both the defendant and the original client. The defendant later received a life sentence and did not testify against Lawyer 2's client. Was Lawyer 2 subject to discipline?", "choices": [{"letter": "A", "text": "Yes, for violating Rule 4.2 only — communicating with a represented party without counsel's consent"}, {"letter": "B", "text": "Yes, for violating Rule 1.7 only — representing clients with a concurrent conflict"}, {"letter": "C", "text": "Yes, for violating both Rule 4.2 and Rule 1.7"}, {"letter": "D", "text": "No, because the defendant voluntarily agreed to be represented by Lawyer 2"}], "correct": "C", "explanation": "Lawyer 2 violated Rule 4.2 by communicating directly with the defendant — a represented party — without his counsel's consent. Lawyer 2 also violated Rule 1.7 by representing two clients with an actual conflict: the original client benefited from the defendant not testifying, while the defendant received a life sentence instead of the reduced sentence from his plea deal. The defendant's voluntary agreement does not cure either violation. Lawyer 2 was disbarred.", "verify": false, "id": 394}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "G is represented by counsel in an employment discrimination suit against Pepsi. Pepsi is involved in a related case and subpoenas G for a deposition, serving G directly rather than G's counsel. At the deposition, Pepsi's lawyer questions G about the substance of G's discrimination suit against Pepsi. Did Pepsi's lawyer violate Rule 4.2?", "choices": [{"letter": "A", "text": "Yes, because Pepsi's lawyer communicated with G about the subject of G's representation without G's counsel's consent"}, {"letter": "B", "text": "Yes, because the subpoena was served on G rather than G's counsel"}, {"letter": "C", "text": "No, because the subpoena was issued in a separate legal proceeding"}, {"letter": "D", "text": "No, because deposition questions in litigation are always permissible"}], "correct": "A", "explanation": "Rule 4.2 prohibits a lawyer from communicating with a person the lawyer knows is represented by counsel in a matter, without that counsel's consent. G was represented in the employment discrimination case against Pepsi, and Pepsi's lawyer used a deposition in a related proceeding to ask questions about the very matter in which G was represented. The deposition testimony was excluded and G's attorney received fees for the successful motion to exclude.", "verify": false, "id": 395}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "A defense lawyer communicated directly with the opposing plaintiff after the plaintiff told the lawyer that she had fired her attorney. In fact, the plaintiff had not fired her attorney and was still represented. The plaintiff's attorney later claimed a Rule 4.2 violation. Did the defense lawyer violate Rule 4.2?", "choices": [{"letter": "A", "text": "Yes, because the plaintiff was in fact still represented by counsel at the time of the communication"}, {"letter": "B", "text": "Yes, because the lawyer had a duty to independently verify whether the plaintiff had actually discharged her attorney"}, {"letter": "C", "text": "No, because Rule 4.2 only applies when the communicating lawyer knows the person is represented by counsel"}, {"letter": "D", "text": "No, because the plaintiff consented to the communication"}], "correct": "C", "explanation": "Rule 4.2 prohibits communication with a person the lawyer knows is represented by counsel. The operative word is 'knows.' Here the plaintiff told the defense lawyer she had fired her attorney, so the lawyer had no knowledge that the plaintiff remained represented. Because the knowledge element was not satisfied, no Rule 4.2 violation occurred — even though the plaintiff was in fact still represented.", "verify": false, "id": 396}, {"topic": "Third Parties", "style": "Lecture Slides", "stem": "A low-level drug defendant is represented by counsel who was provided by the gang leadership the defendant is cooperating against. The defendant wants to speak directly with the government because he believes his lawyer may be protecting the gang's interests rather than his own. A government lawyer learns the defendant wants to communicate directly. May the government lawyer respond without defense counsel's consent?", "choices": [{"letter": "A", "text": "Yes, because the defendant initiated the contact"}, {"letter": "B", "text": "Yes, because there is good cause to believe the attorney-client relationship has been compromised"}, {"letter": "C", "text": "No, because Rule 4.2 prohibits communicating with a represented person without counsel's consent, even when the defendant initiates contact"}, {"letter": "D", "text": "No, because government lawyers are subject to stricter standards than private lawyers under Rule 4.2"}], "correct": "C", "explanation": "Rule 4.2 prohibits a lawyer from communicating about the subject of a representation with a person the lawyer knows is represented by counsel, unless counsel consents or a court order or law authorizes the communication. This prohibition applies even when the represented person initiates the contact. The government lawyer's remedy is to seek a court order authorizing communication — not to simply respond to the defendant's request.", "verify": false, "id": 397}, {"topic": "Advocacy", "style": "Lecture Slides", "stem": "An attorney represented a seller negotiating the sale of an ice cream parlor. The seller confidentially told the attorney that profits had been stable but modest. To restore the buyer's waning interest, the attorney told the buyer: 'The ice cream business is every American dream: happy kids, steady profits, and a clear conscience.' The buyer purchased the business but was disappointed when profits proved only modest. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney made a false statement of material fact to the buyer"}, {"letter": "B", "text": "Yes, because the attorney used confidential client information to benefit the client at the buyer's expense"}, {"letter": "C", "text": "No, because the attorney's statement was puffing and not a false statement of material fact"}, {"letter": "D", "text": "No, because the buyer had an independent duty to investigate the business's profitability"}], "correct": "C", "explanation": "Under Rule 4.1, a lawyer may not make a false statement of material fact or law to a third person. However, not all statements made during negotiations constitute statements of fact — estimates, opinions, value assessments, and general sales talk ('puffery') are not considered material facts. The attorney's statement about 'happy kids, steady profits, and a clear conscience' was classic puffing in a commercial negotiation and did not constitute a false statement of material fact.", "verify": false, "id": 398}, {"topic": "Advocacy", "style": "Lecture Slides", "stem": "An attorney represented a landowner selling land to a developer who planned to build a golf resort. Before closing, the attorney learned the land had been contaminated by a former fish-processing plant and was unsuitable for growing grass. The attorney tried to persuade the client to disclose the contamination, but the client refused. The attorney withdrew and notified the developer's lawyer and the bank's lawyer that the attorney had withdrawn and disaffirmed all documents prepared for the transaction. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney disclosed confidential client information without authorization"}, {"letter": "B", "text": "Yes, because the attorney was required to disclose the contamination directly to the developer, not merely withdraw"}, {"letter": "C", "text": "No, because the attorney properly withdrew and took steps to avoid assisting the client's fraud"}, {"letter": "D", "text": "No, because the attorney had no duty to take any action after withdrawal"}], "correct": "C", "explanation": "Under Rule 1.2, a lawyer may not knowingly assist a client in criminal or fraudulent conduct. When the client refused to disclose material contamination, the attorney properly withdrew. Under Rule 1.6(b), a lawyer may disclose information to prevent or rectify a client's fraud when the lawyer's services have been used to further it. The attorney's withdrawal and disaffirmance of prepared documents was an appropriate and permissible response to avoid assisting the client's intended fraud.", "verify": false, "id": 399}, {"topic": "Advocacy", "style": "Lecture Slides", "stem": "A buyer authorized the attorney to pay up to $10 million for a property but preferred a price in the $7.5–$8.5 million range. During negotiations, the attorney told the seller's lawyer that the buyer would pay no more than $6 million. The seller countered at $9.5 million and eventually said the seller would accept $8 million and nothing lower. The attorney accepted at $8 million, and the buyer was pleased with the result. Was the attorney's conduct proper?", "choices": [{"letter": "A", "text": "Yes, because the attorney's statements about the buyer's position were accepted negotiating conventions, not false statements of material fact"}, {"letter": "B", "text": "Yes, because the buyer was pleased with the outcome"}, {"letter": "C", "text": "No, because the attorney made false statements about the buyer's actual authorized ceiling"}, {"letter": "D", "text": "No, because an attorney may not misrepresent a client's financial position in any negotiation"}], "correct": "A", "explanation": "Under Rule 4.1, a lawyer may not make false statements of material fact. However, statements about a party's negotiating position, settlement range, or reservation price are generally understood to be negotiating conventions — not statements of material fact. Telling opposing counsel 'my client will pay no more than $6 million' when the actual ceiling is $10 million falls within widely accepted negotiation practice and does not violate Rule 4.1.", "verify": false, "id": 400}, {"topic": "Different Roles", "style": "Lecture Slides", "stem": "A restaurant partnership seeking new investors hired an attorney to prepare an evaluation of whether the restaurant had complied with state and local laws over the past five years. The attorney told the partners that the evaluation would need to disclose serious past health code violations and could harm their ability to obtain investment. The partners gave informed consent. The attorney prepared the evaluation, which disclosed the violations, and sent it to prospective investors. The investors declined to invest, and word of the violations spread. Was the attorney's conduct proper?", "choices": [{"letter": "A", "text": "Yes, because the attorney obtained the client's informed consent before preparing and disclosing an evaluation likely to adversely affect the client"}, {"letter": "B", "text": "Yes, because evaluations for third parties are always permissible"}, {"letter": "C", "text": "No, because the attorney's disclosure caused the client reputational and financial harm"}, {"letter": "D", "text": "No, because the attorney should have refused to prepare the evaluation once violations were discovered"}], "correct": "A", "explanation": "Under Rule 2.3, a lawyer may provide an evaluation of a matter for the use of someone other than the client if the lawyer reasonably believes preparing the evaluation is compatible with the lawyer-client relationship. When the evaluation is likely to materially and adversely affect the client's interests, the lawyer must first obtain the client's informed consent. The attorney did exactly that — disclosed the risk, obtained the partners' informed consent, and then prepared and provided the evaluation.", "verify": false, "id": 401}, {"topic": "Different Roles", "style": "Lecture Slides", "stem": "A seller hired an attorney to handle the sale of an apartment building. State law required the seller's attorney to provide the buyer with a lease summary and an opinion about whether the leases were in good standing. The attorney reasonably concluded the leases were in order and provided the summary to the buyer, with a copy to the seller, without separately asking the seller for explicit authorization to provide the evaluation. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney provided information to a third party without the client's explicit informed consent"}, {"letter": "B", "text": "Yes, because Rule 2.3 always requires separate written authorization"}, {"letter": "C", "text": "No, because the evaluation was impliedly authorized by the representation and presented no significant risk to the client"}, {"letter": "D", "text": "No, because the attorney provided the seller with a copy of the evaluation"}], "correct": "C", "explanation": "Under Rule 2.3, when a lawyer evaluates a matter for a third party and the evaluation presents no significant risk to the client, the lawyer may be impliedly authorized to provide it without separately obtaining explicit consent. Here, state law required the lease summary and opinion as part of the transaction, the leases were in good standing, and no adverse information was disclosed. Providing the evaluation was impliedly authorized by the scope of the representation.", "verify": false, "id": 402}, {"topic": "Advocacy", "style": "Lecture Slides", "stem": "An attorney represented a plaintiff in an automobile accident case. Shortly before trial, the attorney located an eyewitness whose testimony would be harmful to the plaintiff. The witness had not been contacted by the defense and mentioned she had always wanted to vacation in Europe. The attorney told the witness that because no one had subpoenaed her, she had no legal obligation to appear, and suggested she take a vacation so she would be unavailable to testify. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because the attorney improperly encouraged a witness to make herself unavailable to testify"}, {"letter": "B", "text": "Yes, because the attorney's statement about subpoenas was legally incorrect"}, {"letter": "C", "text": "No, because the witness had no legal obligation to appear if she had not been subpoenaed"}, {"letter": "D", "text": "No, because the attorney was acting in her client's best interests"}], "correct": "A", "explanation": "Under Rule 3.4(f), a lawyer may not request a person other than a client to refrain from voluntarily giving relevant information to another party, unless the person is a relative, employee, or agent of the client and the lawyer reasonably believes the person's interests will not be adversely affected by doing so. While the attorney's statement about subpoenas may have been technically accurate, the purpose and effect of the communication was to encourage the witness to make herself unavailable — which is improper obstruction of the truth-seeking process.", "verify": false, "id": 403}, {"topic": "Client-Lawyer", "style": "BARBRI", "stem": "An attorney represents a client in a personal injury case on a contingency fee basis. The client is struggling financially and asks the attorney to lend her $500 to cover her rent while the case is pending. The attorney makes the loan from personal funds with the understanding it will be repaid regardless of outcome. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because a lawyer may not provide financial assistance to a client in connection with pending litigation"}, {"letter": "B", "text": "Yes, because the loan was not contingent on the outcome of the case"}, {"letter": "C", "text": "No, because the client needed the money for basic living expenses, not litigation costs"}, {"letter": "D", "text": "No, because the client agreed to repay the loan regardless of outcome"}], "correct": "A", "explanation": "Under Rule 1.8(e), a lawyer shall not provide financial assistance to a client in connection with pending or contemplated litigation, except that the lawyer may advance court costs and litigation expenses with repayment contingent on outcome. The rule does not permit personal loans for living expenses — even for struggling clients. The indigency exception only allows a lawyer to pay court costs and litigation expenses outright; it does not authorize personal loans.", "verify": false, "id": 404}, {"topic": "Client-Lawyer", "style": "BARBRI", "stem": "An attorney represents a client in a slip-and-fall case. The attorney advances the $500 filing fee and $300 for a medical records subpoena, with the understanding that the client will repay these costs from any recovery. The client is not indigent. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because a lawyer may never advance money to a client"}, {"letter": "B", "text": "Yes, because the client is not indigent"}, {"letter": "C", "text": "No, because advancing court costs and litigation expenses with repayment contingent on outcome is expressly permitted"}, {"letter": "D", "text": "No, because the amounts are modest"}], "correct": "C", "explanation": "Under Rule 1.8(e), a lawyer may advance court costs and litigation expenses, with repayment contingent on the outcome of the matter. This exception applies to any client — not just indigent clients. Filing fees and costs of obtaining medical records are classic litigation expenses. The indigency exception is separate: it allows a lawyer to pay these costs outright without expecting repayment at all.", "verify": false, "id": 405}, {"topic": "Client-Lawyer", "style": "BARBRI", "stem": "An attorney represents an indigent client pro bono in an eviction defense. The attorney pays the $200 filing fee for a counterclaim from her own funds with no expectation of repayment. Is the attorney subject to discipline?", "choices": [{"letter": "A", "text": "Yes, because a lawyer may never pay litigation costs without expectation of repayment"}, {"letter": "B", "text": "Yes, because paying costs outright creates an improper financial interest in the outcome"}, {"letter": "C", "text": "No, because a lawyer representing an indigent client may pay court costs and litigation expenses outright"}, {"letter": "D", "text": "No, because pro bono representations are exempt from Rule 1.8(e)"}], "correct": "C", "explanation": "Rule 1.8(e) contains two exceptions: (1) any lawyer may advance court costs and litigation expenses with repayment contingent on outcome; and (2) a lawyer representing an indigent client may pay court costs and litigation expenses outright — meaning no repayment is expected at all. Here, the attorney paid a filing fee for an indigent client with no expectation of repayment, which falls squarely within the second exception.", "verify": false, "id": 406}, {"topic": "Client-Lawyer", "style": "BARBRI", "stem": "A personal injury law firm advertises that in cases of clear liability, it will advance clients up to 50% of the firm's estimated value of the case as an interest-free loan against the prospective judgment. Is this practice permissible under the ABA Model Rules?", "choices": [{"letter": "A", "text": "Yes, because the advances are interest-free and benefit the client"}, {"letter": "B", "text": "Yes, because the advances are structured as loans to be repaid from the recovery"}, {"letter": "C", "text": "No, because advancing money against the expected value of a recovery goes beyond the permitted exception for court costs and litigation expenses"}, {"letter": "D", "text": "No, because lawyers may only advance money to indigent clients"}], "correct": "C", "explanation": "Rule 1.8(e) permits a lawyer to advance court costs and litigation expenses with repayment contingent on outcome — but this exception is narrow. Advancing a percentage of the anticipated recovery is not a court cost or litigation expense; it is financial assistance tied to the expected value of the case. This goes beyond what Rule 1.8(e) permits and constitutes prohibited financial assistance in connection with litigation, regardless of how the loan is structured or whether it is interest-free.", "verify": false, "id": 407}, {"topic": "Client-Lawyer", "style": "BARBRI", "stem": "An attorney represents a client in a contract dispute. The client cannot afford an expert witness fee of $3,000. The attorney agrees to advance the expert witness fee, with the understanding the client will repay it from any recovery. Is this proper?", "choices": [{"letter": "A", "text": "Yes, because expert witness fees are litigation expenses that may be advanced with repayment contingent on outcome"}, {"letter": "B", "text": "Yes, because the attorney has a financial interest in winning the case"}, {"letter": "C", "text": "No, because only filing fees may be advanced under Rule 1.8(e)"}, {"letter": "D", "text": "No, because advancing expert fees creates a conflict of interest"}], "correct": "A", "explanation": "Rule 1.8(e) allows a lawyer to advance court costs and litigation expenses with repayment contingent on the outcome of the matter. Expert witness fees are a recognized litigation expense. The advance is proper here because (1) it is a legitimate litigation expense, not a personal loan, and (2) repayment is contingent on the outcome. This exception applies to any client — not just indigent clients.", "verify": false, "id": 408}];

(function(){
var TOPICS = ['All','Regulation','Client-Lawyer','Confidentiality','Conflicts'];
var state = { filter:'All', order:[], idx:0, answered:false, right:0, wrong:0,
              missed:[], perTopic:{} };

function g(id){ return document.getElementById(id); }

function idsFor(filter){
  return QUESTIONS.filter(function(q){ return filter==='All' || q.topic===filter; })
                  .map(function(q){ return q.id; });
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function buildFilters(){
  var w = g('filters'); w.innerHTML='';
  TOPICS.forEach(function(t){
    var n = t==='All' ? QUESTIONS.length : QUESTIONS.filter(function(q){return q.topic===t;}).length;
    var b = document.createElement('button');
    b.className = 'fbtn'+(state.filter===t?' active':'');
    b.innerHTML = t+'<span class="fc">'+n+'</span>';
    b.addEventListener('click', function(){ state.filter=t; start(shuffle(idsFor(t))); buildFilters(); });
    w.appendChild(b);
  });
}

function start(order){
  state.order = order; state.idx=0; state.answered=false;
  state.right=0; state.wrong=0; state.missed=[]; state.perTopic={};
  g('results').style.display='none'; g('qcard').style.display='block';
  render();
}

function render(){
  var total = state.order.length;
  g('d-right').textContent = state.right;
  g('d-wrong').textContent = state.wrong;
  g('d-left').textContent = Math.max(0, total - state.idx);
  g('hdr-score').textContent = state.right + '/' + (state.right+state.wrong);
  g('d-fill').style.width = total>0 ? Math.round((state.right+state.wrong)/total*100)+'%' : '0%';
  if(state.idx >= total){ showResults(); return; }
  var q = QUESTIONS[state.order[state.idx]];
  state.answered = false;
  g('qnum').textContent = 'Question '+(state.idx+1)+' of '+total;
  g('b-topic').textContent = q.topic;
  g('b-src').textContent = q.style;
  g('b-verify').style.display = q.verify ? 'inline-block' : 'none';
  g('stem').textContent = q.stem;
  g('explain').style.display='none';
  g('next-wrap').style.display='none';
  var cw = g('choices'); cw.innerHTML='';
  q.choices.forEach(function(c){
    var d = document.createElement('div');
    d.className='choice'; d.id='ch-'+c.letter;
    d.innerHTML = '<div class="ch-letter">'+c.letter+'</div><div class="ch-text"></div>';
    d.querySelector('.ch-text').textContent = c.text;
    d.addEventListener('click', function(){ answer(q, c.letter); });
    cw.appendChild(d);
  });
}

function answer(q, letter){
  if(state.answered) return;
  state.answered = true;
  var correct = (letter === q.correct);
  if(correct){ state.right++; } else { state.wrong++; state.missed.push(q.id); }
  if(!state.perTopic[q.topic]) state.perTopic[q.topic] = {r:0,t:0};
  state.perTopic[q.topic].t++;
  if(correct) state.perTopic[q.topic].r++;
  q.choices.forEach(function(c){
    var el = g('ch-'+c.letter);
    if(c.letter === letter && correct) el.className='choice picked-right';
    else if(c.letter === letter && !correct) el.className='choice picked-wrong';
    else if(c.letter === q.correct) el.className='choice reveal-right';
    else el.className='choice dim';
  });
  g('explain-label').textContent = correct ? '✓ Correct — '+q.correct : '✗ The answer is '+q.correct;
  g('explain-text').textContent = q.explanation || '';
  g('explain').style.display='block';
  g('next-wrap').style.display='block';
  g('d-right').textContent = state.right;
  g('d-wrong').textContent = state.wrong;
  g('hdr-score').textContent = state.right + '/' + (state.right+state.wrong);
  g('d-fill').style.width = Math.round((state.right+state.wrong)/state.order.length*100)+'%';
}

g('btn-next').addEventListener('click', function(){ state.idx++; render(); });
document.addEventListener('keydown', function(e){
  if(!state.answered){
    var L = e.key.toUpperCase();
    if(['A','B','C','D'].indexOf(L) >= 0){
      var q = QUESTIONS[state.order[state.idx]];
      if(q && q.choices.some(function(c){return c.letter===L;})) answer(q, L);
    }
  } else if(e.code==='Space' || e.key==='Enter'){ e.preventDefault(); state.idx++; render(); }
});

function showResults(){
  g('qcard').style.display='none';
  g('results').style.display='block';
  var total = state.right + state.wrong;
  var pct = total>0 ? Math.round(state.right/total*100) : 0;
  g('res-score').textContent = pct + '%';
  g('res-sub').textContent = state.right+' of '+total+' correct'+(state.missed.length?' · '+state.missed.length+' queued for re-drill':'');
  var rows = g('topic-rows'); rows.innerHTML='';
  Object.keys(state.perTopic).forEach(function(t){
    var s = state.perTopic[t];
    var p = Math.round(s.r/s.t*100);
    var color = p>=80 ? '#1d9e75' : p>=60 ? '#c9973a' : '#e24b4a';
    var row = document.createElement('div');
    row.className='t-row';
    row.innerHTML = '<div class="t-name">'+t+'</div><div class="t-bar"><div class="t-fill" style="width:'+p+'%;background:'+color+';"></div></div><div class="t-pct">'+s.r+'/'+s.t+' · '+p+'%</div>';
    rows.appendChild(row);
  });
  g('btn-missed').style.display = state.missed.length ? 'inline-block' : 'none';
}

g('btn-missed').addEventListener('click', function(){ start(shuffle(state.missed.slice())); });
g('btn-again').addEventListener('click', function(){ start(shuffle(idsFor(state.filter))); });
g('btn-shuffle').addEventListener('click', function(){ start(shuffle(idsFor(state.filter))); });
g('btn-order').addEventListener('click', function(){ start(idsFor(state.filter)); });

buildFilters();
start(shuffle(idsFor('All')));
})();
</script>
