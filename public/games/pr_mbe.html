ney-client communication to be considered confidential, the communicating person must reasonably believe that no outsider will hear the contents. The presence of a third party will not destroy confidentiality if the third party was present to help further the attorney-client relationship — the third party need not be an agent or play a direct role. For example, a third party may be present because of the client's psychological needs.","verify":false,"id":117}, {"topic":"Confidentiality","style":"BARBRI","stem":"Which of these statements regarding confidential information and privileged information is true?","choices":[{"letter":"A","text":"An attorney cannot reveal privileged or confidential information unless the client expressly consents"},{"letter":"B","text":"An attorney generally has implied authority from the client to use or disclose confidential information when appropriate to carry out the representation, but cannot reveal privileged information unless the client expressly consents"},{"letter":"C","text":"An attorney generally has implied authority from the client to use or disclose privileged information when appropriate to carry out the representation, but cannot reveal confidential information unless the client expressly consents"},{"letter":"D","text":"An attorney generally has implied authority from the client to reveal privileged or confidential information when appropriate to carry out the representation"}],"correct":"B","explanation":"An attorney has implied authority from the client to use or disclose confidential information when appropriate to carry out the representation, unless the client gives specific instructions to the contrary. However, the attorney-client privilege exists for the sole benefit of the client, and only the client can waive the privilege. The attorney cannot choose to waive the privilege without the client's express consent.","verify":false,"id":118}, {"topic":"Confidentiality","style":"BARBRI","stem":"An attorney has an ethical duty not to reveal a client's confidential information, even if she _________.","choices":[{"letter":"A","text":"Has been ordered to do so by a court"},{"letter":"B","text":"Is defending her own conduct in a dispute involving her conduct"},{"letter":"C","text":"Believes disclosure is necessary in the interest of justice"},{"letter":"D","text":"Is seeking legal ethics advice"}],"correct":"C","explanation":"An attorney's belief that disclosure is necessary in the interest of justice is not an exception to the duty of confidentiality. An attorney may reveal confidential information to defend her own conduct in a dispute, to obtain legal ethics advice, or when required to do so by law or court order. But a general belief that justice would be served by disclosure does not satisfy any recognized exception.","verify":false,"id":119}, {"topic":"Confidentiality","style":"BARBRI","stem":"Which of the following statements is correct regarding disclosure and use of attorney-client information?","choices":[{"letter":"A","text":"Both the attorney-client privilege and the ethical duty of confidentiality concern only the disclosure of information"},{"letter":"B","text":"Both the attorney-client privilege and the ethical duty of confidentiality concern both the disclosure and use of information"},{"letter":"C","text":"The ethical duty of confidentiality concerns only the disclosure of information, whereas the attorney-client privilege concerns both the disclosure and use of information"},{"letter":"D","text":"The attorney-client privilege concerns only the disclosure of information, whereas the ethical duty of confidentiality concerns both the disclosure and use of information"}],"correct":"D","explanation":"The attorney-client privilege concerns only the disclosure of information. In contrast, the ethical duty of confidentiality concerns both the disclosure and use of information. An attorney can be disciplined for disclosing a client's confidential information without informed consent, or for using confidential information to the disadvantage of a client, former client, or prospective client, without the affected client's informed consent.","verify":false,"id":120}, {"topic":"Confidentiality","style":"BARBRI","stem":"When a lawyer is representing a corporate client, which of these is NOT required for the lawyer's communications with a lower level corporate employee to be protected by the attorney-client privilege?","choices":[{"letter":"A","text":"The employee communicates with the lawyer at the direction of the employee's superior"},{"letter":"B","text":"The communication concerns a subject within the scope of the employee's duties to act for the corporation"},{"letter":"C","text":"The employee knows that the purpose of the communication is to obtain legal advice for the corporation"},{"letter":"D","text":"The employee invokes the attorney-client privilege on behalf of the corporation"}],"correct":"D","explanation":"There is no need for the employee to explicitly invoke the attorney-client privilege for the privilege to apply. The privilege covers communications between a lawyer and lower-level corporate employees if: (i) the employee communicates with the lawyer at the direction of the employee's superior; (ii) the employee knows that the purpose of the communication is to obtain legal advice for the corporation; and (iii) the communication concerns a subject within the scope of the employee's duties to act for the corporation.","verify":false,"id":121}, {"topic":"Confidentiality","style":"BARBRI","stem":"Under modern law, how does the presence of an unsuspected eavesdropper affect the confidentiality of an attorney-client communication?","choices":[{"letter":"A","text":"The confidentiality of the communication is destroyed, but the eavesdropper can be prohibited from testifying about the communication"},{"letter":"B","text":"The communication remains confidential, and the eavesdropper can be prohibited from testifying about the communication"},{"letter":"C","text":"The communication remains confidential, but the eavesdropper can choose to testify about the communication"},{"letter":"D","text":"The confidentiality of the communication is destroyed, and the eavesdropper can choose to testify about the communication"}],"correct":"B","explanation":"Under modern law, a confidential communication remains confidential despite the presence of an unsuspected eavesdropper, and the eavesdropper can be prohibited from testifying about the confidential communication. Under older law, the presence of an unsuspected eavesdropper was sometimes held to destroy the confidentiality of a communication, but under modern evidence law this is no longer true.","verify":false,"id":122}, {"topic":"Confidentiality","style":"BARBRI","stem":"Who can choose to waive the attorney-client privilege?","choices":[{"letter":"A","text":"The attorney only"},{"letter":"B","text":"No one, because the attorney-client privilege is absolute and unwaivable"},{"letter":"C","text":"Either the client or the attorney"},{"letter":"D","text":"The client only"}],"correct":"D","explanation":"Only the client can waive the attorney-client privilege, as the client is the \"holder\" of the privilege. A waiver consists of a failure to claim the privilege when there is an opportunity to do so, or the intentional revelation of a significant portion of the privileged communication. The attorney cannot choose to waive the privilege. If someone tries to obtain privileged information when the client is not present, the attorney must claim the privilege on the client's behalf.","verify":false,"id":123}, {"topic":"Confidentiality","style":"BARBRI","stem":"When does a lawyer's duty to preserve a client's confidential information cease?","choices":[{"letter":"A","text":"After all pending cases have ended, including any possible appeals"},{"letter":"B","text":"It does not cease"},{"letter":"C","text":"After the client dies"},{"letter":"D","text":"Only if the client chooses to fire the lawyer"}],"correct":"B","explanation":"An attorney's duty to preserve a client's confidential information does not cease when the representation ends, even when any possible appeals have ended. It also does not cease after the client dies or if the client fires the lawyer.","verify":false,"id":124}, {"topic":"Confidentiality","style":"BARBRI","stem":"Which of the following statements is correct regarding the attorney-client privilege?","choices":[{"letter":"A","text":"It does not apply in a courtroom, i.e., an attorney may be compelled to testify as to confidential communications between himself and his client"},{"letter":"B","text":"It prohibits an attorney from voluntarily revealing any information relating to the representation of a client"},{"letter":"C","text":"It prevents a court from compelling the revelation of confidential communications between an attorney and a client"},{"letter":"D","text":"It applies only outside the courtroom"}],"correct":"C","explanation":"The attorney-client privilege is an exclusionary rule of evidence law. It prevents a court, or other governmental tribunal, from using the twin powers of subpoena and contempt to compel the revelation of confidential communications between an attorney and a client. In contrast, the ethical duty of confidentiality — rather than the attorney-client privilege — prohibits an attorney from voluntarily revealing information relating to the representation of a client.","verify":false,"id":125}, {"topic":"Confidentiality","style":"BARBRI","stem":"If someone tries to obtain privileged information from an attorney when the client is not present, the attorney __________.","choices":[{"letter":"A","text":"May decide whether to reveal the information based on his own best interests"},{"letter":"B","text":"Must claim the attorney-client privilege on the client's behalf and not reveal the information"},{"letter":"C","text":"May decide whether to reveal the information based on his client's best interests"},{"letter":"D","text":"Must claim the attorney-client privilege on his own behalf and not reveal the information"}],"correct":"B","explanation":"If someone tries to obtain privileged information from an attorney when the client is not present, the lawyer must claim the privilege on the client's behalf. The attorney-client privilege exists for the benefit of the client, not the attorney. The client is the \"holder\" of the privilege and the only one who can waive it. The attorney cannot choose to waive the privilege without the client's permission.","verify":false,"id":126}, {"topic":"Conflicts","style":"BARBRI","stem":"What is informed consent?","choices":[{"letter":"A","text":"When a client agrees to a proposed course of conduct after the lawyer has sufficiently explained the material risks and reasonable alternatives"},{"letter":"B","text":"When a client agrees to a proposed course of conduct on the advice of the lawyer"},{"letter":"C","text":"When a client agrees to a proposed course of conduct after consulting with a second, independent lawyer"}],"correct":"A","explanation":"Informed consent means that the client agrees to a proposed course of conduct after the lawyer has sufficiently explained the material risks and reasonable alternatives. The client must be given sufficient information by the lawyer and not simply rely on the advice of the lawyer. There is no requirement that the client must consult with a second, independent lawyer to provide informed consent.","verify":false,"id":127}, {"topic":"Conflicts","style":"BARBRI","stem":"A conflict of interest arises when there is a __________ risk that the lawyer's representation of the client will be materially and adversely affected by the lawyer's own interests or the lawyer's duties to __________.","choices":[{"letter":"A","text":"Reasonable; another current client, a former client, or a third person"},{"letter":"B","text":"Significant; another current client, a former client, or a third person"},{"letter":"C","text":"Reasonable; another current or former client"},{"letter":"D","text":"Significant; another current or former client"}],"correct":"B","explanation":"A conflict of interest arises when there is a substantial risk (not 'reasonable' or 'significant') that the lawyer's representation of the client will be materially and adversely affected by the lawyer's own interests or the lawyer's duties to another current client, a former client, or a third person. A conflict may arise from a lawyer's duties not just to current and former clients but also to third persons, such as fiduciary duties arising from a lawyer's service as a trustee.","verify":false,"id":128}, {"topic":"Conflicts","style":"BARBRI","stem":"If an attorney mishandles a client conflict, she may be subject to any or all of the following:","choices":[{"letter":"A","text":"Disqualification as counsel and/or professional discipline only"},{"letter":"B","text":"Disqualification as counsel, professional discipline, civil liability for legal malpractice, criminal liability for legal malpractice"},{"letter":"C","text":"Disqualification as counsel, professional discipline, civil liability for legal malpractice"},{"letter":"D","text":"Disqualification as counsel, professional discipline, criminal liability for legal malpractice"}],"correct":"C","explanation":"If an attorney mishandles a client conflict, she may be subject to disqualification as counsel, professional discipline, and/or civil liability for legal malpractice. There is no criminal liability for legal malpractice.","verify":false,"id":129}, {"topic":"Conflicts","style":"BARBRI","stem":"Generally, when a lawyer is barred from taking on a matter due to a conflict of interest, the other lawyers in her firm _________________.","choices":[{"letter":"A","text":"Are also barred from taking on the matter in all circumstances"},{"letter":"B","text":"Are not barred from taking on the matter"},{"letter":"C","text":"Are also barred from taking on the matter, unless the conflict is uniquely personal to that lawyer"},{"letter":"D","text":"Are not barred from taking on the matter unless they actively worked on the prior matter that gave rise to the conflict"}],"correct":"C","explanation":"Generally, when a lawyer is barred from taking on a matter due to a conflict of interest, the other lawyers in her firm are also barred, unless the conflict is uniquely personal to that lawyer. For example, if the conflict arose from an improper personal relationship with the client, other lawyers in the firm would not have the conflict imputed to them.","verify":false,"id":130}, {"topic":"Conflicts","style":"BARBRI","stem":"Despite a concurrent conflict of interest, a lawyer may represent a client as long as the representation is not prohibited by law and __________.","choices":[{"letter":"A","text":"The representation does not involve asserting a claim by one client against the other in the same litigation"},{"letter":"B","text":"Each affected client gives informed consent, the representation does not involve asserting a claim by one client against the other in the same litigation, OR the lawyer believes he can competently and diligently represent both clients despite the conflict"},{"letter":"C","text":"Each affected client gives informed consent, the representation does not involve asserting a claim by one client against the other in the same litigation, AND the lawyer believes he can competently and diligently represent both clients despite the conflict"},{"letter":"D","text":"Each affected client gives informed consent, OR the representation does not involve asserting a claim by one client against the other in the same litigation"}],"correct":"C","explanation":"Despite a concurrent conflict of interest, a lawyer may represent a client if: the representation is not prohibited by law, the representation does not involve asserting a claim by one client against the other in the same litigation, the lawyer believes he can competently and diligently represent both clients, AND each affected client gives informed consent confirmed in writing. All conditions must be met.","verify":false,"id":131}, {"topic":"Conflicts","style":"BARBRI","stem":"Generally, a lawyer __________ represent criminal co-defendants __________.","choices":[{"letter":"A","text":"Should not; because their interests are likely to be divergent"},{"letter":"B","text":"May; because their interests are likely to be similar"},{"letter":"C","text":"May; as long as both co-defendants agree to the representation"},{"letter":"D","text":"Should not; because doing so is expressly prohibited by the Rules of Professional Conduct"}],"correct":"A","explanation":"A lawyer should not represent criminal co-defendants because their interests are likely to be divergent, negatively affecting their Sixth Amendment right to effective assistance of counsel. However, the Rules do NOT expressly prohibit such representation. Examples of divergent interests: one defendant seeks to blame the other; stories are inconsistent; one defendant's strong defense is compromised to protect the other; trial tactics that help one would harm the other.","verify":false,"id":132}, {"topic":"Conflicts","style":"BARBRI","stem":"Which of the following represents a conflict of interest?","choices":[{"letter":"A","text":"Sarah represents Defendant Daryl in a personal injury case. Daryl is also a named class member in a class action suit against John, and John is also Sarah's client"},{"letter":"B","text":"Sarah represents both Daryl and John. In Daryl's case she argues ABC Act is unconstitutional; in John's case in a different circuit she argues ABC Act is constitutional"},{"letter":"C","text":"Sarah represents Defendant Daryl in a wrongful death case. Daryl is also an unnamed class member in a class action suit against John, and John is also Sarah's client"}],"correct":"A","explanation":"When Daryl is a named class member in a suit against John (who is also Sarah's client), a conflict exists. Unnamed class members are not regarded as clients for conflict purposes. A lawyer can generally represent two clients with inconsistent legal positions in different circuits without conflict, unless one court's decision is likely to become controlling in the other case.","verify":false,"id":133}, {"topic":"Conflicts","style":"BARBRI","stem":"If two clients in a __________ are represented by the same lawyer, and a potential conflict ripens into a present conflict, their lawyer is required to (1) analyze the facts, (2) disclose the potential conflict to both clients, (3) invite them to give informed consent, and (4) consider whether a reasonable lawyer would advise these clients to consent.","choices":[{"letter":"A","text":"Nonlitigation matter"},{"letter":"B","text":"Litigation or nonlitigation matter"},{"letter":"C","text":"Litigation matter"}],"correct":"B","explanation":"The same rules for handling conflicts apply to both litigation and nonlitigation matters. The lawyer must withdraw from joint representation if a reasonable lawyer would have to advise either client not to consent. The lawyer may continue to represent one consenting client, but only if the dropped client gives informed consent to the continuation, confirmed in writing.","verify":false,"id":134}, {"topic":"Conflicts","style":"BARBRI","stem":"In litigation between two people who were formerly joint clients of a single lawyer, ____________ can claim the attorney-client privilege for their communications with that lawyer.","choices":[{"letter":"A","text":"The person who hired the lawyer last"},{"letter":"B","text":"The person who hired the lawyer first"},{"letter":"C","text":"Neither of them"},{"letter":"D","text":"Both of them"}],"correct":"C","explanation":"In litigation between two people who were formerly joint clients of a single lawyer, neither of them can claim the attorney-client privilege for their communications with that lawyer. The lawyer should warn the clients about this before undertaking multiple representation.","verify":false,"id":135}, {"topic":"Conflicts","style":"BARBRI","stem":"When a lawyer is taking on a new matter, if the lawyer's interests are likely to __________ her ability to represent a client effectively, she must __________.","choices":[{"letter":"A","text":"Limit to any extent; not take on the matter"},{"letter":"B","text":"Materially limit; not take on the matter unless she obtains informed consent, confirmed in writing, from her client"},{"letter":"C","text":"Limit to any extent; not take on the matter unless she obtains informed consent, confirmed in writing, from her client"},{"letter":"D","text":"Materially limit; not take on the matter"}],"correct":"B","explanation":"If a lawyer's interests are likely to materially limit her ability to represent a client effectively, she must not take on the matter (or must withdraw from an existing matter) unless she obtains informed consent, confirmed in writing. If the limitation is not material, there is no conflict.","verify":false,"id":136}, {"topic":"Conflicts","style":"BARBRI","stem":"Lucy is Calvin's family lawyer. Calvin is selling his house and hires another lawyer to represent him. Lucy wants to buy Calvin's house. They work out the details, Lucy ensures the deal is fair and laid out clearly in writing. Calvin's new lawyer discloses the conflict, and Calvin signs informed consent. Can the parties proceed?","choices":[{"letter":"A","text":"No, because Lucy should have disclosed the conflict directly to Calvin"},{"letter":"B","text":"No, because Lucy should have advised Calvin to retain independent counsel"},{"letter":"C","text":"Yes, this transaction meets the requirements for managing the conflict"},{"letter":"D","text":"No, because Lucy should have disclosed the conflict directly to Calvin and because Lucy should have advised Calvin to retain independent counsel"}],"correct":"C","explanation":"This transaction meets the requirements: (i) terms are fair to the client; (ii) terms are fully disclosed in writing in understandable language; (iii) client is advised to get independent counsel advice (but if the client already has independent counsel, that counsel may make the disclosure); (iv) client gives informed consent in a writing the client signs. Note: the lawyer need not advise the client to get independent counsel if the client already has independent counsel in the matter.","verify":false,"id":137}, {"topic":"Conflicts","style":"BARBRI","stem":"Unless the client gives informed consent or some other exception applies, a lawyer may be disciplined for using the confidential information of a __________ client to that client's disadvantage.","choices":[{"letter":"A","text":"Current or prospective"},{"letter":"B","text":"Current, former, or prospective"},{"letter":"C","text":"Current or former"},{"letter":"D","text":"Current"}],"correct":"B","explanation":"A lawyer may be disciplined for using the confidential information of a current, former, or prospective client to that client's disadvantage (unless the client gives informed consent or an exception applies). The rule applies to all three categories.","verify":false,"id":138}, {"topic":"Conflicts","style":"BARBRI","stem":"Under the ABA Model Rules, a lawyer must NOT __________ from a client who is not the lawyer's relative.","choices":[{"letter":"A","text":"Solicit a substantial gift"},{"letter":"B","text":"Solicit or accept any gift"},{"letter":"C","text":"Solicit any gift"},{"letter":"D","text":"Solicit or accept a substantial gift"}],"correct":"A","explanation":"A lawyer must not solicit a substantial gift from a client who is not the lawyer's relative (which includes spouse, child, parent, grandparent, grandchild, and others with whom the lawyer maintains a close familial relationship). A lawyer may accept even a substantial gift (though it may be voidable for undue influence), but may not solicit one. The prohibition is on soliciting substantial gifts, not on accepting them.","verify":false,"id":139}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer __________ acquire literary or media rights to her client's life story __________ her client's story is not based substantially on information relating to the representation.","choices":[{"letter":"A","text":"May; at any time, provided that"},{"letter":"B","text":"May; only after the client's legal matter is entirely completed (including appeals), even if"},{"letter":"C","text":"May not; even if"}],"correct":"A","explanation":"A lawyer may acquire literary or media rights to her client's life story at any time, provided that the story is not based substantially on information relating to the representation. If the story is based substantially on information relating to the representation, the lawyer must wait until the client's legal matter is entirely completed (including appeals).","verify":false,"id":140}, {"topic":"Conflicts","style":"BARBRI","stem":"Under the ABA Model Rules, which of the following statements is FALSE?","choices":[{"letter":"A","text":"A lawyer may pay an indigent client's court costs and litigation expenses outright"},{"letter":"B","text":"A lawyer may advance court costs and litigation expenses for any client on a contingency fee basis"},{"letter":"C","text":"A lawyer must not assist an indigent client with their living expenses under any circumstances"},{"letter":"D","text":"A lawyer must not assist an indigent client with their living expenses, unless representing the indigent client pro bono"}],"correct":"C","explanation":"FALSE: 'A lawyer must not assist an indigent client with their living expenses under any circumstances.' A lawyer representing an indigent client pro bono CAN provide modest gifts for basic living expenses. The valid exceptions: (i) advance court costs and litigation expenses for any client (repayment contingent on outcome); (ii) pay an indigent client's court costs outright; (iii) a pro bono lawyer may provide modest gifts for basic living expenses.","verify":false,"id":141}, {"topic":"Conflicts","style":"BARBRI","stem":"When a lawyer represents several co-parties and the adversary makes an aggregate settlement offer, which statement is true?","choices":[{"letter":"A","text":"The lawyer must advise the clients to retain independent counsel to advise them on how to split the settlement amount"},{"letter":"B","text":"The clients must come to an agreement themselves about how the aggregate sum will be shared"},{"letter":"C","text":"Even though the lawyer owes a duty to each client, the lawyer must provide a professional opinion as to how the sum should be shared between them"}],"correct":"B","explanation":"When an aggregate settlement is offered, the lawyer must: (1) make sure clients have come to an agreement among themselves about the division; (2) disclose to each client the terms of the settlement; (3) each client gives informed consent in writing. The lawyer must NOT give an opinion on how to split the sum. No requirement to advise clients to retain independent counsel.","verify":false,"id":142}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer must not acquire a proprietary interest in the cause of action or the subject matter of litigation she is conducting for the client. Which of the following is most likely prohibited?","choices":[{"letter":"A","text":"A lawyer is paid on a contingency fee basis"},{"letter":"B","text":"A lawyer represents a client in patent litigation and, as payment, is given a 50% ownership in the patent"},{"letter":"C","text":"A lawyer is paid via a lien against the proceeds of a case"}],"correct":"B","explanation":"Acquiring a 50% ownership interest in the patent (the subject matter of the litigation) violates the rule. Permitted exceptions: contingency fee basis and a lien against the proceeds of the case (where permitted by state law). The client's informed consent does not cure this prohibition.","verify":false,"id":143}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer must not accept compensation from a third person for representing a client, unless (1) the client gives informed consent, ____________.","choices":[{"letter":"A","text":"(2) The third person does not interfere with the lawyer's independence or the representation, and (3) the arrangement does not compromise the client's confidential information"},{"letter":"B","text":"(2) The third person does not interfere, (3) the arrangement does not compromise confidential information, and (4) the client is indigent"},{"letter":"C","text":"(2) The arrangement does not compromise confidential information, and (3) the client is indigent"},{"letter":"D","text":"(2) The third person does not interfere, and (3) the third person is a close relative of the client"}],"correct":"A","explanation":"A lawyer may accept third-party compensation if: (i) client gives informed consent; (ii) the third person does not interfere with the lawyer's independence or the representation; and (iii) the arrangement does not compromise the client's confidential information. No requirement that the client be indigent or that the third person be a relative.","verify":false,"id":144}, {"topic":"Conflicts","style":"BARBRI","stem":"When an insurance company hires an attorney to defend the policyholder, some states hold that _________________________, while others hold that _________________________.","choices":[{"letter":"A","text":"The insurance company is the attorney's sole client; the policyholder and the insurance company are joint clients"},{"letter":"B","text":"The policyholder is the attorney's sole client; the policyholder and the insurance company are joint clients"},{"letter":"C","text":"The policyholder is the attorney's sole client; the insurance company is the attorney's sole client"}],"correct":"B","explanation":"Some states hold that the policyholder is the attorney's sole client; others hold that the policyholder and the insurance company are joint clients. Generally, state laws do not provide that the insurance company is the attorney's sole client.","verify":false,"id":145}, {"topic":"Conflicts","style":"BARBRI","stem":"Insurance Company C hires attorney A to defend policyholder D. The liability limit is $500,000; P offers to settle for $450,000. D wants to settle but C wants to go to trial. A must:","choices":[{"letter":"A","text":"Disclose the conflict to D and invite D to obtain independent counsel (at C's expense) to advise D on the settlement issue"},{"letter":"B","text":"Settle per D's wishes"},{"letter":"C","text":"Disclose the conflict to D and invite D to obtain independent counsel (at D's expense) to advise D on the settlement issue"},{"letter":"D","text":"Go to trial per C's wishes"}],"correct":"A","explanation":"A must disclose the conflict to D and invite D to obtain independent counsel at C's expense to advise D on the settlement issue. If A fails to do so and negligently or in bad faith advises D to reject the settlement, A is subject to discipline and civil liability. If C negligently or in bad faith rejects the settlement, C will be liable for the entire judgment even above policy limits. Independent counsel must be at C's expense, not D's.","verify":false,"id":146}, {"topic":"Conflicts","style":"BARBRI","stem":"When a former client has given confidential information to a lawyer, the lawyer __________ later oppose the former client in any matter in which the confidential information would be relevant, __________.","choices":[{"letter":"A","text":"May not; unless the former client gives informed consent, confirmed in writing"},{"letter":"B","text":"May not; under any circumstances"},{"letter":"C","text":"May; if the lawyer reasonably believes she can refrain from using the information against the client"}],"correct":"A","explanation":"A lawyer may not later oppose a former client in any matter in which the confidential information would be relevant, unless the former client gives informed consent, confirmed in writing. It is not true that the lawyer may oppose the former client if she merely believes she can refrain from using the information.","verify":false,"id":147}, {"topic":"Conflicts","style":"BARBRI","stem":"When a former client has imparted confidential information to a lawyer, and that information later becomes public knowledge (through no fault of the lawyer), the lawyer __________.","choices":[{"letter":"A","text":"May not use the formerly confidential information to the former client's disadvantage under any circumstances"},{"letter":"B","text":"May not use the formerly confidential information to the former client's disadvantage, unless the former client gives informed consent, confirmed in writing"},{"letter":"C","text":"May use the formerly confidential information to the former client's disadvantage"}],"correct":"C","explanation":"When formerly confidential information becomes public knowledge (through no fault of the lawyer), the lawyer may use it to the former client's disadvantage. Normally, the lawyer could not use such information without informed consent confirmed in writing. But if the information is now public, the former client's consent is no longer needed.","verify":false,"id":148}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer whose former firm represented a client in a matter and who acquired information pertaining to the representation may not thereafter represent another person in the same matter if that person's interests are __________________________________.","choices":[{"letter":"A","text":"Materially adverse to those of the former client (unless the former client gives informed consent, confirmed in writing)"},{"letter":"B","text":"Potentially adverse to those of the former client (whether or not informed consent is obtained)"},{"letter":"C","text":"Potentially adverse to those of the former client (unless the former client gives informed consent, confirmed in writing)"},{"letter":"D","text":"Materially adverse to those of the former client (whether or not informed consent is obtained)"}],"correct":"A","explanation":"The standard is materially adverse (not potentially adverse). The former client's informed consent, confirmed in writing, can cure the conflict. The choices stating 'whether or not informed consent is obtained' are incorrect.","verify":false,"id":149}, {"topic":"Conflicts","style":"BARBRI","stem":"At ABC law firm, Lawyer L represented C in the matter of C v. D and was privy to confidential material from C. L then left ABC and joined JKM. Can another lawyer at JKM represent R in the substantially related matter of R v. C?","choices":[{"letter":"A","text":"Yes, but only if L is properly screened, does not share fees from the matter, and C is given notice"},{"letter":"B","text":"Yes, but only if L is properly screened, does not share fees from the matter, and C gives informed consent confirmed in writing"},{"letter":"C","text":"Yes, under all circumstances"},{"letter":"D","text":"No, under any circumstances"}],"correct":"A","explanation":"If a lawyer who is disqualified joins a new firm, the new firm may take the representation if the disqualified lawyer is properly screened, does not share fees from the matter, and the former client is given notice. There is no requirement that C give informed consent — notice is sufficient.","verify":false,"id":150}, {"topic":"Conflicts","style":"BARBRI","stem":"Except when expressly permitted by law, a lawyer who leaves government service and enters private practice must not represent a private client in ___________________________.","choices":[{"letter":"A","text":"A matter materially adverse to the government, unless the government agency gives informed consent, confirmed in writing"},{"letter":"B","text":"A matter in which the lawyer participated personally and substantially while in government service, without first notifying the government agency"},{"letter":"C","text":"A matter in which the lawyer participated personally and substantially while in government service, unless the government agency gives informed consent, confirmed in writing"},{"letter":"D","text":"A matter materially adverse to the government, without first notifying the government agency"}],"correct":"C","explanation":"A lawyer leaving government service must not represent a private client in a matter in which the lawyer participated personally and substantially while in government service, unless the government agency gives informed consent, confirmed in writing. The issue is personal substantial participation, not merely adverse-to-government. Mere notice is insufficient — the agency must give informed consent.","verify":false,"id":151}, {"topic":"Conflicts","style":"BARBRI","stem":"Except when expressly permitted by law, a government lawyer who receives confidential government information about a person __________.","choices":[{"letter":"A","text":"May later represent a private client whose interests are adverse to that person, even if the information could be used to the material disadvantage of that person"},{"letter":"B","text":"May not later represent a private client whose interests are adverse to that person, when the information could be used to the material disadvantage of that person"},{"letter":"C","text":"May later represent a private client whose interests are adverse to that person, as long as he provides the government agency with written notice"},{"letter":"D","text":"May not later represent a private client whose interests are adverse to that person even if the information will not materially disadvantage that person"}],"correct":"B","explanation":"A government lawyer who receives confidential government information about a person may not later represent a private client whose interests are adverse to that person when the information could be used to the material disadvantage of that person. The lawyer may represent such a client if the information will NOT materially disadvantage that person. Written notice to the government agency does not cure the conflict.","verify":false,"id":152}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer Larry currently works for the NYC Landmarks Commission, representing it in disputes with Blackacre Real Estate. Larry oversaw all litigation against Blackacre and personally appeared in court. Blackacre offered Larry a position as general counsel and Larry accepted. Is Larry subject to discipline?","choices":[{"letter":"A","text":"Yes, because Larry negotiated private employment with a party in a matter for which the Commission was directly and substantially involved, regardless of Larry's own involvement"},{"letter":"B","text":"Yes, because Larry negotiated private employment with an entity that is involved as a party in a matter in which Larry is participating personally and substantially"},{"letter":"C","text":"No, because Larry did not seek out employment with Blackacre; Blackacre approached Larry"},{"letter":"D","text":"No, because Larry's employment with the Commission is at will"}],"correct":"B","explanation":"A government attorney may be subject to discipline for negotiating private employment with an entity involved as a party in a matter in which the attorney is participating personally and substantially. Larry's own involvement is material. It does not matter that Blackacre approached Larry, or that his employment was at will. Note the special exception for law clerks does not apply here.","verify":false,"id":153}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer is prohibited from representing a private client in a matter in which the lawyer has previously participated personally and substantially while serving as a judge or other adjudicative officer, __________________________.","choices":[{"letter":"A","text":"Unless all parties to the proceedings are notified"},{"letter":"B","text":"Under any circumstances"},{"letter":"C","text":"Unless all parties to the proceedings give informed consent, confirmed in writing"}],"correct":"C","explanation":"A lawyer must not represent a private client in a matter in which the lawyer previously participated personally and substantially while serving as a judge, adjudicative officer, law clerk to such person, or neutral arbitrator/mediator, unless all parties to the proceedings give informed consent, confirmed in writing. Mere notification is insufficient.","verify":false,"id":154}, {"topic":"Conflicts","style":"BARBRI","stem":"__________ are always forbidden from negotiating for private employment with a party (or the attorney for a party) in a matter in which they are __________.","choices":[{"letter":"A","text":"Law clerks, judges, arbitrators, and mediators; participating personally and substantially"},{"letter":"B","text":"Law clerks, judges, arbitrators, and mediators; participating in any way"},{"letter":"C","text":"Judges, arbitrators, and mediators; participating personally and substantially"},{"letter":"D","text":"Judges, arbitrators, and mediators; participating in any way"}],"correct":"C","explanation":"Judges, arbitrators, mediators, third-party neutrals, and other adjudicative officers are forbidden to negotiate for private employment with a party in a matter in which they are participating personally and substantially. Law clerks are subject to a SPECIAL RULE: they may negotiate for private employment if they notify that judge/officer in advance. Mere participation (not personal and substantial) is insufficient to trigger the prohibition.","verify":false,"id":155}, {"topic":"Conflicts","style":"BARBRI","stem":"When a lawyer meets with a prospective client who does not become an actual client, confidential information shared during that meeting __________.","choices":[{"letter":"A","text":"Is protected by attorney-client privilege and the ethical duty of confidentiality"},{"letter":"B","text":"Is protected by attorney-client privilege but not by the ethical duty of confidentiality"},{"letter":"C","text":"Is not protected by attorney-client privilege or the ethical duty of confidentiality"},{"letter":"D","text":"Is protected by the ethical duty of confidentiality but not by attorney-client privilege"}],"correct":"A","explanation":"Confidential information shared by a prospective client is protected by both attorney-client privilege and the ethical duty of confidentiality, even when the prospective client does not become an actual client. The lawyer must not reveal or use information learned from a prospective client unless an exception to confidentiality applies.","verify":false,"id":156}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer's conflict of interest will not be imputed to the rest of her firm if the conflict relates to duties owed to __________ and provided that the disqualified lawyer is __________.","choices":[{"letter":"A","text":"Former clients or current clients; timely screened from participation"},{"letter":"B","text":"Former clients or current clients; timely screened from participation and prohibited from receiving any part of the fee from that matter"},{"letter":"C","text":"Former clients from a prior firm; timely screened from participation and prohibited from receiving any part of the fee from that matter"},{"letter":"D","text":"Former clients from a prior firm; timely screened from participation"}],"correct":"C","explanation":"The screening procedure is only available when conflicts arise from duties owed to former clients from a prior firm. It is NOT available for current clients. The disqualified lawyer must be (1) timely screened from participation AND (2) prohibited from receiving any part of the fee. Prompt written notice must also be given to the former client.","verify":false,"id":157}, {"topic":"Conflicts","style":"BARBRI","stem":"Which of the following statements regarding client consent to conflicts is FALSE?","choices":[{"letter":"A","text":"A client may consent to conflicts that may arise in the future if it is reasonable to do so and if the client understands the particular conflicts that may arise"},{"letter":"B","text":"If a reasonable lawyer would conclude that the client's interests would not be adequately protected in light of the conflict, the conflict is unconsentable"},{"letter":"C","text":"An electronic record of consent to a conflict (e.g., via e-mail) sometimes can satisfy the requirement that the consent be in writing"},{"letter":"D","text":"A consent provision in a firm's standard engagement letter that states 'Client hereby consents to and waives any and all future conflicts of interest' represents valid consent to future conflicts"}],"correct":"D","explanation":"FALSE: A blanket consent in a standard engagement letter ('Client hereby consents to and waives any and all future conflicts of interest') is NOT valid consent to future conflicts. To provide valid consent, the client must understand the particular conflicts that may arise. All other answer choices are true statements.","verify":false,"id":158}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer's duties to __________ could give rise to a conflict of interest between the lawyer and her client.","choices":[{"letter":"A","text":"Another current or former client only"},{"letter":"B","text":"Another current client only"},{"letter":"C","text":"Another current client, a former client, or a third person"}],"correct":"C","explanation":"A lawyer's duties to another current client, a former client, or a third person could give rise to a conflict of interest. A conflict may arise from duties not just to current and former clients but also to third persons, such as fiduciary duties arising from a lawyer's service as a trustee.","verify":false,"id":159}, {"topic":"Conflicts","style":"BARBRI","stem":"If a conflict of interest arises after a lawyer has taken on a new client's matter, the lawyer must ________________.","choices":[{"letter":"A","text":"Withdraw"},{"letter":"B","text":"Withdraw, unless he gets proper informed consent from the new client and any other affected clients"},{"letter":"C","text":"Continue representing the new client and any other affected clients as long as he does not use any information to any client's disadvantage"}],"correct":"B","explanation":"If a conflict arises after representation begins, the lawyer must withdraw unless he gets proper informed consent from the new client and any other affected clients. The lawyer need not withdraw in all cases if informed consent is obtained.","verify":false,"id":160}, {"topic":"Conflicts","style":"BARBRI","stem":"One lawyer's conflict of interest ______________________.","choices":[{"letter":"A","text":"Is never imputed to the rest of the lawyers at her firm"},{"letter":"B","text":"Is always imputed to the rest of the lawyers at her firm"},{"letter":"C","text":"Is always imputed to the rest of the lawyers at her firm, unless the conflict is uniquely personal in nature"}],"correct":"C","explanation":"One lawyer's conflict of interest is always imputed to the rest of the lawyers at her firm, unless the conflict is uniquely personal in nature (e.g., if the conflict arose because of an improper personal relationship with the client, other lawyers at the firm would not have it imputed to them).","verify":false,"id":161}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer L represents Plaintiff P in a torts case. Defendant D approaches L about representing him as well. L believes he can competently and diligently represent both parties, and requests and receives informed consent confirmed in writing from both P and D. May L now represent both?","choices":[{"letter":"A","text":"No, because the representation involves asserting a claim by one client against the other in the same litigation"},{"letter":"B","text":"Yes, because Lawyer L obtained informed consent from Plaintiff P and Defendant D"},{"letter":"C","text":"Yes, because Lawyer L obtained informed consent from Plaintiff P"}],"correct":"A","explanation":"L may not represent both P and D because the representation involves asserting a claim by one client against the other in the same litigation. This is an unconsentable conflict of interest — informed consent does not cure it.","verify":false,"id":162}, {"topic":"Conflicts","style":"BARBRI","stem":"Client A and Client B, both defendants in a tort case, jointly retain Lawyer L. During discovery, L concludes the best defense for A would be to focus blame on B, and that it would not be reasonable to advise A and B to continue joint representation. What options are available to L?","choices":[{"letter":"A","text":"She can continue to represent both parties if they give her informed consent, confirmed in writing, after being made aware of this present conflict"},{"letter":"B","text":"She must continue to represent only one of the parties"},{"letter":"C","text":"She can withdraw from representing both parties, or continue to represent one party as long as the other grants informed consent, confirmed in writing"},{"letter":"D","text":"She must withdraw from representing both parties"}],"correct":"C","explanation":"L can withdraw from representing both parties, OR continue to represent one party as long as the other grants informed consent, confirmed in writing. She cannot continue to represent both parties even with informed consent if she has determined that it would not be reasonable to advise these clients to consent.","verify":false,"id":163}, {"topic":"Conflicts","style":"BARBRI","stem":"In class action litigation, the __________ members of a class ordinarily __________ regarded as clients for conflict of interest purposes.","choices":[{"letter":"A","text":"Unnamed; are not"},{"letter":"B","text":"Named and unnamed; are not"},{"letter":"C","text":"Named and unnamed; are"}],"correct":"A","explanation":"In class action litigation, unnamed members of a class ordinarily are not regarded as clients for conflict of interest purposes. Named members of a class would ordinarily be regarded as clients.","verify":false,"id":164}, {"topic":"Conflicts","style":"BARBRI","stem":"Husband and Wife hire Lawyer to draft their wills. A conflict ripens and Lawyer determines that a reasonable attorney would advise the clients not to consent to continued joint representation. What options are available to Lawyer?","choices":[{"letter":"A","text":"She must immediately withdraw from representing both of the parties"},{"letter":"B","text":"She can withdraw from representing both parties, or continue to represent one party as long as the other party grants informed consent, confirmed in writing"},{"letter":"C","text":"She can only withdraw from representing one party"}],"correct":"B","explanation":"Lawyer can withdraw from representing both parties, or continue to represent one party as long as the other grants informed consent, confirmed in writing. The same rules apply to both litigation and nonlitigation matters.","verify":false,"id":165}, {"topic":"Conflicts","style":"BARBRI","stem":"Generally, when a lawyer represents multiple parties in a matter, __________.","choices":[{"letter":"A","text":"Attorney-client privilege can be claimed by all of the parties in future litigation among those parties"},{"letter":"B","text":"Disclosures by one client will not be shared with any of the other clients"},{"letter":"C","text":"Disclosures by one client will be shared with all of the other clients"}],"correct":"C","explanation":"Generally, when a lawyer represents multiple parties, disclosures by one client will be shared with all of the other clients. The lawyer should warn clients about this before undertaking multiple representation. None of the jointly-represented clients can claim attorney-client privilege against the others in future litigation.","verify":false,"id":166}, {"topic":"Conflicts","style":"BARBRI","stem":"Which of the following conflicts of interest is most likely to be imputed to the other lawyers in a firm?","choices":[{"letter":"A","text":"A conflict caused by two sisters representing opposing sides in a real estate transaction"},{"letter":"B","text":"A conflict caused by a father and son representing opposing sides in litigation"},{"letter":"C","text":"A conflict caused by a lawyer owning stock in a corporation that is suing his client for fraud"},{"letter":"D","text":"A conflict caused by a sexual relationship between a lawyer and a client"}],"correct":"C","explanation":"A conflict caused by owning stock in a corporation suing his client is most likely to be imputed to other lawyers at the firm. Conflicts created by family relationships (spouses, siblings, parents/children) generally are not imputed to other lawyers at the firm. Conflicts arising from sexual relationships with clients are generally not imputed to other lawyers at the firm either.","verify":false,"id":167}, {"topic":"Conflicts","style":"BARBRI","stem":"An attorney must not enter into a business transaction with her client unless all of the following requirements are met: (1) the terms are fair to the client, (2) the terms are fully disclosed in writing in a manner the client can reasonably understand, (3) the client is advised in writing to get the advice of an independent lawyer, __________.","choices":[{"letter":"A","text":"And (4) the client gives his informed consent, which may be written or verbal"},{"letter":"B","text":"(4) The client retains an independent lawyer, and (5) the client gives his informed consent, which may be written or verbal"},{"letter":"C","text":"And (4) the client gives his informed consent in a signed writing"},{"letter":"D","text":"(4) The client retains an independent lawyer, and (5) the client gives his informed consent in a signed writing"}],"correct":"C","explanation":"The fourth requirement is that the client gives informed consent in a writing that the client signs. The client is advised to get independent counsel but need not actually retain independent counsel. Verbal consent is insufficient — the consent must be in writing signed by the client.","verify":false,"id":168}, {"topic":"Conflicts","style":"BARBRI","stem":"Which of the following is FALSE regarding a lawyer acquiring literary or media rights to her client's life story?","choices":[{"letter":"A","text":"The lawyer may be paid for her representation via a percentage of royalties from the story if certain procedures are followed"},{"letter":"B","text":"The lawyer may acquire such rights while representing the client provided the story is not based substantially on information related to the representation"},{"letter":"C","text":"The lawyer may only acquire such rights after the client's legal matter is entirely completed (including appeals), even if the client's life story is not based on information substantially related to the representation"}],"correct":"C","explanation":"FALSE: The lawyer need not wait until the matter is completed if the story is NOT based substantially on information related to the representation. The restriction only applies if the story is based substantially on information related to the representation. Both A and B are true statements.","verify":false,"id":169}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer L represents non-indigent P1 and indigent P2 in separate cases with contingent fee agreements. L advances court costs for P1 (repayable if P1 wins), pays P2's court costs outright, and helps P2 pay rent. Which arrangements are forbidden?","choices":[{"letter":"A","text":"All of these arrangements"},{"letter":"B","text":"Advancing court costs and fees for P1 and helping pay P2's rent"},{"letter":"C","text":"Helping pay P2's rent and paying P2's court costs outright"},{"letter":"D","text":"Helping pay P2's rent"}],"correct":"D","explanation":"Only helping pay P2's rent is forbidden. A lawyer may advance court costs for any client with repayment contingent on outcome. A lawyer may pay an indigent client's court costs outright. A pro bono lawyer representing an indigent client may provide modest gifts for basic living expenses — but L is not representing P2 pro bono (there is a contingent fee agreement), so the pro bono exception does not apply to rent assistance.","verify":false,"id":170}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer represents co-parties in a matter, and the parties' adversary makes an aggregate settlement offer, the lawyer must not participate in negotiating the settlement unless all of the following conditions are met:","choices":[{"letter":"A","text":"He must assure clients have come to an agreement among themselves, disclose to each client the terms of the settlement, and each client must give informed consent to the aggregate settlement agreement in writing"},{"letter":"B","text":"Each client must give informed consent to the aggregate settlement agreement in writing"},{"letter":"C","text":"He must disclose the terms to each client, give his professional opinion on how funds should be split, and each client must give informed consent in writing"},{"letter":"D","text":"He must recommend in writing that each client obtain separate independent counsel, and if they decline, each client must give informed consent in writing"}],"correct":"A","explanation":"All three requirements must be met: (1) the lawyer must assure clients have come to an agreement among themselves; (2) disclose to each client the terms of the settlement; (3) each client gives informed consent in writing. The lawyer must NOT provide a professional opinion on how to split the funds. No requirement to recommend separate independent counsel.","verify":false,"id":171}, {"topic":"Conflicts","style":"BARBRI","stem":"Client C is being sued over copyright to a video game code. Lawyer L offers to represent C in exchange for 10% of the profits from the game. Is L subject to discipline?","choices":[{"letter":"A","text":"Yes, because L is violating the rule that a lawyer must not acquire a proprietary interest in the subject matter of litigation she is conducting for the client"},{"letter":"B","text":"No, because this is a valid contingency fee arrangement"},{"letter":"C","text":"Yes, unless C granted his informed consent, confirmed in writing"}],"correct":"A","explanation":"L is subject to discipline for acquiring a proprietary interest in the subject matter of litigation (the game's profits). Valid exceptions: contingency fees and liens against proceeds. A 10% ownership in the profits is not a contingency fee. A lawyer may not circumvent this rule even if the client provides informed consent.","verify":false,"id":172}, {"topic":"Conflicts","style":"BARBRI","stem":"Tom's brother hires Lawyer L to defend Tom in a personal injury case and wants to be informed of Tom's expected testimony and to approve all of L's major decisions. Can L agree to represent Tom under these conditions?","choices":[{"letter":"A","text":"No, because a lawyer may not represent a client if the third party is paying the client's legal fees"},{"letter":"B","text":"Yes, as long as Tom provides informed consent"},{"letter":"C","text":"Yes, he can represent Tom because his brother is a family member"},{"letter":"D","text":"No, because Tom's brother is asking L to compromise Tom's confidential information and seeks to interfere with L's independence"}],"correct":"D","explanation":"L cannot agree to these conditions because Tom's brother seeks to interfere with L's independence and compromise Tom's confidential information. Tom's informed consent would not solve this problem. A lawyer may accept third-party compensation only if: (i) client gives informed consent; (ii) the third person does not interfere with the lawyer's independence; and (iii) the arrangement does not compromise confidential information. Conditions (ii) and (iii) are not met here.","verify":false,"id":173}, {"topic":"Conflicts","style":"BARBRI","stem":"When an insurance company hires an attorney to defend a policyholder, the attorney's ethical obligations are governed by __________________________.","choices":[{"letter":"A","text":"The Rules of Professional Conduct and the insurance contract"},{"letter":"B","text":"The Rules of Professional Conduct"},{"letter":"C","text":"The insurance contract"}],"correct":"B","explanation":"The attorney's ethical obligations are governed by the Rules of Professional Conduct, not the insurance contract. This is true whether the defense lawyer represents the policyholder only or both the policyholder and the insurance company jointly.","verify":false,"id":174}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer is hired by a policyholder's insurance company to defend the policyholder, and the lawyer is offered a settlement that the policyholder objects to, the lawyer _____________________________.","choices":[{"letter":"A","text":"Must reject the offer"},{"letter":"B","text":"May agree to the settlement on behalf of the insurance company and the policyholder"},{"letter":"C","text":"Must disclose the conflict to the policyholder and invite the policyholder to obtain independent counsel at the insurance company's expense"},{"letter":"D","text":"Must not proceed without first giving the policyholder a chance to reject the insurance company's representation and to assume responsibility for her own defense at her own expense"}],"correct":"D","explanation":"When the policyholder objects to a settlement (insurance company wants to settle but policyholder does not), the lawyer must not proceed without first giving the policyholder a chance to reject the insurance company's representation and to assume responsibility for her own defense at her own expense. Note: answer C would be correct if the POLICYHOLDER wanted to settle and the insurance company did not — the opposite scenario.","verify":false,"id":175}, {"topic":"Conflicts","style":"BARBRI","stem":"For 10 years, Attorney A represented Client C in matters relating to C's clothing store. Two years after they parted ways, P slips and falls in C's store, and P seeks to hire A. Can A represent P in the case against C?","choices":[{"letter":"A","text":"A can represent P because the duty to protect confidential information does not extend to former clients"},{"letter":"B","text":"A can only represent P if (1) there is no information A obtained in confidence about C's business that would be relevant in P's suit, OR (2) there is such information, but C gives informed consent, confirmed in writing"},{"letter":"C","text":"A can only represent P if there is no information A obtained in confidence about C's business that would be relevant in P's suit"},{"letter":"D","text":"A can only represent P if C gives informed consent, confirmed in writing"}],"correct":"B","explanation":"A can represent P if (i) there is no confidential information about C's business relevant to P's suit against C, OR (ii) there is such information but C gives informed consent, confirmed in writing. The duty to preserve confidential information does not cease when representation ends. Either condition is sufficient — A need not satisfy both.","verify":false,"id":176}, {"topic":"Conflicts","style":"BARBRI","stem":"Which of the following is NOT a situation in which a lawyer may use the confidential information of a former client to the former client's disadvantage?","choices":[{"letter":"A","text":"The former client gives informed consent, confirmed in writing"},{"letter":"B","text":"The confidential information is essential to effectively represent a current client of the lawyer"},{"letter":"C","text":"The formerly confidential information is now public knowledge"},{"letter":"D","text":"The lawyer is obligated to disclose that information under an exception to the general ethical duty of confidentiality"}],"correct":"B","explanation":"NOT permitted: using former client's confidential information just because it is essential to represent a current client. Permitted uses: (i) former client gives informed consent confirmed in writing; (ii) the information is now public knowledge; (iii) the lawyer is obligated to disclose under an exception to the duty of confidentiality.","verify":false,"id":177}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer joins a new firm and is screened from a matter due to a conflict stemming from representation of a former client, she may be 'apportioned no part of the fee therefrom,' which means ________________________.","choices":[{"letter":"A","text":"Her regular salary or partnership share must be proportionally reduced so that she does not receive any portion of such fees"},{"letter":"B","text":"She may receive a regular salary or partnership share set by prior independent agreement, but any bonus must be proportionally reduced so she does not receive any portion of such fees"},{"letter":"C","text":"She may receive a regular salary or partnership share set by prior independent agreement, but her compensation must not be directly related to the matter in which she is disqualified"},{"letter":"D","text":"Her current firm may not share fees from the matter with her former firm"}],"correct":"C","explanation":"'Apportioned no part of the fee' means the lawyer may receive a regular salary or partnership share set by prior independent agreement, but her compensation must not be directly related to the matter in which she is disqualified. The rule is not about proportional reduction of salary/bonus, but rather that her compensation cannot be directly tied to the specific disqualifying matter.","verify":false,"id":178}, {"topic":"Conflicts","style":"BARBRI","stem":"Attorney Anne worked for the Treasury Department and helped draft federal tax regulations. Now in private practice, ABC Farms wants to hire her to dispute a regulation she wrote. May Anne represent ABC Farms?","choices":[{"letter":"A","text":"No, unless she received informed consent from the Treasury Department, because she personally and substantially participated in the matter"},{"letter":"B","text":"Yes, because the drafting of general regulations is not a 'matter' that involves specific parties"},{"letter":"C","text":"Yes, as long as she notifies the Treasury Department"},{"letter":"D","text":"No, under any circumstances"}],"correct":"B","explanation":"Anne may represent ABC Farms because the drafting of general regulations is not a 'matter' for purposes of the conflicts rule. As used in this rule, 'matter' has a narrow, technical meaning — it means a specific set of facts involving specific parties, not a broad subject area or general regulation. Therefore, no informed consent or notice is required.","verify":false,"id":179}, {"topic":"Conflicts","style":"BARBRI","stem":"If a lawyer is disqualified under the confidential government information rule, then everyone in that lawyer's firm is also disqualified __________.","choices":[{"letter":"A","text":"Unless the lawyer is timely screened, does not share fees from the matter, and written notice is promptly given to the potentially materially disadvantaged person"},{"letter":"B","text":"Unless the lawyer is timely screened, does not share fees from the matter, and the potentially materially disadvantaged person gives informed consent, confirmed in writing"},{"letter":"C","text":"Under all circumstances"},{"letter":"D","text":"Unless the lawyer is timely screened and does not share fees from the matter"}],"correct":"D","explanation":"Under the confidential government information rule, firm-wide disqualification is avoided if the disqualified lawyer is timely screened and does not share fees from the matter. No written notice to the disadvantaged person is required, and that person need not give informed consent.","verify":false,"id":180}, {"topic":"Conflicts","style":"BARBRI","stem":"Lawyer Linda works for the NYC Landmarks Commission in a strictly nonlegal capacity as Public Relations Director. She has been personally and substantially involved with the PR aspects of a public-private partnership with Whiteacre Real Estate. Whiteacre approaches Linda to join as assistant general counsel and Linda accepts. Is Linda subject to discipline?","choices":[{"letter":"A","text":"Yes, because Linda negotiated private employment with an entity involved as a party in a matter in which Linda is participating personally and substantially"},{"letter":"B","text":"No, because Linda's work for Whiteacre was nonlegal in nature"},{"letter":"C","text":"No, because Linda did not seek out employment with Whiteacre; Whiteacre approached Linda"},{"letter":"D","text":"No, because Linda's employment with the Commission is at will"}],"correct":"A","explanation":"Linda is subject to discipline because she negotiated private employment with an entity involved as a party in a matter in which she is participating personally and substantially. Even though her work was nonlegal in nature and she is a government lawyer, the rule applies. It does not matter that Whiteacre approached her or that her employment is at will.","verify":false,"id":181}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer participates in a matter as a partisan arbitrator for a party in a three-arbitrator panel. May the lawyer subsequently represent that party in the same matter?","choices":[{"letter":"A","text":"No, under any circumstances"},{"letter":"B","text":"Yes, but only if all parties to the proceedings give informed consent, confirmed in writing"},{"letter":"C","text":"Yes, but only if all parties to the proceedings are notified"},{"letter":"D","text":"Yes, under any circumstances"}],"correct":"D","explanation":"A partisan arbitrator for a party in a multi-member arbitration panel may subsequently represent that party in the same matter under any circumstances. This is an exception to the general rule (which bars prior adjudicative officers from representing private clients without all parties' informed consent). A partisan arbitrator is not a neutral, so the exception applies.","verify":false,"id":182}, {"topic":"Conflicts","style":"BARBRI","stem":"Law Clerk Leanne worked for Judge Jerry and drafted an opinion in Porter v. Dylan. Alice, Dylan's attorney, asked Leanne to interview with her firm. What should Leanne do if she wants to pursue private employment with Alice's firm?","choices":[{"letter":"A","text":"Leanne may pursue employment with Alice because Alice was the attorney for a party, not the party itself, and does not need to notify Judge Jerry"},{"letter":"B","text":"Leanne may not pursue employment with Alice because Leanne was personally and substantially involved with the Porter v. Dylan matter"},{"letter":"C","text":"Leanne must notify Judge Jerry before discussing future employment with Alice"},{"letter":"D","text":"Leanne must obtain informed consent, confirmed in writing, from Judge Jerry"}],"correct":"C","explanation":"Unlike judges and other adjudicative officers (who are FORBIDDEN from negotiating private employment with a party or the attorney for a party in matters where they personally and substantially participate), law clerks may negotiate for private employment as long as they notify the judge/officer in advance. Note: the rule applies to private employment with a party OR the attorney for a party, so Alice qualifies. Informed consent from Judge Jerry is not required — only notification.","verify":false,"id":183}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer who obtains confidential information during a consultation with Prospective Client P must not later represent Client C in the same or substantially related matter if _____________________________ (unless P and C each gives informed consent, confirmed in writing).","choices":[{"letter":"A","text":"C's interests are potentially adverse to P's"},{"letter":"B","text":"The confidential information could significantly harm P"},{"letter":"C","text":"C's interests are materially adverse to P's"}],"correct":"B","explanation":"The standard for prospective clients is that the confidential information could significantly harm P. This differs from the standard for former clients (materially adverse). Note: 'materially adverse' is the standard for former client conflicts, not prospective client conflicts.","verify":false,"id":184}, {"topic":"Conflicts","style":"BARBRI","stem":"Laura represented Mrs. C in her divorce while at Law Firm A. Laura recently joined Law Firm B. A partner at Firm B is considering taking on Mr. C in the same divorce case. May Law Firm B take on Mr. C?","choices":[{"letter":"A","text":"Yes, as long as Laura is timely screened from participation and prohibited from receiving any part of the fee from that matter, and proper notice is sent to Mrs. C"},{"letter":"B","text":"No, Laura's conflict is imputed to Law Firm B and it is barred from taking Mr. C's case"},{"letter":"C","text":"Yes, as long as Laura is timely screened, prohibited from receiving any part of the fee, and proper notice is sent to Mr. C and Mrs. C"},{"letter":"D","text":"Yes, as long as Laura is timely screened, prohibited from receiving any part of the fee, and Mrs. C provides informed consent"}],"correct":"A","explanation":"Law Firm B may take Mr. C's case using screening procedures because the conflict arises from duties to a former client from a prior law firm. Requirements: Laura is timely screened, does not share fees, and proper notice is sent to Mrs. C (the former client). Mrs. C's informed consent is NOT required — notice is sufficient. Notice is sent to the former client (Mrs. C), not to the new client (Mr. C).","verify":false,"id":185}, {"topic":"Conflicts","style":"BARBRI","stem":"A lawyer __________ ask a client to consent to future conflicts __________.","choices":[{"letter":"A","text":"May; if (a) it is reasonable to do so and (b) the client truly understands the particular kinds of conflicts that may arise and the consequences of consenting"},{"letter":"B","text":"May; if (a) it is reasonable to do so, (b) the client truly understands the particular kinds of conflicts that may arise and the consequences of consenting, and (c) it is highly unlikely that any future conflicts will arise"},{"letter":"C","text":"May not; under any circumstances"},{"letter":"D","text":"May; if the client truly understands the particular kinds of conflicts that may arise and the consequences of consenting"}],"correct":"A","explanation":"A lawyer may ask a client to consent to future conflicts if (a) it is reasonable to do so AND (b) the client truly understands the particular kinds of conflicts that may arise and the consequences of consenting. There is no additional requirement that future conflicts be highly unlikely. Both conditions (a) and (b) must be met — understanding alone is insufficient.","verify":false,"id":186}, {"topic":"Conflicts","style":"BARBRI","stem":"A conflict of interest arises when there is a substantial risk that the lawyer's representation of the client will be materially and adversely affected by __________.","choices":[{"letter":"A","text":"The lawyer's own interests or the lawyer's duties to another current client, a former client, or a third person"},{"letter":"B","text":"The lawyer's duties to another current or former client only"},{"letter":"C","text":"The lawyer's own interests or the lawyer's duties to another current client or former client (but not a third person)"},{"letter":"D","text":"The lawyer's own interests only"}],"correct":"A","explanation":"A conflict arises from: the lawyer's own interests OR duties to another current client, a former client, OR a third person. The category of third persons includes, for example, fiduciary duties arising from the lawyer's service as a trustee. All sources — personal interests, current clients, former clients, and third persons — must be included.","verify":false,"id":187}, {"topic":"Conflicts","style":"BARBRI","stem":"If a conflict of interest arises during the course of a representation involving a new client and the lawyer's existing client, the lawyer __________.","choices":[{"letter":"A","text":"May continue to represent both clients as long as he gets proper informed consent from the new client"},{"letter":"B","text":"Must withdraw unless he obtains proper informed consent from the new client and any other affected clients"},{"letter":"C","text":"Must immediately withdraw"}],"correct":"B","explanation":"If a conflict arises during an ongoing representation, the lawyer must withdraw UNLESS he obtains proper informed consent from the new client AND any other affected clients. It is not sufficient to get consent only from the new client — all affected clients must consent.","verify":false,"id":188}, {"topic":"Conflicts","style":"BARBRI","stem":"If two parties in a case are represented by the same lawyer, and a potential conflict between the two ripens into a present conflict, their lawyer _______________.","choices":[{"letter":"A","text":"Is not required to do anything, provided that she obtained informed consent agreements from both clients at the start of their representation"},{"letter":"B","text":"Must withdraw from representing one party"},{"letter":"C","text":"Must withdraw from representing both parties"},{"letter":"D","text":"Must analyze the facts to determine if she can effectively represent both clients, disclose the potential conflict to both clients, invite them to provide informed consent, and consider whether a reasonable lawyer would advise these clients to consent"}],"correct":"D","explanation":"The lawyer is required to: (1) analyze the facts to determine if she can effectively represent both clients; (2) disclose the potential conflict to both clients; (3) invite them to give informed consent; (4) consider whether a reasonable lawyer would advise these clients to consent. The lawyer must withdraw from joint representation if a reasonable lawyer would advise either client not to consent. Prior informed consent agreements at the start of representation do not relieve this obligation.","verify":false,"id":189}, {"topic":"Conflicts","style":"BARBRI","stem":"When a lawyer is representing multiple parties in a matter, she should make clear to all of the parties that:","choices":[{"letter":"A","text":"Disclosures by one client will be shared with the other clients, and the attorney-client privilege for communications with the lawyer cannot be claimed by any of the parties in future litigation among those parties"},{"letter":"B","text":"Although disclosures by one client will generally be shared with the other parties, the attorney-client privilege will protect such communications in future litigation among those parties"},{"letter":"C","text":"Anything one client tells the lawyer will be kept confidential from the other clients and will be covered by the attorney-client privilege in any future litigation between the parties"}],"correct":"A","explanation":"The lawyer should make clear that (1) disclosures by one client will be shared with all other clients, and (2) attorney-client privilege for communications with the lawyer cannot be claimed by any of the parties in future litigation among those parties. There is no privilege protection for communications in subsequent litigation between the jointly-represented parties.","verify":false,"id":190}, {"topic":"Conflicts","style":"BARBRI","stem":"Conflicts caused by family members representing opposing parties are generally __________.","choices":[{"letter":"A","text":"Imputed to the other lawyers at their firms only if the family members are close relatives"},{"letter":"B","text":"Not imputed to the other lawyers at their firms"},{"letter":"C","text":"Imputed to the other lawyers at their firms"}],"correct":"B","explanation":"Conflicts caused by family members representing opposing parties are generally NOT imputed to the other lawyers at their firms — regardless of whether the family members are close relatives or not.","verify":false,"id":191}, {"topic":"Conflicts","style":"BARBRI","stem":"Lisa is a lawyer who represents Claire, owner of a boutique. Last week Lisa had Claire sig
