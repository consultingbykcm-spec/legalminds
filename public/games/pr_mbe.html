.choice.picked-wrong .ch-letter { background: #e24b4a; border-color: #e24b4a; color: #0a1628; }

.choice.reveal-right { background: #0f3d2a; border-color: #1d9e75; }

<script>
var QUESTIONS = [{"topic":"Regulation","style":"BARBRI","stem":"The ultimate power to regulate the legal profession rests with __________.","choices":[{"letter":"A","text":"The highest court in the state"},{"letter":"B","text":"The state legislature"},{"letter":"C","text":"The American Bar Association"},{"letter":"D","text":"The state bar association"}],"correct":"A","explanation":"Because the practice of law is intimately connected with the administration of justice, the ultimate power to regulate the legal profession in and out of court rests with the highest court in the state. The highest court generally promulgates the ethics rules and oversees the discipline of lawyers. Every state has a body of statutes passed by the state legislature that govern some aspects of the practice of law, but the ultimate power rests with the highest court in the state, not with the state legislature. Common functions of a state bar association are to administer the state’s bar examination, to provide continuing education programs for practicing lawyers, and to assist the state courts in regulating and imposing professional discipline on lawyers. Nearly every state has adopted some version of the American Bar Association (“ABA”) Model Rules of Professional Conduct. Likewise, most of the states have adopted some version of the ABA Model Code of Judicial Conduct, but the ABA itself does not have the power to regulate the legal profession.","verify":false,"id":0}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following would be a sufficient basis by itself to deny a candidate’s application to practice law?","choices":[{"letter":"A","text":"Membership in the Communist Party"},{"letter":"B","text":"Any record of civil disobedience"},{"letter":"C","text":"Any prior felony conviction"},{"letter":"D","text":"Any conviction of a crime involving moral turpitude"}],"correct":"D","explanation":"Conviction of a crime involving moral turpitude is sufficient by itself to cause disqualification of a candidate’s application to practice law. Crimes involving moral turpitude include crimes involving intentional dishonesty for the purpose of personal gain (e.g., forgery, bribery, theft, perjury, robbery, extortion) or crimes involving violence (e.g., murder, rape, mayhem). Although many felony convictions are also crimes of moral turpitude, the mere fact that it was a felony is not controlling. The nature of the offense and the motivation of the violator are important factors in determining whether moral turpitude exists. Similarly, any record of civil disobedience is incorrect because it is too broad. For example, an arrest for nonviolent civil disobedience does not rise to the level of moral turpitude. Similarly, an applicant’s mere membership in the Communist Party (when there is no showing that the applicant engaged in or advocated actions to overthrow the government by force or violence) is not sufficient to show a lack of moral character and deny the applicant admission to practice law.","verify":false,"id":1}, {"topic":"Regulation","style":"BARBRI","stem":"Under the ABA Model Rules of Professional Conduct, a lawyer is subject to discipline for committing any criminal act __________.","choices":[{"letter":"A","text":"That reflects poorly on the legal profession"},{"letter":"B","text":"That would constitute a felony within the state where she is admitted to practice law"},{"letter":"C","text":"That reflects adversely on her honesty, trustworthiness, or fitness as a lawyer in other respects"},{"letter":"D","text":"Whatsoever, because she has taken an oath to uphold the state and federal Constitutions"}],"correct":"C","explanation":"ABA Model Rule 8.4(b) states that a lawyer is subject to discipline for committing a criminal act that reflects adversely on her honesty, trustworthiness, or fitness as a lawyer in other respects. The other answers are incorrect because to constitute professional misconduct, the crime must involve some characteristic that is relevant to the practice of law. Crimes involving dishonesty, breach of trust, substantial interference with the administration of justice, and most crimes involving violence reflect on the lawyer’s fitness to practice law. Thus it is not simply any criminal act whatsoever or any criminal act constituting a felony that will trigger professional discipline. Similarly, disciplining a lawyer based on any criminal act that reflects poorly on the legal profession arguably could include any criminal act.","verify":false,"id":2}, {"topic":"Regulation","style":"BARBRI","stem":"When must a lawyer report another lawyer’s actions to the appropriate professional authority?","choices":[{"letter":"A","text":"When the lawyer knows that the other lawyer has violated the Rules of Professional Conduct in any way"},{"letter":"B","text":"When the lawyer suspects that the other lawyer has violated the Rules of Professional Conduct in any way"},{"letter":"C","text":"When the lawyer suspects that the other lawyer has violated the Rules of Professional Conduct in such a way that it raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer"},{"letter":"D","text":"When the lawyer knows that the other lawyer has violated the Rules of Professional Conduct in such a way that it raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer"}],"correct":"D","explanation":"A lawyer who knows that another lawyer has violated the Rules of Professional Conduct in such a way that it raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer must report the violation to the appropriate professional authority. A lawyer who fails to report this type of misconduct is herself subject to discipline for violating the rule requiring disclosure. A lawyer may choose to report suspected misconduct, but she is not required to do so. Similarly, a lawyer is not required to make a report whenever another lawyer has violated a rule in any way. She may decline to report another lawyer’s violation if it concerns an arcane rule and does not indicate that the other lawyer is dishonest, untrustworthy, or unfit to practice law. Examples of violations that may not raise a substantial question as to a lawyer’s fitness to practice include some types of improper solicitation and the improper use of nonlawyer assistants.","verify":false,"id":3}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following rights does **NOT** apply to a lawyer accused of professional misconduct?","choices":[{"letter":"A","text":"The right to counsel"},{"letter":"B","text":"The right to exclude evidence obtained from an illegal search"},{"letter":"C","text":"The right to proper notice"},{"letter":"D","text":"The right to cross-examine adverse witnesses"}],"correct":"B","explanation":"The exclusionary rules of criminal law do not apply to disciplinary proceedings. Thus, a lawyer accused of professional misconduct does not have the right to exclude evidence obtained from an illegal search. Such evidence is admissible in a disciplinary proceeding. An accused lawyer is entitled to procedural due process, which means that she has the right to counsel, to proper notice, to be heard and introduce evidence, and to cross-examine adverse witnesses. In addition, the hearing must be limited to the charges made in the complaint.","verify":false,"id":4}, {"topic":"Regulation","style":"BARBRI","stem":"As a general rule, a lawyer who is admitted to practice law in one state __________.","choices":[{"letter":"A","text":"May only practice law in the state of her admission"},{"letter":"B","text":"May practice law in any state of her choosing provided she first pays that state’s annual bar dues"},{"letter":"C","text":"Has an automatic right under the Full Faith and Credit Clause of the United States Constitution to practice in any other state so long as she remains in good standing with the bar of her state of admission"}],"correct":"A","explanation":"A lawyer who is admitted to practice law in one jurisdiction is not, without more, authorized to practice in any other jurisdiction, and thus generally may only practice law in the state of her admission. She will be subject to discipline for practicing in a jurisdiction where she is not admitted to practice. If she wishes to join the bar of another state and pay that state’s annual bar dues, she will first need to seek an admission or waiver from that state. The Full Faith and Credit Clause to the United States Constitution does not require a state to honor the bar admissions of another state, even for lawyers who are in good standing with the bar of their state of admission.","verify":false,"id":5}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following acts done by a lawyer would be considered assisting another in the unauthorized practice of law?","choices":[{"letter":"A","text":"Advising a nonlawyer on aspects of the law related to that nonlawyer’s job"},{"letter":"B","text":"Having a paralegal send a routine request to opposing counsel without first checking the contents of the letter"},{"letter":"C","text":"Hiring a disbarred lawyer as a legal secretary"},{"letter":"D","text":"Giving a nonlawyer advice on how to appear pro se before a court"}],"correct":"B","explanation":"A lawyer who assists a nonlawyer in the unauthorized practice of law is subject to professional discipline. A lawyer may delegate certain tasks to a paralegal, law clerk, student intern, or other such person, but only if the lawyer supervises the delegated work carefully and is ultimately responsible for the results. For example, a paralegal may write and sign letters on the law firm letterhead to make routine requests for information from banks, mortgage companies, and governmental agencies, provided that she indicates that she is a paralegal, not a lawyer. But a paralegal should not sign letters to clients, adversaries, opposing counsel, or tribunals; she may draft such letters, but they should be approved and signed by the lawyer. That helps assure that the lawyer is properly supervising the paralegal’s work. A lawyer may advise persons who wish to appear on their own behalf in a legal matter. Thus, giving a nonlawyer advice on how to appear pro se would not be considered aiding another in the unauthorized practice of law. A lawyer may properly advise and instruct nonlawyers whose employment requires a knowledge of the law—e.g., claims adjusters, bank trust officers, social workers, accountants, and government employees. It is proper to hire a suspended or disbarred lawyer to do work that a layperson is permitted to do, such as working as a legal secretary, but the suspended or disbarred lawyer must not be permitted to do any work that constitutes the practice of law.","verify":false,"id":6}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following is NOT a factor in determining whether a partner of a firm is subject to discipline for the specific misconduct of another lawyer in the firm?","choices":[{"letter":"A","text":"Whether the partner failed to mitigate the consequences of the misconduct"},{"letter":"B","text":"Whether the partner ordered the misconduct"},{"letter":"C","text":"Whether the misconduct constitutes legal malpractice"},{"letter":"D","text":"Whether the partner ratified the misconduct"}],"correct":"C","explanation":"A lawyer is subject to discipline for a disciplinary violation committed by a second lawyer if: (i) the first lawyer ordered the second lawyer’s misconduct or knew about it and ratified it; or (ii) the first lawyer is a partner or manager or has direct supervisory responsibility over the second lawyer, and she knows about the misconduct at a time when its consequences can be avoided or mitigated and fails to take reasonable remedial action. Although a partner may be subject to civil liability for the debts of the partnership, whether the misconduct constitutes legal malpractice does not affect whether a partner is subject to discipline under the ethical rules.","verify":false,"id":7}, {"topic":"Regulation","style":"BARBRI","stem":"Which statement regarding nonlawyer employees in a law firm is true?","choices":[{"letter":"A","text":"A lawyer may be subject to discipline for failing to instruct nonlawyer employees regarding ethics matters"},{"letter":"B","text":"A lawyer is not subject to discipline for a nonlawyer’s misconduct unless the lawyer is a partner of the firm"},{"letter":"C","text":"A lawyer is never subject to discipline for the actions of a nonlawyer"},{"letter":"D","text":"A lawyer is not subject to discipline for a nonlawyer’s misconduct unless the lawyer ordered the misconduct"}],"correct":"A","explanation":"The partners and managers in a law firm (and the supervisory lawyers in a governmental agency, business, or other group of lawyers) must make reasonable efforts to assure that the conduct of the nonlawyers is compatible with the obligations of the profession. Thus, failing to instruct or train nonlawyers with respect to ethics matters may be grounds for discipline.  A lawyer is responsible for a nonlawyer’s misconduct not only when the lawyer ordered the misconduct, but also when the lawyer knew about the misconduct and ratified it, or when the lawyer is a partner, manager, or direct supervisor and knew about and failed to mitigate the consequences of the misconduct.  The lawyer need not be a partner of the firm; managers, direct supervisors, or any lawyer who ordered or ratified the misconduct may also be held responsible.","verify":false,"id":8}, {"topic":"Regulation","style":"BARBRI","stem":"Can a lawyer share her legal fee with a nonlawyer?","choices":[{"letter":"A","text":"No, fee sharing with nonlawyers is never allowed"},{"letter":"B","text":"Yes, lawyers are free to share legal fees at their discretion"},{"letter":"C","text":"No, except with a nonprofit organization"},{"letter":"D","text":"Yes, but only in limited circumstances"}],"correct":"D","explanation":"A lawyer must generally not share her legal fee with a nonlawyer. However, a lawyer may share fees in limited circumstances. A lawyer may pay a death benefit to the estate of a deceased lawyer, may include nonlawyers in a compensation or retirement plan, may pay the purchase price of a deceased, disabled, or disappeared lawyer’s practice to the practice’s nonlawyer representative, and may share court-awarded legal fees with a nonprofit organization that recommended or hired the lawyer as counsel. Sharing a fee with a nonprofit organization is not the only circumstance where fees may be shared, as stated above.","verify":false,"id":9}, {"topic":"Regulation","style":"BARBRI","stem":"May a lawyer enter into an employment agreement that permanently prohibits her from practicing law in a certain geographic areawhen she leaves the firm?","choices":[{"letter":"A","text":"Yes, non-compete clauses in employment agreements are specifically permitted by the ABA Rules of Professional Conduct"},{"letter":"B","text":"Yes, but only if the agreement is voluntarily entered into by all parties"},{"letter":"C","text":"No, because agreements restricting a lawyer's right to practice violate the ABA Model Rules of Professional Conduct"},{"letter":"D","text":"No, because the prohibition is permanent"}],"correct":"C","explanation":"A lawyer must neither make nor offer a partnership or employment or similar agreement that restricts a lawyer’s right to practice after termination of the relationship, except for an agreement concerning benefits upon retirement. Such agreements are prohibited even if the agreement is entered into voluntarily, and even if the restriction is not permanent.","verify":false,"id":10}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following statements regarding the sale of a law practice is **FALSE**?","choices":[{"letter":"A","text":"The entire practice or field of practice must be sold to the purchasing lawyer or firm"},{"letter":"B","text":"Written notice must be given to the seller’s clients of the pending sale"},{"letter":"C","text":"The selling lawyer must cease to engage in the private practice of law or cease to accept any matters in the area of practice that is being sold"},{"letter":"D","text":"The purchasing lawyer may choose to represent only some of the seller's clients"}],"correct":"D","explanation":"The sale of a law practice or a field of law practice, including goodwill, is authorized by the ABA Model Rules under certain circumstances. Pursuant to this rule: (i) The seller must cease to engage in the private practice of law, or in the sold field of practice, in the area where the practice has been conducted; (ii) The entire practice, or the entire field of practice, must be sold to one or more lawyers or firms; and (iii) Written notice must be given to the seller’s clients regarding the sale, the clients’ right to retain other counsel or to take possession of their files, and the fact that consent to the transfer of the clients’ files will be presumed if a client takes no action within 90 days of receipt of the notice. The purchasing lawyer or firm may NOT choose to accept only certain clients, but rather must undertake all client matters in the practice (subject, of course, to client consent and conflict of interest rules).","verify":false,"id":11}, {"topic":"Regulation","style":"BARBRI","stem":"If a lawyer has a regular legal practice and also provides other law-related services, is the lawyer subject to the ABA Model Rules of Professional Conduct in providing the law-related services?","choices":[{"letter":"A","text":"No, the ABA Model Rules of Professional Conduct apply only to the provision of legal services"},{"letter":"B","text":"Yes, the ABA Model Rules of Professional Conduct always apply to a lawyer’s conduct relating to any profession"},{"letter":"C","text":"Yes, if the services are provided together with the legal services"}],"correct":"C","explanation":"Even though law-related services are not legal services, a lawyer who provides such services is subject to the Rules of Professional Conduct if: (i) the nonlegal services are provided together with the legal services or (ii) if a lawyer provides nonlegal services through an entity that is not her law office but that she controls (either alone or with other lawyers). It is not correct that the ABA Model Rules of Professional Conduct always apply to a lawyer’s conduct relating to any profession.","verify":false,"id":12}, {"topic":"Regulation","style":"BARBRI","stem":"If Attorney A retires and sells his business to Attorney B, __________________________.","choices":[{"letter":"A","text":"A can transfer the files of current clients to B without their consent, but must obtain the consent of former clients before transferring their files to B"},{"letter":"B","text":"A must request the consent of current and former clients before transferring their files to B"},{"letter":"C","text":"A can transfer the files of former clients to B without their consent, but must obtain the consent of current clients before transferring their files to B"},{"letter":"D","text":"A can transfer the files of former and current clients to B without their consent"}],"correct":"B","explanation":"If Attorney A retires and sells his business to Attorney B, A must request the consent of current and former clients before transferring their files to B. A cannot transfer the files of current or former clients without their consent. Doing so makes A subject to discipline.","verify":false,"id":13}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following is typically **NOT** a function of a state bar association?","choices":[{"letter":"A","text":"Providing continuing education programs for practicing lawyers"},{"letter":"B","text":"Administering the state’s bar examination"},{"letter":"C","text":"Assisting state courts in imposing professional discipline on lawyers"},{"letter":"D","text":"Enacting ethics rules"}],"correct":"D","explanation":"The courts have the inherent power to regulate the legal profession; thus, the role of enacting ethics rules and overseeing the discipline of lawyers generally belongs to the highest court in a state, not the state’s bar association. Common functions of a state bar association include administering the state’s bar examination, providing continuing education programs for practicing lawyers, and assisting state courts in regulating and imposing professional discipline on lawyers.","verify":false,"id":14}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following acts would **NOT** constitute an act of moral turpitude sufficient to deny admission to the bar?","choices":[{"letter":"A","text":"Committing a crime involving intentional dishonesty for personal gain"},{"letter":"B","text":"Committing an act of nonviolent civil disobedience"},{"letter":"C","text":"Committing a violent crime"},{"letter":"D","text":"Concealing facts in response to an inquiry by the bar admissions committee"}],"correct":"B","explanation":"An act of nonviolent civil disobedience does not rise to the level of moral turpitude; hence, it would not be sufficient by itself to disqualify the candidate from admission to the bar. Crimes involving intentional dishonesty for the purpose of personal gain (e.g., forgery, bribery, theft, perjury, robbery, extortion) and crimes involving violence (e.g., murder, rape, mayhem) are generally considered to be crimes of moral turpitude. False statements or concealment of facts in response to an inquiry by the bar admissionscommittee also constitutes moral turpitude. Such concealment alone is evidence of sufficient lack of moral character to deny admission, even if the underlying conduct does not involve moral turpitude.","verify":false,"id":15}, {"topic":"Regulation","style":"BARBRI","stem":"Commission of which of the following crimes by an attorney would most likely lead to professional discipline?","choices":[{"letter":"A","text":"Solicitation of prostitution"},{"letter":"B","text":"Possession of marijuana where it is illegal"},{"letter":"C","text":"Intentional failure to file a personal tax return"},{"letter":"D","text":"A single incident of drunk driving"}],"correct":"C","explanation":"A lawyer is subject to discipline for committing a criminal act that reflects adversely on his honesty, trustworthiness, or fitness as a lawyer in other respects. To constitute professional misconduct, the crime must involve some characteristic that is relevant to the practice of law. For example, crimes involving dishonesty, breach of trust, or substantial interference with the administration of justice, such as intentionally failing to file a personal tax return, and most crimes involving violence, reflect on the lawyer’s fitness to practice law. The other crimes listed (solicitation of prostitution, a single offense of drunk driving, possession of marijuana), while punishable by law, do not necessarily trigger professional discipline.","verify":false,"id":16}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer is **NOT** permitted to report another’s lawyer’s violation of the Rules of Professional Conduct if:","choices":[{"letter":"A","text":"The violation involves the other lawyer’s personal affairs, rather than his professional conduct"},{"letter":"B","text":"The lawyer learned about the violation through a privileged communication with one of his clients"},{"letter":"C","text":"The lawyer only suspects, but has no actual knowledge of, the violation"},{"letter":"D","text":"The violation does not raise a substantial question as to the other lawyer’s honesty, trustworthiness, or fitness as a lawyer"}],"correct":"B","explanation":"If a lawyer learns about another lawyer’s violation of the Rules of Professional Conduct through a privileged communication with the other lawyer or one of his clients, the lawyer is not permitted to report the misconduct. In fact, the lawyer would be subject to discipline for violating the confidentiality rules if he did report it. When a lawyer knows that another lawyer has violated the Rules of Professional Conduct in such a way that it raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer, he must report the violation to the appropriate professional authority. This is true, even if the conduct involves the other lawyer’s personal affairs. A lawyer may also choose to report suspected misconduct, even without actual knowledge, but he is not required to do so. A lawyer need not report other violations that do not raise a substantial question as to the other lawyer’s honesty, trustworthiness, or fitness as a lawyer, but is permitted to do so.","verify":false,"id":17}, {"topic":"Regulation","style":"BARBRI","stem":"A complaint against a lawyer can be brought by an aggrieved client or anyone with knowledge of the misconduct. Under what circumstances may a lawyer sue the complainant for defamation on the basis of the complaint?","choices":[{"letter":"A","text":"Only if the complaint does not ultimately lead to discipline"},{"letter":"B","text":"Only if the complaint was brought by an aggrieved client, rather than an uninvolved third party"},{"letter":"C","text":"Never; any such complaint is considered privileged and thus cannot be the basis of an action by the lawyer against the complainant"}],"correct":"C","explanation":"Disciplinary proceedings against a lawyer begin when a complaint is made to the state disciplinary authority (usually the state bar). Complaints are often brought by aggrieved clients, but may also be brought by anyone with knowledge of the misconduct. Filing a complaint against a lawyer is considered privileged. Thus, it cannot be the basis of a defamation action by the lawyer against the complainant. The privilege applies whether the complaint is brought by a client or another person with knowledge of the misconduct. This is true even if the complaint does not ultimately lead to discipline.","verify":false,"id":18}, {"topic":"Regulation","style":"BARBRI","stem":"Under the ABA Model Rules of Professional Conduct, which of the following is **NOT** a proper way for a lawyer admitted to practice in one state to temporarily provide legal services in a second state?","choices":[{"letter":"A","text":"By requesting special permission from a local court in the second state"},{"letter":"B","text":"By representing one of her in-state clients in an arbitration proceeding in the second state"},{"letter":"C","text":"By associating herself with a local lawyer in the second state who actively participates in the matter"},{"letter":"D","text":"By paying the required annual bar dues for the second state"}],"correct":"D","explanation":"A lawyer who is admitted to practice law in one jurisdiction is not, without more, authorized to practice in any other jurisdiction. A lawyer is subject to discipline for practicing in a jurisdiction where she is not admitted to practice. Simply paying the required annual bar dues for the other jurisdiction is not a substitute for gaining admission to that state’s bar. A lawyer admitted to practice in one state may provide legal services in a second state on a temporary basis in four situations. First, she may practice on a temporary basis in a state in which she is not admitted if she associates with a local lawyer who actively participates in the matter. Second, she may request special permission from a local court, administrative agency, or other tribunal to handle a matter in that tribunal. In a court, such permission is commonly called admission “pro hac vice,” which means admission for purposes of this matter only. Third, a lawyer may mediate, arbitrate, or engage in another form of alternative dispute resolution in a state in which she is not admitted to practice if her services arise out of, or are reasonably related to, her practice in the state in which she is admitted. Finally, note that the ABA Model Rules also contain a “catch-all” category that permits a lawyer to temporarily practice out of state if the lawyer’s out-of-state practice is reasonably related to the lawyer’s home-state practice.","verify":false,"id":19}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following acts done by a nonlawyer on behalf of another would likely constitute the unauthorized practice of law?","choices":[{"letter":"A","text":"An accountant appearing before a state or federal agency to represent a client"},{"letter":"B","text":"A real estate broker filling in the blanks on a standard document related to the sale of real property"},{"letter":"C","text":"A tax preparer giving a client advice on tax law while preparing the client’s tax return"},{"letter":"D","text":"An author publishing a do-it-yourself book containing general information about incorporating a small business"}],"correct":"C","explanation":"A tax preparer giving a client advice on tax law while preparing the client’s tax return would probably constitute the unauthorized practice of law, although answering questions incidental to the preparation of the return would not. A nonlawyer may not engage in the unauthorized practice of law or she will be subject to several sanctions, including injunction, contempt, and criminal conviction. In determining whether the practice of law is involved, consider (i) whether the activity involves legal knowledge and skill beyond that which the average layperson possesses; (ii) whether the activity constitutes advice or services concerning binding legal rights or remedies; and (iii) whether the activity is one traditionally performed by lawyers. There are some activities that a nonlawyer may undertake that do not constitute the practice of law. For example, state and federal agencies often permit nonlawyers, such as accountants, to appear before them representing clients. Also, while nonlawyers may not draft legal documents, they can act as scriveners, filling in the blanks on standard forms. Thus, real estate brokers, title insurance companies, and escrow companies are usually permitted to fill in the blanks on standard documents related to the sale of real property. Nonlawyer authors may publish books or pamphlets offering general advice, including most do-it-yourself books and kits.","verify":false,"id":20}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer with direct supervisory authority over a second lawyer is subject to discipline for the second lawyer's ethical violation ____________________________.","choices":[{"letter":"A","text":"Only if the supervising lawyer assisted the second lawyer in completing the misconduct"},{"letter":"B","text":"Only if the supervising lawyer ordered the second lawyer’s misconduct"},{"letter":"C","text":"If the misconduct rises to the level of legal malpractice"},{"letter":"D","text":"If the supervising lawyer ordered the second lawyer’s misconduct, knew about it and ratified it, or failed to mitigate its consequences"}],"correct":"D","explanation":"A lawyer is subject to discipline for a disciplinary violation committed by a second lawyer if: (i) the first lawyer ordered the second lawyer’s misconduct or knew about it and ratified it; or (ii) the first lawyer is a partner or manager or has direct supervisory responsibility over the second lawyer, and she knows about the misconduct at a time when its consequences can be avoided or mitigated and fails to take reasonable remedial action. Thus, it is incorrect to say that the lawyer will only be subject to discipline if she ordered the misconduct, or if she assisted in the misconduct. Furthermore, whether the second lawyer's misconduct constitutes legal malpractice does not affect whether the supervising lawyer is subject to discipline.","verify":false,"id":21}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer in a firm has direct supervisory authority over a nonlawyer. The nonlawyer commits an act that, if done by a lawyer, would violate the Rules of Professional Conduct.Is the supervising lawyer subject to discipline for the nonlawyer's misconduct?","choices":[{"letter":"A","text":"Yes, if the lawyer ordered the misconduct, knew about and ratified the misconduct, or failed to mitigate the consequences of the misconduct"},{"letter":"B","text":"No, a lawyer can never be disciplined for the acts of nonlawyers"},{"letter":"C","text":"Yes, but only if the lawyer ordered the misconduct"},{"letter":"D","text":"No, unless the lawyer is a partner of the firm"}],"correct":"A","explanation":"A lawyer is subject to discipline in two situations when a nonlawyer does something that, if done by a lawyer, would violate a disciplinary rule. The lawyer is subject to discipline if: (a) the lawyer ordered the conduct or knew about it and ratified it; or (b) the lawyer is a partner or manager or has direct supervisory responsibility over the nonlawyer, and the lawyer knows about the misconduct at a time when its consequences can be avoided or mitigated and fails to take reasonable remedial action. Thus, it is incorrect to say that a supervising lawyer is responsible for another lawyer’s misconduct only if he ordered the misconduct or only if he is a partner of the firm.","verify":false,"id":22}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following fee-sharing arrangements is prohibited?","choices":[{"letter":"A","text":"Sharing a court-awarded fee with a nonprofit association that had hired the lawyer as counsel in the case"},{"letter":"B","text":"Paying a death benefit to the estate of a deceased law partner"},{"letter":"C","text":"Paying a paralegal half of the lawyer’s fee in a case because the paralegal performed half of the work"},{"letter":"D","text":"Paying the purchase price of a deceased, disabled, or disappeared lawyer’s practice to the practice’s nonlawyer representative"}],"correct":"C","explanation":"A lawyer generally must not share her legal fee with a nonlawyer. However, a lawyer may: (i) Pay a death benefit to the estate of a deceased lawyer, (ii) Offer compensation and retirement plans to nonlawyer employees, (iii) Pay the purchase price of a deceased, disabled, or disappeared lawyer’s practice to the practice’s nonlawyer representative, and (iv) Share a court-awarded fee with a nonprofit organization that recommended or hired the lawyer as counsel. Giving half of a legal fee to a paralegal is a classic case of improper fee-sharing, even if the paralegal did half of the work in the matter. Of course, lawyers may pay nonlawyer employees a salary with money earned as legal fees, but the fees must not directly be shared.","verify":false,"id":23}, {"topic":"Regulation","style":"BARBRI","stem":"A restriction on a lawyer’s right to practice after termination of an employment relationship is _______________________.","choices":[{"letter":"A","text":"Always improper"},{"letter":"B","text":"Proper, but only if it was entered into voluntarily"},{"letter":"C","text":"Proper, unless it is unreasonable (e.g., a geographic restriction that restricts the lawyer’s right to practice in more than one state)"},{"letter":"D","text":"Improper, unless it relates to retirement benefits"}],"correct":"D","explanation":"A lawyer must neither make nor offer a partnership or employment or similar agreement that restricts a lawyer’s right to practice after termination of the relationship, except for an agreement relating to retirement benefits. Such agreements are prohibited even if the agreement is entered into voluntarily, and even if the restrictions are not unreasonable.","verify":false,"id":24}, {"topic":"Regulation","style":"BARBRI","stem":"After a lawyer sells his law practice to another, he __________.","choices":[{"letter":"A","text":"May still practice law, but only if he works exclusively on pro bono matters"},{"letter":"B","text":"Generally must cease to engage in the private practice of law, but may be employed as a lawyer in another capacity"},{"letter":"C","text":"Must cease the practice of law completely"},{"letter":"D","text":"May continue to practice law without limitation"}],"correct":"B","explanation":"After the sale of his practice, a lawyer generally must cease to engage in the private practice of law, but may still be employed as a lawyer on the staff of a public agency or legal services entity that provides legal services to the poor, or as in-house counsel to a business. (It is not necessary that the lawyer only work on pro bono matters.) Additionally, a lawyer’s return to private practice because of an unanticipated change in circumstances does not necessarily violate the Rules.","verify":false,"id":25}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer operates a law firm on Main Street (at which she provides legal services only) and a real estate office on Green Street (at which she provides real estate services only). Which of the following statements is true?","choices":[{"letter":"A","text":"The attorney-client privilege applies to the services rendered by the lawyer at both the law firm and the real estate office"},{"letter":"B","text":"The Rules of Professional Conduct apply only to services provided at the law firm"},{"letter":"C","text":"The Rules of Professional Conduct may apply with respect to services rendered at the real estate office"}],"correct":"C","explanation":"If a lawyer provides nonlegal services through an entity that is not her law office but that she controls (either alone or with other lawyers), that lawyer must take reasonable steps to assure that people who receive the nonlegal services understand that those services are not legal services and that the Rules of Professional Conduct do not cover those services. For instance, the attorney-client privilege does not apply to the nonlegal services. If the lawyer does not take those reasonable steps, then the lawyer is subject to the Rules of Professional Conduct with respect to the nonlegal services. Thus, it is correct to say that the Rules of Professional Conduct may apply with respect to the services rendered at the lawyer’s real estate office (if the lawyer does not take reasonable measures to inform her customers that they are not receiving legal services). In that case, the Rules of Professional Conduct would not apply only to services provided at the law firm.","verify":false,"id":26}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following statements is true?","choices":[{"letter":"A","text":"Courts have the power to create rules of conduct within the courtroom, but the actions of an attorney outside of a courtroom are overseen by the state bar association"},{"letter":"B","text":"The state legislature has the sole power to regulate the practice of law under the exercise of its police powers"},{"letter":"C","text":"Courts have the inherent power to regulate the legal profession both in and out of court"},{"letter":"D","text":"All actions by any attorney, both in and out of court, are governed by the ethics rules of the American Bar Association"}],"correct":"C","explanation":"Because the practice of law is intimately connected with the administration of justice, the courts have the inherent power to regulate the legal profession in and out of court. Thus, it is incorrect to state that the courts are limited to creating rules of conduct within the courtroom. The courts promulgate the ethics rules and oversee the discipline of lawyers both in and out of court. The state bar association may assist the courts in regulating and imposing professional discipline on lawyers, but it does not oversee the process. Every state has a body of statutes that govern some aspects of the practice of law. The practice of law, like other professions and businesses, affects the public interest and is, therefore, subject to regulation by the states in the exercise of their police powers, but this power to regulate the practice of law is not exclusive to the state legislature. The ultimate power rests with the highest court in the state, not with the state legislature. The American Bar Association (“ABA”) itself does not actually govern the actions of any attorney, but most states’ ethics rules are patterned after models created by the ABA. Nearly every state has adopted some version of the ABA Model Rules of Professional Conduct. Likewise, most states have adopted some version of the ABA Model Code of Judicial Conduct.","verify":false,"id":27}, {"topic":"Regulation","style":"BARBRI","stem":"What remedy is available to an applicant who is denied admission to the bar by the bar admissions committee for failure to satisfy the good moral character requirement?","choices":[{"letter":"A","text":"The rejected candidate has no recourse because he has voluntarily put his character into question by submitting his application for admission to the bar"},{"letter":"B","text":"The rejected candidate has no recourse because admission to the practice of law is a privilege, not a right"},{"letter":"C","text":"The rejected candidate is entitled to a review by a panel of the state bar association"},{"letter":"D","text":"The rejected candidate is entitled to judicial review, usually by the state’s highest court"}],"correct":"D","explanation":"An applicant who is denied admission for failure to satisfy the good moral character requirement is entitled to judicial review, usually by the state’s highest court. He is not entitled to an additional review by a panel of the state bar association. It is incorrect to state that the rejected candidate has no recourse because the practice of law is a privilege or because he has voluntarily put his character into question. A bar applicant has due process rights. For example, during committee proceedings, he has the right to know the charges filed against him, to explain away any derogatory information, and to confront his critics.","verify":false,"id":28}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following acts would generally **NOT** be considered the type of misconduct that could subject a lawyer to professional discipline?","choices":[{"letter":"A","text":"Helping a family member cheat on the bar examination"},{"letter":"B","text":"Misusing law firm expense accounts"},{"letter":"C","text":"Mentioning a prominent relative in a position of political power during the course of a law firm job interview"},{"letter":"D","text":"Soliciting illegal sex acts from an undercover police officer"}],"correct":"D","explanation":"An attorney would not be subject to professional discipline for soliciting illegal sex acts from an undercover police officer. Although this is criminal conduct, it does not show dishonesty, untrustworthiness, or unfitness to practice law. Mentioning a prominent relative in a position of political power during the course of a law firm job interview could lead to professional discipline. A lawyer must never state or even imply that he has the ability to improperly influence a government agency or official or to achieve results by means that violate the law or legal ethics rules. Any conduct involving dishonesty, fraud, deceit, or misrepresentation constitutes professional misconduct, even if such conduct does not rise to the level of a crime. Thus, helping a family member cheat on the bar examination could lead to professional discipline. Misusing law firm expense accounts is another action involving dishonesty, fraud, deceit, or misrepresentation, and thus could also lead to discipline.","verify":false,"id":29}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer who fails to report another lawyer’s misconduct that raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer __________.","choices":[{"letter":"A","text":"Will suffer no repercussions because self-policing in the legal profession is voluntary"},{"letter":"B","text":"Will herself be subject to discipline because she has violated the rule requiring disclosure"},{"letter":"C","text":"Will suffer no repercussions because she is upholding the tradition of privilege between attorneys"},{"letter":"D","text":"Will herself be subject to discipline for failing to intervene in an attempt to stop the misconduct from occurring"}],"correct":"B","explanation":"A lawyer who knows that another lawyer has violated the Rules of Professional Conduct in such a way that it raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer must report the violation to the appropriate professional authority. A lawyer who fails to report this type of misconduct is herself subject to discipline for violating the rule requiring disclosure. There is no requirement that a lawyer intervene in an attempt to stop the misconduct from occurring. She need only report the conduct to the proper authority. The legal profession prides itself on being self-policing. One element of a self-policing group is that each member of the group is obligated to report misconduct by the other members. There is no tradition of privilege between attorneys. Privilege would only apply if there were an attorney-client relationship between the two or if the lawyer learned about the violation through a privileged communication with the other lawyer or one of his clients.","verify":false,"id":30}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following statements regarding disciplinary proceedings is true?","choices":[{"letter":"A","text":"Evidence will be excluded if it was obtained through an illegal search"},{"letter":"B","text":"The burden of proof is on the lawyer"},{"letter":"C","text":"The lawyer may invoke their Fifth Amendment privilege and refuse to answer questions at the hearing"}],"correct":"C","explanation":"The burden of proof is on the party prosecuting the charge, not the lawyer. The exclusionary rules of criminal law do not apply to disciplinary proceedings. Thus, a lawyer accused of professional misconduct does not have the right to exclude evidence obtained from an illegal search. Such evidence is admissible in a disciplinary proceeding. lawyer may, however, invoke their Fifth Amendment privilege and refuse to answer questions at the hearing, and no disciplinary action can be taken against the lawyer if it is based solely on the claim of Fifth Amendment privilege.","verify":false,"id":31}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer who is admitted to practice law in one state, but who improperly practices in another state, will be subject to the disciplinary rules of __________.","choices":[{"letter":"A","text":"Only the state of her improper practice"},{"letter":"B","text":"Both the state where she is admitted and the state of her improper practice"},{"letter":"C","text":"Only the state where she is admitted"},{"letter":"D","text":"The federal court system"}],"correct":"B","explanation":"A lawyer who is admitted to practice law in one state is not, without more, authorized to practice in any other state. A lawyer is subject to discipline for practicing in a state where she is not admitted to practice. A lawyer who is admitted to practice law in one state, but who improperly practices in another state, will be subject to the disciplinary rules of both the state where she is admitted AND the state of her improper practice. Discipline of such a lawyer will not be handled by the federal court system.","verify":false,"id":32}, {"topic":"Regulation","style":"BARBRI","stem":"In determining whether a nonlawyer’s activity should be considered the unauthorized practice of law, all of the following will be considered, **EXCEPT **whether the activity _______.","choices":[{"letter":"A","text":"Involves legal knowledge and skill beyond that which the average layperson possesses"},{"letter":"B","text":"Is in exchange for payment or is pro bono"},{"letter":"C","text":"Is one traditionally performed by lawyers"},{"letter":"D","text":"Constitutes advice or services concerning binding legal rights or remedies"}],"correct":"B","explanation":"A nonlawyer may not engage in the unauthorized practice of law. Whether such activity is performed for payment or pro bono is irrelevant; a nonlawyer engaging in the practice of law will be subject to several sanctions, including injunction, contempt, and criminal conviction. Note that a lawyer may assist a person who wishes to appear pro se, or on their own behalf, in a legal matter, but this does not mean that nonlawyers may properly assist others in the practice of law, even if done voluntarily, without payment. Important considerations in determining whether the activity constitutes the practice of law include whether the activity: (i) involves legal knowledge and skill beyond that which the average layperson possesses; (ii) constitutes advice or services concerning binding legal rights or remedies; and (iii) is one traditionally performed by lawyers.","verify":false,"id":33}, {"topic":"Regulation","style":"BARBRI","stem":"A lawyer wins a case on behalf of a client, and pays 10% of the legal fee to a nonlawyer who recommended the lawyer to the client. This arrangement is: _________.","choices":[{"letter":"A","text":"Proper, because a lawyer may share a legal fee with a nonlawyer at her discretion"},{"letter":"B","text":"Proper, because the lawyer shared less than 15% of the total legal fee"},{"letter":"C","text":"Improper, because sharing a legal fee with a nonlawyer is never allowed"},{"letter":"D","text":"Improper, because it is not a permitted fee-sharing arrangement"}],"correct":"D","explanation":"A lawyer generally must not share her legal fee with a nonlawyer—even sharing a small percentage of the fee is prohibited. However, a lawyer may: (i) Pay a death benefit to the estate of a deceased lawyer, (ii) Offer compensation and retirement plans to nonlawyer employees, (iii) Pay the purchase price of a deceased, disabled, or disappeared lawyer’s practice to the practice’s nonlawyer representative, and (iv) Share a court-awarded fee with a nonprofit organization that recommended or hired the lawyer as counsel. Thus, it is incorrect to say that fee-sharing with a nonlawyer is never allowed.","verify":false,"id":34}, {"topic":"Regulation","style":"BARBRI","stem":"A restriction on the lawyer’s right to practice law as part of a client's settlement agreementis ____________________________.","choices":[{"letter":"A","text":"Only allowed if proposed by the lawyer as part of the settlement of his client’s controversy"},{"letter":"B","text":"Always allowed, because public policy encourages the settlement of claims"},{"letter":"C","text":"Never allowed"}],"correct":"C","explanation":"A lawyer must neither make nor offer an agreement in which a restriction on the lawyer’s right to practice is part of the settlement of a client controversy. Such an agreement is never allowed under the ABA Model Rules of Professional Conduct.","verify":false,"id":35}, {"topic":"Regulation","style":"BARBRI","stem":"Generally, after a lawyer sells her law practice, she is prohibited from practicing law: __________.","choices":[{"letter":"A","text":"At a law firm"},{"letter":"B","text":"For a corporation as in-house counsel"},{"letter":"C","text":"At a public agency"},{"letter":"D","text":"At a legal entity that provides legal services to the poor"}],"correct":"A","explanation":"The selling lawyer must cease to engage in the private practice of law (e.g., at another law firm) or in the sold field of practice in the area where the practice has been conducted. However, after the sale of his practice, a lawyer on the staff of a public agency or legal services entity that provides legal services to the poor, or as in-house counsel to a corporation.","verify":false,"id":36}, {"topic":"Regulation","style":"BARBRI","stem":"“Ancillary” services provided by a lawyer are _________________________________.","choices":[{"letter":"A","text":"Law-related services that might reasonably be performed in conjunction with the provision of legal services"},{"letter":"B","text":"Services that are unrelated to the provision of legal services"},{"letter":"C","text":"Administrative tasks that only a lawyer may perform"}],"correct":"A","explanation":"Lawyers are permitted to provide law-related services. Law-related services (often referred to as ancillary services) are services that might reasonably be performed in conjunction with (and are related to) the provision of legal services, and that are not prohibited as unauthorized practice of law when provided by a nonlawyer (i.e., need not be tasks that only a lawyer may perform).","verify":false,"id":37}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following is a valid requirement for admission to a state’s bar?","choices":[{"letter":"A","text":"The applicant is willing to take an oath to uphold the state and federal Constitution"},{"letter":"B","text":"The applicant is a United States citizen"},{"letter":"C","text":"The applicant is a resident of the state in which she is seeking admission"},{"letter":"D","text":"The applicant is not a member of the Communist Party"}],"correct":"A","explanation":"It is valid for a state to require an applicant for admission to the bar to take an oath to uphold the state and federal Constitution. An applicant who refuses to take such an oath may be denied admission because there is a rational connection between this requirement and the practice of law. A state cannot require that an applicant be a United States citizen to be admitted to the practice of law; such a requirement violates the Equal Protection Clause of the United States Constitution. Similarly, a requirement that a bar applicant be a resident of the state in which she is seeking admission to practice law violates the Privileges and Immunities Clause of the Constitution and is, therefore, invalid. Finally, a requirement that would forbid an applicant from being a member of the Communist Party is not valid. In the absence of a showing that the applicant has engaged in or advocated actions to overthrow the government by force or violence, an applicant’s political activity should not be used to deny the applicant admission to practice law.","verify":false,"id":38}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following is an improper form of fee-sharing with a nonlawyer?","choices":[{"letter":"A","text":"Paying a death benefit to the estate of a deceased partner"},{"letter":"B","text":"Providing retirement plans for nonlawyer employees"},{"letter":"C","text":"Sending part of a legal fee to a nonlawyer who recommended the lawyer to the client"},{"letter":"D","text":"Sharing a court-awarded fee with a nonprofit organization that recommended the lawyer as counsel in the case"}],"correct":"C","explanation":"A lawyer generally must not share her legal fee with a nonlawyer. However, a lawyer may: (i) Pay a death benefit to the estate of a deceased lawyer, (ii) Offer compensation and retirement plans to nonlawyer employees, (iii) Pay the purchase price of a deceased, disabled, or disappeared lawyer’s practice to the practice’s nonlawyer representative, and (iv) Share a court-awarded fee with a nonprofit organization that recommended or hired the lawyer as counsel. Paying a referral fee to a nonlawyer is an improper fee-sharing arrangement.","verify":false,"id":39}, {"topic":"Regulation","style":"BARBRI","stem":"Which of the following is a permissible restriction on a lawyer’s right to practice law?","choices":[{"letter":"A","text":"A lawyer’s voluntary agreement not to practice law before a tribunal, entered into as part of a client’s settlement agreement"},{"letter":"B","text":"An agreement between a law firm and a retired partner that discontinues retirement payments if the partner re-enters the practice of law"},{"letter":"C","text":"A durational restriction on a lawyer’s right to practice after termination of employment (e.g., the lawyer promises not to practice law for one year)"},{"letter":"D","text":"A geographical restriction on a lawyer’s right to practice after termination of employment"}],"correct":"B","explanation":"A lawyer must neither make nor offer a partnership or employment or similar agreement that restricts a lawyer’s right to practice after termination of the relationship, except for an agreement concerning benefits upon retirement, such as an agreement between a law firm and a retired partner that discontinues retirement payments if the partner re-enters the practice of law. Both geographic and durational restrictions on the right to practice are prohibited, as is a lawyer’s voluntary agreement not to practice law before a tribunal. A lawyer must neither make nor offer an agreement in which a restriction on the lawyer’s right to practice is part of the settlement of a client controversy.","verify":false,"id":40}, {"topic":"Regulation","style":"Scenario","stem":"Calvin is admitted to practice in State A but received “pro hac vice” permission from State B to represent a client in State B court. During the State B litigation, Calvin commits misconduct. \n\nWhich state can discipline Calvin for his misconduct?","choices":[{"letter":"A","text":"State A only"},{"letter":"B","text":"State B only"},{"letter":"C","text":"Both states"}],"correct":"C","explanation":"A lawyer is subject to regulation by each state in which the lawyer is admitted to practice, regardless of where the lawyer actually practices law or where the lawyer’s conduct occurred. A lawyer is also subject to discipline in any other state where the lawyer provides or offers to provide legal services. Calvin is admitted to practice in State A and was practicing on a temporary basis in State B. Calvin is subject to discipline in both states.","verify":false,"id":41}, {"topic":"Regulation","style":"Scenario","stem":"Miguel and Brendan are brothers-in-law and are both lawyers. One day, Brendan pulls Miguel aside at a holiday gathering and tells Miguel he needs legal advice. Miguel agrees to help, and Brendan tells Miguel that he has been stealing small amounts of money from many clients to support his gambling addiction. Miguel tells Brendan to hire another lawyer. \n\nWhat should Miguel do next?","choices":[{"letter":"A","text":"Report Brendan’s violation to the appropriate disciplinary authority, because it raises a substantial question as to his honesty and fitness to practice law"},{"letter":"B","text":"Keep the information confidential"}],"correct":"B","explanation":"Brendan’s misconduct raises a substantial question as to his honesty and fitness to practice law. Ordinarily, another lawyer who learns of such conduct must report it to the appropriate professional authority. However, this rule does not require disclosure of information protected by the duty of confidentiality to a client. Here, Miguel knows of Brendan’s conduct only because Brendan consulted him for legal advice—Miguel was acting as a lawyer, not a brother-in-law. Miguel has a duty of confidentiality to Brendan, even though they did not continue their attorney-client relationship.","verify":false,"id":42}, {"topic":"Regulation","style":"Scenario","stem":"Attorney Selin suspects that Phil, her supervisor, is stealing from clients because he suddenly purchased several luxury items and seems “off.” Selin does not report this to a disciplinary authority. \n\nIs Selin subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"B","explanation":"A lawyer who ***knows****** ***that another lawyer has violated the rules of professional conduct in such a way that it raises a substantial question as to that lawyer’s honesty, trustworthiness, or fitness as a lawyer must report the violation to the appropriate professional authority. “Knowledge” means actual knowledge, and although knowledge can be inferred from the circumstances, it has to be more than mere suspicion. Stealing from clients would raise a substantial question about Phil, but because Selin only ***suspects****** ***that Phil is stealing, there is no mandatory duty to report.","verify":false,"id":43}, {"topic":"Regulation","style":"Scenario","stem":"Attorney Brad tried to murder a witness in a case he was working on. He was eventually acquitted at trial on a technicality. \n\nIs Brad subject to discipline?","choices":[{"letter":"A","text":"No, because he was not convicted"},{"letter":"B","text":"No, because the crime did not involve dishonesty"},{"letter":"C","text":"Yes, because the crime reflects adversely on his fitness as a lawyer"},{"letter":"D","text":"Yes, because the crime was connected to his law practice"}],"correct":"C","explanation":"A lawyer is subject to discipline for committing a criminal act that reflects adversely on his honesty, trustworthiness, or fitness as a lawyer in other respects.  To constitute professional misconduct, the crime must involve some characteristic that’s relevant to the practice of law. For example, crimes involving dishonesty, breach of trust, substantial interference with the administration of justice, and most crimes involving violence reflect on the lawyer’s fitness to practice law. Brad is subject to discipline for his serious crime of violence. (A) is wrong because a conviction is not required. (B) is wrong because the crime need not involve dishonesty. (D) is wrong because a lawyer is subject to discipline even if the crime was unrelated to the lawyer’s practice. (E) is wrong because not all crimes will necessarily trigger professional discipline.","verify":false,"id":44}, {"topic":"Regulation","style":"Scenario","stem":"Bar applicant Tom hires his old law professor Aisha in connection with his bar application. Tom tells Aisha that there were charges of plagiarism filed against him during college, but these charges were eventually dropped when the accusing professor died. Aisha does not believe Tom would have committed plagiarism. The state bar contacts Aisha as a character reference and asks, “Do you know of any past or current allegations of dishonesty against the applicant?” Aisha responds, “No, I do not.” \n\nIs Aisha subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"A","explanation":"An applicant for admission to the bar, or a lawyer in connection with a bar admission application, must not knowingly make a false statement of material fact. \n\nAdditionally, an applicant, or a lawyer in connection with an applicant’s application for admission, must not: (i) fail to disclose a fact necessary to correct a misapprehension known by the person to have arisen in the matter, or (ii) knowingly fail to respond to a lawful demand for information from an admissions authority. This rule doesn’t, however, require disclosure of information otherwise protected by the confidentiality provisions of the rules of professional conduct. \n\nHere, Aisha will be subject to discipline because she made a false statement of material fact to the state bar—she said she didn’t know of any allegations against Tom, when in fact she did know about the plagiarism allegation. But note that if she had simply refused to respond to the question (rather than lying), she would NOT be subject to discipline because she gained the information while representing Tom as a client—it is protected by her duty of confidentiality.","verify":false,"id":45}, {"topic":"Regulation","style":"Scenario","stem":"Which of the following is a valid requirement for admission to a state's bar?","choices":[{"letter":"A","text":"The applicant is willing to take an oath to uphold the state and federal constitutions"},{"letter":"B","text":"The applicant is a citizen of the United States"},{"letter":"C","text":"The applicant is a resident of the state in which she is seeking admission"}],"correct":"A","explanation":"It is valid for a state to require an applicant for admission to the bar to take an oath to uphold the state and federal constitutions. An applicant who refuses to take such an oath may be denied admission because there is a rational connection between this requirement and the practice of law. However, a state cannot require that an applicant be a United States citizen; such a requirement violates the Equal Protection Clause of the United States Constitution. Similarly, a requirement that a bar applicant be a resident of the state in which she is seeking admission violates the Privileges and Immunities Clause of the Constitution and is therefore invalid.","verify":false,"id":46}, {"topic":"Regulation","style":"Scenario","stem":"Becca is a criminal defense attorney who also owns a dog grooming business. On one occasion, Becca failed to supervise a new employee, and a dog was seriously injured.\n\nIs Becca subject to discipline?","choices":[{"letter":"A","text":"Yes, unless she had warned the dog’s owner that the protections of the attorney-client relationship do not apply"},{"letter":"B","text":"No, because grooming dogs is not a law-related service"}],"correct":"B","explanation":"Law-related services are services that might reasonably be performed in conjunction with (and are related to) the provision of legal services and that are not prohibited as unauthorized practice of law when provided by a nonlawyer. If a lawyer provides nonlegal services through an entity that isn’t her law office but that she controls (either alone or with other lawyers), that lawyer must take reasonable steps to assure that people who receive the nonlegal services understand that those services aren’t legal services and that the rules of professional conduct don’t cover those services. If the lawyer doesn’t take those reasonable steps, then the lawyer is subject to the rules of professional conduct with respect to the nonlegal services.\n\nDog grooming is not a law-related service. Thus, the rules of professional conduct won’t apply even if Becca fails to make this clear to her customers.","verify":false,"id":47}, {"topic":"Regulation","style":"Scenario","stem":"Arie, a tax attorney, meets with client Chloe to prepare her taxes and provide legal advice. Arie makes a serious error on the tax return, resulting in a costly audit.\n\nCould Arie be subject to discipline for incompetently completing Chloe’s tax return?","choices":[{"letter":"A","text":"No, because preparing a tax return is a nonlegal service"},{"letter":"B","text":"Yes, because the legal and nonlegal services were provided together"}],"correct":"B","explanation":"If a lawyer provides nonlegal services in circumstances that aren’t distinct from the provision of legal services, then the rules of professional conduct apply to both the legal and nonlegal services. Consequently, Arie can be disciplined for the mistake on Chloe’s tax return.","verify":false,"id":48}, {"topic":"Regulation","style":"Scenario","stem":"Kai is a new associate working on a personal injury case. Kai’s supervisor, Leah, tells Kai to send an important eyewitness an “attendance fee” for testifying at trial. The rules of professional conduct in the jurisdiction forbid compensating a non-expert witness for their testimony, but Kai is not aware of this. Kai makes the payment to the witness.\n\nIs Kai subject to discipline?","choices":[{"letter":"A","text":"No, because making the payment was a reasonable resolution of an arguable ethics question"},{"letter":"B","text":"No, because Kai was acting on orders from Leah"},{"letter":"C","text":"Yes, because making the payment violated the rules of professional conduct"}],"correct":"C","explanation":"A subordinate lawyer doesn’t violate the rules of professional conduct by acting in accordance with a supervisor’s reasonable resolution of an ***arguable question ***of professional duty. Here, however, there was no arguable question of professional duty—the rules of professional conduct state that the payment was forbidden. It’s immaterial that Kai didn’t know about the rule. Orders from a supervisory lawyer are no excuse for clearly unethical conduct—a lawyer has to follow the ethics rules even when acting under the direction of another person.","verify":false,"id":49}, {"topic":"Regulation","style":"Scenario","stem":"A law firm is defending a client in a personal injury case. Andrea, a senior associate, is in charge of the case. Andrea believes that the plaintiff is exaggerating his injury, so she hires Ed, a rookie private investigator, on a contract basis to “check out the plaintiff and get to the bottom of this.” Instead of conducting covert surveillance as Andrea expected, Ed confronts the plaintiff at his home and tells him to drop the lawsuit. The rules of professional conduct prohibit a lawyer from communicating with a represented party without their counsel’s consent.\n\nIs Andrea subject to discipline?","choices":[{"letter":"A","text":"No, because she is not a partner of the firm"},{"letter":"B","text":"No, because she did not order or ratify the misconduct, and had no opportunity to take reasonable remedial action"},{"letter":"C","text":"No, because Ed is not an employee of her firm"},{"letter":"D","text":"Yes, because she failed to make reasonable efforts to assure that Ed’s conduct would comply with her own professional obligations"}],"correct":"D","explanation":"The partners and managers in a law firm have to make reasonable efforts to assure that the conduct of nonlawyers who are associated with the firm is compatible with the obligations of the profession. Additionally, any lawyer who directly supervises the work of a nonlawyer has the same duty with respect to that nonlawyer. Therefore, (D) is correct because Andrea is Ed’s direct supervisor in the matter—she hired him and is in charge of the case. She had a duty to make reasonable efforts to assure that Ed’s conduct would comply with the rules of professional conduct. For instance, she should have made sure he understood the bounds of what she wanted him to do and that, as her agent, he could not communicate with the plaintiff directly.\n\n**E** Yes, because a supervising lawyer is always responsible for the conduct of persons working on a matter\n\n(E) is wrong because it’s too broad. If Andrea had made reasonable efforts to ensure that Ed acted appropriately, she would not have been subject to discipline.","verify":false,"id":50}, {"topic":"Regulation","style":"Scenario","stem":"Tanith and Brian work at the same law firm. Tanith is an associate and Brian is a partner, but Brian is not Tanith’s direct supervisor. One day, Tanith and Brian run into each other in a courtroom hallway. Tanith mentions to Brian that she was in the middle of a trial and she had just convinced a witness to “bend the truth a little—or a lot.” Brian shakes his head in disapproval but otherwise does nothing. Tanith’s client wins at trial.\n\nIs Brian subject to discipline for Tanith’s misconduct?","choices":[{"letter":"A","text":"No, because he is not Tanith’s direct supervisor"},{"letter":"B","text":"No, because he did not order or ratify Tanith’s misconduct"},{"letter":"C","text":"Yes, because he is jointly and severally liable for the misconduct of everyone at the firm"},{"letter":"D","text":"Yes, because he failed to take reasonable remedial action"}],"correct":"D","explanation":"A lawyer is subject to discipline for a disciplinary violation committed by a second lawyer if: (i) the first lawyer ordered the second lawyer’s misconduct or knew about it and ratified it; or (ii) the first lawyer is a partner or manager or has direct supervisory responsibility over the second lawyer, and knows about the misconduct at a time when its consequences can be avoided or mitigated and fails to take reasonable remedial action. (D) is correct because Brian had a duty to take reasonable remedial action (e.g., advising Tanith to strike the testimony, notifying Tanith’s supervisor, etc.).","verify":false,"id":51}, {"topic":"Regulation","style":"Scenario","stem":"Which of the following is a PROPER restriction on a lawyer’s right to practice law?","choices":[{"letter":"A","text":"Leon takes on a new associate, Adrian. Adrian’s employment agreement provides that if Adrian leaves the firm on his own accord, he will not practice law within a 10-mile radius for six months following his departure"},{"letter":"B","text":"Leon settles a client’s lawsuit against a pharmaceutical company. As part of the settlement, Leon promises not to bring any more claims against the company"},{"letter":"C","text":"Leon takes on a new partner, Julissa. The partnership agreement provides that if Julissa leaves the firm and takes any of the firm’s clients with her, Julissa must pay the firm 50% of her billings for that client for two years following her departure"},{"letter":"D","text":"Leon sells his family law practice to Samaira and agrees to stop practicing family law in the state"}],"correct":"D","explanation":"There are two types of prohibited restrictions on a lawyer’s right to practice law. First, a lawyer can’t make or offer a partnership, employment, or similar agreement that restricts a lawyer’s right to practice after termination of the relationship (except for an agreement concerning retirement benefits). The agreement in (A) is a noncompete agreement and is clearly improper, even though it’s a small geographical restriction and a short period of time. The agreement in (C) is also improper because it effectively restricts Julissa’s right to practice law where she chooses; it also restricts the clients’ right to select their own lawyer.\n\nSecond, a lawyer can’t make or offer an agreement that includes a restriction on the lawyer’s right to practice as part of the settlement of a client controversy. The agreement in (B) violates this rule.\n\nWhen a law practice is sold, the seller generally has to stop practicing law in the local area, so the agreement in (D) is proper.","verify":false,"id":52}, {"topic":"Regulation","style":"Scenario","stem":"Generally, a lawyer must not share fees with a nonlawyer.\n\nWhich of the following is NOT an exception to this rule?","choices":[{"letter":"A","text":"Paying a paralegal a portion of a fee based on how much work they did on that matter"},{"letter":"B","text":"Paying death benefits to a deceased lawyer’s estate"},{"letter":"C","text":"Sharing a court-awarded legal fee with the nonprofit organization that hired or recommended the lawyer in the matter"},{"letter":"D","text":"Purchasing the law practice of a deceased, disabled, or disappeared lawyer"}],"correct":"D","explanation":"**E**\n\nPaying the firm’s administrative assistants a salary or bonus","verify":false,"id":53}, {"topic":"Regulation","style":"Scenario","stem":"Beth, an entertainment lawyer, forms a partnership with Jeff, a nonlawyer talent agent. The partnership’s purpose is to provide clients with a “one stop shop” for their needs. Beth provided legal services on one side of the office, and Jeff worked as a talent agent on the other side of the office. Jeff never did any legal work, and Beth made sure to warn all clients that the protections of the attorney-client relationship did not apply to their dealings with Jeff.\n\nIs Beth subject to discipline?","choices":[{"letter":"A","text":"Yes"},{"letter":"B","text":"No"}],"correct":"A","explanation":"A lawyer must not form a partnership with a nonlawyer if ***any ***part of the partnership activities will constitute the practice of law. Because Beth formed a partnership with nonlawyer Jeff, and the partnership was meant to provide legal services, Beth is subject to discipline.\n\nMake sure to distinguish this rule from the law-related services rule. It would have been proper for Beth to control a ***separate entity*** that provided law-related services. However, Beth would have been subject to the rules of professional conduct with respect to the non-legal services unless she made it clear that the protections of the attorney-client relationship did not apply.","verify":false,"id":54}, {"topic":"Regulation","style":"Scenario","stem":"Abby is licensed to practice in State A but received “pro hac vice” permission from State B to represent a client in a lawsuit in State B court. During the State B litigation, Abby does something that violates the rules of professional conduct of State B. However, the action is permitted under State A’s rules. State B’s choice of law rule follows the ABA model rule. \n\nWhich state’s rule will apply to Abby’s conduct?","choices":[{"letter":"A","text":"State A, because that is where Abby is licensed"},{"letter":"B","text":"State B, because that is where the litigation took place"},{"letter":"C","text":"Each state can apply their own rule and discipline Abby"}],"correct":"B","explanation":"Although each state can discipline Abby, a lawyer’s particular conduct is governed by only one set of disciplinary rules. Therefore, (C) is wrong. The choice of law rules are as follows: If the conduct in question occurred in connection with a proceeding that was pending before a tribunal, the ethics rules of the jurisdiction in which the tribunal sits will be applied, unless the tribunal’s rules provide otherwise. For any other conduct, the rules of the jurisdiction in which the predominant effect of the conduct occurred will apply (but note that if the lawyer reasonably believed that the predominant effect would be somewhere else, the lawyer won’t be subject to discipline if the conduct would have been proper in that other jurisdiction). \n\nBecause Abby’s misconduct occurred in connection with litigation pending before a State B court, State B’s rule will apply. Thus, (B) is correct and (A) is wrong.","verify":false,"id":55}, {"topic":"Client-Lawyer","style":"BARBRI","stem":"A lawyer’s assent to accept a client __________.","choices":[{"letter":"A","text":"Must be clearly communicated to the client, either in writing or orally, to be legally binding"},{"
