false, "id": 111}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "An attorney may reveal a client's confidential information in all of the following cases, EXCEPT:", "choices": [{"letter": "A", "text": "As is necessary to obtain legal ethics advice for the attorney"}, {"letter": "B", "text": "To the extent that the lawyer reasonably believes necessary to prevent reasonably certain death or substantial bodily harm to the client or a third party"}, {"letter": "C", "text": "To the extent necessary to protect the attorney's interests in a dispute that involves the conduct of the attorney"}, {"letter": "D", "text": "To the extent that the lawyer reasonably believes necessary to prevent any financial injury to the client or a third party"}], "correct": "D", "explanation": "There is no exception to the duty of confidentiality that allows an attorney to reveal a client's confidential information simply to prevent any financial injury to the client or a third party. An attorney may reveal confidential information to prevent a client's crime or fraud reasonably certain to cause substantial financial harm if the client used the lawyer's services, but not merely to prevent any financial harm. An attorney may reveal information to prevent reasonably certain death or substantial bodily harm, to protect the attorney's interests in a dispute, or to obtain legal ethics advice.", "verify": false, "id": 112}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "An attorney's duty to preserve a client's confidential information __________.", "choices": [{"letter": "A", "text": "Does not cease when the representation ends"}, {"letter": "B", "text": "Ceases upon the death of the client"}, {"letter": "C", "text": "Ceases if the client fires the attorney"}, {"letter": "D", "text": "Ceases when all pending cases have ended, including any possible appeals"}], "correct": "A", "explanation": "An attorney's duty to preserve a client's confidential information does not cease when the representation ends. It also does not cease upon the death of the client or if the client fires the attorney.", "verify": false, "id": 113}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "__________ prevent(s) a court from compelling the revelation of confidential communications between an attorney and client.", "choices": [{"letter": "A", "text": "Both the attorney-client privilege and the ethical duty of confidentiality"}, {"letter": "B", "text": "The attorney-client privilege"}, {"letter": "C", "text": "The ethical duty of confidentiality"}, {"letter": "D", "text": "Neither — courts can always compel disclosure"}], "correct": "B", "explanation": "The attorney-client privilege prevents a court, or other governmental tribunal, from using the twin powers of subpoena and contempt to compel the revelation of confidential communications between an attorney and a client. In contrast, the ethical duty of confidentiality prohibits an attorney from voluntarily revealing information relating to the representation of a client — it applies in every context where the attorney-client privilege does not apply.", "verify": false, "id": 114}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Which communications are covered by the attorney-client privilege when the client is a corporation?", "choices": [{"letter": "A", "text": "None, because the attorney-client privilege applies only to human clients"}, {"letter": "B", "text": "Communications between the lawyer and a high-ranking corporate official"}, {"letter": "C", "text": "Communications between the lawyer and any person, if the content of the communications is somehow related to the corporation"}, {"letter": "D", "text": "Communications between the lawyer and any employee of the corporation"}], "correct": "B", "explanation": "When the client is a corporation, the attorney-client privilege covers communications between the lawyer and a high-ranking corporate official. Communications between the lawyer and lower-level employees are privileged only if: (i) the employee communicates with the lawyer at the direction of the employee's superior; (ii) the employee knows the purpose is to obtain legal advice for the corporation; and (iii) the communication concerns a subject within the scope of the employee's corporate duties. Corporate clients are covered by the privilege.", "verify": false, "id": 115}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "The attorney-client privilege does NOT apply to:", "choices": [{"letter": "A", "text": "Written communications"}, {"letter": "B", "text": "Preexisting documents"}, {"letter": "C", "text": "Statements made by agents"}, {"letter": "D", "text": "Oral communications"}], "correct": "B", "explanation": "The attorney-client privilege does not apply to preexisting documents. A client cannot protect a preexisting document from discovery simply by turning it over to the attorney. If the document would be discoverable in the client's hands, it is equally discoverable in the attorney's hands. The attorney-client privilege covers both oral and written communications, and statements made by agents of either the attorney or the client.", "verify": false, "id": 116}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Which of the following statements regarding \"confidential\" communications is most correct?", "choices": [{"letter": "A", "text": "For an attorney-client communication to be considered confidential, the only third parties who can be present are those who play a direct role in the communication"}, {"letter": "B", "text": "For an attorney-client communication to be considered confidential, the only third parties who can be present are those who are there to help further the attorney-client relationship"}, {"letter": "C", "text": "For an attorney-client communication to be considered confidential, no third parties can be present during the communication"}, {"letter": "D", "text": "For an attorney-client communication to be considered confidential, the only third parties who can be present are those who are agents of either the attorney or the client"}], "correct": "B", "explanation": "For an attorney-client communication to be considered confidential, the communicating person must reasonably believe that no outsider will hear the contents. The presence of a third party will not destroy confidentiality if the third party was present to help further the attorney-client relationship — the third party need not be an agent or play a direct role. For example, a third party may be present because of the client's psychological needs.", "verify": false, "id": 117}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Which of these statements regarding confidential information and privileged information is true?", "choices": [{"letter": "A", "text": "An attorney cannot reveal privileged or confidential information unless the client expressly consents"}, {"letter": "B", "text": "An attorney generally has implied authority from the client to use or disclose confidential information when appropriate to carry out the representation, but cannot reveal privileged information unless the client expressly consents"}, {"letter": "C", "text": "An attorney generally has implied authority from the client to use or disclose privileged information when appropriate to carry out the representation, but cannot reveal confidential information unless the client expressly consents"}, {"letter": "D", "text": "An attorney generally has implied authority from the client to reveal privileged or confidential information when appropriate to carry out the representation"}], "correct": "B", "explanation": "An attorney has implied authority from the client to use or disclose confidential information when appropriate to carry out the representation, unless the client gives specific instructions to the contrary. However, the attorney-client privilege exists for the sole benefit of the client, and only the client can waive the privilege. The attorney cannot choose to waive the privilege without the client's express consent.", "verify": false, "id": 118}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "An attorney has an ethical duty not to reveal a client's confidential information, even if she _________.", "choices": [{"letter": "A", "text": "Has been ordered to do so by a court"}, {"letter": "B", "text": "Is defending her own conduct in a dispute involving her conduct"}, {"letter": "C", "text": "Believes disclosure is necessary in the interest of justice"}, {"letter": "D", "text": "Is seeking legal ethics advice"}], "correct": "C", "explanation": "An attorney's belief that disclosure is necessary in the interest of justice is not an exception to the duty of confidentiality. An attorney may reveal confidential information to defend her own conduct in a dispute, to obtain legal ethics advice, or when required to do so by law or court order. But a general belief that justice would be served by disclosure does not satisfy any recognized exception.", "verify": false, "id": 119}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Which of the following statements is correct regarding disclosure and use of attorney-client information?", "choices": [{"letter": "A", "text": "Both the attorney-client privilege and the ethical duty of confidentiality concern only the disclosure of information"}, {"letter": "B", "text": "Both the attorney-client privilege and the ethical duty of confidentiality concern both the disclosure and use of information"}, {"letter": "C", "text": "The ethical duty of confidentiality concerns only the disclosure of information, whereas the attorney-client privilege concerns both the disclosure and use of information"}, {"letter": "D", "text": "The attorney-client privilege concerns only the disclosure of information, whereas the ethical duty of confidentiality concerns both the disclosure and use of information"}], "correct": "D", "explanation": "The attorney-client privilege concerns only the disclosure of information. In contrast, the ethical duty of confidentiality concerns both the disclosure and use of information. An attorney can be disciplined for disclosing a client's confidential information without informed consent, or for using confidential information to the disadvantage of a client, former client, or prospective client, without the affected client's informed consent.", "verify": false, "id": 120}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "When a lawyer is representing a corporate client, which of these is NOT required for the lawyer's communications with a lower level corporate employee to be protected by the attorney-client privilege?", "choices": [{"letter": "A", "text": "The employee communicates with the lawyer at the direction of the employee's superior"}, {"letter": "B", "text": "The communication concerns a subject within the scope of the employee's duties to act for the corporation"}, {"letter": "C", "text": "The employee knows that the purpose of the communication is to obtain legal advice for the corporation"}, {"letter": "D", "text": "The employee invokes the attorney-client privilege on behalf of the corporation"}], "correct": "D", "explanation": "There is no need for the employee to explicitly invoke the attorney-client privilege for the privilege to apply. The privilege covers communications between a lawyer and lower-level corporate employees if: (i) the employee communicates with the lawyer at the direction of the employee's superior; (ii) the employee knows that the purpose of the communication is to obtain legal advice for the corporation; and (iii) the communication concerns a subject within the scope of the employee's duties to act for the corporation.", "verify": false, "id": 121}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Under modern law, how does the presence of an unsuspected eavesdropper affect the confidentiality of an attorney-client communication?", "choices": [{"letter": "A", "text": "The confidentiality of the communication is destroyed, but the eavesdropper can be prohibited from testifying about the communication"}, {"letter": "B", "text": "The communication remains confidential, and the eavesdropper can be prohibited from testifying about the communication"}, {"letter": "C", "text": "The communication remains confidential, but the eavesdropper can choose to testify about the communication"}, {"letter": "D", "text": "The confidentiality of the communication is destroyed, and the eavesdropper can choose to testify about the communication"}], "correct": "B", "explanation": "Under modern law, a confidential communication remains confidential despite the presence of an unsuspected eavesdropper, and the eavesdropper can be prohibited from testifying about the confidential communication. Under older law, the presence of an unsuspected eavesdropper was sometimes held to destroy the confidentiality of a communication, but under modern evidence law this is no longer true.", "verify": false, "id": 122}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Who can choose to waive the attorney-client privilege?", "choices": [{"letter": "A", "text": "The attorney only"}, {"letter": "B", "text": "No one, because the attorney-client privilege is absolute and unwaivable"}, {"letter": "C", "text": "Either the client or the attorney"}, {"letter": "D", "text": "The client only"}], "correct": "D", "explanation": "Only the client can waive the attorney-client privilege, as the client is the \"holder\" of the privilege. A waiver consists of a failure to claim the privilege when there is an opportunity to do so, or the intentional revelation of a significant portion of the privileged communication. The attorney cannot choose to waive the privilege. If someone tries to obtain privileged information when the client is not present, the attorney must claim the privilege on the client's behalf.", "verify": false, "id": 123}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "When does a lawyer's duty to preserve a client's confidential information cease?", "choices": [{"letter": "A", "text": "After all pending cases have ended, including any possible appeals"}, {"letter": "B", "text": "It does not cease"}, {"letter": "C", "text": "After the client dies"}, {"letter": "D", "text": "Only if the client chooses to fire the lawyer"}], "correct": "B", "explanation": "An attorney's duty to preserve a client's confidential information does not cease when the representation ends, even when any possible appeals have ended. It also does not cease after the client dies or if the client fires the lawyer.", "verify": false, "id": 124}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "Which of the following statements is correct regarding the attorney-client privilege?", "choices": [{"letter": "A", "text": "It does not apply in a courtroom, i.e., an attorney may be compelled to testify as to confidential communications between himself and his client"}, {"letter": "B", "text": "It prohibits an attorney from voluntarily revealing any information relating to the representation of a client"}, {"letter": "C", "text": "It prevents a court from compelling the revelation of confidential communications between an attorney and a client"}, {"letter": "D", "text": "It applies only outside the courtroom"}], "correct": "C", "explanation": "The attorney-client privilege is an exclusionary rule of evidence law. It prevents a court, or other governmental tribunal, from using the twin powers of subpoena and contempt to compel the revelation of confidential communications between an attorney and a client. In contrast, the ethical duty of confidentiality — rather than the attorney-client privilege — prohibits an attorney from voluntarily revealing information relating to the representation of a client.", "verify": false, "id": 125}, {"topic": "Confidentiality", "style": "BARBRI", "stem": "If someone tries to obtain privileged information from an attorney when the client is not present, the attorney __________.", "choices": [{"letter": "A", "text": "May decide whether to reveal the information based on his own best interests"}, {"letter": "B", "text": "Must claim the attorney-client privilege on the client's behalf and not reveal the information"}, {"letter": "C", "text": "May decide whether to reveal the information based on his client's best interests"}, {"letter": "D", "text": "Must claim the attorney-client privilege on his own behalf and not reveal the information"}], "correct": "B", "explanation": "If someone tries to obtain privileged information from an attorney when the client is not present, the lawyer must claim the privilege on the client's behalf. The attorney-client privilege exists for the benefit of the client, not the attorney. The client is the \"holder\" of the privilege and the only one who can waive it. The attorney cannot choose to waive the privilege without the client's permission.", "verify": false, "id": 126}];

(function(){
var TOPICS = ['All','Regulation','Client-Lawyer','Confidentiality','Conflicts'];
var state = { filter:'All', order:[], idx:0, answered:false, right:0, wrong:0,
              missed:[], perTopic:{} };

function g(id){ return document.getElementById(id); }

function idsFor(filter){
  return QUESTIONS.filter(function(q){ return filter==='All' || q.topic===filter; })
                  .map(function(q){ return q.id; });
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function buildFilters(){
  var w = g('filters'); w.innerHTML='';
  TOPICS.forEach(function(t){
    var n = t==='All' ? QUESTIONS.length : QUESTIONS.filter(function(q){return q.topic===t;}).length;
    var b = document.createElement('button');
    b.className = 'fbtn'+(state.filter===t?' active':'');
    b.innerHTML = t+'<span class="fc">'+n+'</span>';
    b.addEventListener('click', function(){ state.filter=t; start(shuffle(idsFor(t))); buildFilters(); });
    w.appendChild(b);
  });
}

function start(order){
  state.order = order; state.idx=0; state.answered=false;
  state.right=0; state.wrong=0; state.missed=[]; state.perTopic={};
  g('results').style.display='none'; g('qcard').style.display='block';
  render();
}

function render(){
  var total = state.order.length;
  g('d-right').textContent = state.right;
  g('d-wrong').textContent = state.wrong;
  g('d-left').textContent = Math.max(0, total - state.idx);
  g('hdr-score').textContent = state.right + '/' + (state.right+state.wrong);
  g('d-fill').style.width = total>0 ? Math.round((state.right+state.wrong)/total*100)+'%' : '0%';
  if(state.idx >= total){ showResults(); return; }
  var q = QUESTIONS[state.order[state.idx]];
  state.answered = false;
  g('qnum').textContent = 'Question '+(state.idx+1)+' of '+total;
  g('b-topic').textContent = q.topic;
  g('b-src').textContent = q.style;
  g('b-verify').style.display = q.verify ? 'inline-block' : 'none';
  g('stem').textContent = q.stem;
  g('explain').style.display='none';
  g('next-wrap').style.display='none';
  var cw = g('choices'); cw.innerHTML='';
  q.choices.forEach(function(c){
    var d = document.createElement('div');
    d.className='choice'; d.id='ch-'+c.letter;
    d.innerHTML = '<div class="ch-letter">'+c.letter+'</div><div class="ch-text"></div>';
    d.querySelector('.ch-text').textContent = c.text;
    d.addEventListener('click', function(){ answer(q, c.letter); });
    cw.appendChild(d);
  });
}

function answer(q, letter){
  if(state.answered) return;
  state.answered = true;
  var correct = (letter === q.correct);
  if(correct){ state.right++; } else { state.wrong++; state.missed.push(q.id); }
  if(!state.perTopic[q.topic]) state.perTopic[q.topic] = {r:0,t:0};
  state.perTopic[q.topic].t++;
  if(correct) state.perTopic[q.topic].r++;
  q.choices.forEach(function(c){
    var el = g('ch-'+c.letter);
    if(c.letter === letter && correct) el.className='choice picked-right';
    else if(c.letter === letter && !correct) el.className='choice picked-wrong';
    else if(c.letter === q.correct) el.className='choice reveal-right';
    else el.className='choice dim';
  });
  g('explain-label').textContent = correct ? '✓ Correct — '+q.correct : '✗ The answer is '+q.correct;
  g('explain-text').textContent = q.explanation || '';
  g('explain').style.display='block';
  g('next-wrap').style.display='block';
  g('d-right').textContent = state.right;
  g('d-wrong').textContent = state.wrong;
  g('hdr-score').textContent = state.right + '/' + (state.right+state.wrong);
  g('d-fill').style.width = Math.round((state.right+state.wrong)/state.order.length*100)+'%';
}

g('btn-next').addEventListener('click', function(){ state.idx++; render(); });
document.addEventListener('keydown', function(e){
  if(!state.answered){
    var L = e.key.toUpperCase();
    if(['A','B','C','D'].indexOf(L) >= 0){
      var q = QUESTIONS[state.order[state.idx]];
      if(q && q.choices.some(function(c){return c.letter===L;})) answer(q, L);
    }
  } else if(e.code==='Space' || e.key==='Enter'){ e.preventDefault(); state.idx++; render(); }
});

function showResults(){
  g('qcard').style.display='none';
  g('results').style.display='block';
  var total = state.right + state.wrong;
  var pct = total>0 ? Math.round(state.right/total*100) : 0;
  g('res-score').textContent = pct + '%';
  g('res-sub').textContent = state.right+' of '+total+' correct'+(state.missed.length?' · '+state.missed.length+' queued for re-drill':'');
  var rows = g('topic-rows'); rows.innerHTML='';
  Object.keys(state.perTopic).forEach(function(t){
    var s = state.perTopic[t];
    var p = Math.round(s.r/s.t*100);
    var color = p>=80 ? '#1d9e75' : p>=60 ? '#c9973a' : '#e24b4a';
    var row = document.createElement('div');
    row.className='t-row';
    row.innerHTML = '<div class="t-name">'+t+'</div><div class="t-bar"><div class="t-fill" style="width:'+p+'%;background:'+color+';"></div></div><div class="t-pct">'+s.r+'/'+s.t+' · '+p+'%</div>';
    rows.appendChild(row);
  });
  g('btn-missed').style.display = state.missed.length ? 'inline-block' : 'none';
}

g('btn-missed').addEventListener('click', function(){ start(shuffle(state.missed.slice())); });
g('btn-again').addEventListener('click', function(){ start(shuffle(idsFor(state.filter))); });
g('btn-shuffle').addEventListener('click', function(){ start(shuffle(idsFor(state.filter))); });
g('btn-order').addEventListener('click', function(){ start(idsFor(state.filter)); });

buildFilters();
start(shuffle(idsFor('All')));
})();
</script>
</body>
</html>
