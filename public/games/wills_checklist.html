<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wills — Checklist Drill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');
:root{
  --bg:#0d0d0f;--surface:#13131a;--border:#2a2a3a;--gold:#c9a84c;--gold-dim:#7a6430;
  --cream:#e8e0cc;--muted:#7a7a90;--text:#ccc8d8;
  --green:#2d6a4f;--green-bright:#52b788;--red:#7a2a2a;--red-bright:#c05555;
  --policy:#4a2a6a;--policy-bright:#9b72cf;--blue:#3a5f8a;--blue-bright:#5a8fbf;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;min-height:100vh;}

header{padding:20px 32px 16px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:flex-end;}
.brand{font-family:'Playfair Display',serif;font-size:10pt;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;}
.title{font-family:'Playfair Display',serif;font-size:24pt;font-weight:900;color:var(--cream);line-height:1;}
.subtitle{font-size:8pt;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:4px;}
.header-right{text-align:right;}
.score-row{display:flex;gap:20px;justify-content:flex-end;}
.score-item{text-align:center;}
.score-num{font-family:'Playfair Display',serif;font-size:18pt;font-weight:700;display:block;line-height:1;}
.score-num.got{color:var(--green-bright);}
.score-num.again{color:var(--red-bright);}
.score-lbl{font-size:7pt;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}

.controls{padding:10px 32px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ctrl-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Source Serif 4',serif;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:2px;cursor:pointer;transition:all .18s;}
.ctrl-btn:hover{border-color:var(--gold-dim);color:var(--gold);}
.ctrl-btn.active{background:var(--gold);border-color:var(--gold);color:#0d0d0f;font-weight:600;}
.ctrl-label{font-size:8pt;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-right:4px;}

main{max-width:900px;margin:0 auto;padding:28px 24px;}

/* Mental checklist */
.mental{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.step{flex:1;text-align:center;padding:10px 8px;border-right:1px solid var(--border);cursor:pointer;transition:all .2s;}
.step:last-child{border-right:none;}
.step:hover{background:rgba(201,168,76,.08);}
.step.active-section{background:rgba(201,168,76,.15);border-bottom:2px solid var(--gold);}
.step-num{font-family:'Playfair Display',serif;font-size:16pt;font-weight:900;color:var(--gold);display:block;line-height:1;}
.step-lbl{font-size:7pt;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;}

/* Sections */
.section{margin-bottom:20px;}
.section-header{font-family:'Playfair Display',serif;font-size:12pt;font-weight:900;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);padding:8px 14px;border-radius:2px;margin-bottom:2px;letter-spacing:.04em;color:var(--cream);}

/* Rows */
.row{display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid rgba(42,42,58,.5);cursor:pointer;transition:background .15s;position:relative;}
.row:hover{background:rgba(201,168,76,.05);}
.row.revealed{background:rgba(42,62,42,.15);}
.row.marked-got{background:rgba(45,106,79,.12);}
.row.marked-again{background:rgba(122,42,42,.12);}

.row-indent-0{padding-left:8px;}
.row-indent-1{padding-left:24px;}
.row-indent-2{padding-left:40px;}
.row-indent-3{padding-left:56px;}

.row-label{font-size:9.5pt;min-width:200px;flex-shrink:0;line-height:1.35;color:var(--text);}
.row-label.l0{font-family:'Playfair Display',serif;font-weight:700;font-size:10pt;color:var(--cream);}
.row-label.l1{font-weight:600;}
.row-label.l2{font-weight:400;}
.row-label.l3{font-weight:400;font-style:italic;font-size:8.5pt;color:var(--muted);}

.buzz-area{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1;}
.buzz-hidden{color:var(--muted);font-size:8pt;font-style:italic;letter-spacing:.08em;}

.tag{display:inline-block;font-family:'Playfair Display',serif;font-size:9.5pt;font-weight:700;padding:3px 10px;border-radius:2px;letter-spacing:.03em;opacity:0;transition:opacity .3s;pointer-events:none;}
.tag.show{opacity:1;pointer-events:auto;}
.tag.standard{background:rgba(201,168,76,.1);border:1px solid var(--gold-dim);color:var(--gold);}
.tag.policy{background:rgba(155,114,207,.1);border:1px solid var(--policy);color:var(--policy-bright);}
.tag.note{background:rgba(90,143,191,.1);border:1px solid var(--blue);color:var(--blue-bright);font-family:'Source Serif 4',serif;font-weight:400;font-style:italic;font-size:8pt;}

/* Row actions */
.row-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s;flex-shrink:0;}
.row:hover .row-actions,.row.revealed .row-actions{opacity:1;}
.act-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:7.5pt;padding:3px 8px;border-radius:2px;cursor:pointer;transition:all .15s;font-family:'Source Serif 4',serif;letter-spacing:.08em;text-transform:uppercase;}
.act-btn.got:hover,.act-btn.got.active{background:var(--green);border-color:var(--green);color:#fff;}
.act-btn.again:hover,.act-btn.again.active{background:var(--red);border-color:var(--red);color:#fff;}

.reveal-hint{font-size:7.5pt;color:var(--border);font-style:italic;position:absolute;right:8px;bottom:3px;pointer-events:none;}
.row:hover .reveal-hint{color:var(--muted);}
.row.revealed .reveal-hint{display:none;}

/* Progress */
.progress-bar-wrap{margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.progress-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.progress-text{font-size:8pt;color:var(--muted);white-space:nowrap;}

/* Summary */
.summary{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:16px 20px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.summary-title{font-family:'Playfair Display',serif;font-size:13pt;color:var(--cream);}
.summary-scores{display:flex;gap:20px;}
.sum-item{text-align:center;}
.sum-num{font-family:'Playfair Display',serif;font-size:22pt;font-weight:700;display:block;line-height:1;}
.sum-num.got{color:var(--green-bright);}
.sum-num.again{color:var(--red-bright);}
.sum-lbl{font-size:7.5pt;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.btn-reset{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);font-family:'Source Serif 4',serif;font-size:9pt;letter-spacing:.1em;text-transform:uppercase;padding:9px 20px;border-radius:2px;cursor:pointer;transition:all .18s;}
.btn-reset:hover{background:var(--gold);color:#0d0d0f;}
.btn-reveal-all{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Source Serif 4',serif;font-size:9pt;letter-spacing:.1em;text-transform:uppercase;padding:9px 20px;border-radius:2px;cursor:pointer;transition:all .18s;}
.btn-reveal-all:hover{border-color:var(--muted);color:var(--text);}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">LegalMinds ⚖️</div>
    <div class="title">WILLS — CHECKLIST DRILL</div>
    <div class="subtitle">Click each issue to reveal buzz words · Colleges of Law · Class of 2026</div>
  </div>
  <div class="header-right">
    <div class="score-row">
      <div class="score-item"><span class="score-num got" id="got-count">0</span><span class="score-lbl">Got It</span></div>
      <div class="score-item"><span class="score-num again" id="again-count">0</span><span class="score-lbl">Again</span></div>
    </div>
  </div>
</header>

<div class="controls">
  <span class="ctrl-label">Show:</span>
  <button class="ctrl-btn active" onclick="setMode('hide',this)">Hide All</button>
  <button class="ctrl-btn" onclick="setMode('show',this)">Show All</button>
  <button class="ctrl-btn" onclick="resetAll()">Reset</button>
</div>

<main>
<div class="progress-bar-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-text" id="progress-text">0 revealed</div>
</div>

<!-- Mental checklist nav -->
<div class="mental">
  <div class="step" onclick="scrollTo('s1')"><span class="step-num">I</span><span class="step-lbl">Validity</span></div>
  <div class="step" onclick="scrollTo('s2')"><span class="step-num">II</span><span class="step-lbl">Consists Of</span></div>
  <div class="step" onclick="scrollTo('s3')"><span class="step-num">III</span><span class="step-lbl">Revocation</span></div>
  <div class="step" onclick="scrollTo('s4')"><span class="step-num">IV</span><span class="step-lbl">Distribution</span></div>
  <div class="step" onclick="scrollTo('s5')"><span class="step-num">V</span><span class="step-lbl">Renunciation</span></div>
  <div class="step" onclick="scrollTo('s6')"><span class="step-num">VI</span><span class="step-lbl">Intestate</span></div>
</div>

<div id="checklist"></div>

<div class="summary">
  <div>
    <div class="summary-title">Progress</div>
    <div style="font-size:8.5pt;color:var(--muted);margin-top:4px;">Click rows to reveal · Mark Got It or Again</div>
  </div>
  <div class="summary-scores">
    <div class="sum-item"><span class="sum-num got" id="sum-got">0</span><span class="sum-lbl">Got It</span></div>
    <div class="sum-item"><span class="sum-num again" id="sum-again">0</span><span class="sum-lbl">Again</span></div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn-reveal-all" onclick="revealAll()">Reveal All</button>
    <button class="btn-reset" onclick="resetAll()">Reset ↺</button>
  </div>
</div>
</main>

  {id:'r78', type:'row', indent:2, label:'General POA', buzz:[{t:'Anyone Including Self'},{t:'Creditors Can Reach'},{t:'In Estate (Tax)'}]},
  {id:'r79', type:'row', indent:2, label:'Non-General (Special) POA', buzz:[{t:'Restricted Class'},{t:'Creditors Cannot Reach'},{t:'Not in Estate (Tax)'}]},
  {id:'r80', type:'row', indent:2, label:'Taker in Default', buzz:[{t:'Donee Fumbled'},{t:"Donor's Backup"}]},
  {id:'r81', type:'row', indent:2, label:'Residual Clause + General POA', buzz:[{t:'Majority: No'},{t:'Minority & UPC: Yes'}]},
];

let revealed = {};
let marked = {};
let mode = 'hide';

function build() {
  const container = document.getElementById('checklist');
  container.innerHTML = '';
  CHECKLIST.forEach(item => {
    if (item.type === 'section') {
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.id = item.id;
      const h = document.createElement('div');
      h.className = 'section-header';
      h.textContent = item.label;
      sec.appendChild(h);
      container.appendChild(sec);
      return;
    }
    const lastSection = container.lastElementChild;
    const row = document.createElement('div');
    row.className = `row row-indent-${item.indent}`;
    row.id = item.id;
    if (marked[item.id] === 'got') row.classList.add('marked-got');
    if (marked[item.id] === 'again') row.classList.add('marked-again');
    if (revealed[item.id] || mode === 'show') row.classList.add('revealed');

    const lbl = document.createElement('div');
    lbl.className = `row-label l${Math.min(item.indent,3)}`;
    lbl.textContent = item.label;
    row.appendChild(lbl);

    const buzzArea = document.createElement('div');
    buzzArea.className = 'buzz-area';

    if (item.buzz && item.buzz.length > 0) {
      if (!revealed[item.id] && mode !== 'show') {
        const hint = document.createElement('span');
        hint.className = 'buzz-hidden';
        hint.textContent = '— click to reveal';
        buzzArea.appendChild(hint);
      }
      item.buzz.forEach(b => {
        const tag = document.createElement('span');
        tag.className = `tag ${b.c || 'standard'}`;
        if (revealed[item.id] || mode === 'show') tag.classList.add('show');
        tag.textContent = b.t;
        buzzArea.appendChild(tag);
      });

      if (revealed[item.id] || mode === 'show') {
        const actions = document.createElement('div');
        actions.className = 'row-actions';
        const gotBtn = document.createElement('button');
        gotBtn.className = 'act-btn got' + (marked[item.id]==='got'?' active':'');
        gotBtn.textContent = '✓ Got It';
        gotBtn.onclick = (e) => { e.stopPropagation(); markRow(item.id, 'got'); };
        const againBtn = document.createElement('button');
        againBtn.className = 'act-btn again' + (marked[item.id]==='again'?' active':'');
        againBtn.textContent = '↺ Again';
        againBtn.onclick = (e) => { e.stopPropagation(); markRow(item.id, 'again'); };
        actions.appendChild(gotBtn);
        actions.appendChild(againBtn);
        row.appendChild(actions);
      }

      row.onclick = () => revealRow(item.id);
    }

    row.appendChild(buzzArea);
    if (lastSection) lastSection.appendChild(row);
  });
  updateProgress();
}

function revealRow(id) {
  revealed[id] = true;
  build();
}

function markRow(id, mark) {
  if (marked[id] === mark) { delete marked[id]; }
  else { marked[id] = mark; }
  updateProgress();
  build();
}

function revealAll() {
  CHECKLIST.forEach(item => { if (item.type==='row' && item.buzz && item.buzz.length) revealed[item.id] = true; });
  build();
}

function resetAll() {
  revealed = {}; marked = {}; mode = 'hide';
  document.querySelectorAll('.ctrl-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.ctrl-btn').classList.add('active');
  build();
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.ctrl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (m === 'show') revealAll();
  else build();
}

function updateProgress() {
  const rows = CHECKLIST.filter(i=>i.type==='row' && i.buzz && i.buzz.length > 0);
  const rev = rows.filter(i=>revealed[i.id] || mode==='show').length;
  const got = Object.values(marked).filter(v=>v==='got').length;
  const again = Object.values(marked).filter(v=>v==='again').length;
  const pct = rows.length ? (rev/rows.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-text').textContent = rev+' of '+rows.length+' revealed';
  document.getElementById('got-count').textContent = got;
  document.getElementById('again-count').textContent = again;
  document.getElementById('sum-got').textContent = got;
  document.getElementById('sum-again').textContent = again;
}

function scrollTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

build();
</script>
</body>
</html>
